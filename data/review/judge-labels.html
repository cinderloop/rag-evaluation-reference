 board (the captain, who owned the vessel, and two deckhands). On December 9 and 10, a gale warning was in effect for the Pavlof Islands, the area the vessel was transiting. Rain was also forecasted, and southeasterly 35-knot winds had been observed. On December 10, the third day of the transit, t he captain navigated the vessel through various straits around the Pavlof Islands. Rather than steering the vessel directly from the helm, the captain relied on the autopilot to steer. 3 He would enter", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-558dca1cd2", "answerable": true, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "status": "not_retrieved"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "status": "not_retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "status": "retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2547.pdf", "text": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 8 2 Analysis On September 11, at 1236, the towboat Schweiger was transiting Baker Bay West Channel in Ilwaco, when the vessel struck the US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. At 1235:12, the Schweiger began moving to port and crossed the channel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "spans": [[533, 604]]}], "answer": "The documents indicate that the Schweiger started wandering off its intended path approximately 2 minutes and 12 seconds before impact, as the vessel began moving to port and crossing the channel. The operator, the captain, reported that he fell asleep before the contact, which aligns with the AIS track showing the vessel moving across and then out of the channel.\n\nFor the Amber Brittany incident, the documents do not provide information about the timing of the vessel starting to wander off its intended path or the operator's actions at that point.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-fe004d5295", "answerable": true, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 3 1 Factual Information On April 15, 2024, about 2300, the crews of towing vessels operated by Evansville Marine Services (EMS) moored two 297.5-foot-long steel tank barges, the MPC 644 and MPC 907, alongside (in a string) the Marathon Petroleum Corporation (MPC) terminal dock at mile 793.8 on the right descending bank of the Ohio River, near Evansville, Indiana. 2 The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline. Discharge of cargo from the two barges was expected to take place the following morning. River conditions at the time were high, with the gauge at Evansville at 38.8 feet and rising (the river peaked 4 days later, on April 19, at 39.8 feet). 3 The current was", "spans": [[460, 642]]}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "visual inspection of the dock and found all six lock lines and four winch wires broken. Terminal operations personnel then notified all downriver facilities of potentially loose barges. MPC personnel reviewed terminal camera footage, which showed that, about 0445 on April 16, the two barges broke free from the dock. EMS reported a drift pile of debris (100 feet by 200 feet) in the water about the time of the breakaway. According to MPC, terminal camera footage appeared to show a debris pile that followed the barges after the breakaway. 2 (a) The inland towing industry refers to the shorelines of Western Rivers as the left and right banks when traveling (facing) downriver. The left bank is called the left descending bank, and the right bank is called the right descending bank. (b) The Ohio River runs 981 miles from Pittsburgh, Pennsylvania, to Cairo, Illinois, where it meets the Mississippi River. 3 Flood stage at Evansville is 42 feet.", "spans": []}], "answer": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-beb2d784cc", "answerable": false, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "evidence": [], "passages": [{"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 2 Analysis While the City of Louisville was upbound on the Upper Mississippi River pushing 11 empty barges, the towing vessel ran aground near mile 42.6 in a charted shallow and rocky area. The grounding caused fractures to the vessel’s bottom plating underneath the engine room, leading to water flooding into the engine room, machinery, and aft accommodation spaces. The pilot of the City of Louisville was alone on watch in the wheelhouse when the grounding occurred. The pilot told investigators that, before the grounding, he had left the helm and was on the port side of the wheelhouse. He estimated he was away from the helm about 5 minutes. Leaving the helm unattended is contrary to prudent navigation practices when operating on rivers. The Mississippi River, in particular, has frequent turns, and the potential for strong currents and heavy traffic.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "for a fleet on the Upper Mississippi River at mile 126 near St. Genevieve, Missouri. The overall length of the tow was about 738 feet, and the overall width was about 140 feet (see figure 3). Figure 3. City of Louisville tow arrangement (scale approximate). On July 29, about 1100, the pilot took over the navigational watch in the wheelhouse from the relief captain for their normally scheduled watch change. The City of Louisville proceeded upriver without event, with the pilot at the helm and making a speed of about 4 to 5 mph. According to the pilot, the tow was traveling at 3 Pilot is a term used aboard towing vessels on inland waterways for a person, other than the captain, who navigates the vessel.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "engine room, causing the vessel to settle to the bottom. There were eventually about 4 feet of water in the lower engine room. The tow remained intact, facing upriver after the grounding. The pilot said they were unable to move the vessel off the rocks. About 3 hours after the grounding, at 1753, thunderstorms passed through the area, which required the crew and responding personnel to evacuate the City of Louisville. Winds from the storm moved the tow to starboard, causing it to pivot on the rocks; the tow was then oriented toward the left descending bank. As the river stage later rose, the water level inside the engine room increased, and the main deck rudder room and aft galley/mess area also flooded. Figure 5. The City of Louisville aground. (Source: Coast Guard) 1.3 Additional Information There were no reported defects or deficiencies with the City of Louisville’s navigational, steering, communication, and propulsion systems. 5", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 a reduced speed at the customer’s request, since they were not in a rush to receive the barges. The pilot told investigators that, about 1442, he left the helm. Before doing so, he looked out the wheelhouse front window and saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system). He also checked the swing meter, fathometer, and electronic chart system (ECS). At that time, the boat’s ECS recorded the vessel on a heading of 349° at 4.8 mph and about 45 yards to the east of the sailing line, which had a course line of 347°. 4 He told investigators that he then went to the port side of the wheelhouse and relieved himself into a bag while looking out of the portside window. At 1444, on a heading of 344° at 4.7 mph, the City of Louisville tow passed a point where the sailing line changed course from 347° to 356°. About a minute later, the", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-82e8d70b09", "answerable": true, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "status": "retrieved"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direction. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. Because there were not enough immersion suits available for everyone, t he captain elected not to wear one. The crew attempted to stay on the stern deck of the vessel as long as possible before deploying the liferaft and entering the water. With the wheelhouse unattended, t he vessel’s heading changed, and smoke", "spans": [[599, 706]]}, {"doc_id": "MIR2504.pdf", "text": "distress call on VHF channel 16; he stated that the vessel was on fire and the crew was abandoning ship, and he also provided the vessel’s position. According to the captain, while making the radio calls in the wheelhouse, he was gasping for air and could barely see the GPS position on the navigation console due to the amount of smoke. US Coast Guard Sector Northern New England (in Portland, Maine) received the distress call from the Three Girls. Once alerted about the fire, the first mate ran into the accommodation space to collect as many survival suits from the crew quarters (staterooms) as he could carry. He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "spans": [[617, 895]]}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 6 On August 11, about 2030, the captain made a round of the engine room before returning to the wheelhouse to maneuver the vessel. He did not notice anything out of the ordinary during his round. About 2045, the captain called the crew to report to the stern deck to begin hauling the fishing net back onto the vessel. Crewmembers and the NMFS observer retrieved their gear from the vestibule at the entrance to the engine room in the accommodation space—which included the crew staterooms and the galley—before reporting to the stern deck. As they arrived, the captain was in the port aft corner of the wheelhouse overlooking the stern, operating the hydraulic net reel to haul in the fishing net. None of the crewmembers reported anything unusual from the entrance to the engine room. About 2050, after the fishing net was recovered from the seafloor, and when it", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 11 suits and lifejackets as fire blocked the crewmembers’ path to their storage area. The captain quickly made a mayday call, activated the EPIRB, and abandoned the vessel with the sternman into the liferaft in a timely manner. However, deployment of the liferaft on the windward side of the vessel prevented the crew from positioning it at a safe distance from the burning vessel. As a result, the heat of the fire ignited the liferaft’s canopy, causing it to sink and forcing the crewmembers into the water without any survival gear. The estimated water temperature of 50°F was within a range where hypothermia was a significant survival factor. 6 In water that temperature, cold incapacitation—where the use of hands, arms, and legs becomes more difficult—can occur within 10 minutes and possibly result in swimming failure or drowning. 7 Without lifejackets or immersion suits, the GITN’R DUN crew’s survival was dependent", "spans": []}], "answer": "The captain of the fishing vessel *Three Girls* abandoned ship without wearing an immersion suit during the August 2024 engine room fire due to a combination of factors, including insufficient survival gear and the urgent need to ensure the safety of the crew. Here is a detailed explanation:\n\n1. **Insufficient Immersion Suits**: The vessel did not have enough immersion suits available for all crewmembers. The captain, recognizing this shortage, elected not to wear one, likely prioritizing the survival of the remaining crew over his own personal safety.\n\n2. **Urgency of the Situation**: The fire in the engine room quickly escalated, and the captain was forced to abandon ship to prevent further loss of life. The fire spread rapidly, and the smoke made it difficult to navigate and maintain control of the vessel.\n\n3. **Distress Call and Abandonment**: The captain made a distress call on VHF channel 16, informing the US Coast Guard of the fire and the abandonment of the vessel. He was gasping for air and struggling to see due to the smoke, indicating the severity of the situation and the immediate need to evacuate.\n\n4. **Lack of Survival Gear for All Crew**: While the first mate managed to retrieve five of the seven survival suits, the remaining two were inaccessible due to the fire and smoke. This meant that not all crewmembers had the necessary gear to survive in the cold water, further emphasizing the captain's decision to prioritize the crew's safety over his own.\n\nIn summary, the captain's decision not to wear an immersion suit was driven by the lack of available gear and the urgent need to ensure the safety of the crew during a rapidly escalating emergency.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-d40b59eb0b", "answerable": true, "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "Possible ignition sources in the forward berthing area included electrical wiring, electrical components, and the lithium-ion batteries stored in the portside bunk (some of which the captain said were charging at the time).", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "investigators were unable to determine when this occurred in the ignition sequence, and it is possible that the arcing and corrosion occurred after the initial fire or during firefighting efforts.", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "due to severe fire damage in the berthing area, and because the space was unoccupied when the fire started, investigators were unable to determine when the bag containing the lithium-ion batteries caught fire or what caused it to ignite.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 8 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on board the fishing vessel Spicy Lady was an unknown source on a bunk in the forward berthing area.", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 7 2 Analysis While the crew of the Spicy Lady was fishing in Chatham Strait, about 1 mile west of Point Gardner, Alaska, they saw smoke and discovered a fire in a berthing area inside the main cabin. The fire was later extinguished by responding firefighters. When the crew entered the cabin to investigate the smoke, they discovered a fire near the portside middle bunk in the forward crew berthing area. They found that the bunk mattress was burning, as was a “plastic tote” containing lithium-ion batteries for personal items, which may have been charging at the time. Post-fire photos showed that, compared to other areas of the vessel, the portside bunks in the forward berthing area were the most severely damaged and thus experienced the highest level of heat. Additionally, the responding firefighters and the marine surveyor’s report both concluded that the most severe smoke and fire damage was located in", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 3 1 Factual Information On March 2, 2025, the 58-foot-long steel-hulled fishing vessel Spicy Lady got underway from Heritage Harbor near Wrangell, Alaska, with a crew of five. Between March 2 and March 5, the Spicy Lady transited near Frederick Sound and Chatham Strait while fishing for golden king crab. On March 6, at 1320, the crew of the Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska. Crewmembers on the aft working deck were preparing to haul in a crab pot when they noticed smoke coming from the main cabin, which was forward on the same deck. The deck boss and another crewmember entered the main cabin to investigate the source of the smoke and observed a fire in a crew berthing area located near the bow of the vessel. 2 (The crew berthing area was a “V-berth” with six bunks—three on the port side and three on the starboard side.)", "spans": []}], "answer": "The documents indicate that investigators were unable to pin down the exact source of the blaze on the fishing vessel Spicy Lady because the National Transportation Safety Board determined that the probable cause was an \"unknown source on a bunk in the forward berthing area.\" This suggests that the origin of the fire could not be definitively identified despite the investigation.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1e83ac5d6b", "answerable": true, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "status": "not_retrieved"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "status": "not_retrieved"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 13 the Scot Stuttgart, the fixed fire extinguishing system’s CO 2 capacity was designed to extinguish a fire in only one engine room, not both. 1.3.5 Postcasualty Actions by the Operating Company After the fire, the operating company identified an inconsistency in the fuel return piping system on a vessel built similarly to the Scot Stuttgart. Like the Scot Stuttgart, the fuel return piping from the port and starboard auxiliary diesel generators on the similarly built vessel did not have a check valve installed in the piping at the top of the day tanks. Other vessels in the fleet with similar diesel oil systems had check valves. The operating company installed check valves at these locations on the Scot Stuttgart and the other similarly built vessel identified without a check valve. The operating company also updated the lock-out/tag-out procedures to", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a58b297dd5", "answerable": false, "question": "How long did firefighters take to put out the blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point?", "expected_answer": "The premise is wrong: there was no fire after the Hunts Point explosion; instead, sludge burst out of the tank and covered the assistant engineer and the vessel's exterior.", "evidence": [], "passages": [{"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel. The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NYC DEP office. He requested that the NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 4 1.2 Event Sequence On May 24, 2025, about 0818, the Hunts Point departed the Wards Island Wastewater Treatment Plant, where it was normally docked when not in operation, with a crew of six, including a master, chief engineer, assistant engineer, a mate, and two able seamen. The vessel was en route to the North River Wastewater Treatment Plant (also in New York) to load about 100,000 cubic feet of liquid sludge, a transit that would take about 2 hours. When the vessel departed Wards Island, about 40,000 cubic feet of cargo evenly distributed cargo remained in the cargo tanks from the previous day’s operation due to time constraints at the facility and the consistency of the sludge. Because sludge remained within the tanks, it had become too viscous for the vessel’s cargo pumps to move it from the tanks to the facility. To reduce the thickness and", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 13 2 Analysis On May 24, 2025, the sludge vessel Hunts Point was loading cargo at the North River Wastewater Treatment Plant when an explosion occurred in the no. 2 port cargo tank, resulting in the death of the chief engineer and injuries to three other crewmembers. Like other NYC DEP sludge vessels, the Hunts Point was designed to transport treated sludge from wastewater facilities to the dewatering facility. On the day of the casualty, about 40,000 cubic feet of sludge remained aboard the vessel from the previous day’s operation. The remaining cargo was evenly distributed within the six cargo tanks. While the sludge had been treated, it still contained decomposing organic material and produced flammable gases. Any flammable gas the sludge produced would collect within the cargo tanks. As a result, the concentration of these flammable gases would increase the longer the sludge remained within the tanks.", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion aboard Sludge Vessel Hunts Point On May 24, 2025, about 1020 local time, the sludge vessel Hunts Point was moored at the North River Wastewater Treatment Plant on the Hudson River, in New York, New York, when an explosion occurred aboard the vessel (see figure 1 and figure 2). 1 One crewmember was killed, and three crewmembers sustained minor injuries. No pollution was reported. Vessel damage was estimated to exceed $10 million. Figure 1. Hunts Point on July 7, 2018, before the explosion. (Source: Frank Joniak, shipspotting.com) 1 (a) In this report, all times are eastern daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM045). Use the CAROL Query to search investigations. July 15, 2026 MIR-26-22", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-84cf2493e1", "answerable": true, "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "evidence": [{"doc_id": "MIR2535.pdf", "quote": "The pilots assigned numbers to the tugs from bow to stern, with the no. 1 tug (Ted C Litton) being the first tug at the bow, the no. 2 tug (Connolly M) on the port shoulder, the no. 3 tug (Cooper K) on the port quarter, the no. 4 tug (Mercury) at the stern, and the no. 5 tug (Zeus) as the standby tug.", "status": "partly"}], "passages": [{"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 6 Figure 5. The Cosflourish Lake’s positions, relative to the east dock and the vessel at the west dock, leading up to the initial contact with the east dock’s pilings. ( Source: Electronic Chart Display and Information System from Cosflourish Lake. Background source: National Oceanic and Atmospheric Administration, Electronic Navigation Chart US5CRPBF as viewed on Made Smart automatic identification system) Pilot 3 continued to issue orders to the tugs as he proceeded with the docking. At 1412, he ordered slow astern on the tanker’s main engine with the rudder at hard to starboard, “ slack line” for tug no. 1, and “full towards” for tug no. 2 (push at full power on the port side, toward the east dock). Two minutes later, he ordered the rudder hard to port and tug no. 1 to push “slow towards” (pushing on the port bow, toward the dock, at a slow rpm).", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 5 PILOT 3: I’m gonna f——k the s——t out of this ship. I’m gonna go in there and I’m gonna be doing the god d——n docking, ok. You got it? MASTER: Yeah. PILOT 3: We're changing, ok. Don’t f——k up, ok. PILOT 1: [To unknown person] I told ya, you gotta watch him. PILOT 3: [To the other pilots] Sometimes you gotta shock talk em. Pilot 1 then left the bridge for the bow, and, at 1354, Pilot 2 requested tug no. 1 be made fast at the center lead forward. Tug nos. 2, 3, and 4 were all successfully made fast in their agreed upon positions. At 1404, Pilot 3 ordered the engine full astern to slow the ship in the channel so that tug no. 1 could be made fast. About 1406, tug no. 1 was secured with a line to the bow. The Cosflourish Lake had a heading of 259° and a speed of 6.1 knots, which continued to decrease as the bow of the tanker moved to starboard and into the STGT basin.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "At 1407, with tug no. 1 pulling to starboard at the bow as ordered, the Cosflourish Lake had a heading of 279° at a speed of 1.7 knots. Pilot 3 ordered tug no. 2 to push at full power on the port side. At 1408, at a slow ahead propulsion order, the vessel had a heading of 298°, and Pilot 3 ordered tug no. 1 to slack its line, and tug no. 2 to full power away to port. At 1409, the vessel continued to turn to starboard, and the pilot ordered the rudder hard to starboard while issuing multiple orders to the tugs. At 1410, on a heading of 336° at a speed of 0.6 knots, the pilot ordered tug no. 1 to port 90°. Seconds later, Pilot 3 ordered tug no. 1 to “back full.” At 1411, as the pilot continued to issue tug, engine, and rudder orders, the starboard side of the Cosflourish Lake struck two of three rubber tire-covered pilings at the end of the east dock. The vessel had a speed of 2.2 knots on a heading of about 354°.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 4 1.2 Event Sequence On November 14, 2023, at 1018 local time, the Cosflourish Lake got underway from an offshore anchorage in a ballast condition, inbound to the STGT east dock (an 11-mile transit). At 1254, three Aransas-Corpus Christi pilots boarded the vessel at the nearby pilot station, and shortly after, d uring the master/pilot exchange, Pilot 1 confirmed with the master that there were no deficiencies with the Cosflourish Lake. (Pilot 3 told investigators that three pilots were required for a VLCC.) About 1301, Pilot 1 took the conn. Pilot 1 briefed the master that the plan was to dock the tanker starboard-side-to using five tractor tugs: four 6,772-hp, tractor tugs would have a line to the tanker, and one 5,150 hp-tractor tug would be standing by to assist where needed (see figure 4). The pilots assigned numbers to the tugs from bow", "spans": [[889, 937]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0233916026", "answerable": true, "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "The chief engineer closed the quick-closing valves to the engines (stopping fuel supply to them), and the fire team shut down all ventilation fans, fire dampers, and watertight and fire screen doors, and prepared fire hoses.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "At 0741, the vessel’s fire team that entered the engine room reported that there was no fire in the engine room; t he team only observed black smoke.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "Crewmembers boarded the barge, shut all doors and ventilation dampers to the unloading generator space, started the tug’s fire pump, and began boundary cooling on the exterior bulkheads and deck above the unloading generator.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "he released carbon dioxide into the unloading generator space about 1630.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 15 2 Analysis While the passenger vessel Ocean Navigator was docked in Portland, Maine, the vessel experienced a catastrophic engine failure of the no. 2 auxiliary diesel engine, which resulted in an engine room fire. The crew quickly sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to effectively starve the fire of fuel and oxygen, which prevented the spread of the fire. Ultimately, the fire self-extinguished. Additionally, within a few minutes of the fire, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations. The Ocean Navigator crewmembers followed company procedures to muster all passengers and evacuate them from the vessel without injury. Therefore, the crew’s", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 5 sure of the operating status of the supply fan for the unloading generator space. He believed it was either running at slow speed or not running before the time of the fire. The first mate and another crewmember, wearing self-contained breathing apparatus, entered the unloading generator space from the port side with two portable fire extinguishers and reported very heavy smoke. They retreated from the space, securing the door as they exited. The chief engineer announced that he was preparing to release the fixed carbon dioxide fire extinguishing system; he released carbon dioxide into the unloading generator space about 1630. The captain notified the US Coast Guard and company of the fire. Crewmembers set watches and used an infrared thermometer to monitor bulkhead temperatures, which declined through the night. About 0730 the following morning,", "spans": [[644, 717]]}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 11 2 Analysis On December 30, 2024, while the ATB Dorothy Ann/Pathfinder was anchored in Lake Erie, the diesel generator engine on the Pathfinder suffered a catastrophic failure, which resulted in a fire in the barge’s unloading electrical generator space. The crew sealed the space and released the vessel’s fixed gas fire extinguishing system, putting out the fire. The most severe fire damage was about 5–10 feet from the damaged engine block near the no. 9 connecting rod, where internal components had forcefully exited the engine. In the 4 minutes leading up to the discovery of the fire at 1609, the engine control room machinery automation system recorded a decrease of lube oil pressure while the engine was running at rated speed (1,800 rpm). The engine stopped at 1609:30. This loss of pressure (from 58–47 psi) was not severe enough to", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 7 throughout the vessel. The passengers and crew proceeded to their muster stations. The captain notified the operating company’s designated person ashore who, in turn notified the company’s qualified individual, their dedicated salvage and marine firefighting contractor, and the corporate crisis team. 4 About 0718, crewmembers removed the injured motorman from the Ocean Navigator, and at 0721, after receiving permission from the captain, the first fire team entered the engine room—wearing self-contained breathing apparatus—to assess the fire. About 0730, the local shoreside fire department arrived at the vessel. About this time, the captain received the report from the muster station team leaders that all passengers were accounted for at both muster stations. At 0731, the captain directed the passengers and non-essential crew to evacuate the Ocean Navigator to the pier", "spans": []}], "answer": "In both the **Ocean Navigator** and the **Pathfinder**, the crew managed to extinguish the flames after a Caterpillar 3516B generator engine failure, though the methods used differed slightly based on the situation and available resources.\n\n### **Ocean Navigator (Passenger Vessel):**\n1. **Containment and Isolation:**\n   - The crew quickly sealed the engine room by closing **watertight doors**, **shutting off ventilation fans**, and **closing dampers** to cut off the fire's access to **fuel and oxygen**.\n   - They also **activated quick-closing fuel valves** to further isolate the fire source.\n\n2. **Fire Suppression:**\n   - The fire **self-extinguished** due to the lack of fuel and oxygen, without the need for active fire suppression.\n   - Later, at **0718**, the **first fire team** (wearing self-contained breathing apparatus) entered the engine room to assess the situation.\n   - At **0730**, the **local shoreside fire department** arrived and assisted in ensuring the fire was fully extinguished.\n\n3. **Passenger Safety:**\n   - The **captain** immediately notified the **crew** and **passengers**, sounding the **general alarm** to move everyone to **muster stations**.\n   - All passengers and crew were safely evacuated to the **pier** by **0731**.\n\n### **Pathfinder (Self-unloading Barge):**\n1. **Containment and Isolation:**\n   - The crew **sealed the unloading generator space** to prevent the fire from spreading.\n   - They **secured the door** after the first mate and another crewmember entered the space with **portable fire extinguishers** and reported heavy smoke.\n\n2. **Fire Suppression:**\n   - The **chief engineer** prepared to release the **fixed carbon dioxide (CO₂) fire extinguishing system** and did so at **1630**.\n   - The **CO₂ system** was effective in putting out the fire.\n   - Crewmembers also used an **infrared thermometer** to monitor **bulkhead temperatures**, which declined through the night.\n\n3. **Communication and Monitoring:**\n   - The **captain** notified the **US Coast Guard** and the **company** of the fire.\n   - Watches were set, and temperatures were continuously monitored to ensure the fire did not reignite.\n\n### **Summary:**\n- On the **Ocean Navigator**, the fire was **contained and self-extinguished** through **isolation measures**, and **external fire teams** were called in for confirmation.\n- On the **Pathfinder**, the crew used a **fixed CO₂ fire suppression system** to extinguish the fire, while also **securing the space** and **monitoring temperatures** to prevent re-ignition.", "judges": ["correctness", "refusal"]}, {"key": "t-3d2c2f5d40", "answerable": true, "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "February 4, 2026 MIR-26-04 Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska", "status": "partly"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska 57°02.09’ N, 134°39.33’ W Date March 6, 2025 Time 1320 Alaska standard time (coordinated universal time –9 hrs) Persons on board 5 Injuries 1 minor Property damage $1.6 million Environmental damage None Weather Visibility 9 mi, overcast, winds east-southeast 12 kts, air temperature 44°F Waterway information Strait; width 4.5 nm, depth 1,571 ft Figure 2. Area where the Spicy Lady fire occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[0, 163]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 4 Figure 3. The Spicy Lady under tow by the Angelette after the crew evacuated to the Angelette. (Source: Wrangell Volunteer Fire Department) At 1432, the captain of the Spicy Lady notified the Wrangell Volunteer Fire Department, located in Wrangell, Alaska (about 100 miles from the Spicy Lady’s location), of the fire. The fire department prepared their gear and boarded a floatplane, which departed Wrangell at 1509 with three firefighters on board. At 1603, the floatplane landed in Warm Springs Bay, where it met the Westerly. The firefighters boarded the Westerly with their gear, and the crew aboard the Westerly transported them to the Spicy Lady just outside of Warm Springs Bay. Once aboard the Spicy Lady, firefighters set up a portable fire pump and entered the main cabin. They encountered heat and heavy smoke and traced the origin of the fire to the forward berthing area. Using water and foam, the firefighters", "spans": [[0, 47]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": [[0, 37], [150, 192]]}, {"doc_id": "MIR2624.pdf", "text": "a. The American Bureau of Shipping only served as the designated TPO for the Miss Peggy and did not class the vessel. 1.5 Waterway Conditions The casualty occurred near the boundary of the Lynchburg precautionary area. The Coast Guard designated Lynchburg as a precautionary area “due to frequent congestion of meeting, crossing, and overtaking of dissimilar traffic including ships, tows with/without barges, ferries, and industrial vessels.” 29 Figure 19 shows the radius of the precautionary area. 29 According to 33 CFR 161.2, a precautionary area is a routing measure comprising an area within defined limits where vessels must navigate with particular caution and within which the direction of traffic may be recommended.", "spans": []}], "answer": "The March 2025 Spicy Lady casualty was categorized as a **fire/explosion** incident. The incident took place in the **Chatham Strait**, near the **landmark Point Gardner**, approximately **1 mile west** of it. The coordinates of the incident location were **57°02.09’ N, 134°39.33’ W**.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-bd9431745f", "answerable": true, "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "evidence": [{"doc_id": "MIR2522.pdf", "quote": "The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff.", "status": "partly"}, {"doc_id": "MIR2522.pdf", "quote": "Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel.", "status": "retrieved"}, {"doc_id": "MIR2522.pdf", "quote": "About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2522.pdf", "text": "engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff. The deckhand reported 6 –8 inches of water on the aft deck as they boarded the skiff. Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel. About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand. Once the Cape Douglas crew was aboard, the Red Sky captain notified the US Coast Guard. The captain and deckhand remained on scene aboard the Red Sky, and, about 40 minutes later, they witnessed the Cape Douglas sink by the port stern. The deckhand noted that, as the “upper deck corner” (near the port quarter of the vessel) went underwater, the Cape Douglas “rolled on its side” before sinking. Shortly after, the Red Sky returned to Kodiak and dropped off the captain and deckhand.", "spans": [[0, 193], [280, 366], [367, 453]]}, {"doc_id": "MIR2522.pdf", "text": "Sinking of the Industrial Vessel Cape Douglas MIR-25-22 5 to enter. The deckhand later estimated that there were about 4 feet of water in the engine room. The captain told investigators that there was a high-water bilge alarm in the center of the engine room; however, it did not activate. (The captain could not recall the last time it was tested and did not know if it was functional.) The captain turned on one of the vessel’s two manual bilge pumps near the engine room entrance (the other bilge pump was inaccessible due to the flooding). He and the deckhand opened the starboard-side sliding doors to dump the fish byproduct overboard to reduce the weight on the deck. However, the product was “like peanut butter” because the seawater pump had not started and there was no water available to loosen the product, so they could not dump it. The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the", "spans": [[846, 948]]}, {"doc_id": "MIR2529.pdf", "text": "system) The captain ordered the deckhand to prepare to lower the anchor. The deckhand prepared one of the anchors, but before she could deploy it , the captain ordered everyone on board to abandon the vessel because the list had become significant, and they w ere in danger. The deckhand, chef, steward, and owner jumped into the water. The captain broadcast a distress call on VHF channel 16, verified that all personnel had egressed, and then he also abandoned the vessel by jumping into the water. From the time the vessel started listing until the owner and", "spans": []}, {"doc_id": "MIR2524.pdf", "text": "crab pot davit was not running or pressurized; however, the hydraulic pump for the steering system was running and its lines (pipes and hoses) were pressurized. The captain estimated that he was in the engine room for 30–40 seconds. He told investigators that, as he exited the engine room, he saw a flash, and the smoke turned from white to black as the flames increased. The captain shut the engine room door to “try to cut oxygen” to the fire and went back to the wheelhouse. Concerned about an explosion, the captain decided that he and the other crewmember should abandon the vessel. At 1604, using a VHF radio on channel 16, he made a Mayday call to the Coast Guard informing them of the vessel’s position and his decision to abandon the vessel into a liferaft. The crewmember donned a survival suit (the captain was unable to retrieve his survival suit due to the fire), and", "spans": []}], "answer": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, he and the deckhand donned survival suits and got into the vessel’s towed skiff. They waved down a nearby Good Samaritan vessel. They were picked up by the Red Sky about 40 minutes after the 1315 decision to abandon the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0b258c7557", "answerable": true, "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "evidence": [{"doc_id": "MIR2630.pdf", "quote": "However, the captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "status": "partly"}], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": [[888, 939]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 7 Figure 4. The Mystery (circled) aground as seen from the former location of the Seal Cape Light on January 16, 2025. (Background source: Coast Guard) 1.3.2 Crew Experience The captain had over 20 years of experience, fishing from Mexico to Alaska. Deckhand 2 had at least 25 years of experience and fished with his own vessel. Deckhand 1’s navigational experience was unavailable. 1.3.3 Chart Plotter The captain reported that the Mystery’s chart plotter had frozen on previous occasions. He reported that when the chart plotter froze, the autopilot would slowly turn the vessel to port, as he believed it had on the evening of the grounding. The captain noted that he had never experienced issues with the autopilot. He stated that the freezing issue could be corrected by rebooting the chart plotter. Due to similar freezing issues on previously installed chart plotters from the same manufacturer, the", "spans": [[584, 629]]}, {"doc_id": "MIR2630.pdf", "text": "which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port. Therefore, on the night of the grounding, the chart plotter froze, and, consequently, the autopilot steered the vessel to port. A proper navigation watch requires a watchstander to confirm and correlate information from all available sources, including electronic charts and visual sightings, to verify the vessel’s position. For the Mystery crew, maintaining a proper navigation watch was critical given their operational environment (on a lee shore, with high winds, and in reduced visibility due to darkness). Vessels navigating near shore face increased risk from the proximity to navigation hazards. As such, any error in navigation, steering, or propulsion can quickly result in catastrophe. Coastwise navigation, therefore, requires increased vigilance to maintain a continuous and", "spans": [[0, 144]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 11 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the grounding of the fishing vessel Mystery was the deckhand on watch not maintaining a proper navigation watch, likely due to his overreliance on the vessel’s automated navigation systems, which resulted in him not noticing when the chart plotter malfunctioned and the autopilot steered the vessel away from its plotted course. 3.2 Lessons Learned Overreliance on Automated Navigation Systems Although modern technology is an asset, it is not infallible. Operator overreliance on, and overconfidence in, technologies like chart plotters and autopilot systems can negatively affect situation awareness. The safety of a vessel underway depends on the crew’s awareness of the vessel’s position and adherence to a voyage plan. Good seamanship requires correlating information from all means of", "spans": []}], "answer": "The captain stated that the autopilot would slowly turn the vessel to port after the chart plotter froze.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-48ff6915ac", "answerable": true, "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "evidence": [{"doc_id": "MIR2501.pdf", "quote": "At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the lock.", "status": "partly"}, {"doc_id": "MIR2508.pdf", "quote": "at a speed of 0.35 mph, the starboard quarter of the starboard barge (EMS 348) contacted the wooden fendering of the transfer platform at dolphin no. 3", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 8 About 1804, the Kitty stopped moving astern and the vessel was outside of the open gates, with the stern of EMS 383 (the aft barge) abeam of the open lock gates. The captain put the engines in reverse in anticipation of water surging back into the lock; he estimated the water level in the lock had dropped about 3 to 4 feet. Less than a minute later, the Kitty tow started to advance ahead even though the engines were in reverse. By 1806, the Kitty tow was advancing ahead at 0.7 mph and increasing in speed. The captain moved propulsion astern on all engines to arrest the increase in speed. Seeing that the tow was still advancing ahead, the captain moved all main engine propulsion levers to full astern, but there was no effect on the tow’s advance. He instructed the steersman to look at the wheel (propeller) wash, and the steersman confirmed that the engines were in reverse. At the head of the tow, the deckhand", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 6 About 1741, the Kitty tow entered the forebay at about 4 mph. A deckhand and tankerman prepared lines and bumpers for entering the lock and then moved to the head of the tow. As the head of the tow neared the lock entrance, the captain reduced the speed of the tow, and, about 1749, the head of the tow began to enter through the open lock gates (A and B) at 2 mph. The captain looked at the automatic identification system information displayed on the vessel’s electronic chart system and saw ships—the 587-foot-long tanker Garden State and, about 1.5 miles astern, the 820-foot-long tanker SKS Darent—transiting southbound on the Mississippi River toward the Algiers Lock forebay entrance (see figure 6). About 1752, the Garden State began to pass the mouth of the forebay at 13.5 knots (15.5 mph); the vessel was about 1,065 yards away from the open lock gates.", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 7 About 1758, the second southbound tanker, the SKS Darent, passed the Algiers Lock forebay at 13.8 knots (15.9 mph); the vessel was about 950 yards away from the open lock gates. At 1759, the Kitty tow, fully within the lock chamber, had stopped moving. The deckhand was calling the distance to come ahead to the red pin via radio. The captain tried to ease the tow further ahead, but the Kitty tow began to move aft. The captain saw water “coming out” of the lock and that the water was “ pulling” the Kitty tow aft out of the lock chamber (toward the Mississippi River). At 1800, the Kitty tow was moving 0.6 mph astern, and the captain came ahead slow on all engines to counteract the tow’s movement (see figure 7). He stated over the Algiers Lock radio frequency that the passing ships were “sucking the water out at Algiers.” At 1801, the Kitty tow was still moving astern, now at 2 mph, despite", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "placed a line on a red pin once it was within reach and tied it off, but the line broke as the tow continued moving ahead. The deckhand placed another line on the pin, and that line broke as well. The deckhand told the captain via radio that the Kitty was “coming in hot.” According to the captain, when the Kitty tow was about 100 feet from the closed lock gates, the vessel was moving about 2 mph ahead. Over the radio, the lock hand announced that the tow was approaching too fast and told the captain to slow down. The captain replied, “Algiers, I’m backing on everything. The [expletive] waters’ coming back in from the [expletive] ships. I can’t get it to stop. I got everything hooked up.” At the bow of the lead barge, the deckhand saw that the tow was going to hit the closed lock gate and walked aft on the barge to safety. At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the", "spans": [[834, 940]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-9e77661e19", "answerable": true, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 3 1 Factual Information On April 15, 2024, about 2300, the crews of towing vessels operated by Evansville Marine Services (EMS) moored two 297.5-foot-long steel tank barges, the MPC 644 and MPC 907, alongside (in a string) the Marathon Petroleum Corporation (MPC) terminal dock at mile 793.8 on the right descending bank of the Ohio River, near Evansville, Indiana. 2 The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline. Discharge of cargo from the two barges was expected to take place the following morning. River conditions at the time were high, with the gauge at Evansville at 38.8 feet and rising (the river peaked 4 days later, on April 19, at 39.8 feet). 3 The current was", "spans": [[460, 642]]}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "visual inspection of the dock and found all six lock lines and four winch wires broken. Terminal operations personnel then notified all downriver facilities of potentially loose barges. MPC personnel reviewed terminal camera footage, which showed that, about 0445 on April 16, the two barges broke free from the dock. EMS reported a drift pile of debris (100 feet by 200 feet) in the water about the time of the breakaway. According to MPC, terminal camera footage appeared to show a debris pile that followed the barges after the breakaway. 2 (a) The inland towing industry refers to the shorelines of Western Rivers as the left and right banks when traveling (facing) downriver. The left bank is called the left descending bank, and the right bank is called the right descending bank. (b) The Ohio River runs 981 miles from Pittsburgh, Pennsylvania, to Cairo, Illinois, where it meets the Mississippi River. 3 Flood stage at Evansville is 42 feet.", "spans": []}], "answer": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-275befe954", "answerable": true, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "status": "not_retrieved"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "status": "not_retrieved"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 13 the Scot Stuttgart, the fixed fire extinguishing system’s CO 2 capacity was designed to extinguish a fire in only one engine room, not both. 1.3.5 Postcasualty Actions by the Operating Company After the fire, the operating company identified an inconsistency in the fuel return piping system on a vessel built similarly to the Scot Stuttgart. Like the Scot Stuttgart, the fuel return piping from the port and starboard auxiliary diesel generators on the similarly built vessel did not have a check valve installed in the piping at the top of the day tanks. Other vessels in the fleet with similar diesel oil systems had check valves. The operating company installed check valves at these locations on the Scot Stuttgart and the other similarly built vessel identified without a check valve. The operating company also updated the lock-out/tag-out procedures to", "spans": []}, {"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 14 2 Analysis On May 17, 2025, while offloading cargo at Puerto Nuevo Terminals in San Juan, a fire broke out in the port engine room aboard the tank vessel Scot Stuttgart. 2.1 Use of Fixed Fire Extinguishing System After discovering thick, white smoke coming from the open door of the port engine room into the engine control room, the crew stopped cargo operations. They shut down the port main engine, remotely stopped all fuel pumps, secured ventilation, shut the ventilation dampers, and stopped electrical power for the port engine room. Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space. While awaiting the arrival of local firefighters, the ship’s crew set up boundary cooling of the port engine room using vessel fire hoses", "spans": [[609, 801]]}, {"doc_id": "MIR2629.pdf", "text": "pressurized by the ship’s fire pump. When shoreside firefighters arrived about 40 minutes later, the ship’s crew reported that there were no elevated heat readings outside the port engine room (as measured using handheld infrared thermometers). The incident commander requested permission from the master for firefighters to open the space and investigate the source of the fire, and the master granted it. When firefighters entered the port engine room, thick smoke was still present. Fixed fire extinguishing systems are typically designed to release a calculated amount of CO 2 into a space to ensure that the CO 2 adequately smothers any fire. The Scot Stuttgart’s system was designed to release all 14 bottles of CO 2 for a fire in the port engine room. The presence of smoldering fire when the firefighters unsealed the space indicates that releasing only half of the system’s CO 2 may not have been as", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 10 2 Analysis On July 24, 2025, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the crew was hauling lobster traps near Mount Desert Rock, Maine. The fire resulted in the total loss of the vessel. After smelling burning fiberglass, the captain discovered flames and light gray smoke in the engine compartment, aft on the vessel. The engine compartment contained multiple potential heat and ignition sources, including main engine exhaust components, high pressure hydraulic equipment that was operational at the time of the fire, electrical systems, batteries, and combustible materials. However, because the GITN’R DUN burned to the waterline, subsequently sank, and was not salvaged, investigators were unable to access and inspect the vessel to determine the exact ignition source. Before the captain detected the smell of burning fiberglass, there were no", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6c5644f860", "answerable": true, "question": "According to the NTSB analysis, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank. Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in this case, the PTC 706 (center barge) had more freeboard than the adjacent barges, but the adjacent barges were not submerged. Therefore, it is more likely that the PTC 706’s freeboard was reduced by weight forward in the barge. This weight forward could have been", "spans": [[94, 361]]}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 4 and coal. The barges with soybeans and corn had covers over their cargo hoppers; the coal barges did not. At the head of the tow, the barges’ raked ends faced forward, while at the aft end of the tow, the Chad Pregracke was faced up to the barges’ raked ends. The PTC 706’s freeboard was about 30 inches, and the two other uncovered coal barges at the head of the tow had a freeboard of 30–31 inches. The covered barges at the head of the tow had varying freeboards: the port outermost barge (CH 0121) had 18 inches, the second tier barge from port (MTC 1379) had 30 inches, and the starboard outermost barge (CH 0132) had 24 inches. Figure 4. Tow diagram of the Chad Pregracke. Over the next day, the pilot and captain alternated navigational watches. The captain stood watch from 0515 to 1115 and 1715 to 2315, and the pilot stood watch", "spans": [[427, 449], [502, 524]]}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for th
