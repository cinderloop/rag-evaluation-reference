<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge labels</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#57534e;--card:#fff;--line:#e7e5e4;--hl:#fef08a;--ok:#15803d;--mid:#b45309;--bad:#b91c1c;--accent:#1d4ed8}
@media (prefers-color-scheme: dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--card:#292524;--line:#44403c;--hl:#713f12;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--accent:#93c5fd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card.done{border-left:4px solid var(--ok)}
.meta{color:var(--muted);font-size:13px}
h4{margin:12px 0 2px;font-size:13px}.box{border-left:3px solid var(--line);padding-left:8px;margin:4px 0;white-space:pre-wrap}
.passage{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0}
mark{background:var(--hl);color:inherit}.s-retrieved{color:var(--ok)}.s-partly{color:var(--mid)}.s-not_retrieved{color:var(--bad)}
.judge{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.judge .q{flex:1 1 320px}
.judge button{font:inherit;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.judge button.on[data-v=Pass]{background:var(--ok);border-color:var(--ok);color:#fff}
.judge button.on[data-v=Fail]{background:var(--bad);border-color:var(--bad);color:#fff}
.judge button.on[data-v=skip]{background:var(--muted);border-color:var(--muted);color:#fff}
input[type=text]{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px}
#download{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
</style></head><body>
<header><strong>Judge labels</strong><span id="progress" class="meta"></span>
<button id="download">Download labels</button>
<span class="meta">For each question under a trace, mark Pass or Fail as a careful reader would. Skip only if you cannot decide; skipped marks are not used. Autosaves in this browser.</span></header>
<main id="list"></main>
<script>
const DATA = {"traces_sha256": "dba1d247e2d1938d8d7852549e23fe117fd1949cf66b8f9bfaac4f7bce368d29", "questions": {"groundedness": "Is every claim in the answer supported by the retrieved passages?", "correctness": "Does the answer give the facts in the expected answer?", "abstention": "Does the answer avoid answering (declines, or corrects the false premise)?", "refusal": "Does the answer give everything the passages contain (nothing held back)?"}, "items": [{"key": "t-59a073bf11", "answerable": false, "question": "Why did the Nickelena's captain not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span?", "expected_answer": "The premise is wrong: the captain was not steering. He was still in his stateroom when the tow passed under the bridge at 0213; a crewmember was at the helm, and the captain learned of the problem only when the engineer went below to notify him.", "evidence": [], "passages": [{"doc_id": "MIR2502.pdf", "text": "planned to return to the pilothouse before the towing vessel and barge passed under the bridge. Figure 4. Infrared footage of the Nickelena towing the deck barge BMI 209 with the crane on board at 1226 the night of the contact. (Source: Enbridge Straits Maritime Operations Center) On May 7, about 0200, the captain woke up and prepared to head to the pilothouse. At 0213, while he was still in his stateroom, the crewmember at the helm guided the vessel and barge under the Mackinac Bridge’s suspension span at 8 knots within the marked channel. At some point after passing under the bridge, both the engineer, who was out on deck, and the crewmember at the helm, looked aft and, with the help of the lights of the bridge, noticed that they couldn’t see the crane’s boom. The engineer went below and notified the captain.", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 12 2 Analysis About 0200 on May 7, shortly after passing eastward under the main suspension span of the Mackinac Bridge, the crew of the commercial towing vessel Nickelena discovered that the crane they were towing 500 feet astern (aboard deck barge BMI 209) had struck the bridge and collapsed onto the barge. Before departure, managers from the towing vessel operating company visually estimated the angle of the boom to be between 50° and 60° and believed that, with its 5-foot “rooster” sheave attached, the boom was 145 feet in length (the boom was 160 feet long). Using their visual estimation of the crane’s boom angle and their boom length estimate, both of which were incorrect, they believed that the boom was at a safe height for the transit. The managers told the Nickelena captain “everything’s secured, ready to go.”", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 8 Figure 7. The boom bent backwards over the cabin after striking the bridge. (Source: Coast Guard) The crane’s mechanical boom angle indicator was extensively damaged by the contact, so investigators could not determine whether it was operational before the bridge strike. Investigators evaluated the LMI and determined that the LMI display was showing a fail mode for the boom angle, the boom pitch and roll, and the wind indicator. The system had the capability to record data, but data downloaded and evaluated later only showed the dates and times of system startups and shutdowns. 1.3.2 Boom Height Evaluation The NTSB conducted a study of the crane boom angle based on an infrared surveillance image of the crane from before the casualty (see figure 4) to estimate the height of boom at the time it contacted the Mackinac Bridge. 3 The study determined,", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge On May 7, 2023, about 0213 local time, the towing vessel Nickelena was transiting the Straits of Mackinac while towing deck barge BMI 209, transporting a crawler crane, when the crane boom struck the main span of the Mackinac Bridge (see figure 1 and figure 2). 1 The contact bent the crane boom backwards, causing the boom to eventually collapse onto the aft end of the barge. There were no injuries, and no pollution was reported. Damage to the Mackinac Bridge was estimated at $145,000; damage to the crane was estimated at $665,000. 2 Figure 1. Left to right: The Nickelena on an unknown date before the contact, and the crane aboard the BMI 209, as seen from the Nickelena during the voyage and before the contact. (Sources: US Coast Guard and Basic Towing Inc.) 1 In this report, all times are central daylight time, and all miles are statute miles. 2", "spans": []}], "answer": "The Nickelena's captain did not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span because he was still in his stateroom at the time of the contact. The crewmember at the helm guided the vessel and barge under the bridge, and it was this crewmember, along with the engineer on deck, who first noticed that the crane’s boom was no longer visible aft, prompting them to alert the captain.", "judges": ["groundedness", "abstention"]}, {"key": "t-126082e2b6", "answerable": true, "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Persons on board 17 (5 crewmembers and 12 passengers)", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 3 1 Factual Information On August 30, 2024, about 1900, the 51.6-foot-long charter fishing vessel Jig Strike departed from San Diego, California, with a crew of five (captain, second captain, two deckhands, and a cook). 2 The vessel had been chartered for a fishing trip lasting a day and a half, and 12 passengers were aboard. The vessel, which had a wood-framed and plywood hull with fiberglass (fiberglass-reinforced plastic) overlay, transited through the night toward Cortes Bank, located about 100 miles west of San Diego. The weather was calm at departure, but according to the captain, in the morning “ it started getting a little bumpy.” Winds were 12–15 knots with swells of 3–6 feet. The vessel arrived at Cortes Bank shortly before 0700 on August 31. The passengers fished at two different locations, but a fter the crew received word that", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike On August 31, 2024, about 1035 local time, the charter fishing vessel Jig Strike was transiting between fishing locations near Cortes Bank in the Pacific Ocean, about 100 miles west of San Diego, California, when the vessel began rapidly taking on water (see figure 1 and figure 2). 1 The crew was unable to stem the flooding, and the five crewmembers and 12 passengers on board abandoned ship into a liferaft. They were rescued by a nearby good Samaritan vessel, and the Jig Strike later sank. There were no injuries, and no pollution was reported. The vessel was a total loss estimated at $475,000. Figure 1. Jig Strike underway at unknown date. (Source: Jig Strike Sportfishing, facebook.com) 1 (a) In this report, all times are Pacific daylight time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 2 Casualty Summary NTSB casualty category Flooding/Hull Failure Location Cortes Bank, Pacific Ocean, 100 nm west San Diego, California 32°28.00’ N, 119°12.00’ W Date August 31, 2024 Time 1035 Pacific daylight time (coordinated universal time −7 hrs) Persons on board 17 (5 crewmembers and 12 passengers) Injuries None Property damage $475,000 est. Environmental damage None Weather Partly cloudy, winds west-northwest 15–18 kts, seas 1–2 ft, swells south- southwest 3–6 ft, air temperature 64°F, water temperature 67°F, sunrise 0623 Waterway information Ocean; Cortes Bank depths 6–1,000 ft Figure 2 . Area where the Jig Strike flooded and sank, as indicated by a circled X. (Background source: Google Maps)", "spans": [[318, 371]]}], "answer": "The total head count aboard the Jig Strike when it flooded off Cortes Bank was 17 people, consisting of 5 crewmembers and 12 passengers.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-cf126660b4", "answerable": true, "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "evidence": [{"doc_id": "MIR2545.pdf", "quote": "On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking", "status": "retrieved"}, {"doc_id": "MIR2545.pdf", "quote": "was owned and operated by Algoma Central Corporation", "status": "not_retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel", "status": "retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "was owned and operated by Algoma Shipping Ltd., a subsidiary of the Algoma Central Corporation", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2606.pdf", "text": "Grounding of Dry Bulk Carrier Algoma Verity On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel (see figure 1 and figure 2). 1 The vessel repositioned and continued its upbound transit, outside the channel, until, at 1828, the vessel grounded again, coming to a stop. The Algoma Verity was refloated 3 days later. No pollution or injuries were reported. Damage to the vessel was estimated at $6.6 million. Figure 1. Algoma Verity underway at unknown date. (Source: Algoma Central Corporation) 1 (a) In this report, all times are eastern standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM015). Use the CAROL Query to search investigations. March 4, 2026 MIR-26-06", "spans": [[44, 236]]}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Damage to the facility was estimated at $950,000, and damage to the Algoma Discovery was estimated at $130,000. Figure 1. Algoma Discovery at unknown date before the contact. (Source: Carson Last, marinetraffic.com) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM052). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-45", "spans": [[77, 329]]}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 72 Report Investigation Year Title Summary Probable Cause MAB-17/30 DCA16FM023 2016 Allision of Tanker Nordbay with Docks and Water Intakes On February 2, 2016, at 2213 local time, the tanker Nordbay was southbound on the Lower Mississippi River in New Orleans, Louisiana, with a pilot on board when it allided with a dock and water intakes on the left descending bank. Less than an hour later, as the vessel maneuvered through another bend in the river while heading toward an anchorage, it allided with a wharf on the left descending bank. No pollution or injuries were reported. The dock, water intakes, the wharf, and the Nordbay sustained an estimated $6.4 million in total damage. The National Transportation Safety Board determines that the probable cause of the Nordbay’s allisions with water intakes and docks was the pilot and the master not", "spans": []}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility MIR-25-45 6 start. He stated that the interlocks for the main engines would not open and the compressed air bottle pressure and the control air pressure had both dropped. The master ordered the starboard anchor and the stern anchor be let go as the vessel was still moving forward, toward the dock. Crewmembers let go the anchors. However, about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots. At 2220, the Algoma Discovery came to a stop, with the bow touching the dock and the stern about 100 feet away from the dock. Five loading shuttles were damaged. Shortly after the vessel made contact with the shuttles, the crew conducted a damage survey of the vessel. The chief engineer determined that the control air system was not being supplied from the compressed air bottle system, and, about", "spans": []}], "answer": "The Algoma Discovery incident occurred on July 20, 2024, and the Algoma Verity incident occurred on January 8, 2025. Therefore, the two events were approximately 6 months apart in time.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-05e5209fa2", "answerable": true, "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "causing components, such as the no. 13 connecting rod and the crankshaft, to seize together and fail by welding themselves to the journal.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders.", "status": "retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "causing components, such as the no. 9 connecting rod and the crankshaft, to seize together at the journal and fail.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "the fire originated on the starboard side of the unloading generator engine when the engine block ruptured in the area of the no. 9 connecting rod", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 8 Coast Guard also requested assistance from a Bureau of Alcohol, Tobacco, Firearms and Explosives certified fire investigator, who participated in the examination of the damage. Investigators found that the no. 2 auxiliary engine was damaged beyond repair: the engine block, crankshaft, two connecting rods, counterweights, and other parts of the rotating assembly were damaged (see figure 5). Figure 5. Damaged no. 2 auxiliary generator aboard Ocean Navigator after the engine failure. The circled area identifies the location of the engine block damage. Investigators noted a hole about 10 inches high and 16 inches wide on the inboard side of the engine block in the area of the nos. 12 and 14 cylinders where the lower portion of the no. 13 connecting rod had been ejected (see figure 6). This area was located on the lower part of the engine near the deck plates between the two", "spans": [[806, 842]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 16 crankshaft. Parts from the disconnected connecting rod collided chaotically as the crankshaft continued to turn, damaging other engine components until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders. Therefore, it is likely that debris entrained in the lube oil system of the no. 2 auxiliary engine led to the catastrophic damage to the engine. As a result of the block rupturing, hot, atomized lube oil vented through the damaged inspection covers and ignited off hot components internal to the engine. The engineering logbooks for the vessel showed that, in the 2 months before the engine failure, crewmembers added lube oil to the no. 2 auxiliary engine (37 gallons in September and 42 gallons in October). In comparison, the crew added", "spans": [[231, 365]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 14 Figure 8. Removed crankshaft from damaged no. 2 auxiliary generator on board Ocean Navigator after the engine failure. After the crankshaft was removed, all main bearings were inspected, and the no. 8 bearing, located directly aft of the affected cylinder, was determined to be in the worst condition. In January 2025, the engine block was replaced and the engine rebuilt by technicians. The operating company requested that the connecting rod bearings on the adjacent no. 1 auxiliary engine be inspected by the technicians. Based on the condition of the sampled bearing, all connecting rod bearings were replaced on the no. 1 auxiliary engine. In February 2025, Caterpillar’s rotating component engineers provided comments from the inspection of the no. 2 auxiliary engine components that had been sent from the Ocean Navigator. The engineers observed the front main bearing", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 9 Figure 6. Left to right: Damaged engine block on no. 2 auxiliary engine aboard Ocean Navigator after the engine failure. Graphic identifying area of engine failure on the no. 2 auxiliary engine. The most significant smoke and heat damage was directly across the decking from the area of the no. 14 cylinder where the engine block was ruptured and extended upward toward the overhead and inboard toward the no. 1 auxiliary engine. The area in the engine room around and above the no. 2 auxiliary engine sustained smoke and heat damage. Soot was observed on all surfaces in the engine room and was heaviest on the components near the deck plates between the two auxiliary engines. The no. 1 auxiliary engine sustained fire damage to the turbocharger, piping, cables, and electrical insulation on the inboard side. The engine control module and", "spans": []}], "answer": "The NTSB analysis indicates that in the diesel generator engine failure aboard the Ocean Navigator, the no. 13 connecting rod seized with the crankshaft, leading to the engine block rupture. However, the specific connecting rod involved in the failure aboard the Pathfinder is not mentioned in the provided context.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-c6a3603e1b", "answerable": true, "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "evidence": [{"doc_id": "MIR2503.pdf", "quote": "Engine power; manufacturer 2 x 3,000 hp (2,237 kW); GE 7FDL12 diesel engines", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "The vessel’s propulsion was provided by two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Vessel electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp (see figure 3). The main engines operated at variable revolutions per minute based on the vessel’s input speed command. The auxiliary engines ran at 1,800 rpm. A 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "an electric motor, assisted with maneuvering. Two main engine shaft-driven generators and two 2,442-hp (1,821-kilowatt) Caterpillar 3512C auxiliary diesel engines, each coupled to an electric generator, provided electrical power for the vessel. The auxiliary diesel engines could be started from three locations: locally at a control panel next to the engines, remotely from the machinery control room (MCR), or remotely from the wheelhouse. 3 Each engine was equipped with a pre-lube pump that circulated pressurized lube oil throughout the stopped engine after receiving a start signal and before the engine began the starting sequence. 4 The two auxiliary engines had been installed aboard the Stuyvesant in December 2022, replacing older engines that had reached the end of their service life. The engine’s operation and maintenance manual indicated that the engines (with deep sump) had an approximate lube oil capacity of 162–165 gallons. 1.2 Event Sequence", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "or unloading equipment (such as conveyor and boom) were operational, a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power. The unloading generator was located on the starboard side of the barge’s main deck, aft of the auxiliary motor control center (MCC), with supply fan ducting in the overhead on the starboard side. The engine was positioned on the barge, with the turbochargers facing the forward direction, between the back of the engine and the generator. Figure 3. Unloading generator space on barge Pathfinder. (Background source: Interlake Steamship Co.)", "spans": []}, {"doc_id": "MIR2609.pdf", "text": "at 385 hp (287 kilowatts) and connected via a set of reduction gears to a fixed-pitch propeller. Electrical power was provided by two John Deere diesel engine–driven generators, each rated at 133 hp (99 kilowatts). The vessel was also equipped with a 36-hp (27-kilowatt) generator, located in the engine room, for emergency power. The Oliver Hazard Perry was equipped with high-water bilge alarms as required by the Coast Guard. Eight high-level bilge sensors were located throughout the vessel on the lower deck: one in the forepeak space, three in the berthing spaces, one in the auxiliary machine space (AMS), two in the engine room, and one in the fixed fire extinguishing system room. The AMS contained electrical panels, pumps, and other electrical equipment. It was adjacent to, and forward of, the engine room and separated by a watertight bulkhead that was fitted with a hinged watertight door.", "spans": []}], "answer": "The Bonnie G had two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Additionally, it was equipped with a 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering. The vessel's electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines), which were Caterpillar 3516B diesel engines, each rated at 2,000 hp.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-12e0ac0c39", "answerable": true, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "status": "retrieved"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direction. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. Because there were not enough immersion suits available for everyone, t he captain elected not to wear one. The crew attempted to stay on the stern deck of the vessel as long as possible before deploying the liferaft and entering the water. With the wheelhouse unattended, t he vessel’s heading changed, and smoke", "spans": [[599, 706]]}, {"doc_id": "MIR2504.pdf", "text": "distress call on VHF channel 16; he stated that the vessel was on fire and the crew was abandoning ship, and he also provided the vessel’s position. According to the captain, while making the radio calls in the wheelhouse, he was gasping for air and could barely see the GPS position on the navigation console due to the amount of smoke. US Coast Guard Sector Northern New England (in Portland, Maine) received the distress call from the Three Girls. Once alerted about the fire, the first mate ran into the accommodation space to collect as many survival suits from the crew quarters (staterooms) as he could carry. He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "spans": [[617, 895]]}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 6 On August 11, about 2030, the captain made a round of the engine room before returning to the wheelhouse to maneuver the vessel. He did not notice anything out of the ordinary during his round. About 2045, the captain called the crew to report to the stern deck to begin hauling the fishing net back onto the vessel. Crewmembers and the NMFS observer retrieved their gear from the vestibule at the entrance to the engine room in the accommodation space—which included the crew staterooms and the galley—before reporting to the stern deck. As they arrived, the captain was in the port aft corner of the wheelhouse overlooking the stern, operating the hydraulic net reel to haul in the fishing net. None of the crewmembers reported anything unusual from the entrance to the engine room. About 2050, after the fishing net was recovered from the seafloor, and when it", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 11 suits and lifejackets as fire blocked the crewmembers’ path to their storage area. The captain quickly made a mayday call, activated the EPIRB, and abandoned the vessel with the sternman into the liferaft in a timely manner. However, deployment of the liferaft on the windward side of the vessel prevented the crew from positioning it at a safe distance from the burning vessel. As a result, the heat of the fire ignited the liferaft’s canopy, causing it to sink and forcing the crewmembers into the water without any survival gear. The estimated water temperature of 50°F was within a range where hypothermia was a significant survival factor. 6 In water that temperature, cold incapacitation—where the use of hands, arms, and legs becomes more difficult—can occur within 10 minutes and possibly result in swimming failure or drowning. 7 Without lifejackets or immersion suits, the GITN’R DUN crew’s survival was dependent", "spans": []}], "answer": "The captain of the fishing vessel Three Girls did not wear an immersion suit during the August 2024 engine room fire because there were not enough immersion suits available for everyone, and he elected not to wear one.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5e62cbe69f", "answerable": true, "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward.", "status": "retrieved"}, {"doc_id": "MIR2628.pdf", "quote": "The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "rapidly expand as the vessel moved through the water (seas and swells) as it transited, ultimately causing a larger section of the hull to separate, including portions of the plywood, as seen by the second captain and deckhand 1. Water can penetrate through cracks, unsealed through-hull fittings, or areas where improper repairs have been made. Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward. The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs. Although the vessel was not salvaged, and therefore investigators could not examine the hull to determine the method of failure, it is possible that inadequately completed repairs to the hull contributed to the casualty.", "spans": [[346, 470], [471, 727]]}, {"doc_id": "MIR2628.pdf", "text": "about a 10-foot-long section located about 4 feet down from the rub rail. The repairs were completed by the owner and the captain. The US Coast Guard was not notified about the issue with the hull and therefore did not oversee the repairs as required for an inspected vessel like the Jig Strike. According to the Coast Guard, “on multiple occasions from 2005 until vessel sinking, the owner of the Jig Strike routinely disregarded notifying attending CG [Coast Guard] inspectors of ongoing repairs.” A condition and valuation survey was completed in December 2021; the surveyor rated the hull and structure of the vessel as “satisfactory.” The summary of the survey stated, “ The vessel is basically structurally sound but it does exhibit normal deterioration and mechanical deficiencies.”", "spans": [[138, 182]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": [[724, 755]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "The crewmembers identified a hull delamination on the Jig Strike, which was repaired by the owner and the captain. The Coast Guard was unable to oversee the repairs because they were not notified about the issue, and the owner routinely disregarded notifying Coast Guard inspectors of ongoing repairs.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5cdfbd0e24", "answerable": false, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "evidence": [], "passages": [{"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 2 Analysis While the City of Louisville was upbound on the Upper Mississippi River pushing 11 empty barges, the towing vessel ran aground near mile 42.6 in a charted shallow and rocky area. The grounding caused fractures to the vessel’s bottom plating underneath the engine room, leading to water flooding into the engine room, machinery, and aft accommodation spaces. The pilot of the City of Louisville was alone on watch in the wheelhouse when the grounding occurred. The pilot told investigators that, before the grounding, he had left the helm and was on the port side of the wheelhouse. He estimated he was away from the helm about 5 minutes. Leaving the helm unattended is contrary to prudent navigation practices when operating on rivers. The Mississippi River, in particular, has frequent turns, and the potential for strong currents and heavy traffic.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "for a fleet on the Upper Mississippi River at mile 126 near St. Genevieve, Missouri. The overall length of the tow was about 738 feet, and the overall width was about 140 feet (see figure 3). Figure 3. City of Louisville tow arrangement (scale approximate). On July 29, about 1100, the pilot took over the navigational watch in the wheelhouse from the relief captain for their normally scheduled watch change. The City of Louisville proceeded upriver without event, with the pilot at the helm and making a speed of about 4 to 5 mph. According to the pilot, the tow was traveling at 3 Pilot is a term used aboard towing vessels on inland waterways for a person, other than the captain, who navigates the vessel.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "engine room, causing the vessel to settle to the bottom. There were eventually about 4 feet of water in the lower engine room. The tow remained intact, facing upriver after the grounding. The pilot said they were unable to move the vessel off the rocks. About 3 hours after the grounding, at 1753, thunderstorms passed through the area, which required the crew and responding personnel to evacuate the City of Louisville. Winds from the storm moved the tow to starboard, causing it to pivot on the rocks; the tow was then oriented toward the left descending bank. As the river stage later rose, the water level inside the engine room increased, and the main deck rudder room and aft galley/mess area also flooded. Figure 5. The City of Louisville aground. (Source: Coast Guard) 1.3 Additional Information There were no reported defects or deficiencies with the City of Louisville’s navigational, steering, communication, and propulsion systems. 5", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 a reduced speed at the customer’s request, since they were not in a rush to receive the barges. The pilot told investigators that, about 1442, he left the helm. Before doing so, he looked out the wheelhouse front window and saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system). He also checked the swing meter, fathometer, and electronic chart system (ECS). At that time, the boat’s ECS recorded the vessel on a heading of 349° at 4.8 mph and about 45 yards to the east of the sailing line, which had a course line of 347°. 4 He told investigators that he then went to the port side of the wheelhouse and relieved himself into a bag while looking out of the portside window. At 1444, on a heading of 344° at 4.7 mph, the City of Louisville tow passed a point where the sailing line changed course from 347° to 356°. About a minute later, the", "spans": []}], "answer": "The City of Louisville was not fitted with an autopilot system, so there was no malfunction in an autopilot that allowed the tow to wander out of the channel. The pilot left the helm unattended, which contributed to the grounding incident.", "judges": ["groundedness", "abstention"]}, {"key": "t-c8d28274ae", "answerable": true, "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "3 The current was about 3 mph. A total of six lock lines and four winch wires were used to moor the two barges (three lock lines and two wires on each barge). MPC told investigators that there was not a specified minimum number of lines to secure barges at their facility, but that industry standard was four lines and/or wires per barge in normal conditions. MPC expected enhanced measures beyond the minimum at high-wind and -water level conditions but did not specify how many additional lines should be used. On April 16, about 0600, MPC terminal operations personnel arrived at the terminal and found the MPC 644 and MPC 907 missing. At 0610, terminal operations personnel called EMS to check on the status of the barges. After investigating, at 0645, EMS called MPC terminal operations personnel and stated that the barges had broken away overnight. About 0650, terminal operations personnel performed a", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 4 The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock. No significant damage was noted to the barges, and all cargo was offloaded without issue. The TransMontaigne terminal—located at mile 794.1, about 1,500 feet downstream of th e MPC terminal—reported damage to its dock structure, which consisted of four mooring cells and a steel access walkway running from shore to cell nos. 2 and 3 (see figure 3). Cell no. 4, located farthest upriver, was no longer present. A sonar survey found that t he cell piling was fractured at t he river bottom and laid in th e downstream direction at a 90° angle to the original vertical location (see figure 4). Cell no. 3 sustained significant damage to the upstream piling structure and concrete cell cap. Cell no. 2 sustained fracture damage to its concrete cap. Supports and steps for a spiral ac", "spans": [[94, 195]]}], "answer": "The barges MPC 907 and MPC 644 were recovered by EMS tugs near mile 802 about 0700.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6c64afa74b", "answerable": true, "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "evidence": [{"doc_id": "MIR2545.pdf", "quote": "On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking", "status": "retrieved"}, {"doc_id": "MIR2545.pdf", "quote": "was owned and operated by Algoma Central Corporation", "status": "not_retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel", "status": "retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "was owned and operated by Algoma Shipping Ltd., a subsidiary of the Algoma Central Corporation", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2606.pdf", "text": "Grounding of Dry Bulk Carrier Algoma Verity On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel (see figure 1 and figure 2). 1 The vessel repositioned and continued its upbound transit, outside the channel, until, at 1828, the vessel grounded again, coming to a stop. The Algoma Verity was refloated 3 days later. No pollution or injuries were reported. Damage to the vessel was estimated at $6.6 million. Figure 1. Algoma Verity underway at unknown date. (Source: Algoma Central Corporation) 1 (a) In this report, all times are eastern standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM015). Use the CAROL Query to search investigations. March 4, 2026 MIR-26-06", "spans": [[44, 236]]}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Damage to the facility was estimated at $950,000, and damage to the Algoma Discovery was estimated at $130,000. Figure 1. Algoma Discovery at unknown date before the contact. (Source: Carson Last, marinetraffic.com) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM052). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-45", "spans": [[77, 329]]}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 72 Report Investigation Year Title Summary Probable Cause MAB-17/30 DCA16FM023 2016 Allision of Tanker Nordbay with Docks and Water Intakes On February 2, 2016, at 2213 local time, the tanker Nordbay was southbound on the Lower Mississippi River in New Orleans, Louisiana, with a pilot on board when it allided with a dock and water intakes on the left descending bank. Less than an hour later, as the vessel maneuvered through another bend in the river while heading toward an anchorage, it allided with a wharf on the left descending bank. No pollution or injuries were reported. The dock, water intakes, the wharf, and the Nordbay sustained an estimated $6.4 million in total damage. The National Transportation Safety Board determines that the probable cause of the Nordbay’s allisions with water intakes and docks was the pilot and the master not", "spans": []}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility MIR-25-45 6 start. He stated that the interlocks for the main engines would not open and the compressed air bottle pressure and the control air pressure had both dropped. The master ordered the starboard anchor and the stern anchor be let go as the vessel was still moving forward, toward the dock. Crewmembers let go the anchors. However, about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots. At 2220, the Algoma Discovery came to a stop, with the bow touching the dock and the stern about 100 feet away from the dock. Five loading shuttles were damaged. Shortly after the vessel made contact with the shuttles, the crew conducted a damage survey of the vessel. The chief engineer determined that the control air system was not being supplied from the compressed air bottle system, and, about", "spans": []}], "answer": "The two events involving the bulk carriers tied to Algoma Central Corporation occurred on different dates:\n\n1. The **Algoma Discovery** incident happened on **July 20, 2024**, when it struck dock equipment at the BNSF Allouez Taconite Facility in Superior, Wisconsin.\n   \n2. The **Algoma Verity** incident occurred on **January 8, 2025**, when it ran aground on the Delaware River near Philadelphia, Pennsylvania.\n\nThe time between these two events is approximately **6 months** (from July 2024 to January 2025).", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0208d5168c", "answerable": false, "question": "Why did the towboat Harlan Creek and its barges strike the lock wall at Markland Locks and Dam on the Ohio River in 2025?", "expected_answer": "The reports do not cover a contact by a tow of the Harlan Creek at Markland Locks and Dam; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 71 Report Investigation Year Title Summary Probable Cause MIR-25-14 DCA24FM025 2024 Contact of Amber Brittany Tow with Vane Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart. There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. The National Transportation Safety Board determines that the probable cause of the contact of the Amber Brittany tow with the vane dike was the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Va n e Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. 2 Figure 1. The Amber Brittany on July 28, 2022, before the contact. (Source: Matt Burks) 1 In this report, all times are eastern standard times, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM025). Use the CAROL Query to search investigations. April 4, 2025 MIR-25-14", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": []}], "answer": "The incident involving the towboat *Harlan Creek* and its barges striking the lock wall at Markland Locks and Dam on the Ohio River in 2025 is not directly documented in the provided contexts. However, based on the information from the related incidents involving the *Amber Brittany* tow and the *Tom Frazier* tow, we can infer potential contributing factors that may have been relevant to the *Harlan Creek* incident.\n\n### Key Contributing Factors from Similar Incidents:\n1. **Outdraft Currents and Navigation Challenges:**\n   - The *Amber Brittany* incident occurred due to the pilot's failure to effectively compensate for outdraft currents near the vane dike while navigating out of the lock channel entrance. This suggests that strong currents can significantly impact a vessel's ability to maintain control, especially in confined or complex waterways like those near locks and dams.\n\n2. **Inexperience or Misjudgment of Conditions:**\n   - The *Amber Brittany* pilot was noted to have inexperience in transiting the Portland Channel, which may have led to poor decision-making under challenging conditions. Similarly, the *Harlan Creek* incident could have been influenced by a pilot or crew member's unfamiliarity with the specific conditions at Markland Locks and Dam.\n\n3. **Proximity to Fixed Hazards:**\n   - The *Tom Frazier* incident involved grounding on jetties due to the vessel running too close to the right descending bank. This highlights the importance of maintaining a safe distance from fixed hazards, such as lock walls, jetties, and riverbanks, especially in areas with changing water levels and currents.\n\n4. **Environmental and Hydrological Conditions:**\n   - The *Tom Frazier* incident also involved changes in water levels, which affected the visibility and positioning of hazards. Similarly, the *Harlan Creek* incident may have been influenced by fluctuating water levels, strong currents, or other hydrological factors that impacted the vessel's maneuverability.\n\n### Conclusion:\nWhile the specific cause of the *Harlan Creek* incident is not provided in the given contexts, it is likely that the strike on the lock wall at Markland Locks and Dam was due to a combination of factors such as:\n- Failure to account for outdraft currents or other hydrological conditions.\n- Inexperience or misjudgment of the navigation environment.\n- Proximity to fixed hazards like the lock wall.\n- Environmental conditions such as water levels or visibility.\n\nFor a definitive answer, a detailed investigation report or official statement regarding the *Harlan Creek* incident would be required.", "judges": ["groundedness", "abstention"]}, {"key": "t-d07f96f904", "answerable": true, "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "evidence": [{"doc_id": "MIR2542.pdf", "quote": "Waterway information Unprotected approach channel, width 148 ft; charted depth 16 ft in channel, 8 ft outside of channel", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2542.pdf", "text": "148 feet wide at the location of the Jack Edwards/Julie C collision, per electronic navigation charts for the area. The charted depth in the channel was 16 feet, with water depths of 8–10 feet immediately outside the channel. On the day of the casualty, high tide within the port was predicted at 6.5 feet above charted datum at 2215; the range of tide was 2.3 feet. The National Geospatial-Intelligence Agency’s (NGA) Sailing Directions (Enroute), East Coast of South America describes the bottom type as follows: The mud on the bottom is known locally as “sling mud.” It is from 0.6 to 1.2m [2.0 to 3.9 feet] thick, and is of a very soft, almost liquid consistency. Ships of 10 knots or more can force a passage through this “sling mud” even though drawing 0.3m [1 foot] more than the actual depth of water. 10 The Jack Edwards crew stated that they were experiencing a flood tide at the time of the transit into Georgetown. According to the Sailing Directions, currents", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "steering issue was not reported to the Jack Edwards’s chief engineer by the bridge watchstanders. Arriving in Georgetown on March 16, the Jack Edwards transited the port’s entrance channel and moored without incident. Later that evening, the vessel shifted berths in the port, again without incident. At 0840 the next morning, the Jack Edwards got underway to conduct a brief sea trial a few miles off the Guyana coast for the vessel’s charterer. A representative of the charterer company had boarded the vessel, bringing the total complement to ten. The OSV’s departure drafts were 13 feet 5 inches forward and 14 feet 2 inches aft. The sea trial was completed by 1530. A half hour later, the vessel anchored, awaiting high tide and an available berth in Georgetown. At 2100, the Jack Edwards crew began preparing the vessel to get underway for the inbound transit to the port. The second mate was the OICNW on the bridge.", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "9 knots, it was hailed on VHF radio by “Georgetown Pilots” and informed that it was “way out of the [Georgetown entrance] channel.” At the time, the Jack Edwards was about 0.48 miles to the northwest of the channel. Georgetown Pilots advised the vessel to come to port toward the channel. The Jack Edwards’s chief mate acknowledged the Georgetown Pilots radio call and instructed the second mate to steer toward the channel. The second mate and chief engineer told investigators that, while outside the channel, the Jack Edwards was “shuddering” and had a “serious vibration.” According to the second mate, the shuddering stopped when the Jack Edwards got closer to the channel. The second mate and chief engineer stated that it was possible that the vibration was caused by the vessel contacting the soft mud bottom. In a statement to investigators, the charterer representative, who was on the bridge during the casualty", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "the channel until it veered to port just prior to the collision). High tide, which occurred at 2215, added 6.5 feet to the charted datum, bringing the water depth to 14.5– 16.5 feet and falling. The Jack Edwards’s aft draft was 14 feet 2 inches, putting the vessel in, or nearly in, the soft “sling mud” on the bottom as it transited inbound. Although the vessel’s echo sounder recorded depths beneath the keel of 8 feet or greater, echo sounder readings can vary in areas with a “fluid-mud” layer. 11 Research has shown that a vessel transiting with its keel near the water-mud interface can experience sluggish maneuvering at low speeds (3 knots). The effect decreases at higher speeds (7 knots). 12 The NGA Sailing Directions notes that ships transiting at 10 knots can navigate through the mud in the approaches to Georgetown with drafts that exceed the depth of water by up to 1 foot. The Jack Edwards was transiting between 9 and 10 knots throughout the time that the 11", "spans": []}], "answer": "The approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C collided, was 148 feet wide at the location of the collision. The charted depth in the channel was 16 feet.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8c534538f8", "answerable": false, "question": "What did the NTSB determine caused the fishing vessel Northern Halcyon to capsize while hauling crab pots in the Bering Sea in 2025?", "expected_answer": "The reports do not cover a capsizing of a fishing vessel named Northern Halcyon; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2536.pdf", "text": "Hull Failure and Implosion of Submersible Titan MIR-25-36 79 Casualty Summary NTSB casualty category Flooding/Hull Failure Location North Atlantic Ocean, 900 nm east of Cape Cod, Massachusetts 41°43.98’ N, 49°59.9’ W Date June 18, 2023 Time 1047 Newfoundland and Labrador daylight time (coordinated universal time –2.5 hours) Injuries 5 fatal Property damage $5.6 million CAD (about $ 4.2 million USD) est. Environmental damage None Persons on board 5 NTSB investigators worked closely with our counterparts from Coast Guard Office of Investigations and Analysis throughout this investigation. The NTSB is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in the other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine the probable causes of the accidents and events we", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN On July 24, 2025, about 0900 local time, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the two crewmembers aboard were hauling lobster traps in the Gulf of Maine near Mount Desert Rock, Maine (see figure 1 and figure 2). 1 The captain of the vessel attempted to put out the fire but was unsuccessful. Both crewmembers abandoned the vessel, which burned to the waterline and sank. There were no injuries, and no pollution was reported. The vessel was a total loss, with damages estimated at $717,500. Figure 1. GITN’R DUN moored on May 29, 2025. (Source: US Coast Guard) 1 (a) In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles), unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM051). July 23, 2026 MIR-26-25", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-45fc0916f9", "answerable": true, "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "evidence": [{"doc_id": "MIR2619.pdf", "quote": "He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 9 Figure 5. Diagram (looking toward the Erving’s bow) showing the position of the STS crane boom if it were raised versus its position at the time of the accident. (Scale approximate.) One of the STAX 1 deckhands repairing the exhaust duct on the Erving ran toward the starboard-side handrails of the funnel. He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane. No one was in the cab, but he was unable to see into the trolley cab due to the angle of the trolley cabin front windshield. At 1649, while STS crane 16 was moving toward the stern of the vessel, the crane contacted the STAX 1 emission capture boom (see figure 6). Sections of boom fell onto STAX 1, onto the Erving, and into the water. A portion of the emission", "spans": [[398, 569]]}], "answer": "The worker was approximately 200 feet away from the crane's operator cabin.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f19f99a78c", "answerable": true, "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "evidence": [{"doc_id": "MIR2509.pdf", "quote": "The mate was then able to reach the Brunswick crew over VHF radio to make passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.”", "status": "partly"}], "passages": [{"doc_id": "MIR2509.pdf", "text": "the Local Notice to Mariners, along with a request for vessels to arrange safe passage when transiting nearby. To pass the area where the Brunswick was dredging, a vessel would need to either (1) request that the Brunswick move the floating discharge pipeline so that it was not extending across the river, or (2) pass to the west of the Brunswick, along the west bank of the Cooper River. The dredge crew moved the floating discharge pipe frequently to accommodate passing traffic during normal operations. On the Royal Engineer, the mate was on watch in the wheelhouse. During the transit south, he attempted to hail the dredge via VHF radio about 1 hour before the tow reached the dredge’s location. According to the mate, he intended to request", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.” He said he could swing the dredge around and provide about 300 feet of clearance to the seawall, not including the width of the Celsius Nicosia. The mate informed the dredge captain that he would have enough room to maneuver the Royal Engineer tow so it would pass between the Brunswick and the Celsius Nicosia (see figure 4). Figure 4. The Royal Engine er’s path between the dredge Brunswick and the containership Celsius Nicosia at 1620. (Background source: Esri satellite image as viewed on Made Smart)", "spans": [[0, 268]]}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 10 2 Analysis While the towing vessel Royal Engineer was pushing the crane barge Stevens 1471 in the Cooper River, the tow transited underneath an STS crane at the North Charleston Terminal while maneuvering through a narrow area between a docked containership and a dredging vessel because the dredge’s floating discharge pipeline was blocking the rest of the channel. The barge crane contacted the STS crane, resulting in extensive damage to the STS crane. The Royal Engineer mate was aware of the dredging operations along the tow’s transit route. The day before the contact, on January 3, he had transited the area between the dredge and the North Charleston Terminal, but there was no containership berthed at the terminal. The mate told investigators that, on the day of the contact, he attempted twice to contact the dredge crew early—first an hour and", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 4 According to technical drawings, the mast reached a height of 144.6 feet above the deck of the barge. The air draft of the crane barge was noted on the towboat’s voyage plan as 145 feet. Figure 3. Approximate towing configuration of the Royal Engineer p ushing the Ste vens 1471. The crane components and their measurements are labeled. Along the Royal Engineer tow’s route, the Brunswick, a 315-foot-long dredge and barge, was dredging the Cooper River channel adjacent to the North Charleston Terminal, located about 1 mile north of the Don Holt Bridge. The Brunswick’s floating discharge pipeline extended eastward across the Cooper River channel, where dredge spoils were discharged near the eastern bank, effectively blocking the channel to traffic moving north and south. The dredging operation was published in", "spans": []}], "answer": "The skipper of the dredge Brunswick wanted the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River because he had workers downstairs who were working on something, and he would have to stop them to go do something else. He preferred the tow to pass between the dredge and the dock.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-eae89fbf02", "answerable": true, "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "evidence": [{"doc_id": "MIR2527.pdf", "quote": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "status": "retrieved"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "status": "not_retrieved"}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 4 Figure 3. Land-based firefighters on Lucinda Smith. (Source: New Bedford Fire Department) After the fire, US Coast Guard investigators examined the damage on the Lucinda Smith. The Coast Guard also requested assistance from Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigators, who participated in the examination of the damage. ATF investigators concluded that the fire originated in the first mate’s stateroom. Based on the fire damage patterns found within the stateroom, investigators concluded that the fire most likely originated at or near the floor (deck) by the end of the bunk. However, due to the damage to the interior of the stateroom, ATF investigators could not determine the exact ignition source and ultimately classified the cause of the fire as “undetermined.”", "spans": [[443, 487]]}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire aboard the towing vessel Lucinda Smith was an undetermined ignition source in one of the vessel’s staterooms.", "spans": []}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 6 2 Analysis While the towing vessel Lucinda Smith was moored at the dock, a crewmember heard a smoke alarm and discovered a fire in one of the staterooms. ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater). Electrical sources near the bunk included an electric heater, an oscillating fan, and an electrical wall receptacle. Crew interviews revealed that the heater and fan were not in use before the fire and thus likely were not an ignition source. The receptacle
