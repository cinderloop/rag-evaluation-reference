ng the initial charging of one of the 48-volt battery banks using one of the portable chargers, which started on February 1, it took 5 days for the battery voltage to increase from 34 volts to 39 volts.", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "Vessel personnel determined that the BMSs were preventing the batteries from being charged from a portable charger", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 4 Figure 3. Diagram of the main deck of the Flagship showing the approximate locations of the 24-volt and 48-volt lithium-ion battery banks. ( Background source: RMK Merrill Stevens) 1.2 Event Sequence 1.2.1 Pre-casualty Events Before their installation on the Flagship during vessel construction, the 24- and 48-volt batteries for the Flagship were able to maintain a charge. There were no issues with the installation of the 48-volt lithium-ion battery systems. However, when the 24-volt system was installed, its BMS could not manage the charging of battery cells. The cause of the problem with the charging of the 24-volt lithium-ion battery system was not identified or resolved during vessel construction. During the vessel’s sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5f20b7484c", "answerable": true, "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "February 4, 2026 MIR-26-04 Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska", "status": "partly"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska 57°02.09’ N, 134°39.33’ W Date March 6, 2025 Time 1320 Alaska standard time (coordinated universal time –9 hrs) Persons on board 5 Injuries 1 minor Property damage $1.6 million Environmental damage None Weather Visibility 9 mi, overcast, winds east-southeast 12 kts, air temperature 44°F Waterway information Strait; width 4.5 nm, depth 1,571 ft Figure 2. Area where the Spicy Lady fire occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[0, 163]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 4 Figure 3. The Spicy Lady under tow by the Angelette after the crew evacuated to the Angelette. (Source: Wrangell Volunteer Fire Department) At 1432, the captain of the Spicy Lady notified the Wrangell Volunteer Fire Department, located in Wrangell, Alaska (about 100 miles from the Spicy Lady’s location), of the fire. The fire department prepared their gear and boarded a floatplane, which departed Wrangell at 1509 with three firefighters on board. At 1603, the floatplane landed in Warm Springs Bay, where it met the Westerly. The firefighters boarded the Westerly with their gear, and the crew aboard the Westerly transported them to the Spicy Lady just outside of Warm Springs Bay. Once aboard the Spicy Lady, firefighters set up a portable fire pump and entered the main cabin. They encountered heat and heavy smoke and traced the origin of the fire to the forward berthing area. Using water and foam, the firefighters", "spans": [[0, 47]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": [[0, 37], [150, 192]]}, {"doc_id": "MIR2624.pdf", "text": "a. The American Bureau of Shipping only served as the designated TPO for the Miss Peggy and did not class the vessel. 1.5 Waterway Conditions The casualty occurred near the boundary of the Lynchburg precautionary area. The Coast Guard designated Lynchburg as a precautionary area “due to frequent congestion of meeting, crossing, and overtaking of dissimilar traffic including ships, tows with/without barges, ferries, and industrial vessels.” 29 Figure 19 shows the radius of the precautionary area. 29 According to 33 CFR 161.2, a precautionary area is a routing measure comprising an area within defined limits where vessels must navigate with particular caution and within which the direction of traffic may be recommended.", "spans": []}], "answer": "The March 2025 Spicy Lady casualty was categorized as a fire/explosion. It took place in Chatham Strait, near the landmark Point Gardner, Alaska.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f0b03579c7", "answerable": true, "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "evidence": [{"doc_id": "MIR2544.pdf", "quote": "Casualty type Flooding/Hull Failure", "status": "retrieved"}], "passages": [{"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole On June 12, 2024, about 1530 local time, the towing vessel Cajole was upbound the Lower Mississippi River near Waggaman, Louisiana, when the vessel began flooding (see figure 1 and figure 2). 1 The two crewmembers aboard attempted to pump out the vessel but were unsuccessful. They tied off to a nearby barge and evacuated to a Good Samaritan vessel. The Cajole later sank. There were no injuries, and a sheen was reported. Damage was estimated at $2 million. Figure 1. Cajole underway on an unknown date before the sinking. (Source: marinetraffic.com, Mark Haury) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM046). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-44", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 2 Casualty Summary Casualty type Flooding/Hull Failure Location Lower Mississippi River, mile 112, Waggaman, Louisiana 29°57.77’ N, 090°14.35’ W Date June 12, 2024 Time 1530 central daylight time (coordinated universal time –5 hrs) Persons on board 2 Injuries None Property damage $2 million Environmental damage Sheen on water, 4,277 gal diesel fuel recovered (est. fuel capacity 5,000 gal) Weather Visibility 7 mi, partly cloudy, winds east-northeast 7 kts, air temperature 91°F Waterway information River width 2,100 ft, depth 33 ft, current est. 2 kts Figure 2. Area where the Cajole flooding occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[74, 109]]}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 10 2 Analysis While transiting the Lower Mississippi River, the towing vessel Cajole flooded and sank after taking on water near mile 113. Partway through the transit, the captain reported that the vessel was losing speed; he later entered the engine room and saw water entering the engine room space from the forward starboard corner near a bulkhead penetration (conduit). There were two spaces forward of the engine room’s forward bulkhead: the auxiliary space and bow void. After the towboat was salvaged, investigators found no hull damage that would have allowed water ingress into these spaces. According to the captain, the cover on an access hatch to the starboard-side auxiliary void was in place when he discovered the flooding in the engine room. The cover was lost during the casualty, so investigators were not able to evaluate its condition. The hatch was flush", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 5 these preparations, about 0630, the vessel departed the shipyard with the captain at the helm, transiting north in the Harvey Canal, bound for Weber Marine in Convent, Louisiana. Between departure and 0745, the captain received an alarm on the bridge. The captain could not recall the nature of the alarm. He silenced the alarm and continued navigating the vessel. About 0745, the Cajole transited Harvey Lock, turned to port, and proceeded upbound on the Mississippi River. Over the next 3-4 hours, the vessel continued at speeds between 3 and 8.5 knots, averaging about 5 knots. Throughout the voyage, to accommodate vessel traffic, the Cajole crossed the river, first crossing to the right descending bank, then the left descending bank. 2 At 1102, the vessel again crossed the river to the right descending bank, turning sharply to port, with the starboard side of the vessel exposed to the current.", "spans": []}], "answer": "The casualty summary indicates that the failure was flooding/hull failure, which led to the loss of the towboat Cajole on the Mississippi River near Waggaman.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a8af4e5cd9", "answerable": false, "question": "What was the name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine?", "expected_answer": "The report does not give this detail; it says only that a tugboat was dispatched to recover the Three Girls, which was docked in Portland on August 14.", "evidence": [], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 9 The William Chadwick arrived in Portland at 1100 the following morning (August 12). The Three Girls remained afloat as the fire continued to smolder. The following day, a tugboat was dispatched to recover the Three Girls, and on August 14, the Three Girls was docked in Portland. The local fire department boarded the vessel and extinguished the fire using water and foam. 1.3 Additional Information 1.3.1 Damage After the fire was extinguished, National Transportation Safety Board and Coast Guard investigators boarded the Three Girls to inspect the damage. The Coast Guard also requested assistance from a local Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigator, who participated in the examination of the damage. The steel bulkheads, decks, and overhead of the wheelhouse displayed several areas of deck and bulkhead warpage, and all contents inside the wheelhouse", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls On August 11, 2024, about 2056 local time, while the fishing vessel Three Girls was engaged in fishing operations in the Gulf of Maine about 118 miles east-southeast of Portland, Maine, a fire broke out in the vessel’s engine room (see figure 1 and figure 2). 1 The five crewmembers and a National Marine Fisheries Service observer abandoned the burning vessel into a liferaft and were rescued by a US Coast Guard cutter crew that same evening. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $1.3 million. 2 Figure 1. Three Girls docked in Portland, Maine, on August 14, 2024, after the fire. 1 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM056). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 17 Vessel Particulars Vessel Three Girls Type Fishing (Fishing vessel) Owner/Operator Three Girls Fishing, LLC (Commercial) Flag United States Port of registry Portland, Maine Year built 1979 Official number 609865 (US) IMO number N/A Classification society N/A Length (overall) 81.6 ft (24.9 m) Breadth (max.) 24.0 ft (7.3 m) Draft (casualty) 11.0 ft (3.4 m) Tonnage 783 GRT Engine power; manufacturer 1 x 850 hp (634 kW); Caterpillar 3512 diesel engine NTSB investigators worked closely with our counterparts from Coast Guard Sector Northern New England throughout this investigation. The National Transportation Safety Board (NTSB) is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 2 Casualty Summary Casualty type Fire/Explosion Location Gulf of Maine, 118 nm east-southeast of Portland, Maine 43°07.37’ N, 67°58.78’ W Date August 11, 2024 Time 2056 eastern daylight time (coordinated universal time –4 hrs) Persons on board 6 Injuries None Property damage $1.3 million est. Environmental damage None Weather Visibility 10 nm, clear, winds southwest 10 kts, gusts 13 kts, seas 2–4 ft, air temperature 67° F, seawater temperature 63° F, sunset 2024, evening twilight 2102 Waterway information Ocean, depth about 450 ft (at casualty site) Figure 2. Area where the fire broke out aboard the fishing vessel Three Girls, as indicated by a circled X. (Background source: Google Maps)", "spans": []}], "answer": "The name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine, is not specified in the provided context.", "judges": ["groundedness", "abstention"]}, {"key": "t-3985c5cfc1", "answerable": true, "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "3 The current was about 3 mph. A total of six lock lines and four winch wires were used to moor the two barges (three lock lines and two wires on each barge). MPC told investigators that there was not a specified minimum number of lines to secure barges at their facility, but that industry standard was four lines and/or wires per barge in normal conditions. MPC expected enhanced measures beyond the minimum at high-wind and -water level conditions but did not specify how many additional lines should be used. On April 16, about 0600, MPC terminal operations personnel arrived at the terminal and found the MPC 644 and MPC 907 missing. At 0610, terminal operations personnel called EMS to check on the status of the barges. After investigating, at 0645, EMS called MPC terminal operations personnel and stated that the barges had broken away overnight. About 0650, terminal operations personnel performed a", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 4 The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock. No significant damage was noted to the barges, and all cargo was offloaded without issue. The TransMontaigne terminal—located at mile 794.1, about 1,500 feet downstream of th e MPC terminal—reported damage to its dock structure, which consisted of four mooring cells and a steel access walkway running from shore to cell nos. 2 and 3 (see figure 3). Cell no. 4, located farthest upriver, was no longer present. A sonar survey found that t he cell piling was fractured at t he river bottom and laid in th e downstream direction at a 90° angle to the original vertical location (see figure 4). Cell no. 3 sustained significant damage to the upstream piling structure and concrete cell cap. Cell no. 2 sustained fracture damage to its concrete cap. Supports and steps for a spiral ac", "spans": [[94, 195]]}], "answer": "The barges MPC 907 and MPC 644 were recovered by EMS tugs near mile 802 about 0700 (central daylight time).", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-215fc9a5ed", "answerable": true, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; during the initial charging of one of the 48-volt battery banks using one of the portable chargers, which started on February 1, it took 5 days for the battery voltage to increase from 34 volts to 39 volts.", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "Vessel personnel determined that the BMSs were preventing the batteries from being charged from a portable charger", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 4 Figure 3. Diagram of the main deck of the Flagship showing the approximate locations of the 24-volt and 48-volt lithium-ion battery banks. ( Background source: RMK Merrill Stevens) 1.2 Event Sequence 1.2.1 Pre-casualty Events Before their installation on the Flagship during vessel construction, the 24- and 48-volt batteries for the Flagship were able to maintain a charge. There were no issues with the installation of the 48-volt lithium-ion battery systems. However, when the 24-volt system was installed, its BMS could not manage the charging of battery cells. The cause of the problem with the charging of the 24-volt lithium-ion battery system was not identified or resolved during vessel construction. During the vessel’s sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands.", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank. To bypass each BMS, an electrical wire was attached to allow power to travel from one side of the terminal to the other side (see figure 4). Figure 4. The installed bypass wire and the wire from the external charger on one of the 48-volt battery management systems on board the Flagship. (Background source: RMK Merrill Stevens) The BMS for the 24-volt battery system, which provided power to the vessel’s fuel pump and internal lights, was bypassed on March 13 and charged by a portable charger that had arrived with the vessel from Turkey.", "spans": [[0, 240]]}, {"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 8 Figure 6. The 24-volt lithium-ion battery bank (c ircled), after the fire. Shipyard personnel told investigators that the 24-volt and 48-volt batteries were not being charged when the workday ended on Friday, April 26, or during the weekend. They did not document or recall when they were last charged. Shipyard personnel informed investigators that both chargers were disconnected before the fire. The vessel’s shore power cable was connected to an outlet designated to provide electricity while the vessel was docked. In addition, a vessel’s representative told investigators that the electrical systems on the vessel were not being powered by the 24-volt and 48-volt battery systems. 2 Analysis The yacht Flagship was docked with no personnel on board at a shipyard on the Miami River in Miami when an explosion and fire occurred. Shoreside firefighters", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "electrical battery system (see figure 3). A BMS is critical to the safety and overall performance of lithium-ion batteries. The four BMSs aboard the Flagship managed the voltage, current, and temperature of each battery cell, as well as the charging and discharging. The BMSs were designed to start charging each of the battery banks when the charge level fell below 94% and would continue to charge until the charge level reached 100%. The battery banks could be charged from the vessel’s generator, shore power connection, or the solar panels located on the flying bridge. 4 3 CE Certification refers to European Union regulations that required manufacturers to affix a “CE marking” on products. The CE marking indicates that a product has been assessed by the manufacturer and deemed to meet European Union safety, health, and environmental protection requirements. 4 The vessel’s shore power electrical system was designed to operate on the nominal European", "spans": []}], "answer": "The team working on the yacht *Flagship* decided to wire around its battery monitoring computers (BMS) because the **24-volt lithium-ion battery system's BMS could not manage the charging of battery cells** during vessel construction. This issue was not identified or resolved, and during sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands. \n\nTo address the charging inefficiency, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to **increase the charging speed of the lithium-ion batteries by bypassing the BMS** of each battery bank. This bypass involved attaching an electrical wire to allow power to travel from one side of the terminal to the other, effectively circumventing the BMS.\n\nRegarding the **charging rate of the 48-volt battery bank**, the context does not provide specific data on how many volts per day the 48-volt bank had been gaining before the bypass was implemented. However, it is known that the BMS for the 48-volt battery system was functional and designed to start charging when the charge level fell below 94% and continue until it reached 100%. The exact rate of charge gain per day is not specified in the provided context.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5d8e8ab744", "answerable": true, "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "evidence": [{"doc_id": "MIR2522.pdf", "quote": "The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff.", "status": "partly"}, {"doc_id": "MIR2522.pdf", "quote": "Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel.", "status": "retrieved"}, {"doc_id": "MIR2522.pdf", "quote": "About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2522.pdf", "text": "engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff. The deckhand reported 6 –8 inches of water on the aft deck as they boarded the skiff. Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel. About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand. Once the Cape Douglas crew was aboard, the Red Sky captain notified the US Coast Guard. The captain and deckhand remained on scene aboard the Red Sky, and, about 40 minutes later, they witnessed the Cape Douglas sink by the port stern. The deckhand noted that, as the “upper deck corner” (near the port quarter of the vessel) went underwater, the Cape Douglas “rolled on its side” before sinking. Shortly after, the Red Sky returned to Kodiak and dropped off the captain and deckhand.", "spans": [[0, 193], [280, 366], [367, 453]]}, {"doc_id": "MIR2522.pdf", "text": "Sinking of the Industrial Vessel Cape Douglas MIR-25-22 5 to enter. The deckhand later estimated that there were about 4 feet of water in the engine room. The captain told investigators that there was a high-water bilge alarm in the center of the engine room; however, it did not activate. (The captain could not recall the last time it was tested and did not know if it was functional.) The captain turned on one of the vessel’s two manual bilge pumps near the engine room entrance (the other bilge pump was inaccessible due to the flooding). He and the deckhand opened the starboard-side sliding doors to dump the fish byproduct overboard to reduce the weight on the deck. However, the product was “like peanut butter” because the seawater pump had not started and there was no water available to loosen the product, so they could not dump it. The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the", "spans": [[846, 948]]}, {"doc_id": "MIR2529.pdf", "text": "system) The captain ordered the deckhand to prepare to lower the anchor. The deckhand prepared one of the anchors, but before she could deploy it , the captain ordered everyone on board to abandon the vessel because the list had become significant, and they w ere in danger. The deckhand, chef, steward, and owner jumped into the water. The captain broadcast a distress call on VHF channel 16, verified that all personnel had egressed, and then he also abandoned the vessel by jumping into the water. From the time the vessel started listing until the owner and", "spans": []}, {"doc_id": "MIR2524.pdf", "text": "crab pot davit was not running or pressurized; however, the hydraulic pump for the steering system was running and its lines (pipes and hoses) were pressurized. The captain estimated that he was in the engine room for 30–40 seconds. He told investigators that, as he exited the engine room, he saw a flash, and the smoke turned from white to black as the flames increased. The captain shut the engine room door to “try to cut oxygen” to the fire and went back to the wheelhouse. Concerned about an explosion, the captain decided that he and the other crewmember should abandon the vessel. At 1604, using a VHF radio on channel 16, he made a Mayday call to the Coast Guard informing them of the vessel’s position and his decision to abandon the vessel into a liferaft. The crewmember donned a survival suit (the captain was unable to retrieve his survival suit due to the fire), and", "spans": []}], "answer": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, he and the deckhand decided to abandon the sinking vessel around 1315. They donned survival suits and got into the vessel’s towed skiff. Once in the skiff, they waved down a nearby Good Samaritan vessel. They were picked up by the fishing vessel *Red Sky* approximately 40 minutes after the 1315 decision to abandon the vessel.", "judges": ["groundedness", "refusal"]}, {"key": "t-dafb3798e1", "answerable": true, "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "evidence": [{"doc_id": "MIR2630.pdf", "quote": "However, the captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "status": "partly"}], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": [[888, 939]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 7 Figure 4. The Mystery (circled) aground as seen from the former location of the Seal Cape Light on January 16, 2025. (Background source: Coast Guard) 1.3.2 Crew Experience The captain had over 20 years of experience, fishing from Mexico to Alaska. Deckhand 2 had at least 25 years of experience and fished with his own vessel. Deckhand 1’s navigational experience was unavailable. 1.3.3 Chart Plotter The captain reported that the Mystery’s chart plotter had frozen on previous occasions. He reported that when the chart plotter froze, the autopilot would slowly turn the vessel to port, as he believed it had on the evening of the grounding. The captain noted that he had never experienced issues with the autopilot. He stated that the freezing issue could be corrected by rebooting the chart plotter. Due to similar freezing issues on previously installed chart plotters from the same manufacturer, the", "spans": [[584, 629]]}, {"doc_id": "MIR2630.pdf", "text": "which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port. Therefore, on the night of the grounding, the chart plotter froze, and, consequently, the autopilot steered the vessel to port. A proper navigation watch requires a watchstander to confirm and correlate information from all available sources, including electronic charts and visual sightings, to verify the vessel’s position. For the Mystery crew, maintaining a proper navigation watch was critical given their operational environment (on a lee shore, with high winds, and in reduced visibility due to darkness). Vessels navigating near shore face increased risk from the proximity to navigation hazards. As such, any error in navigation, steering, or propulsion can quickly result in catastrophe. Coastwise navigation, therefore, requires increased vigilance to maintain a continuous and", "spans": [[0, 144]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 11 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the grounding of the fishing vessel Mystery was the deckhand on watch not maintaining a proper navigation watch, likely due to his overreliance on the vessel’s automated navigation systems, which resulted in him not noticing when the chart plotter malfunctioned and the autopilot steered the vessel away from its plotted course. 3.2 Lessons Learned Overreliance on Automated Navigation Systems Although modern technology is an asset, it is not infallible. Operator overreliance on, and overconfidence in, technologies like chart plotters and autopilot systems can negatively affect situation awareness. The safety of a vessel underway depends on the crew’s awareness of the vessel’s position and adherence to a voyage plan. Good seamanship requires correlating information from all means of", "spans": []}], "answer": "The captain stated that after the chart plotter froze, the autopilot would slowly turn the vessel to port.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-030c7098d2", "answerable": true, "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "evidence": [{"doc_id": "MIR2503.pdf", "quote": "Engine power; manufacturer 2 x 3,000 hp (2,237 kW); GE 7FDL12 diesel engines", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "The vessel’s propulsion was provided by two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Vessel electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp (see figure 3). The main engines operated at variable revolutions per minute based on the vessel’s input speed command. The auxiliary engines ran at 1,800 rpm. A 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "an electric motor, assisted with maneuvering. Two main engine shaft-driven generators and two 2,442-hp (1,821-kilowatt) Caterpillar 3512C auxiliary diesel engines, each coupled to an electric generator, provided electrical power for the vessel. The auxiliary diesel engines could be started from three locations: locally at a control panel next to the engines, remotely from the machinery control room (MCR), or remotely from the wheelhouse. 3 Each engine was equipped with a pre-lube pump that circulated pressurized lube oil throughout the stopped engine after receiving a start signal and before the engine began the starting sequence. 4 The two auxiliary engines had been installed aboard the Stuyvesant in December 2022, replacing older engines that had reached the end of their service life. The engine’s operation and maintenance manual indicated that the engines (with deep sump) had an approximate lube oil capacity of 162–165 gallons. 1.2 Event Sequence", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "or unloading equipment (such as conveyor and boom) were operational, a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power. The unloading generator was located on the starboard side of the barge’s main deck, aft of the auxiliary motor control center (MCC), with supply fan ducting in the overhead on the starboard side. The engine was positioned on the barge, with the turbochargers facing the forward direction, between the back of the engine and the generator. Figure 3. Unloading generator space on barge Pathfinder. (Background source: Interlake Steamship Co.)", "spans": []}, {"doc_id": "MIR2609.pdf", "text": "at 385 hp (287 kilowatts) and connected via a set of reduction gears to a fixed-pitch propeller. Electrical power was provided by two John Deere diesel engine–driven generators, each rated at 133 hp (99 kilowatts). The vessel was also equipped with a 36-hp (27-kilowatt) generator, located in the engine room, for emergency power. The Oliver Hazard Perry was equipped with high-water bilge alarms as required by the Coast Guard. Eight high-level bilge sensors were located throughout the vessel on the lower deck: one in the forepeak space, three in the berthing spaces, one in the auxiliary machine space (AMS), two in the engine room, and one in the fixed fire extinguishing system room. The AMS contained electrical panels, pumps, and other electrical equipment. It was adjacent to, and forward of, the engine room and separated by a watertight bulkhead that was fitted with a hinged watertight door.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-2320aa65c5", "answerable": true, "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "evidence": [{"doc_id": "MIR2535.pdf", "quote": "The pilots assigned numbers to the tugs from bow to stern, with the no. 1 tug (Ted C Litton) being the first tug at the bow, the no. 2 tug (Connolly M) on the port shoulder, the no. 3 tug (Cooper K) on the port quarter, the no. 4 tug (Mercury) at the stern, and the no. 5 tug (Zeus) as the standby tug.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 6 Figure 5. The Cosflourish Lake’s positions, relative to the east dock and the vessel at the west dock, leading up to the initial contact with the east dock’s pilings. ( Source: Electronic Chart Display and Information System from Cosflourish Lake. Background source: National Oceanic and Atmospheric Administration, Electronic Navigation Chart US5CRPBF as viewed on Made Smart automatic identification system) Pilot 3 continued to issue orders to the tugs as he proceeded with the docking. At 1412, he ordered slow astern on the tanker’s main engine with the rudder at hard to starboard, “ slack line” for tug no. 1, and “full towards” for tug no. 2 (push at full power on the port side, toward the east dock). Two minutes later, he ordered the rudder hard to port and tug no. 1 to push “slow towards” (pushing on the port bow, toward the dock, at a slow rpm).", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-2a9e4b2f8a", "answerable": false, "question": "What was the name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine?", "expected_answer": "The report does not give this detail; it says only that a tugboat was dispatched to recover the Three Girls, which was docked in Portland on August 14.", "evidence": [], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 9 The William Chadwick arrived in Portland at 1100 the following morning (August 12). The Three Girls remained afloat as the fire continued to smolder. The following day, a tugboat was dispatched to recover the Three Girls, and on August 14, the Three Girls was docked in Portland. The local fire department boarded the vessel and extinguished the fire using water and foam. 1.3 Additional Information 1.3.1 Damage After the fire was extinguished, National Transportation Safety Board and Coast Guard investigators boarded the Three Girls to inspect the damage. The Coast Guard also requested assistance from a local Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigator, who participated in the examination of the damage. The steel bulkheads, decks, and overhead of the wheelhouse displayed several areas of deck and bulkhead warpage, and all contents inside the wheelhouse", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls On August 11, 2024, about 2056 local time, while the fishing vessel Three Girls was engaged in fishing operations in the Gulf of Maine about 118 miles east-southeast of Portland, Maine, a fire broke out in the vessel’s engine room (see figure 1 and figure 2). 1 The five crewmembers and a National Marine Fisheries Service observer abandoned the burning vessel into a liferaft and were rescued by a US Coast Guard cutter crew that same evening. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $1.3 million. 2 Figure 1. Three Girls docked in Portland, Maine, on August 14, 2024, after the fire. 1 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM056). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 17 Vessel Particulars Vessel Three Girls Type Fishing (Fishing vessel) Owner/Operator Three Girls Fishing, LLC (Commercial) Flag United States Port of registry Portland, Maine Year built 1979 Official number 609865 (US) IMO number N/A Classification society N/A Length (overall) 81.6 ft (24.9 m) Breadth (max.) 24.0 ft (7.3 m) Draft (casualty) 11.0 ft (3.4 m) Tonnage 783 GRT Engine power; manufacturer 1 x 850 hp (634 kW); Caterpillar 3512 diesel engine NTSB investigators worked closely with our counterparts from Coast Guard Sector Northern New England throughout this investigation. The National Transportation Safety Board (NTSB) is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 2 Casualty Summary Casualty type Fire/Explosion Location Gulf of Maine, 118 nm east-southeast of Portland, Maine 43°07.37’ N, 67°58.78’ W Date August 11, 2024 Time 2056 eastern daylight time (coordinated universal time –4 hrs) Persons on board 6 Injuries None Property damage $1.3 million est. Environmental damage None Weather Visibility 10 nm, clear, winds southwest 10 kts, gusts 13 kts, seas 2–4 ft, air temperature 67° F, seawater temperature 63° F, sunset 2024, evening twilight 2102 Waterway information Ocean, depth about 450 ft (at casualty site) Figure 2. Area where the fire broke out aboard the fishing vessel Three Girls, as indicated by a circled X. (Background source: Google Maps)", "spans": []}], "answer": "The name of the tugboat that recovered the burning fishing vessel *Three Girls* and brought it into Portland, Maine, is not specified in the provided information.", "judges": ["groundedness", "abstention"]}, {"key": "t-df4b32dc02", "answerable": true, "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "evidence": [{"doc_id": "MIR2539.pdf", "quote": "Time 1435 eastern daylight time", "status": "retrieved"}, {"doc_id": "MIR2539.pdf", "quote": "morning twilight 0718, sunrise 0743", "status": "retrieved"}], "passages": [{"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredging Vessel Stuyvesant On November 2, 2024, about 1435 local time, the dredging vessel Stuyvesant, with a crew of 22, was holding station in the St. Johns River, near Jacksonville, Florida, when a fire broke out in the engine room (see figure 1 and figure 2). 1 Two crewmembers were in the machinery control room when the fire started: one escaped, and the other was removed by the shipboard emergency squad and later pronounced dead at a local hospital. After reporting no active fire and removing the crewmember, the crew verified that the engine room was sealed and released the fixed gas fire extinguishing system. No pollution was reported. Damage to the vessel was estimated at $18 million. 2 Figure 1. Stuyvesant underway in 2022. (Source: The Dutra Group) 1 In this report, all times are eastern daylight time, and all miles are statute miles. 2", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 2 Casualty Summary NTSB casualty category Fire/Explosion Location St. Johns River, Jacksonville, Florida 30° 24.009'N, 81° 24.02'W Date November 2, 2024 Time 1435 eastern daylight time (coordinated universal time –4 hrs) Persons on board 24 (22 crew, 2 observers) Injuries 1 fatal Property damage $18 million est. Environmental damage None Weather Visibility 10 mi, overcast, winds 13 kts, air temperature 83° F, morning twilight 0718, sunrise 0743 Waterway information River; depth about 47 feet Figure 2. Area where the fire broke out aboard the Stuyvesant, as indicated by a circled X. (Background source: Google Maps)", "spans": [[212, 243], [472, 507]]}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 15 2 Analysis On November 2, 2024, while the dredging vessel Stuyvesant was holding station in the St. Johns River near Jacksonville, a fire broke out in the engine room. Crewmembers had just completed maintenance on the port auxiliary engine which included replacing the fuel and lube oil filters and the lube oil in the sump. Once the work was complete, the first engineer started the engine remotely from the MCR, and less than a minute later, engineering crewmembers saw flames in the engine room. After the fire, investigators found that the crew had not reinstalled the plug on the engine’s lube oil filter housing after completing maintenance. Without the plug reinstalled on the lube oil filter housing, pressurized lube oil would have sprayed out from the port auxiliary engine through the internally threaded port at the top of the lube oil filter housing when the engine was started.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 13 The engine manufacturer instructed a thorough walk-around inspection before starting the engine, looking for oil or coolant leaks, loose bolts, and trash buildup. There were specific instructions for inspection of the air inlet system, cooling system, driven equipment, electrical system, fuel system, lubrication system, and the starting system. The last time this maintenance was performed was on July 6, 2024, when the engine had 4,023 running hours. The next scheduled maintenance was due when the engine had 5,023 running hours. At the time of the casualty, the engine had 5,747 running hours. The lock out/tagout log was kept electronically on a tablet in the MCR. Data from the engine room tablet could not be accessed after the fire. 1.3.4 Engineering Crew The chief engineer had worked aboard the Stuyvesant since 1999, in all credentialed positions.", "spans": []}], "answer": "The sun rose over the St. Johns River at 0743, and the flames broke out in the Stuyvesant's engine room at 1435. Therefore, the flames broke out approximately 6 hours and 52 minutes after sunrise.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-9dbf812f9d", "answerable": true, "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "evidence": [{"doc_id": "MIR2617.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds 8 mph west-southwest, air temperature 81°F", "status": "not_retrieved"}, {"doc_id": "MIR2620.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 8 for tows transiting downbound between miles 869 and 303. 9 When the Vicksburg gage reached 36 feet, tows over 110 feet wide were restricted to daytime transit only through the Vicksburg bridges. Also, towing vessels over 6,000 hp, like the Myra Eckstein, had a maximum tow size of 36 barges, with a minimum of 280 hp per loaded standard barge and 560 hp per oversized barge. On the day of the casualty, the Myra Eckstein was pushing 25 standard barges (312 hp per barge). On April 27, the Mississippi River at Vicksburg was recorded having a level of 49.3 feet. According to the National Weather Service, this was the highest peak at the Vicksburg gage since 2020. On May 5, the day of the casualty, the Vicksburg gage read 46.17 feet (about 3.17 feet above major flood stage and about 16 feet above historic normal stage) and falling (see figure 7). Visibility was about 10 miles, with fair skies and", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-de9cc9b324", "answerable": false, "question": "What did the NTSB determine caused the fishing vessel Northern Halcyon to capsize while hauling crab pots in the Bering Sea in 2025?", "expected_answer": "The reports do not cover a capsizing of a fishing vessel named Northern Halcyon; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-883a037cc2", "answerable": true, "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "evidence": [{"doc_id": "MIR2617.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds 8 mph west-southwest, air temperature 81°F", "status": "not_retrieved"}, {"doc_id": "MIR2620.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F", "status": "retrieved"}], "passages": [{"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 8 for tows transiting downbound between miles 869 and 303. 9 When the Vicksburg gage reached 36 feet, tows over 110 feet wide were restricted to daytime transit only through the Vicksburg bridges. Also, towing vessels over 6,000 hp, like the Myra Eckstein, had a maximum tow size of 36 barges, with a minimum of 280 hp per loaded standard barge and 560 hp per oversized barge. On the day of the casualty, the Myra Eckstein was pushing 25 standard barges (312 hp per barge). On April 27, the Mississippi River at Vicksburg was recorded having a level of 49.3 feet. According to the National Weather Service, this was the highest peak at the Vicksburg gage since 2020. On May 5, the day of the casualty, the Vicksburg gage read 46.17 feet (about 3.17 feet above major flood stage and about 16 feet above historic normal stage) and falling (see figure 7). Visibility was about 10 miles, with fair skies and", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 4 On May 5, the tow was approaching Vicksburg and two bridges: the Vicksburg Highway 80 Bridge and the Vicksburg Interstate 20 Bridge (see figure 2). The Vicksburg Highway 80 Bridge opened in 1930 and originally served as a highway and railroad crossing (see figure 4). The bridge had been closed to vehicular traffic for several years, serving solely as a railway bridge. Vehicular traffic was carried via the Vicksburg Interstate 20 Bridge, which was about 315 feet downstream from and ran parallel to the Vicksburg Highway 80 Bridge. The Coast Guard recorded 29 reportable contacts with the bridge between March 2010 and February 2024. 4 Figure 4. The Vicksburg Highway 80 Bridge, as viewed looking downriver. (Background source: US Army Corps of Engineers) About 0940, the captain began maneuvering the tow at 9 mph around", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 2 Casualty Summary Casualty type Contact Location Lower Mississippi River, mile 435.8, near Vicksburg, Mississippi 32°18.82' N, 090°54.28' W Date May 5, 2025 Time 0957 central daylight time (coordinated universal time –5 hrs) Persons on board 10 Injuries None Property damage $941,000 est. Environmental damage None Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F, morning twilight 0545, sunrise 0611 Waterway information River; width 0.5 mi, depth 45 ft, current 6 mph est. Figure 2. Area where the Myra Eckstein tow contacted the Vicksburg Highway 80 Bridge, as indicated by a circled X. (Background source: Google Maps)", "spans": [[388, 475]]}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 5 Delta Point and toward the Vicksburg bridges during that period, including the Myra Eckstein, was west of the “recommended track” (sailing line) shown on the inland electronic navigation chart and displayed on the Myra Eckstein’s electronic chart system. 7 Figure 5. Trackline of the Myra Eckstein tow (highlighted orange) before and during the contact with the Vicksburg Highway 80 Bridge, the recommended track (highlighted yellow), and the tracklines of vessels (black) transiting downbound in daylight hours from 1000 on May 4, 2025, to 0958 on May 5, 2025. (Background source: Corps of Engineers Inland Electronic Navigation Chart U35LM425 as viewed on Made Smart) The captain was unable to correct the heading and align the tow between the piers of the bridge. About 0957, the lead barge of the starboard string, the CC-1109,", "spans": []}], "answer": "The Rickey Hughes tow did not hit the Vicksburg Highway 80 Bridge. The information provided pertains only to the Myra Eckstein tow incident. On May 5, 2025, when the Myra Eckstein tow contacted the Vicksburg Highway 80 Bridge, the weather conditions included fair skies, visibility of about 10 miles, winds from the south-southeast at 5 mph, and an air temperature of 70°F. There is no information provided about the temperature during the Rickey Hughes tow incident.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-378b79e786", "answerable": true, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 3 1 Factual Information On April 15, 2024, about 2300, the crews of towing vessels operated by Evansville Marine Services (EMS) moored two 297.5-foot-long steel tank barges, the MPC 644 and MPC 907, alongside (in a string) the Marathon Petroleum Corporation (MPC) terminal dock at mile 793.8 on the right descending bank of the Ohio River, near Evansville, Indiana. 2 The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline. Discharge of cargo from the two barges was expected to take place the following morning. River conditions at the time were high, with the gauge at Evansville at 38.8 feet and rising (the river peaked 4 days later, on April 19, at 39.8 feet). 3 The current was", "spans": [[460, 642]]}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "visual inspection of the dock and found all six lock lines and four winch wires broken. Terminal operations personnel then notified all downriver facilities of potentially loose barges. MPC personnel reviewed terminal camera footage, which showed that, about 0445 on April 16, the two barges broke free from the dock. EMS reported a drift pile of debris (100 feet by 200 feet) in the water about the time of the breakaway. According to MPC, terminal camera footage appeared to show a debris pile that followed the barges after the breakaway. 2 (a) The inland towing industry refers to the shorelines of Western Rivers as the left and right banks when traveling (facing) downriver. The left bank is called the left descending bank, and the right bank is called the right descending bank. (b) The Ohio River runs 981 miles from Pittsburgh, Pennsylvania, to Cairo, Illinois, where it meets the Mississippi River. 3 Flood stage at Evansville is 42 feet.", "spans": []}], "answer": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b00c93fb11", "answerable": true, "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "the vessel. About 0920, after the captain and the deckhand examined the wheel and rudder gearboxes, checked for damage to the vessel’s propulsion (sternwheel) and steering, and determined there was no hull flooding. The captain then started the vessel’s engines. After waiting for the chief engineer (who was en route to the scene) for about 15 minutes, the captain decided to move the vessel without him. The captain attempted to dock twice at the Columbia Gorge’s usual dock at the Cascade Locks Marina but was unable to due to the high winds and waves. The captain then turned the vessel around and proceeded downriver to its former docking facility, located above the Bonneville Lock and Dam at mile 145.6 on the Columbia River. The lock operator directed the captain to pass through the lock and tie up at the moorage 3 After fishing sites used by local indigenous populations (Nez Perce Tribe, Confederated", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 4 On January 13, at 0816, a Cascade Locks resident alerted the Hood River County Sheriff’s office that the Columbia Gorge was drifting downriver. The vessel’s captain, the chief engineer, and a deckhand were notified. About 0822, the Columbia Gorge’s stern struck three tribal fishing platforms and then the Thunder Island pedestrian bridge—which spanned the historic lock channel at Cascade Locks Marina and connected Thunder Island to the mainland—halting the vessel’s drift (see Figure 4). 3 By 0831, the deckhand arrived at the pedestrian bridge, where he observed the vessel “banging around in the canal” at the entrance of the lock. The deckhand boarded the Columbia Gorge from the pedestrian bridge and started unlocking doors on the vessel, including in the engine room. About 0910, the vessel’s captain arrived and boarded the vessel.", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "2 Analysis During high winds and blizzard conditions, the Columbia Gorge, with no one aboard, broke free from its mooring at Cascade Locks on the Columbia River. The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock. The crew responded quickly once notified of the breakaway and secured the vessel. The operator took precautions prior to the onset of the predicted weather forecast, including turning the ship around from its usual port side docking to starboard so the bow would face into the weather. In addition, they increased the 4 Root Cause Analysis Team Report: January 13, 2024 Sternwheeler Unmooring. (Port of Cascade Locks Port Commission Root Cause Analysis Team, March 5, 2024), 15.", "spans": [[162, 391]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}], "answer": "The Columbia Gorge drifted about 475 yards downriver into the historic lock after it broke free from its mooring at Cascade Locks.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-cf7cb11f6c", "answerable": true, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 3 1 Factual Information On April 15, 2024, about 2300, the crews of towing vessels operated by Evansville Marine Services (EMS) moored two 297.5-foot-long steel tank barges, the MPC 644 and MPC 907, alongside (in a string) the Marathon Petroleum Corporation (MPC) terminal dock at mile 793.8 on the right descending bank of the Ohio River, near Evansville, Indiana. 2 The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline. Discharge of cargo from the two barges was expected to take place the following morning. River conditions at the time were high, with the gauge at Evansville at 38.8 feet and rising (the river peaked 4 days later, on April 19, at 39.8 feet). 3 The current was", "spans": [[460, 642]]}], "answer": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-283d73c2f8", "answerable": true, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "Persons on board 9 Injuries None Property damage $2 million est.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre On May 13, 2024, about 1657 local time, the towing vessel Baylor J. Tregre was towing the ocean barge MARMAC 27 in the Gulf of America, about 23 miles south of Galveston, Texas, when the towing vessel capsized and sank (see figure 1 and figure 2). 1 All four crewmembers abandoned the vessel and were rescued by the US Coast Guard. One crewmember sustained minor injuries. There was no pollution reported. Damage to the towing vessel was estimated at $2 million. 2 Figure 1. Left to right: Towing vessel Baylor J. Tregre at unknown date, and ocean barge MARMAC 27 after the casualty. (Source: Trinity Towing LLC) 1 In this report, all times are central daylight time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM038). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "J Studdert were rescued by a nearby vessel; four crewmembers sustained minor injuries. The Patrick J Studdert was considered a total constructive loss valued at over $2.3 million. The Clara B sustained minor damage to its hull, estimated at $250,000 to repair. The National Transportation Safety Board determines that the probable cause of the collision between the bulk carrier Clara B and towing vessel Patrick J Studdert and subsequent sinking of the Patrick J Studdert was the Patrick J Studdert captain’s distraction due to his cell phone use, which resulted in him not maintaining a proper lookout and navigating the towing vessel directly into the path of the upbound Clara B. MIR-25-26 DCA24FM033 2024 Collision of William B Klunk Tow with Moored Barges On April 17, 2024, about 1655 local time, the towing vessel William B Klunk was pushing 22 barges downbound on the Lower Mississippi River at mile 227, near Baton Rouge, Louisiana, when the tow collided with", "spans": []}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}], "answer": "The estimated repair bill for both the tug Baylor J. Tregre and the Chad Pregracke tow is $2 million. \n\nFor the Baylor J. Tregre, there were four crewmembers aboard. For the Chad Pregracke tow, there were no specific number of people mentioned, but it is noted that five barges were damaged in the incident. However, based on the context, it is likely that the number of people aboard the Chad Pregracke tow is not specified, but the focus is on the damage to the barges.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-37e078308e", "answerable": true, "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "As a result of the casualty, the operating company required mooring lines to be replaced annually.", "status": "partly"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "and subsequent drifting, witnesses described blizzard conditions, including winds ranging from 35–80 mph, with 3–4 feet waves. The RCA Team also found that the vessel operator had no “life cycle management program” for examining or replacing mooring lines before they would break when in use. The team’s report stated that “standard 1.5 in [nylon] lines generally last about one year”; the ages of the Columbia Gorge’s mooring lines ranged from 5 months to 10 years, with the age of some lines either unknown or not definitively known. Additionally, the team concluded that there may not have been sufficient slack in the galvanized chain “to allow the nylon lines to flex and stretch smoothly enough to avoid breakage.” As a result of the casualty, the operating company instituted two new safety measures: mooring lines are to be replaced annually, and the vessel will be crewed and/or moved when forecasted wind gusts exceed 70 knots. 2 Analysis", "spans": [[721, 771]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 7 On January 16, three days after the casualty, the Port of Cascade Locks Port Commission established an internal Root Cause Analysis (RCA) Team to investigate the Columbia Gorge unmooring. The RCA Team identified two root causes related to the mooring arrangement: mooring line age and the lack of a “lifecycle management program,” and likely insufficient slack in the galvanized chain. 4 The RCA Team determined that the mooring arrangement and size of the nylon lines used would have been “sufficient for the loads that occurred during the incident” if the lines had been new or in good condition. Their conclusion was based on the Columbia Gorge’s history of remaining docked during past weather events with similarly high winds. According to the RCA Team report, at the time of the Columbia Gorge’s unmooring", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "arrangement was six nylon mooring lines and no chain). The bow line was tight, and crewmembers estimated there was less than a foot of slack in the breast lines and the chain (see Figure 3). The vessel was uncrewed while docked, and, in the days before the breakaway, the crew checked the vessel’s mooring a few times a day. Figure 3. Columbia Gorge mooring arrangement on January 13, 2024, including the diameters of and materials comprising
