is NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": [[112, 148], [316, 338]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-af81e08adc", "answerable": false, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "evidence": [], "passages": [{"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 2 Analysis While the City of Louisville was upbound on the Upper Mississippi River pushing 11 empty barges, the towing vessel ran aground near mile 42.6 in a charted shallow and rocky area. The grounding caused fractures to the vessel’s bottom plating underneath the engine room, leading to water flooding into the engine room, machinery, and aft accommodation spaces. The pilot of the City of Louisville was alone on watch in the wheelhouse when the grounding occurred. The pilot told investigators that, before the grounding, he had left the helm and was on the port side of the wheelhouse. He estimated he was away from the helm about 5 minutes. Leaving the helm unattended is contrary to prudent navigation practices when operating on rivers. The Mississippi River, in particular, has frequent turns, and the potential for strong currents and heavy traffic.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "for a fleet on the Upper Mississippi River at mile 126 near St. Genevieve, Missouri. The overall length of the tow was about 738 feet, and the overall width was about 140 feet (see figure 3). Figure 3. City of Louisville tow arrangement (scale approximate). On July 29, about 1100, the pilot took over the navigational watch in the wheelhouse from the relief captain for their normally scheduled watch change. The City of Louisville proceeded upriver without event, with the pilot at the helm and making a speed of about 4 to 5 mph. According to the pilot, the tow was traveling at 3 Pilot is a term used aboard towing vessels on inland waterways for a person, other than the captain, who navigates the vessel.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "engine room, causing the vessel to settle to the bottom. There were eventually about 4 feet of water in the lower engine room. The tow remained intact, facing upriver after the grounding. The pilot said they were unable to move the vessel off the rocks. About 3 hours after the grounding, at 1753, thunderstorms passed through the area, which required the crew and responding personnel to evacuate the City of Louisville. Winds from the storm moved the tow to starboard, causing it to pivot on the rocks; the tow was then oriented toward the left descending bank. As the river stage later rose, the water level inside the engine room increased, and the main deck rudder room and aft galley/mess area also flooded. Figure 5. The City of Louisville aground. (Source: Coast Guard) 1.3 Additional Information There were no reported defects or deficiencies with the City of Louisville’s navigational, steering, communication, and propulsion systems. 5", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 a reduced speed at the customer’s request, since they were not in a rush to receive the barges. The pilot told investigators that, about 1442, he left the helm. Before doing so, he looked out the wheelhouse front window and saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system). He also checked the swing meter, fathometer, and electronic chart system (ECS). At that time, the boat’s ECS recorded the vessel on a heading of 349° at 4.8 mph and about 45 yards to the east of the sailing line, which had a course line of 347°. 4 He told investigators that he then went to the port side of the wheelhouse and relieved himself into a bag while looking out of the portside window. At 1444, on a heading of 344° at 4.7 mph, the City of Louisville tow passed a point where the sailing line changed course from 347° to 356°. About a minute later, the", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-d86455ff6e", "answerable": true, "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "evidence": [{"doc_id": "MIR2535.pdf", "quote": "The pilots assigned numbers to the tugs from bow to stern, with the no. 1 tug (Ted C Litton) being the first tug at the bow, the no. 2 tug (Connolly M) on the port shoulder, the no. 3 tug (Cooper K) on the port quarter, the no. 4 tug (Mercury) at the stern, and the no. 5 tug (Zeus) as the standby tug.", "status": "partly"}], "passages": [{"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 6 Figure 5. The Cosflourish Lake’s positions, relative to the east dock and the vessel at the west dock, leading up to the initial contact with the east dock’s pilings. ( Source: Electronic Chart Display and Information System from Cosflourish Lake. Background source: National Oceanic and Atmospheric Administration, Electronic Navigation Chart US5CRPBF as viewed on Made Smart automatic identification system) Pilot 3 continued to issue orders to the tugs as he proceeded with the docking. At 1412, he ordered slow astern on the tanker’s main engine with the rudder at hard to starboard, “ slack line” for tug no. 1, and “full towards” for tug no. 2 (push at full power on the port side, toward the east dock). Two minutes later, he ordered the rudder hard to port and tug no. 1 to push “slow towards” (pushing on the port bow, toward the dock, at a slow rpm).", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 5 PILOT 3: I’m gonna f——k the s——t out of this ship. I’m gonna go in there and I’m gonna be doing the god d——n docking, ok. You got it? MASTER: Yeah. PILOT 3: We're changing, ok. Don’t f——k up, ok. PILOT 1: [To unknown person] I told ya, you gotta watch him. PILOT 3: [To the other pilots] Sometimes you gotta shock talk em. Pilot 1 then left the bridge for the bow, and, at 1354, Pilot 2 requested tug no. 1 be made fast at the center lead forward. Tug nos. 2, 3, and 4 were all successfully made fast in their agreed upon positions. At 1404, Pilot 3 ordered the engine full astern to slow the ship in the channel so that tug no. 1 could be made fast. About 1406, tug no. 1 was secured with a line to the bow. The Cosflourish Lake had a heading of 259° and a speed of 6.1 knots, which continued to decrease as the bow of the tanker moved to starboard and into the STGT basin.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "At 1407, with tug no. 1 pulling to starboard at the bow as ordered, the Cosflourish Lake had a heading of 279° at a speed of 1.7 knots. Pilot 3 ordered tug no. 2 to push at full power on the port side. At 1408, at a slow ahead propulsion order, the vessel had a heading of 298°, and Pilot 3 ordered tug no. 1 to slack its line, and tug no. 2 to full power away to port. At 1409, the vessel continued to turn to starboard, and the pilot ordered the rudder hard to starboard while issuing multiple orders to the tugs. At 1410, on a heading of 336° at a speed of 0.6 knots, the pilot ordered tug no. 1 to port 90°. Seconds later, Pilot 3 ordered tug no. 1 to “back full.” At 1411, as the pilot continued to issue tug, engine, and rudder orders, the starboard side of the Cosflourish Lake struck two of three rubber tire-covered pilings at the end of the east dock. The vessel had a speed of 2.2 knots on a heading of about 354°.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 4 1.2 Event Sequence On November 14, 2023, at 1018 local time, the Cosflourish Lake got underway from an offshore anchorage in a ballast condition, inbound to the STGT east dock (an 11-mile transit). At 1254, three Aransas-Corpus Christi pilots boarded the vessel at the nearby pilot station, and shortly after, d uring the master/pilot exchange, Pilot 1 confirmed with the master that there were no deficiencies with the Cosflourish Lake. (Pilot 3 told investigators that three pilots were required for a VLCC.) About 1301, Pilot 1 took the conn. Pilot 1 briefed the master that the plan was to dock the tanker starboard-side-to using five tractor tugs: four 6,772-hp, tractor tugs would have a line to the tanker, and one 5,150 hp-tractor tug would be standing by to assist where needed (see figure 4). The pilots assigned numbers to the tugs from bow", "spans": [[889, 937]]}], "answer": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal, tug no. 1 was made fast at the very back of the tanker, and tug no. 5 was held in reserve.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-169491aa19", "answerable": true, "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "evidence": [{"doc_id": "MIR2619.pdf", "quote": "He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 9 Figure 5. Diagram (looking toward the Erving’s bow) showing the position of the STS crane boom if it were raised versus its position at the time of the accident. (Scale approximate.) One of the STAX 1 deckhands repairing the exhaust duct on the Erving ran toward the starboard-side handrails of the funnel. He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane. No one was in the cab, but he was unable to see into the trolley cab due to the angle of the trolley cabin front windshield. At 1649, while STS crane 16 was moving toward the stern of the vessel, the crane contacted the STAX 1 emission capture boom (see figure 6). Sections of boom fell onto STAX 1, onto the Erving, and into the water. A portion of the emission", "spans": [[398, 569]]}, {"doc_id": "MIR2619.pdf", "text": "foremen’s trailer to conduct his routine round, checking the highline and decking (cargo/container staging) areas in his work truck before the start of the flex shift. He checked which cranes needed to be moved on the flex shift. While at the decking area, about 1646, he heard operations manager 1 call out on VHF radio that crane operator 1 could not get STS crane 16 boomed up. While operations manager 2 was checking the highline and decking area, crane operator 2 proceeded to STS crane 15’s waterside dock-level control station to move STS crane 15 to the next cargo bay. (STS crane 15’s boom was in the lowered position.) Crane operator 2 told investigators that he was unaware that the STAX 1 was operating next to the Erving (his line of sight was blocked by the containership). He stated, “If I would’ve seen that [emission capture boom], I would have stopped.” Crane operator 2 explained to investigators that the first-shift crane operators", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "not include any information about the location of the barge or its emission capture boom. Had the crane operator waited for the pre-shift planning meeting and been aware of the STAX 1’s location, he may have opted not to move the crane.", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 17 Regardless of the crane operator’s awareness of the STAX 1, the only way to ensure the lowered boom could clear the Erving’s exhaust stack before gantrying the crane would have been to have positive confirmation of line of sight from the crane’s trolley cabin. According to the ILWU and the PMA’s Pacific Coast Marine Safety Code, crane operators “shall not operate cranes when visibility cannot be maintained to assure a safe operation.” An FMS ship boss told investigators he believed that, typically, crane operations should be performed in the trolley cab rather than using the waterside dock-level control station. According to crane operator 2 and ship boss 2, moving a crane typically also involved a second person: a dock signal person positioned on the dock where they could observe the crane’s movement along its", "spans": []}], "answer": "The worker was approximately 200 feet away from the crane's operator cabin.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e187af9d56", "answerable": true, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "Persons on board 9 Injuries None Property damage $2 million est.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre On May 13, 2024, about 1657 local time, the towing vessel Baylor J. Tregre was towing the ocean barge MARMAC 27 in the Gulf of America, about 23 miles south of Galveston, Texas, when the towing vessel capsized and sank (see figure 1 and figure 2). 1 All four crewmembers abandoned the vessel and were rescued by the US Coast Guard. One crewmember sustained minor injuries. There was no pollution reported. Damage to the towing vessel was estimated at $2 million. 2 Figure 1. Left to right: Towing vessel Baylor J. Tregre at unknown date, and ocean barge MARMAC 27 after the casualty. (Source: Trinity Towing LLC) 1 In this report, all times are central daylight time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM038). Use the CAROL Query to search investigations.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f017a445dd", "answerable": true, "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "the vessel. About 0920, after the captain and the deckhand examined the wheel and rudder gearboxes, checked for damage to the vessel’s propulsion (sternwheel) and steering, and determined there was no hull flooding. The captain then started the vessel’s engines. After waiting for the chief engineer (who was en route to the scene) for about 15 minutes, the captain decided to move the vessel without him. The captain attempted to dock twice at the Columbia Gorge’s usual dock at the Cascade Locks Marina but was unable to due to the high winds and waves. The captain then turned the vessel around and proceeded downriver to its former docking facility, located above the Bonneville Lock and Dam at mile 145.6 on the Columbia River. The lock operator directed the captain to pass through the lock and tie up at the moorage 3 After fishing sites used by local indigenous populations (Nez Perce Tribe, Confederated", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 4 On January 13, at 0816, a Cascade Locks resident alerted the Hood River County Sheriff’s office that the Columbia Gorge was drifting downriver. The vessel’s captain, the chief engineer, and a deckhand were notified. About 0822, the Columbia Gorge’s stern struck three tribal fishing platforms and then the Thunder Island pedestrian bridge—which spanned the historic lock channel at Cascade Locks Marina and connected Thunder Island to the mainland—halting the vessel’s drift (see Figure 4). 3 By 0831, the deckhand arrived at the pedestrian bridge, where he observed the vessel “banging around in the canal” at the entrance of the lock. The deckhand boarded the Columbia Gorge from the pedestrian bridge and started unlocking doors on the vessel, including in the engine room. About 0910, the vessel’s captain arrived and boarded the vessel.", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "2 Analysis During high winds and blizzard conditions, the Columbia Gorge, with no one aboard, broke free from its mooring at Cascade Locks on the Columbia River. The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock. The crew responded quickly once notified of the breakaway and secured the vessel. The operator took precautions prior to the onset of the predicted weather forecast, including turning the ship around from its usual port side docking to starboard so the bow would face into the weather. In addition, they increased the 4 Root Cause Analysis Team Report: January 13, 2024 Sternwheeler Unmooring. (Port of Cascade Locks Port Commission Root Cause Analysis Team, March 5, 2024), 15.", "spans": [[162, 391]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}], "answer": "The Columbia Gorge drifted about 475 yards downriver into the historic lock after it broke free from its mooring at Cascade Locks.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-99ce75516a", "answerable": true, "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "evidence": [{"doc_id": "MIR2509.pdf", "quote": "The mate was then able to reach the Brunswick crew over VHF radio to make passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.”", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2509.pdf", "text": "the Local Notice to Mariners, along with a request for vessels to arrange safe passage when transiting nearby. To pass the area where the Brunswick was dredging, a vessel would need to either (1) request that the Brunswick move the floating discharge pipeline so that it was not extending across the river, or (2) pass to the west of the Brunswick, along the west bank of the Cooper River. The dredge crew moved the floating discharge pipe frequently to accommodate passing traffic during normal operations. On the Royal Engineer, the mate was on watch in the wheelhouse. During the transit south, he attempted to hail the dredge via VHF radio about 1 hour before the tow reached the dredge’s location. According to the mate, he intended to request", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a29bd3ea54", "answerable": true, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "evidence": [{"doc_id": "MIR2523.pdf", "quote": "Time 1855 eastern standard time", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "Weather Visibility 10 mi, overcast, winds west 3 kts, air temperature 60° F, water temperature 43° F, sunset 1730", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties", "status": "retrieved"}], "passages": [{"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 NOTE: This report was reissued August 4, 2026, with corrections to the descending bank labels on the graphic on p. 5. Grounding of Towing Vessel Tom Frazier On February 10, 2024, about 1855 local time, the towing vessel Tom Frazier was pushing 15 empty hopper barges upbound on the Ohio River, near Portsmouth, Ohio, when the vessel grounded on a submerged jetty w hile maneuvering to meet a downbound tow (see figure 1 and figure 2). 1 The nine crewmembers aboard the towboat were safely evacuated to shore. There were no injuries. An estimated 5 gallons of oil w ere released from the Tom Frazier. Damage to the vessel was $258,737. 2 Figure 1. The Tom Frazier underway in 2008. (Source: Billy Smith) 1 In this report, all times are eastern standard time, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": [[263, 441]]}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 8 Figure 8. Ohio River water levels at Portsmouth between August 10, 2023, and February 11, 2024. (Source: US Geological Survey) 1.3.3 Crew The Tom Frazier captain held a Coast Guard-issued credential as master of towing vessels on the Western Rivers. He had worked in the industry for 23 years and with the operating company for 3 years. He stated that he had frequented the area many times in his career but not in the previous 2 or 3 years.", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "On February 10, at 1830, the tow approached Portsmouth, Ohio, in darkness. Upbound vessels had to transit through two bridges connecting Portsmouth and Greenup County, Kentucky, coming out of the 90° bend in the Ohio River near Portsmouth: the Carl D. Perkins Bridge at mile 356.8 and the U.S. Grant Highway Bridge at mile 355.5. At 1838, with the captain at the helm, the Tom Frazier successfully transited through the Carl D. Perkins Bridge. As the Tom Frazier tow transited through the U.S. Grant Bridge, the captain contacted the operator of the 113.3-foot-long towing vessel Debi Sharp—which was downbound 1.5 miles away, pushing 25 barges 3 The Ohio River runs 981 miles from Pittsburgh, Pennsylvania, to Cairo, Illinois, where it meets the Mississippi River.", "spans": []}], "answer": "The skipper of the Tom Frazier struck bottom at 1855 local time. Since the sun went down, the incident occurred **approximately 2 hours and 30 minutes after sunset**.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-fb00cd57e0", "answerable": true, "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "evidence": [{"doc_id": "MIR2525.pdf", "quote": "the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel.", "status": "retrieved"}, {"doc_id": "MIR2614.pdf", "quote": "Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2525.pdf", "text": "On July 13, 2023, about 0100, the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel. The two barges were made up abreast and bow to bow with the towboat. The captain, who was at the helm, told investigators he intended to back out with the barges and then shift position to make up to the aft end of the tow before proceeding outbound (see figure 3). Before the tow got underway, Vessel Traffic Service Houston/Galveston reported a 1.5-knot flood current. The captain later noted a 0.77-knot current setting the vessel down on the Figure 3. Duke tow departing the basin at 0120. The poles and section of the bridge contacted by the tow are circled. (Background source: Magnolia data as viewed on Rosepoint)", "spans": [[30, 249]]}, {"doc_id": "MIR2525.pdf", "text": "Contact of Duke Tow with Power Transmission Poles and Pelican Island Bridge MIR-25-25 6 2 Analysis On July 13, 2023, the towing vessel Duke, pushing two barges, was backing into the Galveston Ship Channel away from the Texas International Terminal when the tow contacted multiple power transmission poles, and the tug subsequently contacted the Pelican Island Causeway Bridge. The vessels, electrical infrastructure, and bridge together sustained estimated damages of $300,000. The Duke captain stated that he intended to back out with the barges made up abreast bow to bow with the towboat before flipping the barges around and proceeding outbound. He also stated that a bulk carrier moored to the end of the pier immediately east of the Texas International Terminal required him to back out fa rther than normal into the channel, and that he was focused on staying clear of the moored vessel while he was underway.", "spans": []}, {"doc_id": "MIR2614.pdf", "text": "3 Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process. The tow was oriented northerly, toward the Galveston Channel. The towboat was faced up to the rake end of the MMLP 322, with the MMLP 321 as the lead barge (see figure 4). Figure 4. Simplified diagram of the LCPL Phillip C George tow (scale approximate). The barges were identical, each measuring 297.5 feet long and 54 feet wide. The overall length of the tow was about 677 feet, and the deepest draft was 10 feet (the barges). The barges were made up to each other with a port and starboard coupling. Each coupling consisted of four steel wires and a fiber center line at the center kevels between the two barges. On board the Phillip C George were a captain and three other crewmembers. The captain explained she had decided to have the barges strung out (versus a breasted", "spans": [[2, 145]]}, {"doc_id": "MIR2614.pdf", "text": "Contact of LCPL Phillip C George Tow with Terminal Dolphin, MIR-26-14 Power Transmission Pole, and Pelican Island Bridge 4 Overhead electrical power transmission lines with a vertical clearance of 85 feet ran parallel to the causeway. The lines, which were owned by CenterPoint Energy, were supported by poles located in the water about 85 feet to the east side of the bridge. The Texas International Terminal (TXIT) was a liquid- and dry-bulk facility located on the south of the Galveston Channel, on Pelican Island. TXIT was comprised of three deep-draft vessel berths, three barge berths, and an east and west breakwater. A dolphin was located at the end of each breakwater, and the distance between the west and east breakwater dolphins was about 440 feet. 1.2 Event Sequence On the morning of May 15, 2024, the towing vessel LCPL Phillip C George was moored at TXIT, with two tank barges, MMLP 321 and MMLP 322, strung out. 3 Each", "spans": []}], "answer": "The Duke's barges were empty, as the tow departed with two empty red-flagged barges. The LCPL Phillip C George's barges were each carrying about 24,000 barrels of vacuum gas oil (VGO).", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b5b3fab1d5", "answerable": false, "question": "How long did firefighters take to put out the blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point?", "expected_answer": "The premise is wrong: there was no fire after the Hunts Point explosion; instead, sludge burst out of the tank and covered the assistant engineer and the vessel's exterior.", "evidence": [], "passages": [{"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel. The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NYC DEP office. He requested that the NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-50eebba70d", "answerable": true, "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "evidence": [{"doc_id": "MIR2535.pdf", "quote": "The pilots assigned numbers to the tugs from bow to stern, with the no. 1 tug (Ted C Litton) being the first tug at the bow, the no. 2 tug (Connolly M) on the port shoulder, the no. 3 tug (Cooper K) on the port quarter, the no. 4 tug (Mercury) at the stern, and the no. 5 tug (Zeus) as the standby tug.", "status": "partly"}], "passages": [{"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 6 Figure 5. The Cosflourish Lake’s positions, relative to the east dock and the vessel at the west dock, leading up to the initial contact with the east dock’s pilings. ( Source: Electronic Chart Display and Information System from Cosflourish Lake. Background source: National Oceanic and Atmospheric Administration, Electronic Navigation Chart US5CRPBF as viewed on Made Smart automatic identification system) Pilot 3 continued to issue orders to the tugs as he proceeded with the docking. At 1412, he ordered slow astern on the tanker’s main engine with the rudder at hard to starboard, “ slack line” for tug no. 1, and “full towards” for tug no. 2 (push at full power on the port side, toward the east dock). Two minutes later, he ordered the rudder hard to port and tug no. 1 to push “slow towards” (pushing on the port bow, toward the dock, at a slow rpm).", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 5 PILOT 3: I’m gonna f——k the s——t out of this ship. I’m gonna go in there and I’m gonna be doing the god d——n docking, ok. You got it? MASTER: Yeah. PILOT 3: We're changing, ok. Don’t f——k up, ok. PILOT 1: [To unknown person] I told ya, you gotta watch him. PILOT 3: [To the other pilots] Sometimes you gotta shock talk em. Pilot 1 then left the bridge for the bow, and, at 1354, Pilot 2 requested tug no. 1 be made fast at the center lead forward. Tug nos. 2, 3, and 4 were all successfully made fast in their agreed upon positions. At 1404, Pilot 3 ordered the engine full astern to slow the ship in the channel so that tug no. 1 could be made fast. About 1406, tug no. 1 was secured with a line to the bow. The Cosflourish Lake had a heading of 259° and a speed of 6.1 knots, which continued to decrease as the bow of the tanker moved to starboard and into the STGT basin.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "At 1407, with tug no. 1 pulling to starboard at the bow as ordered, the Cosflourish Lake had a heading of 279° at a speed of 1.7 knots. Pilot 3 ordered tug no. 2 to push at full power on the port side. At 1408, at a slow ahead propulsion order, the vessel had a heading of 298°, and Pilot 3 ordered tug no. 1 to slack its line, and tug no. 2 to full power away to port. At 1409, the vessel continued to turn to starboard, and the pilot ordered the rudder hard to starboard while issuing multiple orders to the tugs. At 1410, on a heading of 336° at a speed of 0.6 knots, the pilot ordered tug no. 1 to port 90°. Seconds later, Pilot 3 ordered tug no. 1 to “back full.” At 1411, as the pilot continued to issue tug, engine, and rudder orders, the starboard side of the Cosflourish Lake struck two of three rubber tire-covered pilings at the end of the east dock. The vessel had a speed of 2.2 knots on a heading of about 354°.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 4 1.2 Event Sequence On November 14, 2023, at 1018 local time, the Cosflourish Lake got underway from an offshore anchorage in a ballast condition, inbound to the STGT east dock (an 11-mile transit). At 1254, three Aransas-Corpus Christi pilots boarded the vessel at the nearby pilot station, and shortly after, d uring the master/pilot exchange, Pilot 1 confirmed with the master that there were no deficiencies with the Cosflourish Lake. (Pilot 3 told investigators that three pilots were required for a VLCC.) About 1301, Pilot 1 took the conn. Pilot 1 briefed the master that the plan was to dock the tanker starboard-side-to using five tractor tugs: four 6,772-hp, tractor tugs would have a line to the tanker, and one 5,150 hp-tractor tug would be standing by to assist where needed (see figure 4). The pilots assigned numbers to the tugs from bow", "spans": [[889, 937]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-674879afbb", "answerable": true, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "evidence": [{"doc_id": "MIR2515.pdf", "quote": "However, the flexible ducting was made of combustible material; it was not structurally protected from fire (nor was it required to be).", "status": "not_retrieved"}, {"doc_id": "MIR2515.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "status": "retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 17 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the engine room fire on the towing vessel Johnny M was a catastrophic main engine failure that caused the venting and ignition of hot atomized lube oil. Contributing to the ineffectiveness of the carbon dioxide fixed fire extinguishing system was the lack of structural fire protection for the main engines’ combustion air intake ducting, which allowed oxygen to enter the engine room once the fire consumed the ducting. 3.2 Lessons Learned Structural Fire Protection The flexible ducting providing combustion air to the main engines on board the Johnny M extended from the engine stacks on the main deck down to the engine room and did not have any insulation or other barriers to prevent the passage of smoke, heat, and fire—known as structural fire protection. This type of unprotected", "spans": []}, {"doc_id": "MIR2621.pdf", "text": "Fire aboard Towing Vessel William D MIR-26-21 11 fire protection uses fire-resistant materials and insulation installed on the horizontal and vertical surfaces of a compartment, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke, thus providing additional time to evacuate and for firefighting to contain and extinguish a fire. Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "spans": [[365, 589]]}, {"doc_id": "MIR2621.pdf", "text": "due to the rapid spread of the fire. The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained. 5 Structural fire protection is a component of an overall vessel fire-protection strategy that uses passive design features in a vessel’s structure to slow the expansion of a fire from one compartment to another. Structural 5 See Fire aboard Towing Vessel Mary Dupre near Freeport, Texas, June 26, 2022, MIR-23-12; Fire aboard Towing Vessel Jaxon Aaron on the Lower Mississippi River, mile marker 770, August 13, 2016, MAB-17/19; and Fire On Board Fish Processing Vessel Juno in Grays Harbor, Westport, Washington, December 28, 2013, MAB-15/05.", "spans": [[37, 326]]}, {"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 8 Figure 5. Local firefighters fighting the fire aboard Johnny M. (Source: East Marshall Fire Department) 1.3 Additional Information 1.3.1 Damage 1.3.1.1 Vessel After the fire, Coast Guard and the National Transportation Safety Board investigators boarded the Johnny M to examine the vessel damage. The vessel sustained fire damage throughout all the decks. The engine stacks’ interior and exterior and the engine room windows exhibited soot where the space ventilated to the atmosphere. The paint on the exterior of the upper engine room bulkheads was charred where the structural frames intersected with the bulkhead. Fire and heat damage was heavily concentrated in the lower level of the engine room where the main engines were located. The engine room window frames and the deck above the engine room were warped due to heat exposure (see figure 6). The outboard side of the portside stack", "spans": []}], "answer": "The NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to a shortcoming in the federal rules for towboats regarding the lack of requirements for structural fire protection. Specifically, the federal regulations do not currently mandate the use of fire-resistant materials, insulation, or other barriers in pipe and cable openings, doors, hatches, and horizontal and vertical surfaces of compartments. These measures are essential for slowing the transfer of heat and smoke, thereby providing additional time for evacuation and firefighting efforts.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-022ed0b877", "answerable": true, "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "evidence": [{"doc_id": "MIR2619.pdf", "quote": "He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 9 Figure 5. Diagram (looking toward the Erving’s bow) showing the position of the STS crane boom if it were raised versus its position at the time of the accident. (Scale approximate.) One of the STAX 1 deckhands repairing the exhaust duct on the Erving ran toward the starboard-side handrails of the funnel. He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane. No one was in the cab, but he was unable to see into the trolley cab due to the angle of the trolley cabin front windshield. At 1649, while STS crane 16 was moving toward the stern of the vessel, the crane contacted the STAX 1 emission capture boom (see figure 6). Sections of boom fell onto STAX 1, onto the Erving, and into the water. A portion of the emission", "spans": [[398, 569]]}, {"doc_id": "MIR2619.pdf", "text": "foremen’s trailer to conduct his routine round, checking the highline and decking (cargo/container staging) areas in his work truck before the start of the flex shift. He checked which cranes needed to be moved on the flex shift. While at the decking area, about 1646, he heard operations manager 1 call out on VHF radio that crane operator 1 could not get STS crane 16 boomed up. While operations manager 2 was checking the highline and decking area, crane operator 2 proceeded to STS crane 15’s waterside dock-level control station to move STS crane 15 to the next cargo bay. (STS crane 15’s boom was in the lowered position.) Crane operator 2 told investigators that he was unaware that the STAX 1 was operating next to the Erving (his line of sight was blocked by the containership). He stated, “If I would’ve seen that [emission capture boom], I would have stopped.” Crane operator 2 explained to investigators that the first-shift crane operators", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "not include any information about the location of the barge or its emission capture boom. Had the crane operator waited for the pre-shift planning meeting and been aware of the STAX 1’s location, he may have opted not to move the crane.", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 17 Regardless of the crane operator’s awareness of the STAX 1, the only way to ensure the lowered boom could clear the Erving’s exhaust stack before gantrying the crane would have been to have positive confirmation of line of sight from the crane’s trolley cabin. According to the ILWU and the PMA’s Pacific Coast Marine Safety Code, crane operators “shall not operate cranes when visibility cannot be maintained to assure a safe operation.” An FMS ship boss told investigators he believed that, typically, crane operations should be performed in the trolley cab rather than using the waterside dock-level control station. According to crane operator 2 and ship boss 2, moving a crane typically also involved a second person: a dock signal person positioned on the dock where they could observe the crane’s movement along its", "spans": []}], "answer": "The STAX 1 worker on top of the Erving's funnel was approximately **200 feet away** from the crane's operator cabin when he shouted and waved his arms to indicate that the crane should stop.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-cd1f07db2c", "answerable": true, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "status": "not_retrieved"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "status": "not_retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "status": "retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2547.pdf", "text": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 8 2 Analysis On September 11, at 1236, the towboat Schweiger was transiting Baker Bay West Channel in Ilwaco, when the vessel struck the US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. At 1235:12, the Schweiger began moving to port and crossed the channel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "spans": [[533, 604]]}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 9 1.3.2 Personnel Information The pilot was working on his first hitch aboard the Amber Brittany, which he began on February 22, thirteen days before the contact. He had previous experience operating towing vessels on inland waters and Western Rivers. This was the pilot’s first time transiting the McAlpine Locks while at the helm of the Amber Brittany. Though the Amber Brittany had transited through the McAlpine Locks twice previously during the pilot’s hitch, the captain had been on watch during both transits. According to the company, the pilot told them he had previous experience operating towing vessels on the Ohio River. However, following the casualty, the pilot told Coast Guard and NTSB investigators that he did not have previous experience operating towing vessels on the Ohio River. The captain had over 40 years of experience in different roles on various", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 5 vessel Stacy McCune, bound upriver, entered the northern McAlpine Lock chamber at 1526, and the lock chamber began to fill at 1540. At 1543, the Amber Brittany tow passed through the Louisville and Indiana (L&I) Railroad Bridge. At 1547, automatic identification system (AIS) data showed that the heading of the Amber Brittany tow altered appreciably to port as the tow exited the upstream end of the canal. At 1548, the tow’s course over ground also altered significantly to port as it began to be set off the sailing line and toward the vane d ike. According to the pilot’s statement, an outdraft current set the tow toward the vane dike. He attempted to counter the set but was unsuccessful. Realizing that the tow was going to contact the vane dike, he then attempted to land the tow as softly as possible, “ in the hopes of minimizing any damage.”", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}], "answer": "For the Amber Brittany tow striking the McAlpine vane dike, the vessel started wandering off its intended path approximately 3 minutes before impact. The operator, the pilot, reported an outdraft current set the tow toward the vane dike, and he attempted to counter the set but was unsuccessful.\n\nFor the Schweiger hitting the Coast Guard docks at Cape Disappointment, the vessel started wandering off its intended path approximately 3 minutes before impact. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-477e38bdb0", "answerable": true, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "status": "not_retrieved"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2615.pdf", "text": "and push gear system and an inspection of the engine room and bilges. He notified the mate on watch that he was going to head to the galley to start preparations for the evening meal, which he routinely performed as part of his duties. About 1624, according to recorded Rose Point data, the Mackenzie Rose tow was centered in the Elizabeth River channel and proceeding through t he South Norfolk Jordan Bridge with a course over ground of 020°, a speed over ground of 4.8 knots, and no rate of turn. About a minute later, about 1625, the vessel and tow passed successfully through the South Norfolk Jordan Bridge. The mate told investigators that, after the 3 The marine autopilot system on board the Mackenzie Rose was designed to hold the vessel’s heading, which was set by the operator. It did not have the capability to automatically steer a course, nor did it account for set or drift.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-3d2bcfed40", "answerable": false, "question": "Why did the towboat Harlan Creek and its barges strike the lock wall at Markland Locks and Dam on the Ohio River in 2025?", "expected_answer": "The reports do not cover a contact by a tow of the Harlan Creek at Markland Locks and Dam; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 71 Report Investigation Year Title Summary Probable Cause MIR-25-14 DCA24FM025 2024 Contact of Amber Brittany Tow with Vane Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart. There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. The National Transportation Safety Board determines that the probable cause of the contact of the Amber Brittany tow with the vane dike was the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Va n e Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. 2 Figure 1. The Amber Brittany on July 28, 2022, before the contact. (Source: Matt Burks) 1 In this report, all times are eastern standard times, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM025). Use the CAROL Query to search investigations. April 4, 2025 MIR-25-14", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": []}], "answer": "The provided context does not mention an incident involving the towboat *Harlan Creek* or a collision with the lock wall at Markland Locks and Dam on the Ohio River in 2025. Therefore, I cannot provide a specific cause for such an event based on the available information.", "judges": ["groundedness", "abstention"]}, {"key": "t-433b406c67", "answerable": true, "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "February 4, 2026 MIR-26-04 Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska", "status": "partly"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska 57°02.09’ N, 134°39.33’ W Date March 6, 2025 Time 1320 Alaska standard time (coordinated universal time –9 hrs) Persons on board 5 Injuries 1 minor Property damage $1.6 million Environmental damage None Weather Visibility 9 mi, overcast, winds east-southeast 12 kts, air temperature 44°F Waterway information Strait; width 4.5 nm, depth 1,571 ft Figure 2. Area where the Spicy Lady fire occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[0, 163]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 4 Figure 3. The Spicy Lady under tow by the Angelette after the crew evacuated to the Angelette. (Source: Wrangell Volunteer Fire Department) At 1432, the captain of the Spicy Lady notified the Wrangell Volunteer Fire Department, located in Wrangell, Alaska (about 100 miles from the Spicy Lady’s location), of the fire. The fire department prepared their gear and boarded a floatplane, which departed Wrangell at 1509 with three firefighters on board. At 1603, the floatplane landed in Warm Springs Bay, where it met the Westerly. The firefighters boarded the Westerly with their gear, and the crew aboard the Westerly transported them to the Spicy Lady just outside of Warm Springs Bay. Once aboard the Spicy Lady, firefighters set up a portable fire pump and entered the main cabin. They encountered heat and heavy smoke and traced the origin of the fire to the forward berthing area. Using water and foam, the firefighters", "spans": [[0, 47]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": [[0, 37], [150, 192]]}, {"doc_id": "MIR2624.pdf", "text": "a. The American Bureau of Shipping only served as the designated TPO for the Miss Peggy and did not class the vessel. 1.5 Waterway Conditions The casualty occurred near the boundary of the Lynchburg precautionary area. The Coast Guard designated Lynchburg as a precautionary area “due to frequent congestion of meeting, crossing, and overtaking of dissimilar traffic including ships, tows with/without barges, ferries, and industrial vessels.” 29 Figure 19 shows the radius of the precautionary area. 29 According to 33 CFR 161.2, a precautionary area is a routing measure comprising an area within defined limits where vessels must navigate with particular caution and within which the direction of traffic may be recommended.", "spans": []}], "answer": "The March 2025 Spicy Lady casualty was categorized as a **Fire/Explosion**. The incident took place in the **Chatham Strait**, near the **landmark Point Gardner, Alaska**.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0244749d09", "answerable": true, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "Persons on board 9 Injuries None Property damage $2 million est.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre On May 13, 2024, about 1657 local time, the towing vessel Baylor J. Tregre was towing the ocean barge MARMAC 27 in the Gulf of America, about 23 miles south of Galveston, Texas, when the towing vessel capsized and sank (see figure 1 and figure 2). 1 All four crewmembers abandoned the vessel and were rescued by the US Coast Guard. One crewmember sustained minor injuries. There was no pollution reported. Damage to the towing vessel was estimated at $2 million. 2 Figure 1. Left to right: Towing vessel Baylor J. Tregre at unknown date, and ocean barge MARMAC 27 after the casualty. (Source: Trinity Towing LLC) 1 In this report, all times are central daylight time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM038). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "J Studdert were rescued by a nearby vessel; four crewmembers sustained minor injuries. The Patrick J Studdert was considered a total constructive loss valued at over $2.3 million. The Clara B sustained minor damage to its hull, estimated at $250,000 to repair. The National Transportation Safety Board determines that the probable cause of the collision between the bulk carrier Clara B and towing vessel Patrick J Studdert and subsequent sinking of the Patrick J Studdert was the Patrick J Studdert captain’s distraction due to his cell phone use, which resulted in him not maintaining a proper lookout and navigating the towing vessel directly into the path of the upbound Clara B. MIR-25-26 DCA24FM033 2024 Collision of William B Klunk Tow with Moored Barges On April 17, 2024, about 1655 local time, the towing vessel William B Klunk was pushing 22 barges downbound on the Lower Mississippi River at mile 227, near Baton Rouge, Louisiana, when the tow collided with", "spans": []}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}], "answer": "The estimated repair bill for both the Baylor J. Tregre and the Chad Pregracke tow is $2 million. The Baylor J. Tregre had four crewmembers aboard, and the Chad Pregracke tow also had four crewmembers aboard.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e4567069de", "answerable": true, "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "Possible ignition sources in the forward berthing area included electrical wiring, electrical components, and the lithium-ion batteries stored in the portside bunk (some of which the captain said were charging at the time).", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "investigators were unable to determine when this occurred in the ignition sequence, and it is possible that the arcing and corrosion occurred after the initial fire or during firefighting efforts.", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "due to severe fire damage in the berthing area, and because the space was unoccupied when the fire started, investigators were unable to determine when the bag containing the lithium-ion batteries caught fire or what caused it to ignite.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 8 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on board the fishing vessel Spicy Lady was an unknown source on a bunk in the forward berthing area.", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 7 2 Analysis While the crew of the Spicy Lady was fishing in Chatham Strait, about 1 mile west of Point Gardner, Alaska, they saw smoke and discovered a fire in a berthing area inside the main cabin. The fire was later extinguished by responding firefighters. When the crew entered the cabin to investigate the smoke, they discovered a fire near the portside middle bunk in the forward crew berthing area. They found that the bunk mattress was burning, as was a “plastic tote” containing lithium-ion batteries for personal items, which may have been charging at the time. Post-fire photos showed that, compared to other areas of the vessel, the portside bunks in the forward berthing area were the most severely damaged and thus experienced the highest level of heat. Additionally, the responding firefighters and the marine surveyor’s report both concluded that the most severe smoke and fire damage was located in", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 3 1 Factual Information On March 2, 2025, the 58-foot-long steel-hulled fishing vessel Spicy Lady got underway from Heritage Harbor near Wrangell, Alaska, with a crew of five. Between March 2 and March 5, the Spicy Lady transited near Frederick Sound and Chatham Strait while fishing for golden king crab. On March 6, at 1320, the crew of the Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska. Crewmembers on the aft working deck were preparing to haul in a crab pot when they noticed smoke coming from the main cabin, which was forward on the same deck. The deck boss and another crewmember entered the main cabin to investigate the source of the smoke and observed a fire in a crew berthing area located near the bow of the vessel. 2 (The crew berthing area was a “V-berth” with six bunks—three on the port side and three on the starboard side.)", "spans": []}], "answer": "Investigators were unable to pin down the exact source of the blaze on the fishing vessel Spicy Lady because the National Transportation Safety Board (NTSB) determined that the probable cause was an **unknown source** on a bunk in the forward berthing area. While the fire was found to have originated near the portside middle bunk in the forward crew berthing area, the specific cause—such as whether it was due to an electrical fault, overheating lithium-ion batteries, or another factor—could not be definitively determined. The presence of a burning mattress and a plastic tote containing lithium-ion batteries suggested potential contributors, but the exact origin remained unclear.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a8560f5393", "answerable": true, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "status": "not_retrieved"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "status": "not_retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "status": "retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2547.pdf", "text": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 8 2 Analysis On September 11, at 1236, the towboat Schweiger was transiting Baker Bay West Channel in Ilwaco, when the vessel struck the US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. At 1235:12, the Schweiger began moving to port and crossed the channel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "spans": [[533, 604]]}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 9 1.3.2 Personnel Information The pilot was working on his first hitch aboard the Amber Brittany, which he began on February 22, thirteen days before the contact. He had previous experience operating towing vessels on inland waters and Western Rivers. This was the pilot’s first time transiting the McAlpine Locks while at the helm of the Amber Brittany. Though the Amber Brittany had transited through the McAlpine Locks twice previously during the pilot’s hitch, the captain had been on watch during both transits. According to the company, the pilot told them he had previous experience operating towing vessels on the Ohio River. However, following the casualty, the pilot told Coast Guard and NTSB investigators that he did not have previous experience operating towing vessels on the Ohio River. The captain had over 40 years of experience in different roles on various", "spans": []}, {"doc_i
