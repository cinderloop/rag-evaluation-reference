trician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank. To bypass each BMS, an electrical wire was attached to allow power to travel from one side of the terminal to the other side (see figure 4). Figure 4. The installed bypass wire and the wire from the external charger on one of the 48-volt battery management systems on board the Flagship. (Background source: RMK Merrill Stevens) The BMS for the 24-volt battery system, which provided power to the vessel’s fuel pump and internal lights, was bypassed on March 13 and charged by a portable charger that had arrived with the vessel from Turkey.", "spans": [[0, 240]]}, {"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 8 Figure 6. The 24-volt lithium-ion battery bank (c ircled), after the fire. Shipyard personnel told investigators that the 24-volt and 48-volt batteries were not being charged when the workday ended on Friday, April 26, or during the weekend. They did not document or recall when they were last charged. Shipyard personnel informed investigators that both chargers were disconnected before the fire. The vessel’s shore power cable was connected to an outlet designated to provide electricity while the vessel was docked. In addition, a vessel’s representative told investigators that the electrical systems on the vessel were not being powered by the 24-volt and 48-volt battery systems. 2 Analysis The yacht Flagship was docked with no personnel on board at a shipyard on the Miami River in Miami when an explosion and fire occurred. Shoreside firefighters", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "electrical battery system (see figure 3). A BMS is critical to the safety and overall performance of lithium-ion batteries. The four BMSs aboard the Flagship managed the voltage, current, and temperature of each battery cell, as well as the charging and discharging. The BMSs were designed to start charging each of the battery banks when the charge level fell below 94% and would continue to charge until the charge level reached 100%. The battery banks could be charged from the vessel’s generator, shore power connection, or the solar panels located on the flying bridge. 4 3 CE Certification refers to European Union regulations that required manufacturers to affix a “CE marking” on products. The CE marking indicates that a product has been assessed by the manufacturer and deemed to meet European Union safety, health, and environmental protection requirements. 4 The vessel’s shore power electrical system was designed to operate on the nominal European", "spans": []}], "answer": "The team working on the yacht Flagship decided to wire around its battery monitoring computers (BMS) to increase the charging speed of the lithium-ion batteries. The original BMS for the 24-volt system could not manage the charging of battery cells, and this issue was not resolved during vessel construction. To address this, they bypassed the BMS by attaching an electrical wire to allow power to travel from one side of the terminal to the other, effectively bypassing the BMS to enable faster charging.\n\nRegarding the 48-volt battery bank, the context does not provide specific information about how many volts per day it had been gaining before the bypass was implemented. However, it is known that the BMS was designed to start charging each battery bank when the charge level fell below 94% and continue charging until the charge level reached 100%. This suggests that the battery bank was likely gaining charge at a rate that brought it from below 94% to 100%, but the exact rate per day is not specified.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-bcc890f436", "answerable": false, "question": "What did the NTSB determine caused the fishing vessel Northern Halcyon to capsize while hauling crab pots in the Bering Sea in 2025?", "expected_answer": "The reports do not cover a capsizing of a fishing vessel named Northern Halcyon; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2536.pdf", "text": "Hull Failure and Implosion of Submersible Titan MIR-25-36 79 Casualty Summary NTSB casualty category Flooding/Hull Failure Location North Atlantic Ocean, 900 nm east of Cape Cod, Massachusetts 41°43.98’ N, 49°59.9’ W Date June 18, 2023 Time 1047 Newfoundland and Labrador daylight time (coordinated universal time –2.5 hours) Injuries 5 fatal Property damage $5.6 million CAD (about $ 4.2 million USD) est. Environmental damage None Persons on board 5 NTSB investigators worked closely with our counterparts from Coast Guard Office of Investigations and Analysis throughout this investigation. The NTSB is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in the other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine the probable causes of the accidents and events we", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN On July 24, 2025, about 0900 local time, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the two crewmembers aboard were hauling lobster traps in the Gulf of Maine near Mount Desert Rock, Maine (see figure 1 and figure 2). 1 The captain of the vessel attempted to put out the fire but was unsuccessful. Both crewmembers abandoned the vessel, which burned to the waterline and sank. There were no injuries, and no pollution was reported. The vessel was a total loss, with damages estimated at $717,500. Figure 1. GITN’R DUN moored on May 29, 2025. (Source: US Coast Guard) 1 (a) In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles), unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM051). July 23, 2026 MIR-26-25", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "The NTSB did not determine the cause of the fishing vessel *Northern Halcyon* capsizing while hauling crab pots in the Bering Sea in 2025, as there is no information provided in the given contexts about this specific incident. The contexts provided detail other maritime incidents, such as the grounding of the *Mystery*, the hull failure of the submersible *Titan*, the fire aboard the *GITN’R DUN*, and the flooding of the *Jig Strike*, but none mention the *Northern Halcyon*. If you have additional details or a different context, please provide them so I can assist further.", "judges": ["groundedness", "abstention"]}, {"key": "t-2eaf756e98", "answerable": false, "question": "What was the official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner?", "expected_answer": "The report does not state a medical cause of death; it says only that local paramedics pronounced the chief engineer and third engineer dead on scene.", "evidence": [], "passages": [{"doc_id": "MIR2505.pdf", "text": "began boundary cooling on the exterior engine room bulkheads. About 0336, the chief engineer reported to the captain via handheld radio that three crewmembers were in the engine room: the third engineer, wiper, and himself. Emergency teams suited up in firefighting gear to search for the crewmembers and assess the situation in the engine room. The chief engineer shut down all electrical power from the ECR, blacking out the vessel. Upon loss of power, the ECR became dark. A ll three engine crewmembers were coughing due to the smoke. The vessel’s emergency diesel generator automatically started, providing electrical power to vital equipment and lighting circuits. The three engine crewmembers attempted to leave the ECR with their faces covered with shirts soaked in water, but upon opening the ECR door into the engine room, they were met with flames and smoke, so they retreated back into the ECR.", "spans": []}, {"doc_id": "MIR2505.pdf", "text": "Engine Room Fire aboard Cargo Ves sel Stride MIR-25-05 14 Figure 8. Left: Diesel oil puddled alongside base of main engine on tanktop. Upper right: Diesel oil puddled in main engine air intake manifold. Bottom right: Diesel oil puddled in deck containment by boiler on D deck. 1.3.2 Personnel The chief engineer who was aboard the Stride at the time of the fire had 38 years of experience in the maritime industry and had worked with the company as a chief engineer on six other company vessels since 2016. This was his first trip aboard the Stride, and he joined the vessel about 7 weeks before the fire. The third engineer joined the company in 2004 as a wiper, and he had completed 26 contracts aboard various company vessels as a motorman, fourth engineer, and third engineer. This also was his first trip aboard the Stride; he joined the vessel about 3 weeks before the fire. The wiper had about 4 years of experience in the maritime industry and had", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "engineer stated that he “tried to put out the fire on [the motorman’s] coverall” before they ran up to deck 1 to the ship’s hospital to receive first aid from the ship’s doctor. About the same time, the officer on watch on the bridge received a “chain of fire alarms in the engine room.” The officer in the wheelhouse called the engineer on watch in the ECR via phone and also called the captain on his handheld radio. The captain, who was on the balcony of deck 3, felt “a shake of the ship“ and saw thick smoke coming from the vessel’s funnel. A bout this time, the chief engineer and chief mate arrived on scene in the ECR. The captain reported to the wheelhouse, and the officer on watch advised him that a failure of the no. 2 auxiliary engine had resulted in an engine room fire. Additionally, he reported that the motorman, who was near the engine, had gotten burned and was receiving first aid from the ship’s doctor.", "spans": []}, {"doc_id": "MIR2516.pdf", "text": "board. The medical examiner determined that the primary cause of death for the two fatally injured firefighters was smoke inhalation, including carbon monoxide intoxication. 1.3 Vessel 1.3.1 General The Grande Costa D’Avorio was a 692-foot-long Ro/Con vessel with 12 decks. Vehicles were loaded using a stern ramp that led up to deck 3 (see Figure 8). Deck 11 was partially exposed and had a cargo vehicle deck, weather deck, and crew accommodation space.", "spans": []}], "answer": "The official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner, was **smoke inhalation**, including **carbon monoxide intoxication**.", "judges": ["groundedness"]}, {"key": "t-c938884f36", "answerable": false, "question": "How fast was the fishing vessel Mystery traveling when it struck the rocks near Seal Cape, Alaska?", "expected_answer": "The report does not state the Mystery's speed at the time of the grounding.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 2 Casualty Summary NTSB casualty category Grounding/Stranding Location Near Seal Cape, about 25 miles west of Sand Point, Alaska 55°21.40' N, 161°15.00' W Date December 10, 2024 Time 2121 Alaska standard time (coordinated universal time −9 hrs) Persons on board 3 Injuries None Property damage $800,000 (vessel); $150,000 (gear) Environmental damage None reported; est. 2,000 gallons of diesel fuel, 30 gallons of lube oil, and 50 gallons of other fuel on board Weather Visibility 10 mi, overcast, winds 020° at 20 kts, seas 1 ft, air temperature 39°F, water temperature 39° F, sunset 1713 Waterway information Strait; width 7 nm, depth 42–300 ft, low tide 0400 Figure 2. Area where the Mystery grounded, as indicated by a circled X. (Background source: Google Maps)", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "2 The dockside exam verified the presence and adequate condition of required lifesaving and safety gear (a six-person liferaft and five survival suits). The vessel was rigged for long-line fishing. 1.2 Event Sequence On December 8, 2024, the Mystery began a planned 5-day transit from Dutch Harbor, Alaska—where the crew had unloaded catch after a fishing trip—back to Homer. Three crewmembers were on board (the captain, who owned the vessel, and two deckhands). On December 9 and 10, a gale warning was in effect for the Pavlof Islands, the area the vessel was transiting. Rain was also forecasted, and southeasterly 35-knot winds had been observed. On December 10, the third day of the transit, t he captain navigated the vessel through various straits around the Pavlof Islands. Rather than steering the vessel directly from the helm, the captain relied on the autopilot to steer. 3 He would enter", "spans": []}], "answer": "The specific speed of the fishing vessel Mystery when it struck the rocks near Seal Cape, Alaska, is not explicitly mentioned in the provided context. However, the weather conditions on the day of the incident included winds of 020° at 20 knots, and the seas were reported to be 1 foot. These conditions, along with the use of autopilot, suggest that the vessel was likely operating under normal navigational conditions, but the exact speed at the time of grounding is not provided.", "judges": ["groundedness", "abstention"]}, {"key": "t-3410a66876", "answerable": true, "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "Possible ignition sources in the forward berthing area included electrical wiring, electrical components, and the lithium-ion batteries stored in the portside bunk (some of which the captain said were charging at the time).", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "investigators were unable to determine when this occurred in the ignition sequence, and it is possible that the arcing and corrosion occurred after the initial fire or during firefighting efforts.", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "due to severe fire damage in the berthing area, and because the space was unoccupied when the fire started, investigators were unable to determine when the bag containing the lithium-ion batteries caught fire or what caused it to ignite.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 8 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on board the fishing vessel Spicy Lady was an unknown source on a bunk in the forward berthing area.", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 7 2 Analysis While the crew of the Spicy Lady was fishing in Chatham Strait, about 1 mile west of Point Gardner, Alaska, they saw smoke and discovered a fire in a berthing area inside the main cabin. The fire was later extinguished by responding firefighters. When the crew entered the cabin to investigate the smoke, they discovered a fire near the portside middle bunk in the forward crew berthing area. They found that the bunk mattress was burning, as was a “plastic tote” containing lithium-ion batteries for personal items, which may have been charging at the time. Post-fire photos showed that, compared to other areas of the vessel, the portside bunks in the forward berthing area were the most severely damaged and thus experienced the highest level of heat. Additionally, the responding firefighters and the marine surveyor’s report both concluded that the most severe smoke and fire damage was located in", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 3 1 Factual Information On March 2, 2025, the 58-foot-long steel-hulled fishing vessel Spicy Lady got underway from Heritage Harbor near Wrangell, Alaska, with a crew of five. Between March 2 and March 5, the Spicy Lady transited near Frederick Sound and Chatham Strait while fishing for golden king crab. On March 6, at 1320, the crew of the Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska. Crewmembers on the aft working deck were preparing to haul in a crab pot when they noticed smoke coming from the main cabin, which was forward on the same deck. The deck boss and another crewmember entered the main cabin to investigate the source of the smoke and observed a fire in a crew berthing area located near the bow of the vessel. 2 (The crew berthing area was a “V-berth” with six bunks—three on the port side and three on the starboard side.)", "spans": []}], "answer": "The investigators were unable to pin down the exact source of the blaze because the National Transportation Safety Board determined that the probable cause was an \"unknown source\" on a bunk in the forward berthing area. The fire originated near the portside middle bunk in the forward crew berthing area, and while the bunk mattress and a \"plastic tote\" containing lithium-ion batteries were found to be burning, the precise origin remained undetermined.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-7ae366c2af", "answerable": true, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "evidence": [{"doc_id": "MIR2523.pdf", "quote": "Time 1855 eastern standard time", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "Weather Visibility 10 mi, overcast, winds west 3 kts, air temperature 60° F, water temperature 43° F, sunset 1730", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties", "status": "retrieved"}], "passages": [{"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 NOTE: This report was reissued August 4, 2026, with corrections to the descending bank labels on the graphic on p. 5. Grounding of Towing Vessel Tom Frazier On February 10, 2024, about 1855 local time, the towing vessel Tom Frazier was pushing 15 empty hopper barges upbound on the Ohio River, near Portsmouth, Ohio, when the vessel grounded on a submerged jetty w hile maneuvering to meet a downbound tow (see figure 1 and figure 2). 1 The nine crewmembers aboard the towboat were safely evacuated to shore. There were no injuries. An estimated 5 gallons of oil w ere released from the Tom Frazier. Damage to the vessel was $258,737. 2 Figure 1. The Tom Frazier underway in 2008. (Source: Billy Smith) 1 In this report, all times are eastern standard time, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": [[263, 441]]}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 8 Figure 8. Ohio River water levels at Portsmouth between August 10, 2023, and February 11, 2024. (Source: US Geological Survey) 1.3.3 Crew The Tom Frazier captain held a Coast Guard-issued credential as master of towing vessels on the Western Rivers. He had worked in the industry for 23 years and with the operating company for 3 years. He stated that he had frequented the area many times in his career but not in the previous 2 or 3 years.", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Geological Survey) The Tom Frazier began listing to starboard, and the engine room flooded (see figure 6). The captain of the Tom Frazier notified US Coast Guard Sector Ohio Valley, via VHF radio, that they were taking on water and had nine people aboard. The Coast Guard notified Greenup County, Kentucky, officials, who launched the Southshore, Lloyd, and Portsmouth Fire Departments, among others, to the scene. Local first responders, individuals ashore, and crews from nearby vessels evacuated the crew to shore. The Tom Frazier tow was transferred to the towing vessel Marty B, which towed the empty barges to McGinnis’ Debi Jo Dock (mile 334) in Greenup, Kentucky.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e312179b79", "answerable": true, "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "evidence": [{"doc_id": "MIR2522.pdf", "quote": "The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff.", "status": "partly"}, {"doc_id": "MIR2522.pdf", "quote": "Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel.", "status": "retrieved"}, {"doc_id": "MIR2522.pdf", "quote": "About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2522.pdf", "text": "engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff. The deckhand reported 6 –8 inches of water on the aft deck as they boarded the skiff. Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel. About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand. Once the Cape Douglas crew was aboard, the Red Sky captain notified the US Coast Guard. The captain and deckhand remained on scene aboard the Red Sky, and, about 40 minutes later, they witnessed the Cape Douglas sink by the port stern. The deckhand noted that, as the “upper deck corner” (near the port quarter of the vessel) went underwater, the Cape Douglas “rolled on its side” before sinking. Shortly after, the Red Sky returned to Kodiak and dropped off the captain and deckhand.", "spans": [[0, 193], [280, 366], [367, 453]]}, {"doc_id": "MIR2522.pdf", "text": "Sinking of the Industrial Vessel Cape Douglas MIR-25-22 5 to enter. The deckhand later estimated that there were about 4 feet of water in the engine room. The captain told investigators that there was a high-water bilge alarm in the center of the engine room; however, it did not activate. (The captain could not recall the last time it was tested and did not know if it was functional.) The captain turned on one of the vessel’s two manual bilge pumps near the engine room entrance (the other bilge pump was inaccessible due to the flooding). He and the deckhand opened the starboard-side sliding doors to dump the fish byproduct overboard to reduce the weight on the deck. However, the product was “like peanut butter” because the seawater pump had not started and there was no water available to loosen the product, so they could not dump it. The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the", "spans": [[846, 948]]}, {"doc_id": "MIR2529.pdf", "text": "system) The captain ordered the deckhand to prepare to lower the anchor. The deckhand prepared one of the anchors, but before she could deploy it , the captain ordered everyone on board to abandon the vessel because the list had become significant, and they w ere in danger. The deckhand, chef, steward, and owner jumped into the water. The captain broadcast a distress call on VHF channel 16, verified that all personnel had egressed, and then he also abandoned the vessel by jumping into the water. From the time the vessel started listing until the owner and", "spans": []}, {"doc_id": "MIR2524.pdf", "text": "crab pot davit was not running or pressurized; however, the hydraulic pump for the steering system was running and its lines (pipes and hoses) were pressurized. The captain estimated that he was in the engine room for 30–40 seconds. He told investigators that, as he exited the engine room, he saw a flash, and the smoke turned from white to black as the flames increased. The captain shut the engine room door to “try to cut oxygen” to the fire and went back to the wheelhouse. Concerned about an explosion, the captain decided that he and the other crewmember should abandon the vessel. At 1604, using a VHF radio on channel 16, he made a Mayday call to the Coast Guard informing them of the vessel’s position and his decision to abandon the vessel into a liferaft. The crewmember donned a survival suit (the captain was unable to retrieve his survival suit due to the fire), and", "spans": []}], "answer": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, he and the deckhand donned survival suits and got into the vessel’s towed skiff. They waved down a nearby Good Samaritan vessel. They were picked up by the fishing vessel Red Sky about 40 minutes after the 1315 decision to abandon the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e1766d6213", "answerable": true, "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "evidence": [{"doc_id": "MIR2525.pdf", "quote": "the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel.", "status": "retrieved"}, {"doc_id": "MIR2614.pdf", "quote": "Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2525.pdf", "text": "On July 13, 2023, about 0100, the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel. The two barges were made up abreast and bow to bow with the towboat. The captain, who was at the helm, told investigators he intended to back out with the barges and then shift position to make up to the aft end of the tow before proceeding outbound (see figure 3). Before the tow got underway, Vessel Traffic Service Houston/Galveston reported a 1.5-knot flood current. The captain later noted a 0.77-knot current setting the vessel down on the Figure 3. Duke tow departing the basin at 0120. The poles and section of the bridge contacted by the tow are circled. (Background source: Magnolia data as viewed on Rosepoint)", "spans": [[30, 249]]}, {"doc_id": "MIR2525.pdf", "text": "Contact of Duke Tow with Power Transmission Poles and Pelican Island Bridge MIR-25-25 6 2 Analysis On July 13, 2023, the towing vessel Duke, pushing two barges, was backing into the Galveston Ship Channel away from the Texas International Terminal when the tow contacted multiple power transmission poles, and the tug subsequently contacted the Pelican Island Causeway Bridge. The vessels, electrical infrastructure, and bridge together sustained estimated damages of $300,000. The Duke captain stated that he intended to back out with the barges made up abreast bow to bow with the towboat before flipping the barges around and proceeding outbound. He also stated that a bulk carrier moored to the end of the pier immediately east of the Texas International Terminal required him to back out fa rther than normal into the channel, and that he was focused on staying clear of the moored vessel while he was underway.", "spans": []}, {"doc_id": "MIR2614.pdf", "text": "3 Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process. The tow was oriented northerly, toward the Galveston Channel. The towboat was faced up to the rake end of the MMLP 322, with the MMLP 321 as the lead barge (see figure 4). Figure 4. Simplified diagram of the LCPL Phillip C George tow (scale approximate). The barges were identical, each measuring 297.5 feet long and 54 feet wide. The overall length of the tow was about 677 feet, and the deepest draft was 10 feet (the barges). The barges were made up to each other with a port and starboard coupling. Each coupling consisted of four steel wires and a fiber center line at the center kevels between the two barges. On board the Phillip C George were a captain and three other crewmembers. The captain explained she had decided to have the barges strung out (versus a breasted", "spans": [[2, 145]]}, {"doc_id": "MIR2614.pdf", "text": "Contact of LCPL Phillip C George Tow with Terminal Dolphin, MIR-26-14 Power Transmission Pole, and Pelican Island Bridge 4 Overhead electrical power transmission lines with a vertical clearance of 85 feet ran parallel to the causeway. The lines, which were owned by CenterPoint Energy, were supported by poles located in the water about 85 feet to the east side of the bridge. The Texas International Terminal (TXIT) was a liquid- and dry-bulk facility located on the south of the Galveston Channel, on Pelican Island. TXIT was comprised of three deep-draft vessel berths, three barge berths, and an east and west breakwater. A dolphin was located at the end of each breakwater, and the distance between the west and east breakwater dolphins was about 440 feet. 1.2 Event Sequence On the morning of May 15, 2024, the towing vessel LCPL Phillip C George was moored at TXIT, with two tank barges, MMLP 321 and MMLP 322, strung out. 3 Each", "spans": []}], "answer": "The Duke's barges were empty, and the LCPL Phillip C George's barges were each carrying about 24,000 barrels of vacuum gas oil (VGO).", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-392a197b01", "answerable": false, "question": "How long did firefighters take to put out the blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point?", "expected_answer": "The premise is wrong: there was no fire after the Hunts Point explosion; instead, sludge burst out of the tank and covered the assistant engineer and the vessel's exterior.", "evidence": [], "passages": [{"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel. The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NYC DEP office. He requested that the NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 4 1.2 Event Sequence On May 24, 2025, about 0818, the Hunts Point departed the Wards Island Wastewater Treatment Plant, where it was normally docked when not in operation, with a crew of six, including a master, chief engineer, assistant engineer, a mate, and two able seamen. The vessel was en route to the North River Wastewater Treatment Plant (also in New York) to load about 100,000 cubic feet of liquid sludge, a transit that would take about 2 hours. When the vessel departed Wards Island, about 40,000 cubic feet of cargo evenly distributed cargo remained in the cargo tanks from the previous day’s operation due to time constraints at the facility and the consistency of the sludge. Because sludge remained within the tanks, it had become too viscous for the vessel’s cargo pumps to move it from the tanks to the facility. To reduce the thickness and", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 13 2 Analysis On May 24, 2025, the sludge vessel Hunts Point was loading cargo at the North River Wastewater Treatment Plant when an explosion occurred in the no. 2 port cargo tank, resulting in the death of the chief engineer and injuries to three other crewmembers. Like other NYC DEP sludge vessels, the Hunts Point was designed to transport treated sludge from wastewater facilities to the dewatering facility. On the day of the casualty, about 40,000 cubic feet of sludge remained aboard the vessel from the previous day’s operation. The remaining cargo was evenly distributed within the six cargo tanks. While the sludge had been treated, it still contained decomposing organic material and produced flammable gases. Any flammable gas the sludge produced would collect within the cargo tanks. As a result, the concentration of these flammable gases would increase the longer the sludge remained within the tanks.", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion aboard Sludge Vessel Hunts Point On May 24, 2025, about 1020 local time, the sludge vessel Hunts Point was moored at the North River Wastewater Treatment Plant on the Hudson River, in New York, New York, when an explosion occurred aboard the vessel (see figure 1 and figure 2). 1 One crewmember was killed, and three crewmembers sustained minor injuries. No pollution was reported. Vessel damage was estimated to exceed $10 million. Figure 1. Hunts Point on July 7, 2018, before the explosion. (Source: Frank Joniak, shipspotting.com) 1 (a) In this report, all times are eastern daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM045). Use the CAROL Query to search investigations. July 15, 2026 MIR-26-22", "spans": []}], "answer": "The context provided does not mention firefighters being called to put out a blaze after the explosion. Instead, it states that there was no fire following the explosion, only sludge bursting out of the tank and covering the assistant engineer and the exterior of the vessel. Therefore, no information is available regarding the duration of any firefighting efforts.", "judges": ["groundedness", "abstention"]}, {"key": "t-ac295759e4", "answerable": true, "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "3 The current was about 3 mph. A total of six lock lines and four winch wires were used to moor the two barges (three lock lines and two wires on each barge). MPC told investigators that there was not a specified minimum number of lines to secure barges at their facility, but that industry standard was four lines and/or wires per barge in normal conditions. MPC expected enhanced measures beyond the minimum at high-wind and -water level conditions but did not specify how many additional lines should be used. On April 16, about 0600, MPC terminal operations personnel arrived at the terminal and found the MPC 644 and MPC 907 missing. At 0610, terminal operations personnel called EMS to check on the status of the barges. After investigating, at 0645, EMS called MPC terminal operations personnel and stated that the barges had broken away overnight. About 0650, terminal operations personnel performed a", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 4 The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock. No significant damage was noted to the barges, and all cargo was offloaded without issue. The TransMontaigne terminal—located at mile 794.1, about 1,500 feet downstream of th e MPC terminal—reported damage to its dock structure, which consisted of four mooring cells and a steel access walkway running from shore to cell nos. 2 and 3 (see figure 3). Cell no. 4, located farthest upriver, was no longer present. A sonar survey found that t he cell piling was fractured at t he river bottom and laid in th e downstream direction at a 90° angle to the original vertical location (see figure 4). Cell no. 3 sustained significant damage to the upstream piling structure and concrete cell cap. Cell no. 2 sustained fracture damage to its concrete cap. Supports and steps for a spiral ac", "spans": [[94, 195]]}], "answer": "The barges MPC 907 and MPC 644 were recovered by EMS tugs near mile 802 about 0700.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-65584941e7", "answerable": true, "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "evidence": [{"doc_id": "MIR2608.pdf", "quote": "The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 15 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "spans": [[95, 457]]}], "answer": "Federal investigators concluded that the blaze below decks on the bulk carrier Lem Verbena was caused by the failure of an O-ring seal on the composite boiler burner unit oil fittings block. This failure was due to the radial misalignment of the two fuel ports on the block modules, which led to pressurized diesel fuel atomizing and igniting on a nearby hot surface.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1ef4d07e82", "answerable": true, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; during the initial charging of one of the 48-volt battery banks using one of the portable chargers, which started on February 1, it took 5 days for the battery voltage to increase from 34 volts to 39 volts.", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "Vessel personnel determined that the BMSs were preventing the batteries from being charged from a portable charger", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 4 Figure 3. Diagram of the main deck of the Flagship showing the approximate locations of the 24-volt and 48-volt lithium-ion battery banks. ( Background source: RMK Merrill Stevens) 1.2 Event Sequence 1.2.1 Pre-casualty Events Before their installation on the Flagship during vessel construction, the 24- and 48-volt batteries for the Flagship were able to maintain a charge. There were no issues with the installation of the 48-volt lithium-ion battery systems. However, when the 24-volt system was installed, its BMS could not manage the charging of battery cells. The cause of the problem with the charging of the 24-volt lithium-ion battery system was not identified or resolved during vessel construction. During the vessel’s sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands.", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank. To bypass each BMS, an electrical wire was attached to allow power to travel from one side of the terminal to the other side (see figure 4). Figure 4. The installed bypass wire and the wire from the external charger on one of the 48-volt battery management systems on board the Flagship. (Background source: RMK Merrill Stevens) The BMS for the 24-volt battery system, which provided power to the vessel’s fuel pump and internal lights, was bypassed on March 13 and charged by a portable charger that had arrived with the vessel from Turkey.", "spans": [[0, 240]]}, {"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 8 Figure 6. The 24-volt lithium-ion battery bank (c ircled), after the fire. Shipyard personnel told investigators that the 24-volt and 48-volt batteries were not being charged when the workday ended on Friday, April 26, or during the weekend. They did not document or recall when they were last charged. Shipyard personnel informed investigators that both chargers were disconnected before the fire. The vessel’s shore power cable was connected to an outlet designated to provide electricity while the vessel was docked. In addition, a vessel’s representative told investigators that the electrical systems on the vessel were not being powered by the 24-volt and 48-volt battery systems. 2 Analysis The yacht Flagship was docked with no personnel on board at a shipyard on the Miami River in Miami when an explosion and fire occurred. Shoreside firefighters", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "electrical battery system (see figure 3). A BMS is critical to the safety and overall performance of lithium-ion batteries. The four BMSs aboard the Flagship managed the voltage, current, and temperature of each battery cell, as well as the charging and discharging. The BMSs were designed to start charging each of the battery banks when the charge level fell below 94% and would continue to charge until the charge level reached 100%. The battery banks could be charged from the vessel’s generator, shore power connection, or the solar panels located on the flying bridge. 4 3 CE Certification refers to European Union regulations that required manufacturers to affix a “CE marking” on products. The CE marking indicates that a product has been assessed by the manufacturer and deemed to meet European Union safety, health, and environmental protection requirements. 4 The vessel’s shore power electrical system was designed to operate on the nominal European", "spans": []}], "answer": "The team working on the yacht Flagship decided to wire around its battery monitoring computers to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank. The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-73491690a0", "answerable": true, "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "evidence": [{"doc_id": "MIR2608.pdf", "quote": "The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 15 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "spans": [[95, 457]]}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 13 2 Analysis While the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks in Mobile, Alabama, a fire broke out in the upper deck of the engine room near the boiler. Due to the severity of the fire, the crew activated the vessel’s CO 2 fixed fire extinguishing system, and the fire was extinguished. After the fire, the Lem Verbena operating company and Coast Guard investigators found that an O-ring on the oil fittings block upper module of the boiler’s burner unit had become pinched on the fuel port for the lower module. This O-ring was intended to provide a seal between the corresponding fuel ports on the lower and upper modules (when bolted together) to contain pressurized fuel as it moved through the system to the burner unit igniter. O-rings are designed to protect against leaks by lying flat and becoming compressed between two machinery", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena On January 4, 2025, about 2323 local time, the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks on the Mobile River in Mobile, Alabama, with 19 crewmembers on board when a fire started in the engine room (see figure 1 and figure 2). 1 The crew activated the vessel’s carbon dioxide fixed fire extinguishing system. Shoreside firefighters later determined the fire had been extinguished. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $5.5 million. Figure 1. Lem Verbena underway in April 2024 in Santos, Brazil. (Source: Guilherme Ceccato, shipspotting.com) 1 (a) In this report, all times are central standard time. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM014). March 11, 2026 MIR-26-08", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 8 Figure 5. The Lem Verbena boiler’s burner unit after the fire. (Background source: US Coast Guard) 1.3.2 Boiler The Lem Verbena’s boiler created steam using two methods: a furnace heated by a burner unit fired from diesel oil, and waste heat from the main engine or the no. 2 and no. 3 diesel generator exhausts, which ran through vertical tubes within the boiler (the no. 1 diesel generator was not part of the boiler system). A portion of the no. 2 and no. 3 generator exhaust pipes ran directly below the burner unit in the engine room upper platform and through metal grating before it entered the boiler. Precasualty pictures of the no. 2 generator exhaust pipe showed that it was covered with protective lagging (see figure 6). 5 5 Lagging insulates hot surfaces such as engine exhaust piping from combustible surfaces,", "spans": []}], "answer": "Federal investigators concluded that the blaze below decks on the bulk carrier Lem Verbena was caused by the failure of an O-ring seal on the composite boiler burner unit oil fittings block. This failure occurred due to the radial misalignment of the two fuel ports on the block modules, which allowed pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-25db0e2cd3", "answerable": true, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "evidence": [{"doc_id": "MIR2515.pdf", "quote": "However, the flexible ducting was made of combustible material; it was not structurally protected from fire (nor was it required to be).", "status": "not_retrieved"}, {"doc_id": "MIR2515.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "status": "retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 17 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the engine room fire on the towing vessel Johnny M was a catastrophic main engine failure that caused the venting and ignition of hot atomized lube oil. Contributing to the ineffectiveness of the carbon dioxide fixed fire extinguishing system was the lack of structural fire protection for the main engines’ combustion air intake ducting, which allowed oxygen to enter the engine room once the fire consumed the ducting. 3.2 Lessons Learned Structural Fire Protection The flexible ducting providing combustion air to the main engines on board the Johnny M extended from the engine stacks on the main deck down to the engine room and did not have any insulation or other barriers to prevent the passage of smoke, heat, and fire—known as structural fire protection. This type of unprotected", "spans": []}, {"doc_id": "MIR2621.pdf", "text": "due to the rapid spread of the fire. The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained. 5 Structural fire protection is a component of an overall vessel fire-protection strategy that uses passive design features in a vessel’s structure to slow the expansion of a fire from one compartment to another. Structural 5 See Fire aboard Towing Vessel Mary Dupre near Freeport, Texas, June 26, 2022, MIR-23-12; Fire aboard Towing Vessel Jaxon Aaron on the Lower Mississippi River, mile marker 770, August 13, 2016, MAB-17/19; and Fire On Board Fish Processing Vessel Juno in Grays Harbor, Westport, Washington, December 28, 2013, MAB-15/05.", "spans": [[37, 326]]}, {"doc_id": "MIR2621.pdf", "text": "Fire aboard Towing Vessel William D MIR-26-21 11 fire protection uses fire-resistant materials and insulation installed on the horizontal and vertical surfaces of a compartment, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke, thus providing additional time to evacuate and for firefighting to contain and extinguish a fire. Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "spans": [[365, 589]]}, {"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 8 Figure 5. Local firefighters fighting the fire aboard Johnny M. (Source: East Marshall Fire Department) 1.3 Additional Information 1.3.1 Damage 1.3.1.1 Vessel After the fire, Coast Guard and the National Transportation Safety Board investigators boarded the Johnny M to examine the vessel damage. The vessel sustained fire damage throughout all the decks. The engine stacks’ interior and exterior and the engine room windows exhibited soot where the space ventilated to the atmosphere. The paint on the exterior of the upper engine room bulkheads was charred where the structural frames intersected with the bulkhead. Fire and heat damage was heavily concentrated in the lower level of the engine room where the main engines were located. The engine room window frames and the deck above the engine room were warped due to heat exposure (see figure 6). The outboard side of the portside stack", "spans": []}], "answer": "The National Transportation Safety Board (NTSB) assessments of both the Johnny M engine-room fire and the William D bunkroom fire point to a significant shortcoming in the federal rules for towboats regarding **structural fire protection**. Specifically, the NTSB highlights that **current federal regulations do not require vessel owners to incorporate structural fire protection** on their vessels.\n\nStructural fire protection involves the use of fire-resistant materials, insulation, and barriers to slow the spread of fire and heat between compartments. This includes protecting horizontal and vertical surfaces, doors, hatches, and pipe and cable openings. In the case of the Johnny M, the lack of insulation or barriers on the flexible ducting that provided combustion air to the main engines allowed fire and heat to spread rapidly. Similarly, the William D incident likely involved similar deficiencies in structural fire protection, which contributed to the fire's rapid spread.\n\nThe NTSB has previously noted that the use of combustible materials in interior spaces and the absence of structural fire protection have contributed to severe damage in other vessel fires. However, the current federal regulations under 46 Code of Federal Regulations Subchapter M do not mandate structural fire protection, leaving vessel owners without a legal requirement to implement these critical safety measures. This regulatory gap is a key shortcoming that the NTSB has identified in the federal rules for towboats.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-3ffa1a857f", "answerable": false, "question": "How fast was the fishing vessel Mystery traveling when it struck the rocks near Seal Cape, Alaska?", "expected_answer": "The report does not state the Mystery's speed at the time of the grounding.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-f1cc1d9fb8", "answerable": true, "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward.", "status": "retrieved"}, {"doc_id": "MIR2628.pdf", "quote": "The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "rapidly expand as the vessel moved through the water (seas and swells) as it transited, ultimately causing a larger section of the hull to separate, including portions of the plywood, as seen by the second captain and deckhand 1. Water can penetrate through cracks, unsealed through-hull fittings, or areas where improper repairs have been made. Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward. The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs. Although the vessel was not salvaged, and therefore investigators could not examine the hull to determine the method of failure, it is possible that inadequately completed repairs to the hull contributed to the casualty.", "spans": [[346, 470], [471, 727]]}, {"doc_id": "MIR2628.pdf", "text": "about a 10-foot-long section located about 4 feet down from the rub rail. The repairs were completed by the owner and the captain. The US Coast Guard was not notified about the issue with the hull and therefore did not oversee the repairs as required for an inspected vessel like the Jig Strike. According to the Coast Guard, “on multiple occasions from 2005 until vessel sinking, the owner of the Jig Strike routinely disregarded notifying attending CG [Coast Guard] inspectors of ongoing repairs.” A condition and valuation survey was completed in December 2021; the surveyor rated the hull and structure of the vessel as “satisfactory.” The summary of the survey stated, “ The vessel is basically structurally sound but it does exhibit normal deterioration and mechanical deficiencies.”", "spans": [[138, 182]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": [[724, 755]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, the delamination was repaired by the owner and the captain of the vessel. The Coast Guard was unable to oversee the repairs because the owner and captain did not notify the Coast Guard about the issue with the hull. As a result, the Coast Guard could not ensure that the repairs were completed in accordance with recommended practices for fiberglass hull repairs. The Coast Guard noted that the owner of the Jig Strike routinely disregarded notifying inspectors of ongoing repairs.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-3d3a880bd3", "answerable": true, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "evidence": [{"doc_id": "MIR2523.pdf", "quote": "Time 1855 eastern standard time", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "Weather Visibility 10 mi, overcast, winds west 3 kts, air temperature 60° F, water temperature 43° F, sunset 1730", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties", "status": "retrieved"}], "passages": [{"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 NOTE: This report was reissued August 4, 2026, with corrections to the descending bank labels on the graphic on p. 5. Grounding of Towing Vessel Tom Frazier On February 10, 2024, about 1855 local time, the towing vessel Tom Frazier was pushing 15 empty hopper barges upbound on the Ohio River, near Portsmouth, Ohio, when the vessel grounded on a submerged jetty w hile maneuvering to meet a downbound tow (see figure 1 and figure 2). 1 The nine crewmembers aboard the towboat were safely evacuated to shore. There were no injuries. An estimated 5 gallons of oil w ere released from the Tom Frazier. Damage to the vessel was $258,737. 2 Figure 1. The Tom Frazier underway in 2008. (Source: Billy Smith) 1 In this report, all times are eastern standard time, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": [[263, 441]]}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 8 Figure 8. Ohio River water levels at Portsmouth between August 10, 2023, and February 11, 2024. (Source: US Geological Survey) 1.3.3 Crew The Tom Frazier captain held a Coast Guard-issued credential as master of towing vessels on the Western Rivers. He had worked in the industry for 23 years and with the operating company for 3 years. He stated that he had frequented the area many times in his career but not in the previous 2 or 3 years.", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Geological Survey) The Tom Frazier began listing to starboard, and the engine room flooded (see figure 6). The captain of the Tom Frazier notified US Coast Guard Sector Ohio Valley, via VHF radio, that they were taking on water and had nine people aboard. The Coast Guard notified Greenup County, Kentucky, officials, who launched the Southshore, Lloyd, and Portsmouth Fire Departments, among others, to the scene. Local first responders, individuals ashore, and crews from nearby vessels evacuated the crew to shore. The Tom Frazier tow was transferred to the towing vessel Marty B, which towed the empty barges to McGinnis’ Debi Jo Dock (mile 334) in Greenup, Kentucky.", "spans": []}], "answer": "The incident occurred on February 10, 2024, at about 1855 local time. Since the sun typically sets in Portsmouth, Ohio, around 5:30 PM to 6:00 PM during that time of year, the grounding occurred approximately 1 to 1.5 hours after sunset.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8435b91fb1", "answerable": true, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "status": "not_retrieved"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "status": "partly"}], "passages": [{"doc_id": "MIR2615.pdf", "text": "and push gear system and an inspection of the engine room and bilges. He notified the mate on watch that he was going to head to the galley to start preparations for the evening meal, which he routinely performed as part of his duties. About 1624, according to recorded Rose Point data, the Mackenzie Rose tow was centered in the Elizabeth River channel and proceeding through t he South Norfolk Jordan Bridge with a course over ground of 020°, a speed over ground of 4.8 knots, and no rate of turn. About a minute later, about 1625, the vessel and tow passed successfully through the South Norfolk Jordan Bridge. The mate told investigators that, after the 3 The marine autopilot system on board the Mackenzie Rose was designed to hold the vessel’s heading, which was set by the operator. It did not have the capability to automatically steer a course, nor did it account for set or drift.", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "Contact of Tank Vessel Hafnia Amessi with Pier MIR-25-11 21 the risks associated with bank effect and current. If the Hafnia Amessi had approached the turn on to Range C in the relatively open water to starboard, the bank effect on the vessel’s port side would have been minimized, and the vessel would have been better positioned to handle the oncoming flood current. To prepare for the Hafnia Amessi’s transit, the pilot ordered the tugboat Diane Moran to escort the tanker down the Cooper River. The pilot stated that this order was a direct consequence of what he had learned from studying the Bow Triumph casualty. When it became apparent that the Hafnia Amessi was not responding to rudder and engine orders as the pilot anticipated and was in danger of striking Pier B, the pilot directed the Diane Moran to push on the tanker’s bow. According to the pilot, the ship’s rate of turn did not increase until the tugboat began", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "the Hafnia Amessi’s drafts were 21.3 feet forward and 26.3 feet aft. Beginning the transit down the Cooper River, the CBPA pilot ordered dead slow ahead, followed by slow ahead. According to the Hafnia Amessi’s pilot card, slow ahead corresponded to 9.0 knots of speed when the tanker was in ballast in open water with no current. At 1000, the vessel entered the Joint Base Charleston Channel (refe
