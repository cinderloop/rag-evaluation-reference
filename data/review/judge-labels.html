ens 1471. The crane components and their measurements are labeled. Along the Royal Engineer tow’s route, the Brunswick, a 315-foot-long dredge and barge, was dredging the Cooper River channel adjacent to the North Charleston Terminal, located about 1 mile north of the Don Holt Bridge. The Brunswick’s floating discharge pipeline extended eastward across the Cooper River channel, where dredge spoils were discharged near the eastern bank, effectively blocking the channel to traffic moving north and south. The dredging operation was published in", "spans": []}], "answer": "The skipper of the dredge Brunswick wanted the Royal Engineer and its crane barge to pass between the dredge and the dock (on the terminal side) because he had workers stationed downstairs who were working on a task. He stated that if the tow passed on the other side, he would have to stop his workers to accommodate the transit, which would disrupt their work. Therefore, he preferred the tow to pass between the dredge and the dock to avoid interrupting the ongoing work.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-66a1163e6e", "answerable": true, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "evidence": [{"doc_id": "MIR2523.pdf", "quote": "Time 1855 eastern standard time", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "Weather Visibility 10 mi, overcast, winds west 3 kts, air temperature 60° F, water temperature 43° F, sunset 1730", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 NOTE: This report was reissued August 4, 2026, with corrections to the descending bank labels on the graphic on p. 5. Grounding of Towing Vessel Tom Frazier On February 10, 2024, about 1855 local time, the towing vessel Tom Frazier was pushing 15 empty hopper barges upbound on the Ohio River, near Portsmouth, Ohio, when the vessel grounded on a submerged jetty w hile maneuvering to meet a downbound tow (see figure 1 and figure 2). 1 The nine crewmembers aboard the towboat were safely evacuated to shore. There were no injuries. An estimated 5 gallons of oil w ere released from the Tom Frazier. Damage to the vessel was $258,737. 2 Figure 1. The Tom Frazier underway in 2008. (Source: Billy Smith) 1 In this report, all times are eastern standard time, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-72954f17c9", "answerable": true, "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "evidence": [{"doc_id": "MIR2544.pdf", "quote": "Casualty type Flooding/Hull Failure", "status": "retrieved"}], "passages": [{"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole On June 12, 2024, about 1530 local time, the towing vessel Cajole was upbound the Lower Mississippi River near Waggaman, Louisiana, when the vessel began flooding (see figure 1 and figure 2). 1 The two crewmembers aboard attempted to pump out the vessel but were unsuccessful. They tied off to a nearby barge and evacuated to a Good Samaritan vessel. The Cajole later sank. There were no injuries, and a sheen was reported. Damage was estimated at $2 million. Figure 1. Cajole underway on an unknown date before the sinking. (Source: marinetraffic.com, Mark Haury) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM046). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-44", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 2 Casualty Summary Casualty type Flooding/Hull Failure Location Lower Mississippi River, mile 112, Waggaman, Louisiana 29°57.77’ N, 090°14.35’ W Date June 12, 2024 Time 1530 central daylight time (coordinated universal time –5 hrs) Persons on board 2 Injuries None Property damage $2 million Environmental damage Sheen on water, 4,277 gal diesel fuel recovered (est. fuel capacity 5,000 gal) Weather Visibility 7 mi, partly cloudy, winds east-northeast 7 kts, air temperature 91°F Waterway information River width 2,100 ft, depth 33 ft, current est. 2 kts Figure 2. Area where the Cajole flooding occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[74, 109]]}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 10 2 Analysis While transiting the Lower Mississippi River, the towing vessel Cajole flooded and sank after taking on water near mile 113. Partway through the transit, the captain reported that the vessel was losing speed; he later entered the engine room and saw water entering the engine room space from the forward starboard corner near a bulkhead penetration (conduit). There were two spaces forward of the engine room’s forward bulkhead: the auxiliary space and bow void. After the towboat was salvaged, investigators found no hull damage that would have allowed water ingress into these spaces. According to the captain, the cover on an access hatch to the starboard-side auxiliary void was in place when he discovered the flooding in the engine room. The cover was lost during the casualty, so investigators were not able to evaluate its condition. The hatch was flush", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 5 these preparations, about 0630, the vessel departed the shipyard with the captain at the helm, transiting north in the Harvey Canal, bound for Weber Marine in Convent, Louisiana. Between departure and 0745, the captain received an alarm on the bridge. The captain could not recall the nature of the alarm. He silenced the alarm and continued navigating the vessel. About 0745, the Cajole transited Harvey Lock, turned to port, and proceeded upbound on the Mississippi River. Over the next 3-4 hours, the vessel continued at speeds between 3 and 8.5 knots, averaging about 5 knots. Throughout the voyage, to accommodate vessel traffic, the Cajole crossed the river, first crossing to the right descending bank, then the left descending bank. 2 At 1102, the vessel again crossed the river to the right descending bank, turning sharply to port, with the starboard side of the vessel exposed to the current.", "spans": []}], "answer": "The casualty summary indicates that the failure leading to the loss of the towboat Cajole on the Mississippi near Waggaman was flooding/hull failure.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6c85fc55b8", "answerable": true, "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "evidence": [{"doc_id": "MIR2543.pdf", "quote": "when the towing vessel Steel Skipper, which was reconfiguring the tow, pushed the tow astern, and the William E Strait collided with two moored barges upstream at the Shell Norco Refinery dock, damaging the barges and dock", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2543.pdf", "text": "about 0210, he felt the vessel begin to move astern in the direction of the Shell Norco Refinery dock as the fleeting tug moved the last two barges into position at the head of the tow. The William E Strait’s engines were not engaged. The Steel Skipper finished its work about 0215, and, with the weather clearing, the mate then noticed “extra equipment tied off to [the] Shell dock. It appeared to be a barge that wasn’t lit well but a bit below [the] dock.” He walked to the stern to check that the towboat was clear. The mate got the William E Strait underway about 0300 and began heading downbound with 16 barges for the Gnots fleeting area at mile 118. A few days later, the Shell Norco Refinery discovered damage to the no. 3 dock and to the two barges moored there. A Shell Norco Refinery boat lift was also damaged. Damages were estimated at $1,000 for the Cajun Courage and CDB02 and $500,000 for the facility.", "spans": []}], "answer": "The assisting tug Steel Skipper was moving the last two barges into position at the head of the tow when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-965b653636", "answerable": true, "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "evidence": [{"doc_id": "MIR2542.pdf", "quote": "Waterway information Unprotected approach channel, width 148 ft; charted depth 16 ft in channel, 8 ft outside of channel", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2542.pdf", "text": "148 feet wide at the location of the Jack Edwards/Julie C collision, per electronic navigation charts for the area. The charted depth in the channel was 16 feet, with water depths of 8–10 feet immediately outside the channel. On the day of the casualty, high tide within the port was predicted at 6.5 feet above charted datum at 2215; the range of tide was 2.3 feet. The National Geospatial-Intelligence Agency’s (NGA) Sailing Directions (Enroute), East Coast of South America describes the bottom type as follows: The mud on the bottom is known locally as “sling mud.” It is from 0.6 to 1.2m [2.0 to 3.9 feet] thick, and is of a very soft, almost liquid consistency. Ships of 10 knots or more can force a passage through this “sling mud” even though drawing 0.3m [1 foot] more than the actual depth of water. 10 The Jack Edwards crew stated that they were experiencing a flood tide at the time of the transit into Georgetown. According to the Sailing Directions, currents", "spans": []}], "answer": "The approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, was 148 feet wide. The charted depth in the channel was 16 feet.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-963289ab9e", "answerable": true, "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Persons on board 17 (5 crewmembers and 12 passengers)", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 3 1 Factual Information On August 30, 2024, about 1900, the 51.6-foot-long charter fishing vessel Jig Strike departed from San Diego, California, with a crew of five (captain, second captain, two deckhands, and a cook). 2 The vessel had been chartered for a fishing trip lasting a day and a half, and 12 passengers were aboard. The vessel, which had a wood-framed and plywood hull with fiberglass (fiberglass-reinforced plastic) overlay, transited through the night toward Cortes Bank, located about 100 miles west of San Diego. The weather was calm at departure, but according to the captain, in the morning “ it started getting a little bumpy.” Winds were 12–15 knots with swells of 3–6 feet. The vessel arrived at Cortes Bank shortly before 0700 on August 31. The passengers fished at two different locations, but a fter the crew received word that", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike On August 31, 2024, about 1035 local time, the charter fishing vessel Jig Strike was transiting between fishing locations near Cortes Bank in the Pacific Ocean, about 100 miles west of San Diego, California, when the vessel began rapidly taking on water (see figure 1 and figure 2). 1 The crew was unable to stem the flooding, and the five crewmembers and 12 passengers on board abandoned ship into a liferaft. They were rescued by a nearby good Samaritan vessel, and the Jig Strike later sank. There were no injuries, and no pollution was reported. The vessel was a total loss estimated at $475,000. Figure 1. Jig Strike underway at unknown date. (Source: Jig Strike Sportfishing, facebook.com) 1 (a) In this report, all times are Pacific daylight time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 2 Casualty Summary NTSB casualty category Flooding/Hull Failure Location Cortes Bank, Pacific Ocean, 100 nm west San Diego, California 32°28.00’ N, 119°12.00’ W Date August 31, 2024 Time 1035 Pacific daylight time (coordinated universal time −7 hrs) Persons on board 17 (5 crewmembers and 12 passengers) Injuries None Property damage $475,000 est. Environmental damage None Weather Partly cloudy, winds west-northwest 15–18 kts, seas 1–2 ft, swells south- southwest 3–6 ft, air temperature 64°F, water temperature 67°F, sunrise 0623 Waterway information Ocean; Cortes Bank depths 6–1,000 ft Figure 2 . Area where the Jig Strike flooded and sank, as indicated by a circled X. (Background source: Google Maps)", "spans": [[318, 371]]}], "answer": "The total head count aboard the Jig Strike when it flooded off Cortes Bank was 17 people, consisting of 5 crewmembers and 12 passengers.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-be9f599aa5", "answerable": true, "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "evidence": [{"doc_id": "MIR2529.pdf", "quote": "The vessel was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 5 crew were in the water, less than 4 minutes had elapsed. The yacht had listed over about 45–50° and grounded in the mud, visibly down by the stern (see figure 5). About 1247, automatic identification system data showed the vessel at a speed of 0.1 knots, crossing the 12-foot-depth contour in the West River. Figure 5. The Lovebug at 1238:48 and 1241:45, shortly after the owner and crew abandoned the vessel. (Source: Lovebug owner) Nearby Good Samaritan vessels rescued the crew and owner; Coast Guard personnel later evaluated them for injuries. One crewmember had a minor injury. For 16 days, the partially sunken yacht remained in the West River while salvage plans and logistics were coordinated. Salvage operations began on August 13. The vessel’s aftmost spaces on its lower deck were a garage that housed watercraft and a technical area for vessel electrical and mechanical systems on the", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 7 indication of a potential source of water ingress on the interior or exterior of the vessel. Extensive damage and debris throughout the vessel prevented investigators from examining some smaller spaces. The marine surveyor’s report stated, “due to the post casualty condition of the vessel it is impossible to determine the pre-loss condition.” The report also noted that the vessel had passed a class inspection the month before the casualty. 3 Damage to the vessel was estimated at $8 million. 3 Bureau Veritas was the class society responsible for Lovebug’s survey. The most recent survey took place on July 19, 2024, and included annual surveys of the hull, structure, machinery, and load line. Surveyors commented that there were no damages on the accessible parts of the hull, machinery alarms were audible throughout vessel, and no substantial corrosion areas had been identified during", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug On July 27, 2024, about 1235 local time, the yacht Lovebug was transiting the Chesapeake Bay in the West River north of Shady Side, Maryland, when the vessel started listing heavily to starboard (see figure 1 and figure 2). 1 The four crewmembers and one owner on board abandoned the vessel and were rescued by nearby vessel crews. The yacht partially sank in about 12 feet of water. There was one minor injury. An oil sheen, visible around the vessel, was contained with a boom. Damage to the vessel was estimated at $8 million. 2 Figure 1. The partially sunken Lovebug on July 27, 2024, at 1342. (Source: Maryland Natural Resources Police) 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM053). July 15, 2025 MIR-25-29", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 4 About 1235, when the yacht was near the West River Entrance Light 2, the captain noticed the Lovebug had developed a starboard list (see figure 4). He checked the steering, rudder indicators, and stabilizers o n the bridge and found no problems. The captain told investigators that, when the vessel first began listing, he did not hear any alarms. The list rapidly increased. According to the captain, about a minute after the vessel started listing, the vessel, which had been powered by its starboard generator, lost power. The captain backed off the throttles, and the vessel’s speed dropped to about 4 knots. Figure 4. The Lovebug’s track from the approximate area the vessel first was observed listing to its final position. (Background source: National Oceanic and Atmospheric Administration Electronic Navigation Chart US5MD1LC as viewed on Made Smart automatic identification system)", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-9ad79a4538", "answerable": true, "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "evidence": [{"doc_id": "MIR2501.pdf", "quote": "At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the lock.", "status": "partly"}, {"doc_id": "MIR2508.pdf", "quote": "at a speed of 0.35 mph, the starboard quarter of the starboard barge (EMS 348) contacted the wooden fendering of the transfer platform at dolphin no. 3", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 8 About 1804, the Kitty stopped moving astern and the vessel was outside of the open gates, with the stern of EMS 383 (the aft barge) abeam of the open lock gates. The captain put the engines in reverse in anticipation of water surging back into the lock; he estimated the water level in the lock had dropped about 3 to 4 feet. Less than a minute later, the Kitty tow started to advance ahead even though the engines were in reverse. By 1806, the Kitty tow was advancing ahead at 0.7 mph and increasing in speed. The captain moved propulsion astern on all engines to arrest the increase in speed. Seeing that the tow was still advancing ahead, the captain moved all main engine propulsion levers to full astern, but there was no effect on the tow’s advance. He instructed the steersman to look at the wheel (propeller) wash, and the steersman confirmed that the engines were in reverse. At the head of the tow, the deckhand", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 6 About 1741, the Kitty tow entered the forebay at about 4 mph. A deckhand and tankerman prepared lines and bumpers for entering the lock and then moved to the head of the tow. As the head of the tow neared the lock entrance, the captain reduced the speed of the tow, and, about 1749, the head of the tow began to enter through the open lock gates (A and B) at 2 mph. The captain looked at the automatic identification system information displayed on the vessel’s electronic chart system and saw ships—the 587-foot-long tanker Garden State and, about 1.5 miles astern, the 820-foot-long tanker SKS Darent—transiting southbound on the Mississippi River toward the Algiers Lock forebay entrance (see figure 6). About 1752, the Garden State began to pass the mouth of the forebay at 13.5 knots (15.5 mph); the vessel was about 1,065 yards away from the open lock gates.", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 7 About 1758, the second southbound tanker, the SKS Darent, passed the Algiers Lock forebay at 13.8 knots (15.9 mph); the vessel was about 950 yards away from the open lock gates. At 1759, the Kitty tow, fully within the lock chamber, had stopped moving. The deckhand was calling the distance to come ahead to the red pin via radio. The captain tried to ease the tow further ahead, but the Kitty tow began to move aft. The captain saw water “coming out” of the lock and that the water was “ pulling” the Kitty tow aft out of the lock chamber (toward the Mississippi River). At 1800, the Kitty tow was moving 0.6 mph astern, and the captain came ahead slow on all engines to counteract the tow’s movement (see figure 7). He stated over the Algiers Lock radio frequency that the passing ships were “sucking the water out at Algiers.” At 1801, the Kitty tow was still moving astern, now at 2 mph, despite", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "placed a line on a red pin once it was within reach and tied it off, but the line broke as the tow continued moving ahead. The deckhand placed another line on the pin, and that line broke as well. The deckhand told the captain via radio that the Kitty was “coming in hot.” According to the captain, when the Kitty tow was about 100 feet from the closed lock gates, the vessel was moving about 2 mph ahead. Over the radio, the lock hand announced that the tow was approaching too fast and told the captain to slow down. The captain replied, “Algiers, I’m backing on everything. The [expletive] waters’ coming back in from the [expletive] ships. I can’t get it to stop. I got everything hooked up.” At the bow of the lead barge, the deckhand saw that the tow was going to hit the closed lock gate and walked aft on the barge to safety. At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the", "spans": [[834, 940]]}], "answer": "The Kitty tow was moving at a higher speed at the moment its barge, EMS 317, made contact with Algiers Lock Gate D. The Kitty tow was moving at 1.4 mph when the contact occurred. There is no specific information provided about the speed of the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock. Therefore, based on the available information, the Kitty tow was moving faster at the moment of contact.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-2a7fdfa97a", "answerable": true, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "Persons on board 9 Injuries None Property damage $2 million est.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre On May 13, 2024, about 1657 local time, the towing vessel Baylor J. Tregre was towing the ocean barge MARMAC 27 in the Gulf of America, about 23 miles south of Galveston, Texas, when the towing vessel capsized and sank (see figure 1 and figure 2). 1 All four crewmembers abandoned the vessel and were rescued by the US Coast Guard. One crewmember sustained minor injuries. There was no pollution reported. Damage to the towing vessel was estimated at $2 million. 2 Figure 1. Left to right: Towing vessel Baylor J. Tregre at unknown date, and ocean barge MARMAC 27 after the casualty. (Source: Trinity Towing LLC) 1 In this report, all times are central daylight time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM038). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "J Studdert were rescued by a nearby vessel; four crewmembers sustained minor injuries. The Patrick J Studdert was considered a total constructive loss valued at over $2.3 million. The Clara B sustained minor damage to its hull, estimated at $250,000 to repair. The National Transportation Safety Board determines that the probable cause of the collision between the bulk carrier Clara B and towing vessel Patrick J Studdert and subsequent sinking of the Patrick J Studdert was the Patrick J Studdert captain’s distraction due to his cell phone use, which resulted in him not maintaining a proper lookout and navigating the towing vessel directly into the path of the upbound Clara B. MIR-25-26 DCA24FM033 2024 Collision of William B Klunk Tow with Moored Barges On April 17, 2024, about 1655 local time, the towing vessel William B Klunk was pushing 22 barges downbound on the Lower Mississippi River at mile 227, near Baton Rouge, Louisiana, when the tow collided with", "spans": []}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}], "answer": "The estimated repair bill for both the Baylor J. Tregre and the Chad Pregracke tow is $2 million. The Baylor J. Tregre had four crewmembers aboard, and the Chad Pregracke tow also had four crewmembers aboard.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1fda1d36e7", "answerable": true, "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "3 The current was about 3 mph. A total of six lock lines and four winch wires were used to moor the two barges (three lock lines and two wires on each barge). MPC told investigators that there was not a specified minimum number of lines to secure barges at their facility, but that industry standard was four lines and/or wires per barge in normal conditions. MPC expected enhanced measures beyond the minimum at high-wind and -water level conditions but did not specify how many additional lines should be used. On April 16, about 0600, MPC terminal operations personnel arrived at the terminal and found the MPC 644 and MPC 907 missing. At 0610, terminal operations personnel called EMS to check on the status of the barges. After investigating, at 0645, EMS called MPC terminal operations personnel and stated that the barges had broken away overnight. About 0650, terminal operations personnel performed a", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 4 The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock. No significant damage was noted to the barges, and all cargo was offloaded without issue. The TransMontaigne terminal—located at mile 794.1, about 1,500 feet downstream of th e MPC terminal—reported damage to its dock structure, which consisted of four mooring cells and a steel access walkway running from shore to cell nos. 2 and 3 (see figure 3). Cell no. 4, located farthest upriver, was no longer present. A sonar survey found that t he cell piling was fractured at t he river bottom and laid in th e downstream direction at a 90° angle to the original vertical location (see figure 4). Cell no. 3 sustained significant damage to the upstream piling structure and concrete cell cap. Cell no. 2 sustained fracture damage to its concrete cap. Supports and steps for a spiral ac", "spans": [[94, 195]]}], "answer": "The barges MPC 907 and MPC 644 were recovered by EMS tugs near mile 802 about 0700.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a544c27087", "answerable": true, "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "evidence": [{"doc_id": "MIR2529.pdf", "quote": "The vessel was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 5 crew were in the water, less than 4 minutes had elapsed. The yacht had listed over about 45–50° and grounded in the mud, visibly down by the stern (see figure 5). About 1247, automatic identification system data showed the vessel at a speed of 0.1 knots, crossing the 12-foot-depth contour in the West River. Figure 5. The Lovebug at 1238:48 and 1241:45, shortly after the owner and crew abandoned the vessel. (Source: Lovebug owner) Nearby Good Samaritan vessels rescued the crew and owner; Coast Guard personnel later evaluated them for injuries. One crewmember had a minor injury. For 16 days, the partially sunken yacht remained in the West River while salvage plans and logistics were coordinated. Salvage operations began on August 13. The vessel’s aftmost spaces on its lower deck were a garage that housed watercraft and a technical area for vessel electrical and mechanical systems on the", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 7 indication of a potential source of water ingress on the interior or exterior of the vessel. Extensive damage and debris throughout the vessel prevented investigators from examining some smaller spaces. The marine surveyor’s report stated, “due to the post casualty condition of the vessel it is impossible to determine the pre-loss condition.” The report also noted that the vessel had passed a class inspection the month before the casualty. 3 Damage to the vessel was estimated at $8 million. 3 Bureau Veritas was the class society responsible for Lovebug’s survey. The most recent survey took place on July 19, 2024, and included annual surveys of the hull, structure, machinery, and load line. Surveyors commented that there were no damages on the accessible parts of the hull, machinery alarms were audible throughout vessel, and no substantial corrosion areas had been identified during", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug On July 27, 2024, about 1235 local time, the yacht Lovebug was transiting the Chesapeake Bay in the West River north of Shady Side, Maryland, when the vessel started listing heavily to starboard (see figure 1 and figure 2). 1 The four crewmembers and one owner on board abandoned the vessel and were rescued by nearby vessel crews. The yacht partially sank in about 12 feet of water. There was one minor injury. An oil sheen, visible around the vessel, was contained with a boom. Damage to the vessel was estimated at $8 million. 2 Figure 1. The partially sunken Lovebug on July 27, 2024, at 1342. (Source: Maryland Natural Resources Police) 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM053). July 15, 2025 MIR-25-29", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 4 About 1235, when the yacht was near the West River Entrance Light 2, the captain noticed the Lovebug had developed a starboard list (see figure 4). He checked the steering, rudder indicators, and stabilizers o n the bridge and found no problems. The captain told investigators that, when the vessel first began listing, he did not hear any alarms. The list rapidly increased. According to the captain, about a minute after the vessel started listing, the vessel, which had been powered by its starboard generator, lost power. The captain backed off the throttles, and the vessel’s speed dropped to about 4 knots. Figure 4. The Lovebug’s track from the approximate area the vessel first was observed listing to its final position. (Background source: National Oceanic and Atmospheric Administration Electronic Navigation Chart US5MD1LC as viewed on Made Smart automatic identification system)", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-ed303fabf6", "answerable": true, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "Persons on board 9 Injuries None Property damage $2 million est.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre On May 13, 2024, about 1657 local time, the towing vessel Baylor J. Tregre was towing the ocean barge MARMAC 27 in the Gulf of America, about 23 miles south of Galveston, Texas, when the towing vessel capsized and sank (see figure 1 and figure 2). 1 All four crewmembers abandoned the vessel and were rescued by the US Coast Guard. One crewmember sustained minor injuries. There was no pollution reported. Damage to the towing vessel was estimated at $2 million. 2 Figure 1. Left to right: Towing vessel Baylor J. Tregre at unknown date, and ocean barge MARMAC 27 after the casualty. (Source: Trinity Towing LLC) 1 In this report, all times are central daylight time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM038). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "J Studdert were rescued by a nearby vessel; four crewmembers sustained minor injuries. The Patrick J Studdert was considered a total constructive loss valued at over $2.3 million. The Clara B sustained minor damage to its hull, estimated at $250,000 to repair. The National Transportation Safety Board determines that the probable cause of the collision between the bulk carrier Clara B and towing vessel Patrick J Studdert and subsequent sinking of the Patrick J Studdert was the Patrick J Studdert captain’s distraction due to his cell phone use, which resulted in him not maintaining a proper lookout and navigating the towing vessel directly into the path of the upbound Clara B. MIR-25-26 DCA24FM033 2024 Collision of William B Klunk Tow with Moored Barges On April 17, 2024, about 1655 local time, the towing vessel William B Klunk was pushing 22 barges downbound on the Lower Mississippi River at mile 227, near Baton Rouge, Louisiana, when the tow collided with", "spans": []}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}], "answer": "The estimated repair bill for both the **Baylor J. Tregre** and the **Chad Pregracke tow** is **$2 million**.\n\n- **Baylor J. Tregre**: There were **four crewmembers** aboard. All four were rescued, and one sustained minor injuries.\n- **Chad Pregracke tow**: There were **35 people** aboard (the towing vessel and the 34 barges). No injuries were reported.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e27ac099ee", "answerable": false, "question": "What did the NTSB determine caused the fishing vessel Northern Halcyon to capsize while hauling crab pots in the Bering Sea in 2025?", "expected_answer": "The reports do not cover a capsizing of a fishing vessel named Northern Halcyon; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2536.pdf", "text": "Hull Failure and Implosion of Submersible Titan MIR-25-36 79 Casualty Summary NTSB casualty category Flooding/Hull Failure Location North Atlantic Ocean, 900 nm east of Cape Cod, Massachusetts 41°43.98’ N, 49°59.9’ W Date June 18, 2023 Time 1047 Newfoundland and Labrador daylight time (coordinated universal time –2.5 hours) Injuries 5 fatal Property damage $5.6 million CAD (about $ 4.2 million USD) est. Environmental damage None Persons on board 5 NTSB investigators worked closely with our counterparts from Coast Guard Office of Investigations and Analysis throughout this investigation. The NTSB is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in the other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine the probable causes of the accidents and events we", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN On July 24, 2025, about 0900 local time, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the two crewmembers aboard were hauling lobster traps in the Gulf of Maine near Mount Desert Rock, Maine (see figure 1 and figure 2). 1 The captain of the vessel attempted to put out the fire but was unsuccessful. Both crewmembers abandoned the vessel, which burned to the waterline and sank. There were no injuries, and no pollution was reported. The vessel was a total loss, with damages estimated at $717,500. Figure 1. GITN’R DUN moored on May 29, 2025. (Source: US Coast Guard) 1 (a) In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles), unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM051). July 23, 2026 MIR-26-25", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-c63863d331", "answerable": true, "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "evidence": [{"doc_id": "MIR2525.pdf", "quote": "the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel.", "status": "retrieved"}, {"doc_id": "MIR2614.pdf", "quote": "Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2525.pdf", "text": "On July 13, 2023, about 0100, the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel. The two barges were made up abreast and bow to bow with the towboat. The captain, who was at the helm, told investigators he intended to back out with the barges and then shift position to make up to the aft end of the tow before proceeding outbound (see figure 3). Before the tow got underway, Vessel Traffic Service Houston/Galveston reported a 1.5-knot flood current. The captain later noted a 0.77-knot current setting the vessel down on the Figure 3. Duke tow departing the basin at 0120. The poles and section of the bridge contacted by the tow are circled. (Background source: Magnolia data as viewed on Rosepoint)", "spans": [[30, 249]]}, {"doc_id": "MIR2525.pdf", "text": "Contact of Duke Tow with Power Transmission Poles and Pelican Island Bridge MIR-25-25 6 2 Analysis On July 13, 2023, the towing vessel Duke, pushing two barges, was backing into the Galveston Ship Channel away from the Texas International Terminal when the tow contacted multiple power transmission poles, and the tug subsequently contacted the Pelican Island Causeway Bridge. The vessels, electrical infrastructure, and bridge together sustained estimated damages of $300,000. The Duke captain stated that he intended to back out with the barges made up abreast bow to bow with the towboat before flipping the barges around and proceeding outbound. He also stated that a bulk carrier moored to the end of the pier immediately east of the Texas International Terminal required him to back out fa rther than normal into the channel, and that he was focused on staying clear of the moored vessel while he was underway.", "spans": []}, {"doc_id": "MIR2614.pdf", "text": "3 Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process. The tow was oriented northerly, toward the Galveston Channel. The towboat was faced up to the rake end of the MMLP 322, with the MMLP 321 as the lead barge (see figure 4). Figure 4. Simplified diagram of the LCPL Phillip C George tow (scale approximate). The barges were identical, each measuring 297.5 feet long and 54 feet wide. The overall length of the tow was about 677 feet, and the deepest draft was 10 feet (the barges). The barges were made up to each other with a port and starboard coupling. Each coupling consisted of four steel wires and a fiber center line at the center kevels between the two barges. On board the Phillip C George were a captain and three other crewmembers. The captain explained she had decided to have the barges strung out (versus a breasted", "spans": [[2, 145]]}, {"doc_id": "MIR2614.pdf", "text": "Contact of LCPL Phillip C George Tow with Terminal Dolphin, MIR-26-14 Power Transmission Pole, and Pelican Island Bridge 4 Overhead electrical power transmission lines with a vertical clearance of 85 feet ran parallel to the causeway. The lines, which were owned by CenterPoint Energy, were supported by poles located in the water about 85 feet to the east side of the bridge. The Texas International Terminal (TXIT) was a liquid- and dry-bulk facility located on the south of the Galveston Channel, on Pelican Island. TXIT was comprised of three deep-draft vessel berths, three barge berths, and an east and west breakwater. A dolphin was located at the end of each breakwater, and the distance between the west and east breakwater dolphins was about 440 feet. 1.2 Event Sequence On the morning of May 15, 2024, the towing vessel LCPL Phillip C George was moored at TXIT, with two tank barges, MMLP 321 and MMLP 322, strung out. 3 Each", "spans": []}], "answer": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges, but the cargo they were carrying differed.\n\n- **The Duke**: The Duke was pushing two empty red-flagged barges. These barges were empty at the time of departure, as indicated by the context. There is no mention of the cargo being loaded on these barges when they left the terminal.\n\n- **The LCPL Phillip C George**: The LCPL Phillip C George was towing two tank barges, MMLP 321 and MMLP 322, which were each loaded with about 24,000 barrels of vacuum gas oil (VGO). VGO is a thick, heavy petroleum byproduct of the crude oil refinement process. The tow was oriented northerly, toward the Galveston Channel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-66a218dfdd", "answerable": true, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "status": "not_retrieved"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "status": "not_retrieved"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 13 the Scot Stuttgart, the fixed fire extinguishing system’s CO 2 capacity was designed to extinguish a fire in only one engine room, not both. 1.3.5 Postcasualty Actions by the Operating Company After the fire, the operating company identified an inconsistency in the fuel return piping system on a vessel built similarly to the Scot Stuttgart. Like the Scot Stuttgart, the fuel return piping from the port and starboard auxiliary diesel generators on the similarly built vessel did not have a check valve installed in the piping at the top of the day tanks. Other vessels in the fleet with similar diesel oil systems had check valves. The operating company installed check valves at these locations on the Scot Stuttgart and the other similarly built vessel identified without a check valve. The operating company also updated the lock-out/tag-out procedures to", "spans": []}, {"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 14 2 Analysis On May 17, 2025, while offloading cargo at Puerto Nuevo Terminals in San Juan, a fire broke out in the port engine room aboard the tank vessel Scot Stuttgart. 2.1 Use of Fixed Fire Extinguishing System After discovering thick, white smoke coming from the open door of the port engine room into the engine control room, the crew stopped cargo operations. They shut down the port main engine, remotely stopped all fuel pumps, secured ventilation, shut the ventilation dampers, and stopped electrical power for the port engine room. Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space. While awaiting the arrival of local firefighters, the ship’s crew set up boundary cooling of the port engine room using vessel fire hoses", "spans": [[609, 801]]}, {"doc_id": "MIR2629.pdf", "text": "pressurized by the ship’s fire pump. When shoreside firefighters arrived about 40 minutes later, the ship’s crew reported that there were no elevated heat readings outside the port engine room (as measured using handheld infrared thermometers). The incident commander requested permission from the master for firefighters to open the space and investigate the source of the fire, and the master granted it. When firefighters entered the port engine room, thick smoke was still present. Fixed fire extinguishing systems are typically designed to release a calculated amount of CO 2 into a space to ensure that the CO 2 adequately smothers any fire. The Scot Stuttgart’s system was designed to release all 14 bottles of CO 2 for a fire in the port engine room. The presence of smoldering fire when the firefighters unsealed the space indicates that releasing only half of the system’s CO 2 may not have been as", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 10 2 Analysis On July 24, 2025, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the crew was hauling lobster traps near Mount Desert Rock, Maine. The fire resulted in the total loss of the vessel. After smelling burning fiberglass, the captain discovered flames and light gray smoke in the engine compartment, aft on the vessel. The engine compartment contained multiple potential heat and ignition sources, including main engine exhaust components, high pressure hydraulic equipment that was operational at the time of the fire, electrical systems, batteries, and combustible materials. However, because the GITN’R DUN burned to the waterline, subsequently sank, and was not salvaged, investigators were unable to access and inspect the vessel to determine the exact ignition source. Before the captain detected the smell of burning fiberglass, there were no", "spans": []}], "answer": "The **Scot Stuttgart** had a built-in system for flooding its machinery space with an extinguishing agent, while the **GITN’R DUN** did not.\n\n### Scot Stuttgart:\n- **Built-in System**: The **Scot Stuttgart** was equipped with a **fixed fire extinguishing system** that used **CO₂** (carbon dioxide) to suppress fires in its engine rooms.\n- **What the Crew Used**: When the fire broke out in the **port engine room**, the crew **manually released half (7 of 14) of the CO₂ bottles** from the fixed fire extinguishing system to suppress the fire. They also set up **boundary cooling** using **vessel fire hoses pressurized by the ship’s fire pump**. However, the presence of thick smoke when firefighters entered the space suggested that the partial release of CO₂ may not have fully extinguished the fire.\n\n### GITN’R DUN:\n- **Built-in System**: The **GITN’R DUN** did **not** have a built-in fixed fire extinguishing system for flooding its machinery space with an extinguishing agent.\n- **What the Crew Used**: The crew of the **GITN’R DUN** did not have a fixed fire extinguishing system to combat the fire. The vessel burned to the waterline and sank, so it is unclear what methods, if any, were used to fight the blaze. However, it is likely that the crew attempted to use **available onboard firefighting equipment**, such as **fire extinguishers** or **water**, but these were not sufficient to prevent the total loss of the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-eef70496b1", "answerable": true, "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "evidence": [{"doc_id": "MIR2539.pdf", "quote": "Time 1435 eastern daylight time", "status": "retrieved"}, {"doc_id": "MIR2539.pdf", "quote": "morning twilight 0718, sunrise 0743", "status": "retrieved"}], "passages": [{"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredging Vessel Stuyvesant On November 2, 2024, about 1435 local time, the dredging vessel Stuyvesant, with a crew of 22, was holding station in the St. Johns River, near Jacksonville, Florida, when a fire broke out in the engine room (see figure 1 and figure 2). 1 Two crewmembers were in the machinery control room when the fire started: one escaped, and the other was removed by the shipboard emergency squad and later pronounced dead at a local hospital. After reporting no active fire and removing the crewmember, the crew verified that the engine room was sealed and released the fixed gas fire extinguishing system. No pollution was reported. Damage to the vessel was estimated at $18 million. 2 Figure 1. Stuyvesant underway in 2022. (Source: The Dutra Group) 1 In this report, all times are eastern daylight time, and all miles are statute miles. 2", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 2 Casualty Summary NTSB casualty category Fire/Explosion Location St. Johns River, Jacksonville, Florida 30° 24.009'N, 81° 24.02'W Date November 2, 2024 Time 1435 eastern daylight time (coordinated universal time –4 hrs) Persons on board 24 (22 crew, 2 observers) Injuries 1 fatal Property damage $18 million est. Environmental damage None Weather Visibility 10 mi, overcast, winds 13 kts, air temperature 83° F, morning twilight 0718, sunrise 0743 Waterway information River; depth about 47 feet Figure 2. Area where the fire broke out aboard the Stuyvesant, as indicated by a circled X. (Background source: Google Maps)", "spans": [[212, 243], [472, 507]]}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 15 2 Analysis On November 2, 2024, while the dredging vessel Stuyvesant was holding station in the St. Johns River near Jacksonville, a fire broke out in the engine room. Crewmembers had just completed maintenance on the port auxiliary engine which included replacing the fuel and lube oil filters and the lube oil in the sump. Once the work was complete, the first engineer started the engine remotely from the MCR, and less than a minute later, engineering crewmembers saw flames in the engine room. After the fire, investigators found that the crew had not reinstalled the plug on the engine’s lube oil filter housing after completing maintenance. Without the plug reinstalled on the lube oil filter housing, pressurized lube oil would have sprayed out from the port auxiliary engine through the internally threaded port at the top of the lube oil filter housing when the engine was started.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 13 The engine manufacturer instructed a thorough walk-around inspection before starting the engine, looking for oil or coolant leaks, loose bolts, and trash buildup. There were specific instructions for inspection of the air inlet system, cooling system, driven equipment, electrical system, fuel system, lubrication system, and the starting system. The last time this maintenance was performed was on July 6, 2024, when the engine had 4,023 running hours. The next scheduled maintenance was due when the engine had 5,023 running hours. At the time of the casualty, the engine had 5,747 running hours. The lock out/tagout log was kept electronically on a tablet in the MCR. Data from the engine room tablet could not be accessed after the fire. 1.3.4 Engineering Crew The chief engineer had worked aboard the Stuyvesant since 1999, in all credentialed positions.", "spans": []}], "answer": "The sun rose over the St. Johns River at 0743 eastern daylight time (EDT), and the fire broke out in the Stuyvesant's engine room at 1435 EDT. \n\nTo calculate the time difference, subtract 0743 from 1435:\n\n- From 0743 to 1400 is 6 hours and 17 minutes.\n- From 1400 to 1435 is 35 minutes.\n\nThus, the flames broke out approximately **6 hours and 52 minutes** after sunrise.", "judges": ["groundedness", "refusal"]}, {"key": "t-df94ac4721", "answerable": true, "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "evidence": [{"doc_id": "MIR2544.pdf", "quote": "Casualty type Flooding/Hull Failure", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole On June 12, 2024, about 1530 local time, the towing vessel Cajole was upbound the Lower Mississippi River near Waggaman, Louisiana, when the vessel began flooding (see figure 1 and figure 2). 1 The two crewmembers aboard attempted to pump out the vessel but were unsuccessful. They tied off to a nearby barge and evacuated to a Good Samaritan vessel. The Cajole later sank. There were no injuries, and a sheen was reported. Damage was estimated at $2 million. Figure 1. Cajole underway on an unknown date before the sinking. (Source: marinetraffic.com, Mark Haury) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM046). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-44", "spans": []}], "answer": "The loss of the towboat Cajole was caused by flooding.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-751cb5b989", "answerable": true, "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "The chief engineer closed the quick-closing valves to the engines (stopping fuel supply to them), and the fire team shut down all ventilation fans, fire dampers, and watertight and fire screen doors, and prepared fire hoses.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "At 0741, the vessel’s fire team that entered the engine room reported that there was no fire in the engine room; t he team only observed black smoke.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "Crewmembers boarded the barge, shut all doors and ventilation dampers to the unloading generator space, started the tug’s fire pump, and began boundary cooling on the exterior bulkheads and deck above the unloading generator.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "he released carbon dioxide into the unloading generator space about 1630.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 15 2 Analysis While the passenger vessel Ocean Navigator was docked in Portland, Maine, the vessel experienced a catastrophic engine failure of the no. 2 auxiliary diesel engine, which resulted in an engine room fire. The crew quickly sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to effectively starve the fire of fuel and oxygen, which prevented the spread of the fire. Ultimately, the fire self-extinguished. Additionally, within a few minutes of the fire, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations. The Ocean Navigator crewmembers followed company procedures to muster all passengers and evacuate them from the vessel without injury. Therefore, the crew’s", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 5 sure of the operating status of the supply fan for the unloading generator space. He believed it was either running at slow speed or not running before the time of the fire. The first mate and another crewmember, wearing self-contained breathing apparatus, entered the unloading generator space from the port side with two portable fire extinguishers and reported very heavy smoke. They retreated from the space, securing the door as they exited. The chief engineer announced that he was preparing to release the fixed carbon dioxide fire extinguishing system; he released carbon dioxide into the unloading generator space about 1630. The captain notified the US Coast Guard and company of the fire. Crewmembers set watches and used an infrared thermometer to monitor bulkhead temperatures, which declined through the night. About 0730 the following morning,", "spans": [[644, 717]]}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 11 2 Analysis On December 30, 2024, while the ATB Dorothy Ann/Pathfinder was anchored in Lake Erie, the diesel generator engine on the Pathfinder suffered a catastrophic failure, which resulted in a fire in the barge’s unloading electrical generator space. The crew sealed the space and released the vessel’s fixed gas fire extinguishing system, putting out the fire. The most severe fire damage was about 5–10 feet from the damaged engine block near the no. 9 connecting rod, where internal components had forcefully exited the engine. In the 4 minutes leading up to the discovery of the fire at 1609, the engine control room machinery automation system recorded a decrease of lube oil pressure while the engine was running at rated speed (1,800 rpm). The engine stopped at 1609:30. This loss of pressure (from 58–47 psi) was not severe enough to", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 7 throughout the vessel. The passengers and crew proceeded to their muster stations. The captain notified the operating company’s designated person ashore who, in turn notified the company’s qualified individual, their dedicated salvage and marine firefighting contractor, and the corporate crisis team. 4 About 0718, crewmembers removed the injured motorman from the Ocean Navigator, and at 0721, after receiving permission from the captain, the first fire team entered the engine room—wearing self-contained breathing apparatus—to assess the fire. About 0730, the local shoreside fire department arrived at the vessel. About this time, the captain received the report from the muster station team leaders that all passengers were accounted for at both muster stations. At 0731, the captain directed the passengers and non-essential crew to evacuate the Ocean Navigator to the pier", "spans": []}], "answer": "The Ocean Navigator crew sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to starve the fire of fuel and oxygen, which prevented its spread. The fire self-extinguished. \n\nFor the barge Pathfinder, the crew sealed the unloading generator space and released the vessel’s fixed gas fire extinguishing system, which put out the fire.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-c2caf6c9fe", "answerable": true, "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "evidence": [{"doc_id": "MIR2522.pdf", "quote": "The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff.", "status": "partly"}, {"doc_id": "MIR2522.pdf", "quote": "Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel.", "status": "retrieved"}, {"doc_id": "MIR2522.pdf", "quote": "About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2522.pdf", "text": "engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff. The deckhand reported 6 –8 inches of water on the aft deck as they boarded the skiff. Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel. About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand. Once the Cape Douglas crew was aboard, the Red Sky captain notified the US Coast Guard. The captain and deckhand remained on scene aboard the Red Sky, and, about 40 minutes later, they witnessed the Cape Douglas sink by the port stern. The deckhand noted that, as the “upper deck corner” (near the port quarter of the vessel) went underwater, the Cape Douglas “rolled on its side” before sinking. Shortly after, the Red Sky returned to Kodiak and dropped off the captain and deckhand.", "spans": [[0, 193], [280, 366], [367, 453]]}], "answer": "After judging the engine room water to be coming in quickly, the captain and deckhand donned survival suits and got into the vessel’s towed skiff. They were picked up by the Red Sky approximately 40 minutes after the 1315 decision to abandon the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-7fbfd5a91b", "answerable": true, "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "causing components, such as the no. 13 connecting rod and the crankshaft, to seize together and fail by welding themselves to the journal.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders.", "status": "retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "causing components, such as the no. 9 connecting rod and the crankshaft, to seize together at the journal and fail.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "the fire originated on the starboard side of the unloading generator engine when the engine block ruptured in the area of the no. 9 connecting rod", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 8 Coast Guard also requested assistance from a Bureau of Alcohol, Tobacco, Firearms and Explosives certified fire investigator, who participated in the examination of the damage. Investigators found that the no. 2 auxiliary engine was damaged beyond repair: the engine block, crankshaft, two connecting rods, counterweights, and other parts of the rotating assembly were damaged (see figure 5). Figure 5. Damaged no. 2 auxiliary generator aboard Ocean Navigator after the engine failure. The circled area identifies the location of the engine block damage. Investigators noted a hole about 10 inches high and 16 inches wide on the inboard side of the engine block in the area of the nos. 12 and 14 cylinders where the lower portion of the no. 13 connecting rod had been ejected (see figure 6). This area was located on the lower part of the engine near the deck plates between the two", "spans": [[806, 842]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 16 crankshaft. Parts from the disconnected connecting rod collided chaotically as the crankshaft continued to turn, damaging other engine components until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders. Therefore, it is likely that debris entrained in the lube oil system of the no. 2 auxiliary engine led to the catastrophic damage to the engine. As a result of the block rupturing, hot, atomized lube oil vented through the damaged inspection covers and ignited off hot components internal to the engine. The engineering logbooks for the vessel showed that, in the 2 months before the engine failure, crewmembers added lube oil to the no. 2 auxiliary engine (37 gallons in September and 42 gallons in October). In comparison, the crew added", "spans": [[231, 365]]}, {"
