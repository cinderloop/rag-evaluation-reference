d": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 5 vessel Stacy McCune, bound upriver, entered the northern McAlpine Lock chamber at 1526, and the lock chamber began to fill at 1540. At 1543, the Amber Brittany tow passed through the Louisville and Indiana (L&I) Railroad Bridge. At 1547, automatic identification system (AIS) data showed that the heading of the Amber Brittany tow altered appreciably to port as the tow exited the upstream end of the canal. At 1548, the tow’s course over ground also altered significantly to port as it began to be set off the sailing line and toward the vane d ike. According to the pilot’s statement, an outdraft current set the tow toward the vane dike. He attempted to counter the set but was unsuccessful. Realizing that the tow was going to contact the vane dike, he then attempted to land the tow as softly as possible, “ in the hopes of minimizing any damage.”", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}], "answer": "The documents indicate that the Amber Brittany tow started wandering off its intended path approximately 3 minutes before impact, as the AIS data showed a significant change in heading to port around 1547, and the tow's course over ground altered significantly to port at 1548. The pilot reported that an outdraft current set the tow toward the vane dike and that he attempted to counter the set but was unsuccessful. \n\nFor the Schweiger, the vessel started wandering off its intended path about 3 minutes before impact, as the AIS track showed a deliberate course change from the 306° leg to the 284° leg on the red (right) side of the Baker Bay West Channel about 1233:47. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1ee1d030cd", "answerable": true, "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "evidence": [{"doc_id": "MIR2501.pdf", "quote": "At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the lock.", "status": "partly"}, {"doc_id": "MIR2508.pdf", "quote": "at a speed of 0.35 mph, the starboard quarter of the starboard barge (EMS 348) contacted the wooden fendering of the transfer platform at dolphin no. 3", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 8 About 1804, the Kitty stopped moving astern and the vessel was outside of the open gates, with the stern of EMS 383 (the aft barge) abeam of the open lock gates. The captain put the engines in reverse in anticipation of water surging back into the lock; he estimated the water level in the lock had dropped about 3 to 4 feet. Less than a minute later, the Kitty tow started to advance ahead even though the engines were in reverse. By 1806, the Kitty tow was advancing ahead at 0.7 mph and increasing in speed. The captain moved propulsion astern on all engines to arrest the increase in speed. Seeing that the tow was still advancing ahead, the captain moved all main engine propulsion levers to full astern, but there was no effect on the tow’s advance. He instructed the steersman to look at the wheel (propeller) wash, and the steersman confirmed that the engines were in reverse. At the head of the tow, the deckhand", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 6 About 1741, the Kitty tow entered the forebay at about 4 mph. A deckhand and tankerman prepared lines and bumpers for entering the lock and then moved to the head of the tow. As the head of the tow neared the lock entrance, the captain reduced the speed of the tow, and, about 1749, the head of the tow began to enter through the open lock gates (A and B) at 2 mph. The captain looked at the automatic identification system information displayed on the vessel’s electronic chart system and saw ships—the 587-foot-long tanker Garden State and, about 1.5 miles astern, the 820-foot-long tanker SKS Darent—transiting southbound on the Mississippi River toward the Algiers Lock forebay entrance (see figure 6). About 1752, the Garden State began to pass the mouth of the forebay at 13.5 knots (15.5 mph); the vessel was about 1,065 yards away from the open lock gates.", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 7 About 1758, the second southbound tanker, the SKS Darent, passed the Algiers Lock forebay at 13.8 knots (15.9 mph); the vessel was about 950 yards away from the open lock gates. At 1759, the Kitty tow, fully within the lock chamber, had stopped moving. The deckhand was calling the distance to come ahead to the red pin via radio. The captain tried to ease the tow further ahead, but the Kitty tow began to move aft. The captain saw water “coming out” of the lock and that the water was “ pulling” the Kitty tow aft out of the lock chamber (toward the Mississippi River). At 1800, the Kitty tow was moving 0.6 mph astern, and the captain came ahead slow on all engines to counteract the tow’s movement (see figure 7). He stated over the Algiers Lock radio frequency that the passing ships were “sucking the water out at Algiers.” At 1801, the Kitty tow was still moving astern, now at 2 mph, despite", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "placed a line on a red pin once it was within reach and tied it off, but the line broke as the tow continued moving ahead. The deckhand placed another line on the pin, and that line broke as well. The deckhand told the captain via radio that the Kitty was “coming in hot.” According to the captain, when the Kitty tow was about 100 feet from the closed lock gates, the vessel was moving about 2 mph ahead. Over the radio, the lock hand announced that the tow was approaching too fast and told the captain to slow down. The captain replied, “Algiers, I’m backing on everything. The [expletive] waters’ coming back in from the [expletive] ships. I can’t get it to stop. I got everything hooked up.” At the bow of the lead barge, the deckhand saw that the tow was going to hit the closed lock gate and walked aft on the barge to safety. At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the", "spans": [[834, 940]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-218047a23b", "answerable": true, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "status": "not_retrieved"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "status": "partly"}], "passages": [{"doc_id": "MIR2615.pdf", "text": "and push gear system and an inspection of the engine room and bilges. He notified the mate on watch that he was going to head to the galley to start preparations for the evening meal, which he routinely performed as part of his duties. About 1624, according to recorded Rose Point data, the Mackenzie Rose tow was centered in the Elizabeth River channel and proceeding through t he South Norfolk Jordan Bridge with a course over ground of 020°, a speed over ground of 4.8 knots, and no rate of turn. About a minute later, about 1625, the vessel and tow passed successfully through the South Norfolk Jordan Bridge. The mate told investigators that, after the 3 The marine autopilot system on board the Mackenzie Rose was designed to hold the vessel’s heading, which was set by the operator. It did not have the capability to automatically steer a course, nor did it account for set or drift.", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "Contact of Tank Vessel Hafnia Amessi with Pier MIR-25-11 21 the risks associated with bank effect and current. If the Hafnia Amessi had approached the turn on to Range C in the relatively open water to starboard, the bank effect on the vessel’s port side would have been minimized, and the vessel would have been better positioned to handle the oncoming flood current. To prepare for the Hafnia Amessi’s transit, the pilot ordered the tugboat Diane Moran to escort the tanker down the Cooper River. The pilot stated that this order was a direct consequence of what he had learned from studying the Bow Triumph casualty. When it became apparent that the Hafnia Amessi was not responding to rudder and engine orders as the pilot anticipated and was in danger of striking Pier B, the pilot directed the Diane Moran to push on the tanker’s bow. According to the pilot, the ship’s rate of turn did not increase until the tugboat began", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "the Hafnia Amessi’s drafts were 21.3 feet forward and 26.3 feet aft. Beginning the transit down the Cooper River, the CBPA pilot ordered dead slow ahead, followed by slow ahead. According to the Hafnia Amessi’s pilot card, slow ahead corresponded to 9.0 knots of speed when the tanker was in ballast in open water with no current. At 1000, the vessel entered the Joint Base Charleston Channel (referred to as the JBC Channel in US Army Corps of Engineers documents), 0.5 miles downriver from the INEOS terminal. Shortly after entering the channel, the Hafnia Amessi encountered a bend to port, onto the section of the river containing Range F (see figure 2). The pilot stated that, as the vessel rounded the bend, he noticed “an exceptional amount of tidal current on buoy number 80,” which was a navigation aid on the inside of the bend. He said, “[the current] reduced my speed to less than 5 knots, and in all my years working down here, I’ve never seen a wake on a buoy at", "spans": []}, {"doc_id": "MIR2615.pdf", "text": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge MIR-26-15 17 2 Analysis The towing vessel Mackenzie Rose was pushing the loaded deck barge Weeks 281 ahead, outbound in the southern branch of the Elizabeth River when the tow veered to port and struck the Norfolk and Portsmouth Belt Line Railroad Bridge. At the time of the casualty, there was minimal current, and wind conditions were calm. According to the mate, as the tow transited outbound in the Elizabeth River, he navigated using autopilot by using the rotary knob to increase or decrease the heading setpoint. (There were no company policies that prevented the Mackenzie Rose mate from steering in autopilot while transiting the Elizabeth River.) The mate told investigators that, when the tow got close to the railroad bridge, the autopilot “tripped” without alarming, and he lost steering without realizing it. Based", "spans": [[35, 83], [286, 338]]}], "answer": "The Mackenzie Rose tow was under way longer before hitting the structure compared to the Hafnia Amessi. The Mackenzie Rose tow veered to port and struck the Norfolk and Portsmouth Belt Line Railroad Bridge, with the incident occurring as the tow was transiting outbound in the Elizabeth River. The Hafnia Amessi struck Pier B during its transit down the Cooper River. While the exact time difference is not specified, the Mackenzie Rose tow's incident occurred after the vessel had been underway for a significant portion of its journey, indicating a longer period under way before the collision.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-3a2a4226a5", "answerable": true, "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "evidence": [{"doc_id": "MIR2539.pdf", "quote": "Time 1435 eastern daylight time", "status": "retrieved"}, {"doc_id": "MIR2539.pdf", "quote": "morning twilight 0718, sunrise 0743", "status": "retrieved"}], "passages": [{"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredging Vessel Stuyvesant On November 2, 2024, about 1435 local time, the dredging vessel Stuyvesant, with a crew of 22, was holding station in the St. Johns River, near Jacksonville, Florida, when a fire broke out in the engine room (see figure 1 and figure 2). 1 Two crewmembers were in the machinery control room when the fire started: one escaped, and the other was removed by the shipboard emergency squad and later pronounced dead at a local hospital. After reporting no active fire and removing the crewmember, the crew verified that the engine room was sealed and released the fixed gas fire extinguishing system. No pollution was reported. Damage to the vessel was estimated at $18 million. 2 Figure 1. Stuyvesant underway in 2022. (Source: The Dutra Group) 1 In this report, all times are eastern daylight time, and all miles are statute miles. 2", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 2 Casualty Summary NTSB casualty category Fire/Explosion Location St. Johns River, Jacksonville, Florida 30° 24.009'N, 81° 24.02'W Date November 2, 2024 Time 1435 eastern daylight time (coordinated universal time –4 hrs) Persons on board 24 (22 crew, 2 observers) Injuries 1 fatal Property damage $18 million est. Environmental damage None Weather Visibility 10 mi, overcast, winds 13 kts, air temperature 83° F, morning twilight 0718, sunrise 0743 Waterway information River; depth about 47 feet Figure 2. Area where the fire broke out aboard the Stuyvesant, as indicated by a circled X. (Background source: Google Maps)", "spans": [[212, 243], [472, 507]]}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 15 2 Analysis On November 2, 2024, while the dredging vessel Stuyvesant was holding station in the St. Johns River near Jacksonville, a fire broke out in the engine room. Crewmembers had just completed maintenance on the port auxiliary engine which included replacing the fuel and lube oil filters and the lube oil in the sump. Once the work was complete, the first engineer started the engine remotely from the MCR, and less than a minute later, engineering crewmembers saw flames in the engine room. After the fire, investigators found that the crew had not reinstalled the plug on the engine’s lube oil filter housing after completing maintenance. Without the plug reinstalled on the lube oil filter housing, pressurized lube oil would have sprayed out from the port auxiliary engine through the internally threaded port at the top of the lube oil filter housing when the engine was started.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 13 The engine manufacturer instructed a thorough walk-around inspection before starting the engine, looking for oil or coolant leaks, loose bolts, and trash buildup. There were specific instructions for inspection of the air inlet system, cooling system, driven equipment, electrical system, fuel system, lubrication system, and the starting system. The last time this maintenance was performed was on July 6, 2024, when the engine had 4,023 running hours. The next scheduled maintenance was due when the engine had 5,023 running hours. At the time of the casualty, the engine had 5,747 running hours. The lock out/tagout log was kept electronically on a tablet in the MCR. Data from the engine room tablet could not be accessed after the fire. 1.3.4 Engineering Crew The chief engineer had worked aboard the Stuyvesant since 1999, in all credentialed positions.", "spans": []}], "answer": "The sun rose over the St. Johns River at 0743 eastern daylight time, and the fire broke out at 1435 eastern daylight time. Therefore, the flames broke out approximately 6 hours and 52 minutes after sunrise.", "judges": ["groundedness", "correctness", "refusal"]}]};
const KEY = "judge-labels-" + DATA.traces_sha256;
const STATUS = {retrieved:"retrieved", partly:"partly retrieved", not_retrieved:"not retrieved"};
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} progress(); }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function cur(item){ if(!state[item.key]) state[item.key]={marks:{},note:""}; return state[item.key]; }
function done(item){ const s=cur(item); return item.judges.every(j=>s.marks[j]); }
function progress(){
  const total=DATA.items.reduce((n,i)=>n+i.judges.length,0);
  const marked=DATA.items.reduce((n,i)=>n+i.judges.filter(j=>cur(i).marks[j]).length,0);
  document.getElementById("progress").textContent = marked + " / " + total + " marks";
}
function marked(p){ let out="", at=0; for(const [a,b] of p.spans){ out+=esc(p.text.slice(at,a))+"<mark>"+esc(p.text.slice(a,b))+"</mark>"; at=b; }
  return out+esc(p.text.slice(at)); }
function render(){
  const list=document.getElementById("list");
  DATA.items.forEach((item,n)=>{
    const s=cur(item); const card=document.createElement("section");
    card.className="card "+(done(item)?"done":"");
    const ev=item.evidence.map(e=>`<div class="box"><b>${esc(e.doc_id)}</b> <span class="s-${e.status}">[${STATUS[e.status]}]</span> ${esc(e.quote)}</div>`).join("");
    const ps=item.passages.map((p,i)=>`<div class="passage"><div class="meta">#${i+1} ${esc(p.doc_id)}</div>${marked(p)}</div>`).join("");
    const qs=item.judges.map(j=>`<div class="judge" data-j="${j}"><span class="q"><b>${esc(j)}</b>: ${esc(DATA.questions[j])}</span>
      ${["Pass","Fail","skip"].map(v=>`<button data-v="${v}" class="${s.marks[j]===v?"on":""}">${v==="skip"?"Skip":v}</button>`).join("")}</div>`).join("");
    card.innerHTML=`<div class="meta">${n+1}. ${esc(item.key)} · ${item.answerable?"answerable":"unanswerable"}</div>
      <h4>Question</h4><div class="box">${esc(item.question)}</div>
      <h4>Expected answer</h4><div class="box">${esc(item.expected_answer)}</div>
      ${ev?`<h4>Expected evidence</h4>${ev}`:""}
      <h4>Answer</h4><div class="box">${esc(item.answer)}</div>
      <details open><summary>Retrieved passages (${item.passages.length})</summary>${ps||'<div class="meta">None retrieved.</div>'}</details>
      ${qs}
      <h4>Note (optional)</h4><input type="text" data-n value="${esc(s.note)}">`;
    card.querySelectorAll(".judge").forEach(row=>{
      const j=row.dataset.j;
      row.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
        s.marks[j]=b.dataset.v;
        row.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
        card.className="card "+(done(item)?"done":""); save();
      }));
    });
    card.querySelector("[data-n]").addEventListener("input",e=>{s.note=e.target.value;save();});
    list.appendChild(card);
  });
  progress();
}
document.getElementById("download").addEventListener("click",()=>{
  const left=DATA.items.filter(i=>!done(i)).length;
  if(left && !confirm(left+" traces are not fully marked yet. Download anyway?")) return;
  const labels={}; for(const i of DATA.items){ const s=cur(i); const marks={};
    for(const j of i.judges) if(s.marks[j]) marks[j]=s.marks[j];
    if(Object.keys(marks).length) labels[i.key]={marks,note:s.note}; }
  const out={traces_sha256:DATA.traces_sha256,labels};
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
  a.download="judge-labels.json"; a.click();
});
render();
</script></body></html>
