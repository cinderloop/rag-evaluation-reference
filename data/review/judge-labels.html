rred to as the JBC Channel in US Army Corps of Engineers documents), 0.5 miles downriver from the INEOS terminal. Shortly after entering the channel, the Hafnia Amessi encountered a bend to port, onto the section of the river containing Range F (see figure 2). The pilot stated that, as the vessel rounded the bend, he noticed “an exceptional amount of tidal current on buoy number 80,” which was a navigation aid on the inside of the bend. He said, “[the current] reduced my speed to less than 5 knots, and in all my years working down here, I’ve never seen a wake on a buoy at", "spans": []}, {"doc_id": "MIR2615.pdf", "text": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge MIR-26-15 17 2 Analysis The towing vessel Mackenzie Rose was pushing the loaded deck barge Weeks 281 ahead, outbound in the southern branch of the Elizabeth River when the tow veered to port and struck the Norfolk and Portsmouth Belt Line Railroad Bridge. At the time of the casualty, there was minimal current, and wind conditions were calm. According to the mate, as the tow transited outbound in the Elizabeth River, he navigated using autopilot by using the rotary knob to increase or decrease the heading setpoint. (There were no company policies that prevented the Mackenzie Rose mate from steering in autopilot while transiting the Elizabeth River.) The mate told investigators that, when the tow got close to the railroad bridge, the autopilot “tripped” without alarming, and he lost steering without realizing it. Based", "spans": [[35, 83], [286, 338]]}], "answer": "The **Mackenzie Rose tow** was under way **longer** before hitting the structure compared to the **Hafnia Amessi** on the Cooper River. \n\n### Mackenzie Rose Tow:\n- The Mackenzie Rose tow was transiting the **Elizabeth River** outbound in the southern branch.\n- The tow veered to port and struck the **Norfolk and Portsmouth Belt Line Railroad Bridge**.\n- The mate reported that the **autopilot \"tripped\" without alarming**, and he **lost steering without realizing it**.\n- The incident occurred **about 1625**, as per the recorded Rose Point data, after the vessel and tow had passed through the **South Norfolk Jordan Bridge** at **about 1624**.\n\n### Hafnia Amessi:\n- The Hafnia Amessi was transiting the **Cooper River** and encountered a bend to port onto the section of the river containing **Range F**.\n- The pilot noted an **exceptional amount of tidal current** on buoy number 80, which reduced the vessel’s speed to **less than 5 knots**.\n- The pilot ordered the tugboat **Diane Moran** to escort the tanker, and the vessel was in danger of striking **Pier B** before the tugboat pushed on the tanker’s bow.\n- The exact time of the collision is not specified, but the incident occurred **after the vessel had entered the Joint Base Charleston Channel** at **1000**.\n\n### Summary:\n- The **Mackenzie Rose tow** was under way **approximately 1 hour and 25 minutes** before hitting the structure (from 1000 to 1625).\n- The **Hafnia Amessi** was under way **less than 1 hour** before the incident (from 1000 to the time of the collision, which is not precisely stated but likely occurred shortly after entering the channel).\n\nThus, the **Mackenzie Rose tow was under way about 1 hour and 25 minutes longer** than the **Hafnia Amessi** before hitting the structure.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1e67dc4dd7", "answerable": true, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "status": "not_retrieved"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direction. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. Because there were not enough immersion suits available for everyone, t he captain elected not to wear one. The crew attempted to stay on the stern deck of the vessel as long as possible before deploying the liferaft and entering the water. With the wheelhouse unattended, t he vessel’s heading changed, and smoke", "spans": [[599, 706]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8254cd6ea8", "answerable": true, "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "February 4, 2026 MIR-26-04 Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska", "status": "partly"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska 57°02.09’ N, 134°39.33’ W Date March 6, 2025 Time 1320 Alaska standard time (coordinated universal time –9 hrs) Persons on board 5 Injuries 1 minor Property damage $1.6 million Environmental damage None Weather Visibility 9 mi, overcast, winds east-southeast 12 kts, air temperature 44°F Waterway information Strait; width 4.5 nm, depth 1,571 ft Figure 2. Area where the Spicy Lady fire occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[0, 163]]}], "answer": "The March 2025 Spicy Lady casualty was categorized as a Fire/Explosion. It took place in the Chatham Strait, near Point Gardner, Alaska.", "judges": ["groundedness", "refusal"]}, {"key": "t-9b041b2ad5", "answerable": false, "question": "Why did the towboat Harlan Creek and its barges strike the lock wall at Markland Locks and Dam on the Ohio River in 2025?", "expected_answer": "The reports do not cover a contact by a tow of the Harlan Creek at Markland Locks and Dam; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 71 Report Investigation Year Title Summary Probable Cause MIR-25-14 DCA24FM025 2024 Contact of Amber Brittany Tow with Vane Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart. There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. The National Transportation Safety Board determines that the probable cause of the contact of the Amber Brittany tow with the vane dike was the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Va n e Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. 2 Figure 1. The Amber Brittany on July 28, 2022, before the contact. (Source: Matt Burks) 1 In this report, all times are eastern standard times, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM025). Use the CAROL Query to search investigations. April 4, 2025 MIR-25-14", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-dabe5c9f4a", "answerable": true, "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "evidence": [{"doc_id": "MIR2543.pdf", "quote": "when the towing vessel Steel Skipper, which was reconfiguring the tow, pushed the tow astern, and the William E Strait collided with two moored barges upstream at the Shell Norco Refinery dock, damaging the barges and dock", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2543.pdf", "text": "about 0210, he felt the vessel begin to move astern in the direction of the Shell Norco Refinery dock as the fleeting tug moved the last two barges into position at the head of the tow. The William E Strait’s engines were not engaged. The Steel Skipper finished its work about 0215, and, with the weather clearing, the mate then noticed “extra equipment tied off to [the] Shell dock. It appeared to be a barge that wasn’t lit well but a bit below [the] dock.” He walked to the stern to check that the towboat was clear. The mate got the William E Strait underway about 0300 and began heading downbound with 16 barges for the Gnots fleeting area at mile 118. A few days later, the Shell Norco Refinery discovered damage to the no. 3 dock and to the two barges moored there. A Shell Norco Refinery boat lift was also damaged. Damages were estimated at $1,000 for the Cajun Courage and CDB02 and $500,000 for the facility.", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 4 CORRECTED COPY three barges in two trips across the river to the Upper St. Rose fleeting area. Operations began at 0100, with the Steel Skipper taking one barge on the first trip, then the remaining two barges on the next trip (see figure 3). Figure 3. William E Strait towing arrangement on arrival and departure from mile 126. (Background source: William E Strait mate) Once the transfer of the 3 barges to the Upper St. Rose fleeting area was completed, the Steel Skipper began to reposition the remaining two barges in the starboard string to the newly created space in the center string (from the barges moved to the Upper St. Rose fleeting area) to create four strings of four barges each for the next leg of William E Strait’s voyage. The mate of the William E Strait said that,", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 5 CORRECTED COPY Using automatic identification system and vessel traffic service data, investigators found that, at the time the last two barges were pushed into place by the Steel Skipper, the William E Strait moved astern about 400 feet toward the moored crane and deck barges at the Shell Norco Refinery dock (see figure 4). Figure 4. William E Strait astern movement toward moored barges on December 10. (Background source: National Oceanic and Atmospheric Administration electronic navigation chart US5LA52M as viewed on Rosepoint)", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "The fleeting tug Steel Skipper was tasked with moving three barges from the William E Strait tow across the river from the Shell Norco Refinery dock to the Upper St. Rose fleeting area near mile 126 on the right descending bank. 3 The Steel Skipper operated with a crew of three—a captain and two deckhands. The Steel Skipper and William E Strait captains had agreed by radio that the Steel Skipper would take the 2 Cajun Industries LLC owned and operated the crane barge, which was built in 2010, and the deck barge, built in 2021. 3 The 68-foot-long fleeting towing vessel Steel Skipper was built in 2021 in Bayou La Batre, Alabama.", "spans": []}], "answer": "The assisting tug **Steel Skipper** was moving the last two barges into position at the head of the tow near the Shell Norco Refinery dock when the **William E Strait** ended up backing into the barges tied up at the Shell refinery pier near Norco. \n\nSpecifically, the Steel Skipper was pushing the last two barges into place at the dock as part of its task to reposition barges from the William E Strait tow. During this operation, the William E Strait moved astern (backward) about 400 feet toward the moored crane and deck barges at the Shell Norco Refinery dock, resulting in the collision.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0d0ac361c4", "answerable": true, "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Persons on board 17 (5 crewmembers and 12 passengers)", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 3 1 Factual Information On August 30, 2024, about 1900, the 51.6-foot-long charter fishing vessel Jig Strike departed from San Diego, California, with a crew of five (captain, second captain, two deckhands, and a cook). 2 The vessel had been chartered for a fishing trip lasting a day and a half, and 12 passengers were aboard. The vessel, which had a wood-framed and plywood hull with fiberglass (fiberglass-reinforced plastic) overlay, transited through the night toward Cortes Bank, located about 100 miles west of San Diego. The weather was calm at departure, but according to the captain, in the morning “ it started getting a little bumpy.” Winds were 12–15 knots with swells of 3–6 feet. The vessel arrived at Cortes Bank shortly before 0700 on August 31. The passengers fished at two different locations, but a fter the crew received word that", "spans": []}], "answer": "The total head count aboard the Jig Strike when it flooded off Cortes Bank was 17 people: 5 crew members and 12 paying customers.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b35e44a604", "answerable": true, "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "evidence": [{"doc_id": "MIR2525.pdf", "quote": "the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel.", "status": "retrieved"}, {"doc_id": "MIR2614.pdf", "quote": "Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2525.pdf", "text": "On July 13, 2023, about 0100, the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel. The two barges were made up abreast and bow to bow with the towboat. The captain, who was at the helm, told investigators he intended to back out with the barges and then shift position to make up to the aft end of the tow before proceeding outbound (see figure 3). Before the tow got underway, Vessel Traffic Service Houston/Galveston reported a 1.5-knot flood current. The captain later noted a 0.77-knot current setting the vessel down on the Figure 3. Duke tow departing the basin at 0120. The poles and section of the bridge contacted by the tow are circled. (Background source: Magnolia data as viewed on Rosepoint)", "spans": [[30, 249]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-014ad8c952", "answerable": true, "question": "According to the NTSB analysis, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank. Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in this case, the PTC 706 (center barge) had more freeboard than the adjacent barges, but the adjacent barges were not submerged. Therefore, it is more likely that the PTC 706’s freeboard was reduced by weight forward in the barge. This weight forward could have been", "spans": [[94, 361]]}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 4 and coal. The barges with soybeans and corn had covers over their cargo hoppers; the coal barges did not. At the head of the tow, the barges’ raked ends faced forward, while at the aft end of the tow, the Chad Pregracke was faced up to the barges’ raked ends. The PTC 706’s freeboard was about 30 inches, and the two other uncovered coal barges at the head of the tow had a freeboard of 30–31 inches. The covered barges at the head of the tow had varying freeboards: the port outermost barge (CH 0121) had 18 inches, the second tier barge from port (MTC 1379) had 30 inches, and the starboard outermost barge (CH 0132) had 24 inches. Figure 4. Tow diagram of the Chad Pregracke. Over the next day, the pilot and captain alternated navigational watches. The captain stood watch from 0515 to 1115 and 1715 to 2315, and the pilot stood watch", "spans": [[427, 449], [502, 524]]}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": [[112, 148], [316, 338]]}], "answer": "According to the NTSB analysis:\n\n1. **Number of Barges**: The towing vessel Chad Pregracke was pushing **34 loaded barges**, while the Baylor J. Tregre was towing **only one barge** (MARMAC 27). Therefore, the Chad Pregracke was pushing **33 more barges** than the Baylor J. Tregre.\n\n2. **Tow Arrangements**: The tow arrangements differed significantly:\n   - The **Chad Pregracke** was pushing a **long train of 34 barges** in a southbound direction on the Lower Mississippi River. The barges were arranged in a line with specific freeboard measurements, and the tow was organized with the Chad Pregracke at the stern facing the raked ends of the barges at the head of the tow.\n   - In contrast, the **Baylor J. Tregre** was towing a **single barge (MARMAC 27)** in a westerly direction along the coastline of Louisiana. The barge was positioned such that its raked end faced the towing vessel, and the towline was not to scale in the diagram provided.\n\nIn summary, the Chad Pregracke was managing a much larger and more complex tow of 34 barges, while the Baylor J. Tregre was towing a single barge, resulting in significantly different operational and navigational challenges.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1ad1e09d01", "answerable": false, "question": "What was the name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine?", "expected_answer": "The report does not give this detail; it says only that a tugboat was dispatched to recover the Three Girls, which was docked in Portland on August 14.", "evidence": [], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 9 The William Chadwick arrived in Portland at 1100 the following morning (August 12). The Three Girls remained afloat as the fire continued to smolder. The following day, a tugboat was dispatched to recover the Three Girls, and on August 14, the Three Girls was docked in Portland. The local fire department boarded the vessel and extinguished the fire using water and foam. 1.3 Additional Information 1.3.1 Damage After the fire was extinguished, National Transportation Safety Board and Coast Guard investigators boarded the Three Girls to inspect the damage. The Coast Guard also requested assistance from a local Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigator, who participated in the examination of the damage. The steel bulkheads, decks, and overhead of the wheelhouse displayed several areas of deck and bulkhead warpage, and all contents inside the wheelhouse", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls On August 11, 2024, about 2056 local time, while the fishing vessel Three Girls was engaged in fishing operations in the Gulf of Maine about 118 miles east-southeast of Portland, Maine, a fire broke out in the vessel’s engine room (see figure 1 and figure 2). 1 The five crewmembers and a National Marine Fisheries Service observer abandoned the burning vessel into a liferaft and were rescued by a US Coast Guard cutter crew that same evening. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $1.3 million. 2 Figure 1. Three Girls docked in Portland, Maine, on August 14, 2024, after the fire. 1 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM056). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 17 Vessel Particulars Vessel Three Girls Type Fishing (Fishing vessel) Owner/Operator Three Girls Fishing, LLC (Commercial) Flag United States Port of registry Portland, Maine Year built 1979 Official number 609865 (US) IMO number N/A Classification society N/A Length (overall) 81.6 ft (24.9 m) Breadth (max.) 24.0 ft (7.3 m) Draft (casualty) 11.0 ft (3.4 m) Tonnage 783 GRT Engine power; manufacturer 1 x 850 hp (634 kW); Caterpillar 3512 diesel engine NTSB investigators worked closely with our counterparts from Coast Guard Sector Northern New England throughout this investigation. The National Transportation Safety Board (NTSB) is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 2 Casualty Summary Casualty type Fire/Explosion Location Gulf of Maine, 118 nm east-southeast of Portland, Maine 43°07.37’ N, 67°58.78’ W Date August 11, 2024 Time 2056 eastern daylight time (coordinated universal time –4 hrs) Persons on board 6 Injuries None Property damage $1.3 million est. Environmental damage None Weather Visibility 10 nm, clear, winds southwest 10 kts, gusts 13 kts, seas 2–4 ft, air temperature 67° F, seawater temperature 63° F, sunset 2024, evening twilight 2102 Waterway information Ocean, depth about 450 ft (at casualty site) Figure 2. Area where the fire broke out aboard the fishing vessel Three Girls, as indicated by a circled X. (Background source: Google Maps)", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-6aeb9c46c6", "answerable": false, "question": "What was the official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner?", "expected_answer": "The report does not state a medical cause of death; it says only that local paramedics pronounced the chief engineer and third engineer dead on scene.", "evidence": [], "passages": [{"doc_id": "MIR2505.pdf", "text": "began boundary cooling on the exterior engine room bulkheads. About 0336, the chief engineer reported to the captain via handheld radio that three crewmembers were in the engine room: the third engineer, wiper, and himself. Emergency teams suited up in firefighting gear to search for the crewmembers and assess the situation in the engine room. The chief engineer shut down all electrical power from the ECR, blacking out the vessel. Upon loss of power, the ECR became dark. A ll three engine crewmembers were coughing due to the smoke. The vessel’s emergency diesel generator automatically started, providing electrical power to vital equipment and lighting circuits. The three engine crewmembers attempted to leave the ECR with their faces covered with shirts soaked in water, but upon opening the ECR door into the engine room, they were met with flames and smoke, so they retreated back into the ECR.", "spans": []}, {"doc_id": "MIR2505.pdf", "text": "Engine Room Fire aboard Cargo Ves sel Stride MIR-25-05 14 Figure 8. Left: Diesel oil puddled alongside base of main engine on tanktop. Upper right: Diesel oil puddled in main engine air intake manifold. Bottom right: Diesel oil puddled in deck containment by boiler on D deck. 1.3.2 Personnel The chief engineer who was aboard the Stride at the time of the fire had 38 years of experience in the maritime industry and had worked with the company as a chief engineer on six other company vessels since 2016. This was his first trip aboard the Stride, and he joined the vessel about 7 weeks before the fire. The third engineer joined the company in 2004 as a wiper, and he had completed 26 contracts aboard various company vessels as a motorman, fourth engineer, and third engineer. This also was his first trip aboard the Stride; he joined the vessel about 3 weeks before the fire. The wiper had about 4 years of experience in the maritime industry and had", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "engineer stated that he “tried to put out the fire on [the motorman’s] coverall” before they ran up to deck 1 to the ship’s hospital to receive first aid from the ship’s doctor. About the same time, the officer on watch on the bridge received a “chain of fire alarms in the engine room.” The officer in the wheelhouse called the engineer on watch in the ECR via phone and also called the captain on his handheld radio. The captain, who was on the balcony of deck 3, felt “a shake of the ship“ and saw thick smoke coming from the vessel’s funnel. A bout this time, the chief engineer and chief mate arrived on scene in the ECR. The captain reported to the wheelhouse, and the officer on watch advised him that a failure of the no. 2 auxiliary engine had resulted in an engine room fire. Additionally, he reported that the motorman, who was near the engine, had gotten burned and was receiving first aid from the ship’s doctor.", "spans": []}, {"doc_id": "MIR2516.pdf", "text": "board. The medical examiner determined that the primary cause of death for the two fatally injured firefighters was smoke inhalation, including carbon monoxide intoxication. 1.3 Vessel 1.3.1 General The Grande Costa D’Avorio was a 692-foot-long Ro/Con vessel with 12 decks. Vehicles were loaded using a stern ramp that led up to deck 3 (see Figure 8). Deck 11 was partially exposed and had a cargo vehicle deck, weather deck, and crew accommodation space.", "spans": []}], "answer": "The official cause of death for the chief engineer and third engineer who died in the Stride engine room fire, according to the medical examiner, was smoke inhalation, including carbon monoxide intoxication.", "judges": ["groundedness", "abstention"]}, {"key": "t-1d28a9257f", "answerable": true, "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "evidence": [{"doc_id": "MIR2619.pdf", "quote": "He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 9 Figure 5. Diagram (looking toward the Erving’s bow) showing the position of the STS crane boom if it were raised versus its position at the time of the accident. (Scale approximate.) One of the STAX 1 deckhands repairing the exhaust duct on the Erving ran toward the starboard-side handrails of the funnel. He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane. No one was in the cab, but he was unable to see into the trolley cab due to the angle of the trolley cabin front windshield. At 1649, while STS crane 16 was moving toward the stern of the vessel, the crane contacted the STAX 1 emission capture boom (see figure 6). Sections of boom fell onto STAX 1, onto the Erving, and into the water. A portion of the emission", "spans": [[398, 569]]}, {"doc_id": "MIR2619.pdf", "text": "foremen’s trailer to conduct his routine round, checking the highline and decking (cargo/container staging) areas in his work truck before the start of the flex shift. He checked which cranes needed to be moved on the flex shift. While at the decking area, about 1646, he heard operations manager 1 call out on VHF radio that crane operator 1 could not get STS crane 16 boomed up. While operations manager 2 was checking the highline and decking area, crane operator 2 proceeded to STS crane 15’s waterside dock-level control station to move STS crane 15 to the next cargo bay. (STS crane 15’s boom was in the lowered position.) Crane operator 2 told investigators that he was unaware that the STAX 1 was operating next to the Erving (his line of sight was blocked by the containership). He stated, “If I would’ve seen that [emission capture boom], I would have stopped.” Crane operator 2 explained to investigators that the first-shift crane operators", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "not include any information about the location of the barge or its emission capture boom. Had the crane operator waited for the pre-shift planning meeting and been aware of the STAX 1’s location, he may have opted not to move the crane.", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 17 Regardless of the crane operator’s awareness of the STAX 1, the only way to ensure the lowered boom could clear the Erving’s exhaust stack before gantrying the crane would have been to have positive confirmation of line of sight from the crane’s trolley cabin. According to the ILWU and the PMA’s Pacific Coast Marine Safety Code, crane operators “shall not operate cranes when visibility cannot be maintained to assure a safe operation.” An FMS ship boss told investigators he believed that, typically, crane operations should be performed in the trolley cab rather than using the waterside dock-level control station. According to crane operator 2 and ship boss 2, moving a crane typically also involved a second person: a dock signal person positioned on the dock where they could observe the crane’s movement along its", "spans": []}], "answer": "The worker was approximately 200 feet away from the crane's operator cabin.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8fb2de28cc", "answerable": true, "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "evidence": [{"doc_id": "MIR2501.pdf", "quote": "At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the lock.", "status": "partly"}, {"doc_id": "MIR2508.pdf", "quote": "at a speed of 0.35 mph, the starboard quarter of the starboard barge (EMS 348) contacted the wooden fendering of the transfer platform at dolphin no. 3", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 8 About 1804, the Kitty stopped moving astern and the vessel was outside of the open gates, with the stern of EMS 383 (the aft barge) abeam of the open lock gates. The captain put the engines in reverse in anticipation of water surging back into the lock; he estimated the water level in the lock had dropped about 3 to 4 feet. Less than a minute later, the Kitty tow started to advance ahead even though the engines were in reverse. By 1806, the Kitty tow was advancing ahead at 0.7 mph and increasing in speed. The captain moved propulsion astern on all engines to arrest the increase in speed. Seeing that the tow was still advancing ahead, the captain moved all main engine propulsion levers to full astern, but there was no effect on the tow’s advance. He instructed the steersman to look at the wheel (propeller) wash, and the steersman confirmed that the engines were in reverse. At the head of the tow, the deckhand", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 6 About 1741, the Kitty tow entered the forebay at about 4 mph. A deckhand and tankerman prepared lines and bumpers for entering the lock and then moved to the head of the tow. As the head of the tow neared the lock entrance, the captain reduced the speed of the tow, and, about 1749, the head of the tow began to enter through the open lock gates (A and B) at 2 mph. The captain looked at the automatic identification system information displayed on the vessel’s electronic chart system and saw ships—the 587-foot-long tanker Garden State and, about 1.5 miles astern, the 820-foot-long tanker SKS Darent—transiting southbound on the Mississippi River toward the Algiers Lock forebay entrance (see figure 6). About 1752, the Garden State began to pass the mouth of the forebay at 13.5 knots (15.5 mph); the vessel was about 1,065 yards away from the open lock gates.", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 7 About 1758, the second southbound tanker, the SKS Darent, passed the Algiers Lock forebay at 13.8 knots (15.9 mph); the vessel was about 950 yards away from the open lock gates. At 1759, the Kitty tow, fully within the lock chamber, had stopped moving. The deckhand was calling the distance to come ahead to the red pin via radio. The captain tried to ease the tow further ahead, but the Kitty tow began to move aft. The captain saw water “coming out” of the lock and that the water was “ pulling” the Kitty tow aft out of the lock chamber (toward the Mississippi River). At 1800, the Kitty tow was moving 0.6 mph astern, and the captain came ahead slow on all engines to counteract the tow’s movement (see figure 7). He stated over the Algiers Lock radio frequency that the passing ships were “sucking the water out at Algiers.” At 1801, the Kitty tow was still moving astern, now at 2 mph, despite", "spans": []}, {"doc_id": "MIR2501.pdf", "text": "placed a line on a red pin once it was within reach and tied it off, but the line broke as the tow continued moving ahead. The deckhand placed another line on the pin, and that line broke as well. The deckhand told the captain via radio that the Kitty was “coming in hot.” According to the captain, when the Kitty tow was about 100 feet from the closed lock gates, the vessel was moving about 2 mph ahead. Over the radio, the lock hand announced that the tow was approaching too fast and told the captain to slow down. The captain replied, “Algiers, I’m backing on everything. The [expletive] waters’ coming back in from the [expletive] ships. I can’t get it to stop. I got everything hooked up.” At the bow of the lead barge, the deckhand saw that the tow was going to hit the closed lock gate and walked aft on the barge to safety. At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the", "spans": [[834, 940]]}], "answer": "Based on the information provided in the context, the **Kitty tow** was moving at a higher speed at the moment its barge, EMS 317, made contact with Algiers Lock Gate D.\n\nHere's the breakdown:\n\n- **Kitty Tow**: At 1808, the port bow of barge EMS 317 struck Gate D, and the tow was moving at **1.4 mph**.\n- **Ovide J Tow**: There is no specific information provided about the speed of the Ovide J tow or the contact with the Chalmette Refinery dock. Therefore, we cannot determine the speed of the Ovide J tow at the moment of contact.\n\nThus, **the Kitty tow was moving at a higher speed** at the moment of contact with Algiers Lock Gate D.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0f60bbb46d", "answerable": true, "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "evidence": [{"doc_id": "MIR2545.pdf", "quote": "On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking", "status": "retrieved"}, {"doc_id": "MIR2545.pdf", "quote": "was owned and operated by Algoma Central Corporation", "status": "not_retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel", "status": "retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "was owned and operated by Algoma Shipping Ltd., a subsidiary of the Algoma Central Corporation", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2606.pdf", "text": "Grounding of Dry Bulk Carrier Algoma Verity On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel (see figure 1 and figure 2). 1 The vessel repositioned and continued its upbound transit, outside the channel, until, at 1828, the vessel grounded again, coming to a stop. The Algoma Verity was refloated 3 days later. No pollution or injuries were reported. Damage to the vessel was estimated at $6.6 million. Figure 1. Algoma Verity underway at unknown date. (Source: Algoma Central Corporation) 1 (a) In this report, all times are eastern standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM015). Use the CAROL Query to search investigations. March 4, 2026 MIR-26-06", "spans": [[44, 236]]}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Damage to the facility was estimated at $950,000, and damage to the Algoma Discovery was estimated at $130,000. Figure 1. Algoma Discovery at unknown date before the contact. (Source: Carson Last, marinetraffic.com) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM052). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-45", "spans": [[77, 329]]}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 72 Report Investigation Year Title Summary Probable Cause MAB-17/30 DCA16FM023 2016 Allision of Tanker Nordbay with Docks and Water Intakes On February 2, 2016, at 2213 local time, the tanker Nordbay was southbound on the Lower Mississippi River in New Orleans, Louisiana, with a pilot on board when it allided with a dock and water intakes on the left descending bank. Less than an hour later, as the vessel maneuvered through another bend in the river while heading toward an anchorage, it allided with a wharf on the left descending bank. No pollution or injuries were reported. The dock, water intakes, the wharf, and the Nordbay sustained an estimated $6.4 million in total damage. The National Transportation Safety Board determines that the probable cause of the Nordbay’s allisions with water intakes and docks was the pilot and the master not", "spans": []}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility MIR-25-45 6 start. He stated that the interlocks for the main engines would not open and the compressed air bottle pressure and the control air pressure had both dropped. The master ordered the starboard anchor and the stern anchor be let go as the vessel was still moving forward, toward the dock. Crewmembers let go the anchors. However, about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots. At 2220, the Algoma Discovery came to a stop, with the bow touching the dock and the stern about 100 feet away from the dock. Five loading shuttles were damaged. Shortly after the vessel made contact with the shuttles, the crew conducted a damage survey of the vessel. The chief engineer determined that the control air system was not being supplied from the compressed air bottle system, and, about", "spans": []}], "answer": "The two events occurred approximately 1 year and 4 months apart. The Algoma Discovery incident happened on July 20, 2024, and the Algoma Verity incident occurred on January 8, 2025.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-906a99e4e2", "answerable": true, "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "evidence": [{"doc_id": "MIR2630.pdf", "quote": "However, the captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "status": "partly"}], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": [[888, 939]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 7 Figure 4. The Mystery (circled) aground as seen from the former location of the Seal Cape Light on January 16, 2025. (Background source: Coast Guard) 1.3.2 Crew Experience The captain had over 20 years of experience, fishing from Mexico to Alaska. Deckhand 2 had at least 25 years of experience and fished with his own vessel. Deckhand 1’s navigational experience was unavailable. 1.3.3 Chart Plotter The captain reported that the Mystery’s chart plotter had frozen on previous occasions. He reported that when the chart plotter froze, the autopilot would slowly turn the vessel to port, as he believed it had on the evening of the grounding. The captain noted that he had never experienced issues with the autopilot. He stated that the freezing issue could be corrected by rebooting the chart plotter. Due to similar freezing issues on previously installed chart plotters from the same manufacturer, the", "spans": [[584, 629]]}, {"doc_id": "MIR2630.pdf", "text": "which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port. Therefore, on the night of the grounding, the chart plotter froze, and, consequently, the autopilot steered the vessel to port. A proper navigation watch requires a watchstander to confirm and correlate information from all available sources, including electronic charts and visual sightings, to verify the vessel’s position. For the Mystery crew, maintaining a proper navigation watch was critical given their operational environment (on a lee shore, with high winds, and in reduced visibility due to darkness). Vessels navigating near shore face increased risk from the proximity to navigation hazards. As such, any error in navigation, steering, or propulsion can quickly result in catastrophe. Coastwise navigation, therefore, requires increased vigilance to maintain a continuous and", "spans": [[0, 144]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 11 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the grounding of the fishing vessel Mystery was the deckhand on watch not maintaining a proper navigation watch, likely due to his overreliance on the vessel’s automated navigation systems, which resulted in him not noticing when the chart plotter malfunctioned and the autopilot steered the vessel away from its plotted course. 3.2 Lessons Learned Overreliance on Automated Navigation Systems Although modern technology is an asset, it is not infallible. Operator overreliance on, and overconfidence in, technologies like chart plotters and autopilot systems can negatively affect situation awareness. The safety of a vessel underway depends on the crew’s awareness of the vessel’s position and adherence to a voyage plan. Good seamanship requires correlating information from all means of", "spans": []}], "answer": "According to the NTSB analysis, the captain stated that after the chart plotter froze, the autopilot would slowly turn the vessel to port.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-14bdaafe52", "answerable": true, "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "evidence": [{"doc_id": "MIR2542.pdf", "quote": "Waterway information Unprotected approach channel, width 148 ft; charted depth 16 ft in channel, 8 ft outside of channel", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2542.pdf", "text": "148 feet wide at the location of the Jack Edwards/Julie C collision, per electronic navigation charts for the area. The charted depth in the channel was 16 feet, with water depths of 8–10 feet immediately outside the channel. On the day of the casualty, high tide within the port was predicted at 6.5 feet above charted datum at 2215; the range of tide was 2.3 feet. The National Geospatial-Intelligence Agency’s (NGA) Sailing Directions (Enroute), East Coast of South America describes the bottom type as follows: The mud on the bottom is known locally as “sling mud.” It is from 0.6 to 1.2m [2.0 to 3.9 feet] thick, and is of a very soft, almost liquid consistency. Ships of 10 knots or more can force a passage through this “sling mud” even though drawing 0.3m [1 foot] more than the actual depth of water. 10 The Jack Edwards crew stated that they were experiencing a flood tide at the time of the transit into Georgetown. According to the Sailing Directions, currents", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "steering issue was not reported to the Jack Edwards’s chief engineer by the bridge watchstanders. Arriving in Georgetown on March 16, the Jack Edwards transited the port’s entrance channel and moored without incident. Later that evening, the vessel shifted berths in the port, again without incident. At 0840 the next morning, the Jack Edwards got underway to conduct a brief sea trial a few miles off the Guyana coast for the vessel’s charterer. A representative of the charterer company had boarded the vessel, bringing the total complement to ten. The OSV’s departure drafts were 13 feet 5 inches forward and 14 feet 2 inches aft. The sea trial was completed by 1530. A half hour later, the vessel anchored, awaiting high tide and an available berth in Georgetown. At 2100, the Jack Edwards crew began preparing the vessel to get underway for the inbound transit to the port. The second mate was the OICNW on the bridge.", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "9 knots, it was hailed on VHF radio by “Georgetown Pilots” and informed that it was “way out of the [Georgetown entrance] channel.” At the time, the Jack Edwards was about 0.48 miles to the northwest of the channel. Georgetown Pilots advised the vessel to come to port toward the channel. The Jack Edwards’s chief mate acknowledged the Georgetown Pilots radio call and instructed the second mate to steer toward the channel. The second mate and chief engineer told investigators that, while outside the channel, the Jack Edwards was “shuddering” and had a “serious vibration.” According to the second mate, the shuddering stopped when the Jack Edwards got closer to the channel. The second mate and chief engineer stated that it was possible that the vibration was caused by the vessel contacting the soft mud bottom. In a statement to investigators, the charterer representative, who was on the bridge during the casualty", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "the channel until it veered to port just prior to the collision). High tide, which occurred at 2215, added 6.5 feet to the charted datum, bringing the water depth to 14.5– 16.5 feet and falling. The Jack Edwards’s aft draft was 14 feet 2 inches, putting the vessel in, or nearly in, the soft “sling mud” on the bottom as it transited inbound. Although the vessel’s echo sounder recorded depths beneath the keel of 8 feet or greater, echo sounder readings can vary in areas with a “fluid-mud” layer. 11 Research has shown that a vessel transiting with its keel near the water-mud interface can experience sluggish maneuvering at low speeds (3 knots). The effect decreases at higher speeds (7 knots). 12 The NGA Sailing Directions notes that ships transiting at 10 knots can navigate through the mud in the approaches to Georgetown with drafts that exceed the depth of water by up to 1 foot. The Jack Edwards was transiting between 9 and 10 knots throughout the time that the 11", "spans": []}], "answer": "The approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C collided, was 148 feet wide. The charted depth in the channel was 16 feet.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-a580a9eb2a", "answerable": true, "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "evidence": [{"doc_id": "MIR2535.pdf", "quote": "The pilots assigned numbers to the tugs from bow to stern, with the no. 1 tug (Ted C Litton) being the first tug at the bow, the no. 2 tug (Connolly M) on the port shoulder, the no. 3 tug (Cooper K) on the port quarter, the no. 4 tug (Mercury) at the stern, and the no. 5 tug (Zeus) as the standby tug.", "status": "partly"}], "passages": [{"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 6 Figure 5. The Cosflourish Lake’s positions, relative to the east dock and the vessel at the west dock, leading up to the initial contact with the east dock’s pilings. ( Source: Electronic Chart Display and Information System from Cosflourish Lake. Background source: National Oceanic and Atmospheric Administration, Electronic Navigation Chart US5CRPBF as viewed on Made Smart automatic identification system) Pilot 3 continued to issue orders to the tugs as he proceeded with the docking. At 1412, he ordered slow astern on the tanker’s main engine with the rudder at hard to starboard, “ slack line” for tug no. 1, and “full towards” for tug no. 2 (push at full power on the port side, toward the east dock). Two minutes later, he ordered the rudder hard to port and tug no. 1 to push “slow towards” (pushing on the port bow, toward the dock, at a slow rpm).", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 5 PILOT 3: I’m gonna f——k the s——t out of this ship. I’m gonna go in there and I’m gonna be doing the god d——n docking, ok. You got it? MASTER: Yeah. PILOT 3: We're changing, ok. Don’t f——k up, ok. PILOT 1: [To unknown person] I told ya, you gotta watch him. PILOT 3: [To the other pilots] Sometimes you gotta shock talk em. Pilot 1 then left the bridge for the bow, and, at 1354, Pilot 2 requested tug no. 1 be made fast at the center lead forward. Tug nos. 2, 3, and 4 were all successfully made fast in their agreed upon positions. At 1404, Pilot 3 ordered the engine full astern to slow the ship in the channel so that tug no. 1 could be made fast. About 1406, tug no. 1 was secured with a line to the bow. The Cosflourish Lake had a heading of 259° and a speed of 6.1 knots, which continued to decrease as the bow of the tanker moved to starboard and into the STGT basin.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "At 1407, with tug no. 1 pulling to starboard at the bow as ordered, the Cosflourish Lake had a heading of 279° at a speed of 1.7 knots. Pilot 3 ordered tug no. 2 to push at full power on the port side. At 1408, at a slow ahead propulsion order, the vessel had a heading of 298°, and Pilot 3 ordered tug no. 1 to slack its line, and tug no. 2 to full power away to port. At 1409, the vessel continued to turn to starboard, and the pilot ordered the rudder hard to starboard while issuing multiple orders to the tugs. At 1410, on a heading of 336° at a speed of 0.6 knots, the pilot ordered tug no. 1 to port 90°. Seconds later, Pilot 3 ordered tug no. 1 to “back full.” At 1411, as the pilot continued to issue tug, engine, and rudder orders, the starboard side of the Cosflourish Lake struck two of three rubber tire-covered pilings at the end of the east dock. The vessel had a speed of 2.2 knots on a heading of about 354°.", "spans": []}, {"doc_id": "MIR2535.pdf", "text": "Contact of Tanker Cosflourish Lake with South Texas Gateway Terminal Dock MIR-25-35 4 1.2 Event Sequence On November 14, 2023, at 1018 local time, the Cosflourish Lake got underway from an offshore anchorage in a ballast condition, inbound to the STGT east dock (an 11-mile transit). At 1254, three Aransas-Corpus Christi pilots boarded the vessel at the nearby pilot station, and shortly after, d uring the master/pilot exchange, Pilot 1 confirmed with the master that there were no deficiencies with the Cosflourish Lake. (Pilot 3 told investigators that three pilots were required for a VLCC.) About 1301, Pilot 1 took the conn. Pilot 1 briefed the master that the plan was to dock the tanker starboard-side-to using five tractor tugs: four 6,772-hp, tractor tugs would have a line to the tanker, and one 5,150 hp-tractor tug would be standing by to assist where needed (see figure 4). The pilots assigned numbers to the tugs from bow", "spans": [[889, 937]]}], "answer": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, **tug no. 1** was made fast at the very back of the tanker, and **tug no. 5** was held in reserve. \n\nHere's the breakdown based on the provided context:\n\n- **Tug no. 1** was made fast at the bow of the tanker. It was secured with a line to the bow at 1406, as per the sequence of events.\n- **Tug no. 5** was identified as the one standing by to assist where needed, as per the plan briefed by Pilot 1 to the master. This indicates that tug no. 5 was held in reserve.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-56a39ffa86", "answerable": true, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "evidence": [{"doc_id": "MIR2515.pdf", "quote": "However, the flexible ducting was made of combustible material; it was not structurally protected from fire (nor was it required to be).", "status": "not_retrieved"}, {"doc_id": "MIR2515.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 17 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the engine room fire on the towing vessel Johnny M was a catastrophic main engine failure that caused the venting and ignition of hot atomized lube oil. Contributing to the ineffectiveness of the carbon dioxide fixed fire extinguishing system was the lack of structural fire protection for the main engines’ combustion air intake ducting, which allowed oxygen to enter the engine room once the fire consumed the ducting. 3.2 Lessons Learned Structural Fire Protection The flexible ducting providing combustion air to the main engines on board the Johnny M extended from the engine stacks on the main deck down to the engine room and did not have any insulation or other barriers to prevent the passage of smoke, heat, and fire—known as structural fire protection. This type of unprotected", "spans": []}], "answer": "The NTSB's assessments point to a shortcoming in the federal rules for towboats regarding the lack of mandatory built-in barriers, such as insulation or fire-resistant materials, to prevent the spread of fire through critical areas like combustion air ducting. This omission allowed fire to spread more rapidly, exacerbating the incidents.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f2deeede6e", "answerable": true, "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "As a result of the casualty, the operating company required mooring lines to be replaced annually.", "status": "partly"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "and subsequent drifting, witnesses described blizzard conditions, including winds ranging from 35–80 mph, with 3–4 feet waves. The RCA Team also found that the vessel operator had no “life cycle management program” for examining or replacing mooring lines before they would break when in use. The team’s report stated that “standard 1.5 in [nylon] lines generally last about one year”; the ages of the Columbia Gorge’s mooring lines ranged from 5 months to 10 years, with the age of some lines either unknown or not definitively known. Additionally, the team concluded that there may not have been sufficient slack in the galvanized chain “to allow the nylon lines to flex and stretch smoothly enough to avoid breakage.” As a result of the casualty, the operating company instituted two new safety measures: mooring lines are to be replaced annually, and the vessel will be crewed and/or moved when forecasted wind gusts exceed 70 knots. 2 Analysis", "spans": [[721, 771]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 7 On January 16, three days after the casualty, the Port of Cascade Locks Port Commission established an internal Root Cause Analysis (RCA) Team to investigate the Columbia Gorge unmooring. The RCA Team identified two root causes related to the mooring arrangement: mooring line age and the lack of a “lifecycle management program,” and likely insufficient slack in the galvanized chain. 4 The RCA Team determined that the mooring arrangement and size of the nylon lines used would have been “sufficient for the loads that occurred during the incident” if the lines had been new or in good condition. Their conclusion was based on the Columbia Gorge’s history of remaining docked during past weather events with similarly high winds. According to the RCA Team report, at the time of the Columbia Gorge’s unmooring", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "arrangement was six nylon mooring lines and no chain). The bow line was tight, and crewmembers estimated there was less than a foot of slack in the breast lines and the chain (see Figure 3). The vessel was uncrewed while docked, and, in the days before the breakaway, the crew checked the vessel’s mooring a few times a day. Figure 3. Columbia Gorge mooring arrangement on January 13, 2024, including the diameters of and materials comprising each mooring line (scale approximate).", "spans": []}], "answer": "Following the Columbia Gorge breakaway at Cascade Locks, the boat's operator started renewing the mooring lines annually.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5b9edc50bd", "answerable": false, "question": "What did the NTSB determine caused the fishing vessel Northern Halcyon to capsize while hauling crab pots in the Bering Sea in 2025?", "expected_answer": "The reports do not cover a capsizing of a fishing vessel named Northern Halcyon; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2536.pdf", "text": "Hull Failure and Implosion of Submersible Titan MIR-25-36 79 Casualty Summary NTSB casualty category Flooding/Hull Failure Location North Atlantic Ocean, 900 nm east of Cape Cod, Massachusetts 41°43.98’ N, 49°59.9’ W Date June 18, 2023 Time 1047 Newfoundland and Labrador daylight time (coordinated universal time –2.5 hours) Injuries 5 fatal Property damage $5.6 million CAD (about $ 4.2 million USD) est. Environmental damage None Persons on board 5 NTSB investigators worked closely with our counterparts from Coast Guard Office of Investigations and Analysis throughout this investigation. The NTSB is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in the other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine the probable causes of the accidents and events we", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN On July 24, 2025, about 0900 local time, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the two crewmembers aboard were hauling lobster traps in the Gulf of Maine near Mount Desert Rock, Maine (see figure 1 and figure 2). 1 The captain of the vessel attempted to put out the fire but was unsuccessful. Both crewmembers abandoned the vessel, which burned to the waterline and sank. There were no injuries, and no pollution was reported. The vessel was a total loss, with damages estimated at $717,500. Figure 1. GITN’R DUN moored on May 29, 2025. (Source: US Coast Guard) 1 (a) In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles), unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM051). July 23, 2026 MIR-26-25", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "The provided context does not mention the fishing vessel \"Northern Halcyon\" or an incident involving it in the Bering Sea in 2025. Therefore, I cannot provide a specific determination by the NTSB regarding this vessel based on the available information.", "judges": ["groundedness", "abstention"]}, {"key": "t-6c3902fc90", "answerable": false, "question": "How fast was the fishing vessel Mystery traveling when it struck the rocks near Seal Cape, Alaska?", "expected_answer": "The report does not state the Mystery's speed at the time of the grounding.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 2 Casualty Summary NTSB casualty category Grounding/Stranding Location Near Seal Cape, about 25 miles west of Sand Point, Alaska 55°21.40' N, 161°15.00' W Date December 10, 2024 Time 2121 Alaska standard time (coordinated universal time −9 hrs) Persons on board 3 Injuries None Property damage $800,000 (vessel); $150,000 (gear) Environmental damage None reported; est. 2,000 gallons of diesel fuel, 30 gallons of lube oil, and 50 gallons of other fuel on board Weather Visibility 10 mi, overcast, winds 020° at 20 kts, seas 1 ft, air temperature 39°F, water temperature 39° F, sunset 1713 Waterway information Strait; width 7 nm, depth 42–300 ft, low tide 0400 Figure 2. Area where the Mystery grounded, as indicated by a circled X. (Background source: Google Maps)", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "2 The dockside exam verified the presence and adequate condition of required lifesaving and safety gear (a six-person liferaft and five survival suits). The vessel was rigged for long-line fishing. 1.2 Event Sequence On December 8, 2024, the Mystery began a planned 5-day transit from Dutch Harbor, Alaska—where the crew had unloaded catch after a fishing trip—back to Homer. Three crewmembers were on
