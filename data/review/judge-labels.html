s, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank. Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in this case, the PTC 706 (center barge) had more freeboard than the adjacent barges, but the adjacent barges were not submerged. Therefore, it is more likely that the PTC 706’s freeboard was reduced by weight forward in the barge. This weight forward could have been", "spans": [[94, 361]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-dabd894910", "answerable": true, "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "evidence": [{"doc_id": "MIR2539.pdf", "quote": "Time 1435 eastern daylight time", "status": "not_retrieved"}, {"doc_id": "MIR2539.pdf", "quote": "morning twilight 0718, sunrise 0743", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredging Vessel Stuyvesant On November 2, 2024, about 1435 local time, the dredging vessel Stuyvesant, with a crew of 22, was holding station in the St. Johns River, near Jacksonville, Florida, when a fire broke out in the engine room (see figure 1 and figure 2). 1 Two crewmembers were in the machinery control room when the fire started: one escaped, and the other was removed by the shipboard emergency squad and later pronounced dead at a local hospital. After reporting no active fire and removing the crewmember, the crew verified that the engine room was sealed and released the fixed gas fire extinguishing system. No pollution was reported. Damage to the vessel was estimated at $18 million. 2 Figure 1. Stuyvesant underway in 2022. (Source: The Dutra Group) 1 In this report, all times are eastern daylight time, and all miles are statute miles. 2", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-393dd5d3bd", "answerable": true, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "status": "not_retrieved"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "status": "not_retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "status": "retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2547.pdf", "text": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 8 2 Analysis On September 11, at 1236, the towboat Schweiger was transiting Baker Bay West Channel in Ilwaco, when the vessel struck the US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. At 1235:12, the Schweiger began moving to port and crossed the channel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "spans": [[533, 604]]}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 9 1.3.2 Personnel Information The pilot was working on his first hitch aboard the Amber Brittany, which he began on February 22, thirteen days before the contact. He had previous experience operating towing vessels on inland waters and Western Rivers. This was the pilot’s first time transiting the McAlpine Locks while at the helm of the Amber Brittany. Though the Amber Brittany had transited through the McAlpine Locks twice previously during the pilot’s hitch, the captain had been on watch during both transits. According to the company, the pilot told them he had previous experience operating towing vessels on the Ohio River. However, following the casualty, the pilot told Coast Guard and NTSB investigators that he did not have previous experience operating towing vessels on the Ohio River. The captain had over 40 years of experience in different roles on various", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 5 vessel Stacy McCune, bound upriver, entered the northern McAlpine Lock chamber at 1526, and the lock chamber began to fill at 1540. At 1543, the Amber Brittany tow passed through the Louisville and Indiana (L&I) Railroad Bridge. At 1547, automatic identification system (AIS) data showed that the heading of the Amber Brittany tow altered appreciably to port as the tow exited the upstream end of the canal. At 1548, the tow’s course over ground also altered significantly to port as it began to be set off the sailing line and toward the vane d ike. According to the pilot’s statement, an outdraft current set the tow toward the vane dike. He attempted to counter the set but was unsuccessful. Realizing that the tow was going to contact the vane dike, he then attempted to land the tow as softly as possible, “ in the hopes of minimizing any damage.”", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}], "answer": "Based on the provided information, here is a summary of the time before impact and the operator's actions in each incident:\n\n### 1. **Amber Brittany Tow Striking the McAlpine Vane Dike**\n- **Time before impact**: The Amber Brittany began to deviate from its intended path **approximately 3 minutes before impact**. The AIS data showed that the heading of the tow altered appreciably to port at **1547**, and the course over ground also altered significantly to port at **1548**. The tow then continued to drift toward the vane dike, eventually striking it.\n- **Operator's actions**: The pilot reported that an **outdraft current set the tow toward the vane dike**. He attempted to counter the set but was unsuccessful. Realizing the tow was going to contact the vane dike, he tried to **land the tow as softly as possible** to minimize damage.\n\n### 2. **Schweiger Hitting the Coast Guard Docks at Cape Disappointment**\n- **Time before impact**: The Schweiger began to veer off its intended path **approximately 3 minutes before impact**. The AIS track showed a deliberate course change from the 306° leg to the 284° leg on the red (right) side of the Baker Bay West Channel about **1233:47**, and the vessel began moving to port at **1235:12**, with the impact occurring at **1236**.\n- **Operator's actions**: The captain reported that he **fell asleep before the contact**, which is supported by the AIS track showing the vessel moving across and then out of the channel. This suggests that the captain was **not alert** at the time the vessel began to veer off course.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-83e65fe31d", "answerable": false, "question": "What was the official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner?", "expected_answer": "The report does not state a medical cause of death; it says only that local paramedics pronounced the chief engineer and third engineer dead on scene.", "evidence": [], "passages": [{"doc_id": "MIR2505.pdf", "text": "began boundary cooling on the exterior engine room bulkheads. About 0336, the chief engineer reported to the captain via handheld radio that three crewmembers were in the engine room: the third engineer, wiper, and himself. Emergency teams suited up in firefighting gear to search for the crewmembers and assess the situation in the engine room. The chief engineer shut down all electrical power from the ECR, blacking out the vessel. Upon loss of power, the ECR became dark. A ll three engine crewmembers were coughing due to the smoke. The vessel’s emergency diesel generator automatically started, providing electrical power to vital equipment and lighting circuits. The three engine crewmembers attempted to leave the ECR with their faces covered with shirts soaked in water, but upon opening the ECR door into the engine room, they were met with flames and smoke, so they retreated back into the ECR.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-7d501a07d6", "answerable": true, "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Persons on board 17 (5 crewmembers and 12 passengers)", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 3 1 Factual Information On August 30, 2024, about 1900, the 51.6-foot-long charter fishing vessel Jig Strike departed from San Diego, California, with a crew of five (captain, second captain, two deckhands, and a cook). 2 The vessel had been chartered for a fishing trip lasting a day and a half, and 12 passengers were aboard. The vessel, which had a wood-framed and plywood hull with fiberglass (fiberglass-reinforced plastic) overlay, transited through the night toward Cortes Bank, located about 100 miles west of San Diego. The weather was calm at departure, but according to the captain, in the morning “ it started getting a little bumpy.” Winds were 12–15 knots with swells of 3–6 feet. The vessel arrived at Cortes Bank shortly before 0700 on August 31. The passengers fished at two different locations, but a fter the crew received word that", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike On August 31, 2024, about 1035 local time, the charter fishing vessel Jig Strike was transiting between fishing locations near Cortes Bank in the Pacific Ocean, about 100 miles west of San Diego, California, when the vessel began rapidly taking on water (see figure 1 and figure 2). 1 The crew was unable to stem the flooding, and the five crewmembers and 12 passengers on board abandoned ship into a liferaft. They were rescued by a nearby good Samaritan vessel, and the Jig Strike later sank. There were no injuries, and no pollution was reported. The vessel was a total loss estimated at $475,000. Figure 1. Jig Strike underway at unknown date. (Source: Jig Strike Sportfishing, facebook.com) 1 (a) In this report, all times are Pacific daylight time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 2 Casualty Summary NTSB casualty category Flooding/Hull Failure Location Cortes Bank, Pacific Ocean, 100 nm west San Diego, California 32°28.00’ N, 119°12.00’ W Date August 31, 2024 Time 1035 Pacific daylight time (coordinated universal time −7 hrs) Persons on board 17 (5 crewmembers and 12 passengers) Injuries None Property damage $475,000 est. Environmental damage None Weather Partly cloudy, winds west-northwest 15–18 kts, seas 1–2 ft, swells south- southwest 3–6 ft, air temperature 64°F, water temperature 67°F, sunrise 0623 Waterway information Ocean; Cortes Bank depths 6–1,000 ft Figure 2 . Area where the Jig Strike flooded and sank, as indicated by a circled X. (Background source: Google Maps)", "spans": [[318, 371]]}], "answer": "The total head count aboard the Jig Strike when it flooded off Cortes Bank was 17 people. Of these, 5 were crew members, and 12 were paying customers.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0718209570", "answerable": true, "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "evidence": [{"doc_id": "MIR2509.pdf", "quote": "The mate was then able to reach the Brunswick crew over VHF radio to make passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.”", "status": "partly"}], "passages": [{"doc_id": "MIR2509.pdf", "text": "the Local Notice to Mariners, along with a request for vessels to arrange safe passage when transiting nearby. To pass the area where the Brunswick was dredging, a vessel would need to either (1) request that the Brunswick move the floating discharge pipeline so that it was not extending across the river, or (2) pass to the west of the Brunswick, along the west bank of the Cooper River. The dredge crew moved the floating discharge pipe frequently to accommodate passing traffic during normal operations. On the Royal Engineer, the mate was on watch in the wheelhouse. During the transit south, he attempted to hail the dredge via VHF radio about 1 hour before the tow reached the dredge’s location. According to the mate, he intended to request", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.” He said he could swing the dredge around and provide about 300 feet of clearance to the seawall, not including the width of the Celsius Nicosia. The mate informed the dredge captain that he would have enough room to maneuver the Royal Engineer tow so it would pass between the Brunswick and the Celsius Nicosia (see figure 4). Figure 4. The Royal Engine er’s path between the dredge Brunswick and the containership Celsius Nicosia at 1620. (Background source: Esri satellite image as viewed on Made Smart)", "spans": [[0, 268]]}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 10 2 Analysis While the towing vessel Royal Engineer was pushing the crane barge Stevens 1471 in the Cooper River, the tow transited underneath an STS crane at the North Charleston Terminal while maneuvering through a narrow area between a docked containership and a dredging vessel because the dredge’s floating discharge pipeline was blocking the rest of the channel. The barge crane contacted the STS crane, resulting in extensive damage to the STS crane. The Royal Engineer mate was aware of the dredging operations along the tow’s transit route. The day before the contact, on January 3, he had transited the area between the dredge and the North Charleston Terminal, but there was no containership berthed at the terminal. The mate told investigators that, on the day of the contact, he attempted twice to contact the dredge crew early—first an hour and", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 4 According to technical drawings, the mast reached a height of 144.6 feet above the deck of the barge. The air draft of the crane barge was noted on the towboat’s voyage plan as 145 feet. Figure 3. Approximate towing configuration of the Royal Engineer p ushing the Ste vens 1471. The crane components and their measurements are labeled. Along the Royal Engineer tow’s route, the Brunswick, a 315-foot-long dredge and barge, was dredging the Cooper River channel adjacent to the North Charleston Terminal, located about 1 mile north of the Don Holt Bridge. The Brunswick’s floating discharge pipeline extended eastward across the Cooper River channel, where dredge spoils were discharged near the eastern bank, effectively blocking the channel to traffic moving north and south. The dredging operation was published in", "spans": []}], "answer": "The skipper of the dredge *Brunswick* wanted the *Royal Engineer* and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River because he had workers stationed on the *Brunswick* who were engaged in a task. He stated that if the tow had passed on the other side of the dredge (i.e., away from the terminal), he would have had to stop his workers to accommodate the passage. \n\nThe skipper expressed a preference for the tow to pass between the *Brunswick* and the docked *Celsius Nicosia* (a containership) because he believed this would provide sufficient clearance for the *Royal Engineer* to maneuver safely. He also mentioned that the *Brunswick* could swing around to provide about 300 feet of clearance to the seawall, excluding the width of the *Celsius Nicosia*. \n\nThis preference likely stemmed from the need to maintain the ongoing work on the *Brunswick* and to ensure that the passage of the *Royal Engineer* did not disrupt the operations taking place on the dredge.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-135df4cbb5", "answerable": false, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "evidence": [], "passages": [{"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 2 Analysis While the City of Louisville was upbound on the Upper Mississippi River pushing 11 empty barges, the towing vessel ran aground near mile 42.6 in a charted shallow and rocky area. The grounding caused fractures to the vessel’s bottom plating underneath the engine room, leading to water flooding into the engine room, machinery, and aft accommodation spaces. The pilot of the City of Louisville was alone on watch in the wheelhouse when the grounding occurred. The pilot told investigators that, before the grounding, he had left the helm and was on the port side of the wheelhouse. He estimated he was away from the helm about 5 minutes. Leaving the helm unattended is contrary to prudent navigation practices when operating on rivers. The Mississippi River, in particular, has frequent turns, and the potential for strong currents and heavy traffic.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-66e41c370f", "answerable": true, "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "evidence": [{"doc_id": "MIR2522.pdf", "quote": "The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff.", "status": "partly"}, {"doc_id": "MIR2522.pdf", "quote": "Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel.", "status": "retrieved"}, {"doc_id": "MIR2522.pdf", "quote": "About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2522.pdf", "text": "engine room] seemed to be coming in awfully quick.” About 1315, the captain and deckhand decided to abandon the sinking vessel. They donned survival suits and got into the vessel’s towed skiff. The deckhand reported 6 –8 inches of water on the aft deck as they boarded the skiff. Once in the skiff, the captain and deckhand waved down a nearby Good Samaritan vessel. About 1330, the crew on the fishing vessel Red Sky picked up the captain and deckhand. Once the Cape Douglas crew was aboard, the Red Sky captain notified the US Coast Guard. The captain and deckhand remained on scene aboard the Red Sky, and, about 40 minutes later, they witnessed the Cape Douglas sink by the port stern. The deckhand noted that, as the “upper deck corner” (near the port quarter of the vessel) went underwater, the Cape Douglas “rolled on its side” before sinking. Shortly after, the Red Sky returned to Kodiak and dropped off the captain and deckhand.", "spans": [[0, 193], [280, 366], [367, 453]]}, {"doc_id": "MIR2522.pdf", "text": "Sinking of the Industrial Vessel Cape Douglas MIR-25-22 5 to enter. The deckhand later estimated that there were about 4 feet of water in the engine room. The captain told investigators that there was a high-water bilge alarm in the center of the engine room; however, it did not activate. (The captain could not recall the last time it was tested and did not know if it was functional.) The captain turned on one of the vessel’s two manual bilge pumps near the engine room entrance (the other bilge pump was inaccessible due to the flooding). He and the deckhand opened the starboard-side sliding doors to dump the fish byproduct overboard to reduce the weight on the deck. However, the product was “like peanut butter” because the seawater pump had not started and there was no water available to loosen the product, so they could not dump it. The captain told investigators that, based on his experience with the Cape Douglas, “the water [in the", "spans": [[846, 948]]}, {"doc_id": "MIR2529.pdf", "text": "system) The captain ordered the deckhand to prepare to lower the anchor. The deckhand prepared one of the anchors, but before she could deploy it , the captain ordered everyone on board to abandon the vessel because the list had become significant, and they w ere in danger. The deckhand, chef, steward, and owner jumped into the water. The captain broadcast a distress call on VHF channel 16, verified that all personnel had egressed, and then he also abandoned the vessel by jumping into the water. From the time the vessel started listing until the owner and", "spans": []}, {"doc_id": "MIR2524.pdf", "text": "crab pot davit was not running or pressurized; however, the hydraulic pump for the steering system was running and its lines (pipes and hoses) were pressurized. The captain estimated that he was in the engine room for 30–40 seconds. He told investigators that, as he exited the engine room, he saw a flash, and the smoke turned from white to black as the flames increased. The captain shut the engine room door to “try to cut oxygen” to the fire and went back to the wheelhouse. Concerned about an explosion, the captain decided that he and the other crewmember should abandon the vessel. At 1604, using a VHF radio on channel 16, he made a Mayday call to the Coast Guard informing them of the vessel’s position and his decision to abandon the vessel into a liferaft. The crewmember donned a survival suit (the captain was unable to retrieve his survival suit due to the fire), and", "spans": []}], "answer": "After judging the engine room water to be coming in quickly, the captain and deckhand donned survival suits and got into the vessel’s towed skiff. They waved down a nearby Good Samaritan vessel. They were picked up by the Red Sky approximately 40 minutes after the 1315 decision to abandon the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-89abcae936", "answerable": true, "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "causing components, such as the no. 13 connecting rod and the crankshaft, to seize together and fail by welding themselves to the journal.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders.", "status": "retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "causing components, such as the no. 9 connecting rod and the crankshaft, to seize together at the journal and fail.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "the fire originated on the starboard side of the unloading generator engine when the engine block ruptured in the area of the no. 9 connecting rod", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 8 Coast Guard also requested assistance from a Bureau of Alcohol, Tobacco, Firearms and Explosives certified fire investigator, who participated in the examination of the damage. Investigators found that the no. 2 auxiliary engine was damaged beyond repair: the engine block, crankshaft, two connecting rods, counterweights, and other parts of the rotating assembly were damaged (see figure 5). Figure 5. Damaged no. 2 auxiliary generator aboard Ocean Navigator after the engine failure. The circled area identifies the location of the engine block damage. Investigators noted a hole about 10 inches high and 16 inches wide on the inboard side of the engine block in the area of the nos. 12 and 14 cylinders where the lower portion of the no. 13 connecting rod had been ejected (see figure 6). This area was located on the lower part of the engine near the deck plates between the two", "spans": [[806, 842]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 16 crankshaft. Parts from the disconnected connecting rod collided chaotically as the crankshaft continued to turn, damaging other engine components until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders. Therefore, it is likely that debris entrained in the lube oil system of the no. 2 auxiliary engine led to the catastrophic damage to the engine. As a result of the block rupturing, hot, atomized lube oil vented through the damaged inspection covers and ignited off hot components internal to the engine. The engineering logbooks for the vessel showed that, in the 2 months before the engine failure, crewmembers added lube oil to the no. 2 auxiliary engine (37 gallons in September and 42 gallons in October). In comparison, the crew added", "spans": [[231, 365]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 14 Figure 8. Removed crankshaft from damaged no. 2 auxiliary generator on board Ocean Navigator after the engine failure. After the crankshaft was removed, all main bearings were inspected, and the no. 8 bearing, located directly aft of the affected cylinder, was determined to be in the worst condition. In January 2025, the engine block was replaced and the engine rebuilt by technicians. The operating company requested that the connecting rod bearings on the adjacent no. 1 auxiliary engine be inspected by the technicians. Based on the condition of the sampled bearing, all connecting rod bearings were replaced on the no. 1 auxiliary engine. In February 2025, Caterpillar’s rotating component engineers provided comments from the inspection of the no. 2 auxiliary engine components that had been sent from the Ocean Navigator. The engineers observed the front main bearing", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 9 Figure 6. Left to right: Damaged engine block on no. 2 auxiliary engine aboard Ocean Navigator after the engine failure. Graphic identifying area of engine failure on the no. 2 auxiliary engine. The most significant smoke and heat damage was directly across the decking from the area of the no. 14 cylinder where the engine block was ruptured and extended upward toward the overhead and inboard toward the no. 1 auxiliary engine. The area in the engine room around and above the no. 2 auxiliary engine sustained smoke and heat damage. Soot was observed on all surfaces in the engine room and was heaviest on the components near the deck plates between the two auxiliary engines. The no. 1 auxiliary engine sustained fire damage to the turbocharger, piping, cables, and electrical insulation on the inboard side. The engine control module and", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness"]}, {"key": "t-3032b68860", "answerable": true, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "status": "not_retrieved"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "status": "not_retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "status": "retrieved"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2547.pdf", "text": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 8 2 Analysis On September 11, at 1236, the towboat Schweiger was transiting Baker Bay West Channel in Ilwaco, when the vessel struck the US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. At 1235:12, the Schweiger began moving to port and crossed the channel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel.", "spans": [[533, 604]]}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 9 1.3.2 Personnel Information The pilot was working on his first hitch aboard the Amber Brittany, which he began on February 22, thirteen days before the contact. He had previous experience operating towing vessels on inland waters and Western Rivers. This was the pilot’s first time transiting the McAlpine Locks while at the helm of the Amber Brittany. Though the Amber Brittany had transited through the McAlpine Locks twice previously during the pilot’s hitch, the captain had been on watch during both transits. According to the company, the pilot told them he had previous experience operating towing vessels on the Ohio River. However, following the casualty, the pilot told Coast Guard and NTSB investigators that he did not have previous experience operating towing vessels on the Ohio River. The captain had over 40 years of experience in different roles on various", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 5 vessel Stacy McCune, bound upriver, entered the northern McAlpine Lock chamber at 1526, and the lock chamber began to fill at 1540. At 1543, the Amber Brittany tow passed through the Louisville and Indiana (L&I) Railroad Bridge. At 1547, automatic identification system (AIS) data showed that the heading of the Amber Brittany tow altered appreciably to port as the tow exited the upstream end of the canal. At 1548, the tow’s course over ground also altered significantly to port as it began to be set off the sailing line and toward the vane d ike. According to the pilot’s statement, an outdraft current set the tow toward the vane dike. He attempted to counter the set but was unsuccessful. Realizing that the tow was going to contact the vane dike, he then attempted to land the tow as softly as possible, “ in the hopes of minimizing any damage.”", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}], "answer": "The Amber Brittany tow started wandering off its intended path approximately **1 minute before impact**, as indicated by the AIS data showing a significant course change to port around 1547, just before the vessel began to be set off the sailing line toward the vane dike. At that point, the pilot was attempting to counter the set caused by an outdraft current but was unsuccessful.\n\nThe Schweiger began to veer off its intended path approximately **2.5 minutes before impact**, as the AIS track showed a deliberate course change from the 306° leg to the 284° leg around 1233:47. The captain reported that he fell asleep before the contact, which is supported by the AIS track showing the vessel moving across and then out of the channel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-01261df60a", "answerable": true, "question": "According to the NTSB analysis, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank. Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in this case, the PTC 706 (center barge) had more freeboard than the adjacent barges, but the adjacent barges were not submerged. Therefore, it is more likely that the PTC 706’s freeboard was reduced by weight forward in the barge. This weight forward could have been", "spans": [[94, 361]]}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 4 and coal. The barges with soybeans and corn had covers over their cargo hoppers; the coal barges did not. At the head of the tow, the barges’ raked ends faced forward, while at the aft end of the tow, the Chad Pregracke was faced up to the barges’ raked ends. The PTC 706’s freeboard was about 30 inches, and the two other uncovered coal barges at the head of the tow had a freeboard of 30–31 inches. The covered barges at the head of the tow had varying freeboards: the port outermost barge (CH 0121) had 18 inches, the second tier barge from port (MTC 1379) had 30 inches, and the starboard outermost barge (CH 0132) had 24 inches. Figure 4. Tow diagram of the Chad Pregracke. Over the next day, the pilot and captain alternated navigational watches. The captain stood watch from 0515 to 1115 and 1715 to 2315, and the pilot stood watch", "spans": [[427, 449], [502, 524]]}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": [[112, 148], [316, 338]]}], "answer": "According to the NTSB analysis, the towing vessel Chad Pregracke was pushing 34 loaded barges, while the Baylor J. Tregre was towing a single barge (MARMAC 27). Therefore, the Chad Pregracke was pushing 33 more barges than the Baylor J. Tregre. \n\nThe two tow arrangements differed significantly: the Chad Pregracke was towing a large number of barges in a long, multi-tiered formation, with the PTC 706 at the head of the tow. In contrast, the Baylor J. Tregre was towing a single barge, MARMAC 27, in a different configuration, with the towline not to scale in the provided diagram. The Chad Pregracke's tow involved multiple barges with varying freeboards and cargo types, while the Baylor J. Tregre's tow was a single-barge operation.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-728bf00360", "answerable": true, "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "evidence": [{"doc_id": "MIR2542.pdf", "quote": "Waterway information Unprotected approach channel, width 148 ft; charted depth 16 ft in channel, 8 ft outside of channel", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2542.pdf", "text": "148 feet wide at the location of the Jack Edwards/Julie C collision, per electronic navigation charts for the area. The charted depth in the channel was 16 feet, with water depths of 8–10 feet immediately outside the channel. On the day of the casualty, high tide within the port was predicted at 6.5 feet above charted datum at 2215; the range of tide was 2.3 feet. The National Geospatial-Intelligence Agency’s (NGA) Sailing Directions (Enroute), East Coast of South America describes the bottom type as follows: The mud on the bottom is known locally as “sling mud.” It is from 0.6 to 1.2m [2.0 to 3.9 feet] thick, and is of a very soft, almost liquid consistency. Ships of 10 knots or more can force a passage through this “sling mud” even though drawing 0.3m [1 foot] more than the actual depth of water. 10 The Jack Edwards crew stated that they were experiencing a flood tide at the time of the transit into Georgetown. According to the Sailing Directions, currents", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "steering issue was not reported to the Jack Edwards’s chief engineer by the bridge watchstanders. Arriving in Georgetown on March 16, the Jack Edwards transited the port’s entrance channel and moored without incident. Later that evening, the vessel shifted berths in the port, again without incident. At 0840 the next morning, the Jack Edwards got underway to conduct a brief sea trial a few miles off the Guyana coast for the vessel’s charterer. A representative of the charterer company had boarded the vessel, bringing the total complement to ten. The OSV’s departure drafts were 13 feet 5 inches forward and 14 feet 2 inches aft. The sea trial was completed by 1530. A half hour later, the vessel anchored, awaiting high tide and an available berth in Georgetown. At 2100, the Jack Edwards crew began preparing the vessel to get underway for the inbound transit to the port. The second mate was the OICNW on the bridge.", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "9 knots, it was hailed on VHF radio by “Georgetown Pilots” and informed that it was “way out of the [Georgetown entrance] channel.” At the time, the Jack Edwards was about 0.48 miles to the northwest of the channel. Georgetown Pilots advised the vessel to come to port toward the channel. The Jack Edwards’s chief mate acknowledged the Georgetown Pilots radio call and instructed the second mate to steer toward the channel. The second mate and chief engineer told investigators that, while outside the channel, the Jack Edwards was “shuddering” and had a “serious vibration.” According to the second mate, the shuddering stopped when the Jack Edwards got closer to the channel. The second mate and chief engineer stated that it was possible that the vibration was caused by the vessel contacting the soft mud bottom. In a statement to investigators, the charterer representative, who was on the bridge during the casualty", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "the channel until it veered to port just prior to the collision). High tide, which occurred at 2215, added 6.5 feet to the charted datum, bringing the water depth to 14.5– 16.5 feet and falling. The Jack Edwards’s aft draft was 14 feet 2 inches, putting the vessel in, or nearly in, the soft “sling mud” on the bottom as it transited inbound. Although the vessel’s echo sounder recorded depths beneath the keel of 8 feet or greater, echo sounder readings can vary in areas with a “fluid-mud” layer. 11 Research has shown that a vessel transiting with its keel near the water-mud interface can experience sluggish maneuvering at low speeds (3 knots). The effect decreases at higher speeds (7 knots). 12 The NGA Sailing Directions notes that ships transiting at 10 knots can navigate through the mud in the approaches to Georgetown with drafts that exceed the depth of water by up to 1 foot. The Jack Edwards was transiting between 9 and 10 knots throughout the time that the 11", "spans": []}], "answer": "The approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, was 148 feet wide. The charted depth in the channel was 16 feet.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-48b1483d51", "answerable": true, "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "The chief engineer closed the quick-closing valves to the engines (stopping fuel supply to them), and the fire team shut down all ventilation fans, fire dampers, and watertight and fire screen doors, and prepared fire hoses.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "At 0741, the vessel’s fire team that entered the engine room reported that there was no fire in the engine room; t he team only observed black smoke.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "Crewmembers boarded the barge, shut all doors and ventilation dampers to the unloading generator space, started the tug’s fire pump, and began boundary cooling on the exterior bulkheads and deck above the unloading generator.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "he released carbon dioxide into the unloading generator space about 1630.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 15 2 Analysis While the passenger vessel Ocean Navigator was docked in Portland, Maine, the vessel experienced a catastrophic engine failure of the no. 2 auxiliary diesel engine, which resulted in an engine room fire. The crew quickly sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to effectively starve the fire of fuel and oxygen, which prevented the spread of the fire. Ultimately, the fire self-extinguished. Additionally, within a few minutes of the fire, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations. The Ocean Navigator crewmembers followed company procedures to muster all passengers and evacuate them from the vessel without injury. Therefore, the crew’s", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 5 sure of the operating status of the supply fan for the unloading generator space. He believed it was either running at slow speed or not running before the time of the fire. The first mate and another crewmember, wearing self-contained breathing apparatus, entered the unloading generator space from the port side with two portable fire extinguishers and reported very heavy smoke. They retreated from the space, securing the door as they exited. The chief engineer announced that he was preparing to release the fixed carbon dioxide fire extinguishing system; he released carbon dioxide into the unloading generator space about 1630. The captain notified the US Coast Guard and company of the fire. Crewmembers set watches and used an infrared thermometer to monitor bulkhead temperatures, which declined through the night. About 0730 the following morning,", "spans": [[644, 717]]}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 11 2 Analysis On December 30, 2024, while the ATB Dorothy Ann/Pathfinder was anchored in Lake Erie, the diesel generator engine on the Pathfinder suffered a catastrophic failure, which resulted in a fire in the barge’s unloading electrical generator space. The crew sealed the space and released the vessel’s fixed gas fire extinguishing system, putting out the fire. The most severe fire damage was about 5–10 feet from the damaged engine block near the no. 9 connecting rod, where internal components had forcefully exited the engine. In the 4 minutes leading up to the discovery of the fire at 1609, the engine control room machinery automation system recorded a decrease of lube oil pressure while the engine was running at rated speed (1,800 rpm). The engine stopped at 1609:30. This loss of pressure (from 58–47 psi) was not severe enough to", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 7 throughout the vessel. The passengers and crew proceeded to their muster stations. The captain notified the operating company’s designated person ashore who, in turn notified the company’s qualified individual, their dedicated salvage and marine firefighting contractor, and the corporate crisis team. 4 About 0718, crewmembers removed the injured motorman from the Ocean Navigator, and at 0721, after receiving permission from the captain, the first fire team entered the engine room—wearing self-contained breathing apparatus—to assess the fire. About 0730, the local shoreside fire department arrived at the vessel. About this time, the captain received the report from the muster station team leaders that all passengers were accounted for at both muster stations. At 0731, the captain directed the passengers and non-essential crew to evacuate the Ocean Navigator to the pier", "spans": []}], "answer": "In both incidents, the crew took swift and effective measures to control and extinguish the fires:\n\n**Ocean Navigator:**\nThe crew sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to cut off fuel and oxygen supply to the fire. These actions effectively starved the fire of its necessary elements, leading to its self-extinction. Additionally, the captain notified the crew and sounded the general alarm to ensure passenger and crew safety. Firefighters later entered the engine room wearing self-contained breathing apparatus to assess the situation, and the local shoreside fire department arrived to assist with the evacuation and firefighting efforts.\n\n**Pathfinder:**\nThe crew sealed the unloading generator space and released the vessel’s fixed gas fire extinguishing system, which successfully put out the fire. The chief engineer activated the carbon dioxide fire extinguishing system, and the fire was controlled before it could spread. Crewmembers also monitored bulkhead temperatures using an infrared thermometer, which showed a decline through the night, indicating the fire was under control. The captain notified the US Coast Guard and the company of the fire, and the situation was managed effectively.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f4c48caf61", "answerable": true, "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "causing components, such as the no. 13 connecting rod and the crankshaft, to seize together and fail by welding themselves to the journal.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders.", "status": "partly"}, {"doc_id": "MIR2602.pdf", "quote": "causing components, such as the no. 9 connecting rod and the crankshaft, to seize together at the journal and fail.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "the fire originated on the starboard side of the unloading generator engine when the engine block ruptured in the area of the no. 9 connecting rod", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 8 Coast Guard also requested assistance from a Bureau of Alcohol, Tobacco, Firearms and Explosives certified fire investigator, who participated in the examination of the damage. Investigators found that the no. 2 auxiliary engine was damaged beyond repair: the engine block, crankshaft, two connecting rods, counterweights, and other parts of the rotating assembly were damaged (see figure 5). Figure 5. Damaged no. 2 auxiliary generator aboard Ocean Navigator after the engine failure. The circled area identifies the location of the engine block damage. Investigators noted a hole about 10 inches high and 16 inches wide on the inboard side of the engine block in the area of the nos. 12 and 14 cylinders where the lower portion of the no. 13 connecting rod had been ejected (see figure 6). This area was located on the lower part of the engine near the deck plates between the two", "spans": [[806, 842]]}], "answer": "The documents provided do not contain the answer to the question about the NTSB analysis or the specific connecting rod that seized with the crankshaft in the engine failure aboard the Pathfinder.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-090bb16fe7", "answerable": true, "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "evidence": [{"doc_id": "MIR2503.pdf", "quote": "Engine power; manufacturer 2 x 3,000 hp (2,237 kW); GE 7FDL12 diesel engines", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "The vessel’s propulsion was provided by two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Vessel electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp (see figure 3). The main engines operated at variable revolutions per minute based on the vessel’s input speed command. The auxiliary engines ran at 1,800 rpm. A 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "spans": []}], "answer": "The Bonnie G had two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster, and two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp. The main engines operated at variable revolutions per minute, while the auxiliary engines ran at 1,800 rpm. Additionally, there was a 1,000-horsepower bow thruster.", "judges": ["correctness", "refusal"]}, {"key": "t-475c881599", "answerable": true, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "evidence": [{"doc_id": "MIR2515.pdf", "quote": "However, the flexible ducting was made of combustible material; it was not structurally protected from fire (nor was it required to be).", "status": "not_retrieved"}, {"doc_id": "MIR2515.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "status": "retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 17 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the engine room fire on the towing vessel Johnny M was a catastrophic main engine failure that caused the venting and ignition of hot atomized lube oil. Contributing to the ineffectiveness of the carbon dioxide fixed fire extinguishing system was the lack of structural fire protection for the main engines’ combustion air intake ducting, which allowed oxygen to enter the engine room once the fire consumed the ducting. 3.2 Lessons Learned Structural Fire Protection The flexible ducting providing combustion air to the main engines on board the Johnny M extended from the engine stacks on the main deck down to the engine room and did not have any insulation or other barriers to prevent the passage of smoke, heat, and fire—known as structural fire protection. This type of unprotected", "spans": []}, {"doc_id": "MIR2621.pdf", "text": "Fire aboard Towing Vessel William D MIR-26-21 11 fire protection uses fire-resistant materials and insulation installed on the horizontal and vertical surfaces of a compartment, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke, thus providing additional time to evacuate and for firefighting to contain and extinguish a fire. Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "spans": [[365, 589]]}, {"doc_id": "MIR2621.pdf", "text": "due to the rapid spread of the fire. The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained. 5 Structural fire protection is a component of an overall vessel fire-protection strategy that uses passive design features in a vessel’s structure to slow the expansion of a fire from one compartment to another. Structural 5 See Fire aboard Towing Vessel Mary Dupre near Freeport, Texas, June 26, 2022, MIR-23-12; Fire aboard Towing Vessel Jaxon Aaron on the Lower Mississippi River, mile marker 770, August 13, 2016, MAB-17/19; and Fire On Board Fish Processing Vessel Juno in Grays Harbor, Westport, Washington, December 28, 2013, MAB-15/05.", "spans": [[37, 326]]}, {"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 8 Figure 5. Local firefighters fighting the fire aboard Johnny M. (Source: East Marshall Fire Department) 1.3 Additional Information 1.3.1 Damage 1.3.1.1 Vessel After the fire, Coast Guard and the National Transportation Safety Board investigators boarded the Johnny M to examine the vessel damage. The vessel sustained fire damage throughout all the decks. The engine stacks’ interior and exterior and the engine room windows exhibited soot where the space ventilated to the atmosphere. The paint on the exterior of the upper engine room bulkheads was charred where the structural frames intersected with the bulkhead. Fire and heat damage was heavily concentrated in the lower level of the engine room where the main engines were located. The engine room window frames and the deck above the engine room were warped due to heat exposure (see figure 6). The outboard side of the portside stack", "spans": []}], "answer": "The NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to a shortcoming in the federal rules for towboats regarding the lack of requirement for structural fire protection. Specifically, the federal regulations do not currently mandate the use of fire-resistant materials and insulation on horizontal and vertical surfaces, doors, hatches, and in pipe and cable openings to slow the transfer of heat and smoke, which could provide additional time for evacuation and firefighting.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-7a4fa27ad0", "answerable": false, "question": "Why did the Nickelena's captain not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span?", "expected_answer": "The premise is wrong: the captain was not steering. He was still in his stateroom when the tow passed under the bridge at 0213; a crewmember was at the helm, and the captain learned of the problem only when the engineer went below to notify him.", "evidence": [], "passages": [{"doc_id": "MIR2502.pdf", "text": "planned to return to the pilothouse before the towing vessel and barge passed under the bridge. Figure 4. Infrared footage of the Nickelena towing the deck barge BMI 209 with the crane on board at 1226 the night of the contact. (Source: Enbridge Straits Maritime Operations Center) On May 7, about 0200, the captain woke up and prepared to head to the pilothouse. At 0213, while he was still in his stateroom, the crewmember at the helm guided the vessel and barge under the Mackinac Bridge’s suspension span at 8 knots within the marked channel. At some point after passing under the bridge, both the engineer, who was out on deck, and the crewmember at the helm, looked aft and, with the help of the lights of the bridge, noticed that they couldn’t see the crane’s boom. The engineer went below and notified the captain.", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 12 2 Analysis About 0200 on May 7, shortly after passing eastward under the main suspension span of the Mackinac Bridge, the crew of the commercial towing vessel Nickelena discovered that the crane they were towing 500 feet astern (aboard deck barge BMI 209) had struck the bridge and collapsed onto the barge. Before departure, managers from the towing vessel operating company visually estimated the angle of the boom to be between 50° and 60° and believed that, with its 5-foot “rooster” sheave attached, the boom was 145 feet in length (the boom was 160 feet long). Using their visual estimation of the crane’s boom angle and their boom length estimate, both of which were incorrect, they believed that the boom was at a safe height for the transit. The managers told the Nickelena captain “everything’s secured, ready to go.”", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 8 Figure 7. The boom bent backwards over the cabin after striking the bridge. (Source: Coast Guard) The crane’s mechanical boom angle indicator was extensively damaged by the contact, so investigators could not determine whether it was operational before the bridge strike. Investigators evaluated the LMI and determined that the LMI display was showing a fail mode for the boom angle, the boom pitch and roll, and the wind indicator. The system had the capability to record data, but data downloaded and evaluated later only showed the dates and times of system startups and shutdowns. 1.3.2 Boom Height Evaluation The NTSB conducted a study of the crane boom angle based on an infrared surveillance image of the crane from before the casualty (see figure 4) to estimate the height of boom at the time it contacted the Mackinac Bridge. 3 The study determined,", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge On May 7, 2023, about 0213 local time, the towing vessel Nickelena was transiting the Straits of Mackinac while towing deck barge BMI 209, transporting a crawler crane, when the crane boom struck the main span of the Mackinac Bridge (see figure 1 and figure 2). 1 The contact bent the crane boom backwards, causing the boom to eventually collapse onto the aft end of the barge. There were no injuries, and no pollution was reported. Damage to the Mackinac Bridge was estimated at $145,000; damage to the crane was estimated at $665,000. 2 Figure 1. Left to right: The Nickelena on an unknown date before the contact, and the crane aboard the BMI 209, as seen from the Nickelena during the voyage and before the contact. (Sources: US Coast Guard and Basic Towing Inc.) 1 In this report, all times are central daylight time, and all miles are statute miles. 2", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-9bee6f4b4d", "answerable": false, "question": "How fast was the fishing vessel Mystery traveling when it struck the rocks near Seal Cape, Alaska?", "expected_answer": "The report does not state the Mystery's speed at the time of the grounding.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 2 Casualty Summary NTSB casualty category Grounding/Stranding Location Near Seal Cape, about 25 miles west of Sand Point, Alaska 55°21.40' N, 161°15.00' W Date December 10, 2024 Time 2121 Alaska standard time (coordinated universal time −9 hrs) Persons on board 3 Injuries None Property damage $800,000 (vessel); $150,000 (gear) Environmental damage None reported; est. 2,000 gallons of diesel fuel, 30 gallons of lube oil, and 50 gallons of other fuel on board Weather Visibility 10 mi, overcast, winds 020° at 20 kts, seas 1 ft, air temperature 39°F, water temperature 39° F, sunset 1713 Waterway information Strait; width 7 nm, depth 42–300 ft, low tide 0400 Figure 2. Area where the Mystery grounded, as indicated by a circled X. (Background source: Google Maps)", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "2 The dockside exam verified the presence and adequate condition of required lifesaving and safety gear (a six-person liferaft and five survival suits). The vessel was rigged for long-line fishing. 1.2 Event Sequence On December 8, 2024, the Mystery began a planned 5-day transit from Dutch Harbor, Alaska—where the crew had unloaded catch after a fishing trip—back to Homer. Three crewmembers were on board (the captain, who owned the vessel, and two deckhands). On December 9 and 10, a gale warning was in effect for the Pavlof Islands, the area the vessel was transiting. Rain was also forecasted, and southeasterly 35-knot winds had been observed. On December 10, the third day of the transit, t he captain navigated the vessel through various straits around the Pavlof Islands. Rather than steering the vessel directly from the helm, the captain relied on the autopilot to steer. 3 He would enter", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-1428edcb28", "answerable": true, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; during the initial charging of one of the 48-volt battery banks using one of the portable chargers, which started on February 1, it took 5 days for the battery voltage to increase from 34 volts to 39 volts.", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "Vessel personnel determined that the BMSs were preventing the batteries from being charged from a portable charger", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 4 Figure 3. Diagram of the main deck of the Flagship showing the approximate locations of the 24-volt and 48-volt lithium-ion battery banks. ( Background source: RMK Merrill Stevens) 1.2 Event Sequence 1.2.1 Pre-casualty Events Before their installation on the Flagship during vessel construction, the 24- and 48-volt batteries for the Flagship were able to maintain a charge. There were no issues with the installation of the 48-volt lithium-ion battery systems. However, when the 24-volt system was installed, its BMS could not manage the charging of battery cells. The cause of the problem with the charging of the 24-volt lithium-ion battery system was not identified or resolved during vessel construction. During the vessel’s sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands.", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "In response, the vessel manufacturer, shipyard personnel, an elec
