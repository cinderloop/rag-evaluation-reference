each mooring line (scale approximate).", "spans": []}], "answer": "Following the Columbia Gorge breakaway at Cascade Locks, the boat's operator started renewing the ropes used to tie it up annually.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e214989bfc", "answerable": true, "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "evidence": [{"doc_id": "MIR2527.pdf", "quote": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "status": "retrieved"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "status": "not_retrieved"}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 4 Figure 3. Land-based firefighters on Lucinda Smith. (Source: New Bedford Fire Department) After the fire, US Coast Guard investigators examined the damage on the Lucinda Smith. The Coast Guard also requested assistance from Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigators, who participated in the examination of the damage. ATF investigators concluded that the fire originated in the first mate’s stateroom. Based on the fire damage patterns found within the stateroom, investigators concluded that the fire most likely originated at or near the floor (deck) by the end of the bunk. However, due to the damage to the interior of the stateroom, ATF investigators could not determine the exact ignition source and ultimately classified the cause of the fire as “undetermined.”", "spans": [[443, 487]]}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire aboard the towing vessel Lucinda Smith was an undetermined ignition source in one of the vessel’s staterooms.", "spans": []}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 6 2 Analysis While the towing vessel Lucinda Smith was moored at the dock, a crewmember heard a smoke alarm and discovered a fire in one of the staterooms. ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater). Electrical sources near the bunk included an electric heater, an oscillating fan, and an electrical wall receptacle. Crew interviews revealed that the heater and fan were not in use before the fire and thus likely were not an ignition source. The receptacle and associated vessel wiring were original to the vessel’s construction and nearly 50 years old. If there was an electrical fault—such as a loose, broken, or frayed wire, or broken receptacle hardware—within the receptacle or nearby circuitry, it could have created excessive resistance heating. Resistive heating from electrical conductors within", "spans": [[206, 364]]}, {"doc_id": "MIR2623.pdf", "text": "Fire aboard Fishing Vessel Sub Zero MIR-26-23 5 2 Analysis While the fishing vessel Sub Zero was transiting Nushagak Bay, a fire started in the engine compartment. The two crewmembers on board attempted to fight the fire but were unsuccessful and were forced to abandon the vessel into a liferaft. They were rescued by a good Samaritan fishing vessel before the Sub Zero sank. The captain initially observed smoke in the aft end of the engine compartment on the display for the two engine compartment cameras. He told investigators that the smoke appeared to be near the vessel’s hydraulic fuel tank but could not definitively confirm its location. The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "spans": [[649, 872]]}], "answer": "On the *Lucinda Smith*, investigators could determine the fire originated in the first mate’s stateroom, near the floor (deck) by the end of the bunk. However, they could not pinpoint the exact ignition source due to damage to the stateroom’s interior. \n\nOn the *Sub Zero*, investigators could not determine the ignition source because the vessel burned to the waterline, sank, and was not salvaged, preventing access for inspection.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1e72bd68f3", "answerable": false, "question": "What was the official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner?", "expected_answer": "The report does not state a medical cause of death; it says only that local paramedics pronounced the chief engineer and third engineer dead on scene.", "evidence": [], "passages": [{"doc_id": "MIR2505.pdf", "text": "began boundary cooling on the exterior engine room bulkheads. About 0336, the chief engineer reported to the captain via handheld radio that three crewmembers were in the engine room: the third engineer, wiper, and himself. Emergency teams suited up in firefighting gear to search for the crewmembers and assess the situation in the engine room. The chief engineer shut down all electrical power from the ECR, blacking out the vessel. Upon loss of power, the ECR became dark. A ll three engine crewmembers were coughing due to the smoke. The vessel’s emergency diesel generator automatically started, providing electrical power to vital equipment and lighting circuits. The three engine crewmembers attempted to leave the ECR with their faces covered with shirts soaked in water, but upon opening the ECR door into the engine room, they were met with flames and smoke, so they retreated back into the ECR.", "spans": []}, {"doc_id": "MIR2505.pdf", "text": "Engine Room Fire aboard Cargo Ves sel Stride MIR-25-05 14 Figure 8. Left: Diesel oil puddled alongside base of main engine on tanktop. Upper right: Diesel oil puddled in main engine air intake manifold. Bottom right: Diesel oil puddled in deck containment by boiler on D deck. 1.3.2 Personnel The chief engineer who was aboard the Stride at the time of the fire had 38 years of experience in the maritime industry and had worked with the company as a chief engineer on six other company vessels since 2016. This was his first trip aboard the Stride, and he joined the vessel about 7 weeks before the fire. The third engineer joined the company in 2004 as a wiper, and he had completed 26 contracts aboard various company vessels as a motorman, fourth engineer, and third engineer. This also was his first trip aboard the Stride; he joined the vessel about 3 weeks before the fire. The wiper had about 4 years of experience in the maritime industry and had", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "engineer stated that he “tried to put out the fire on [the motorman’s] coverall” before they ran up to deck 1 to the ship’s hospital to receive first aid from the ship’s doctor. About the same time, the officer on watch on the bridge received a “chain of fire alarms in the engine room.” The officer in the wheelhouse called the engineer on watch in the ECR via phone and also called the captain on his handheld radio. The captain, who was on the balcony of deck 3, felt “a shake of the ship“ and saw thick smoke coming from the vessel’s funnel. A bout this time, the chief engineer and chief mate arrived on scene in the ECR. The captain reported to the wheelhouse, and the officer on watch advised him that a failure of the no. 2 auxiliary engine had resulted in an engine room fire. Additionally, he reported that the motorman, who was near the engine, had gotten burned and was receiving first aid from the ship’s doctor.", "spans": []}, {"doc_id": "MIR2516.pdf", "text": "board. The medical examiner determined that the primary cause of death for the two fatally injured firefighters was smoke inhalation, including carbon monoxide intoxication. 1.3 Vessel 1.3.1 General The Grande Costa D’Avorio was a 692-foot-long Ro/Con vessel with 12 decks. Vehicles were loaded using a stern ramp that led up to deck 3 (see Figure 8). Deck 11 was partially exposed and had a cargo vehicle deck, weather deck, and crew accommodation space.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-2cddbb3671", "answerable": true, "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "evidence": [{"doc_id": "MIR2617.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds 8 mph west-southwest, air temperature 81°F", "status": "not_retrieved"}, {"doc_id": "MIR2620.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F", "status": "retrieved"}], "passages": [{"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 8 for tows transiting downbound between miles 869 and 303. 9 When the Vicksburg gage reached 36 feet, tows over 110 feet wide were restricted to daytime transit only through the Vicksburg bridges. Also, towing vessels over 6,000 hp, like the Myra Eckstein, had a maximum tow size of 36 barges, with a minimum of 280 hp per loaded standard barge and 560 hp per oversized barge. On the day of the casualty, the Myra Eckstein was pushing 25 standard barges (312 hp per barge). On April 27, the Mississippi River at Vicksburg was recorded having a level of 49.3 feet. According to the National Weather Service, this was the highest peak at the Vicksburg gage since 2020. On May 5, the day of the casualty, the Vicksburg gage read 46.17 feet (about 3.17 feet above major flood stage and about 16 feet above historic normal stage) and falling (see figure 7). Visibility was about 10 miles, with fair skies and", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 4 On May 5, the tow was approaching Vicksburg and two bridges: the Vicksburg Highway 80 Bridge and the Vicksburg Interstate 20 Bridge (see figure 2). The Vicksburg Highway 80 Bridge opened in 1930 and originally served as a highway and railroad crossing (see figure 4). The bridge had been closed to vehicular traffic for several years, serving solely as a railway bridge. Vehicular traffic was carried via the Vicksburg Interstate 20 Bridge, which was about 315 feet downstream from and ran parallel to the Vicksburg Highway 80 Bridge. The Coast Guard recorded 29 reportable contacts with the bridge between March 2010 and February 2024. 4 Figure 4. The Vicksburg Highway 80 Bridge, as viewed looking downriver. (Background source: US Army Corps of Engineers) About 0940, the captain began maneuvering the tow at 9 mph around", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 2 Casualty Summary Casualty type Contact Location Lower Mississippi River, mile 435.8, near Vicksburg, Mississippi 32°18.82' N, 090°54.28' W Date May 5, 2025 Time 0957 central daylight time (coordinated universal time –5 hrs) Persons on board 10 Injuries None Property damage $941,000 est. Environmental damage None Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F, morning twilight 0545, sunrise 0611 Waterway information River; width 0.5 mi, depth 45 ft, current 6 mph est. Figure 2. Area where the Myra Eckstein tow contacted the Vicksburg Highway 80 Bridge, as indicated by a circled X. (Background source: Google Maps)", "spans": [[388, 475]]}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 5 Delta Point and toward the Vicksburg bridges during that period, including the Myra Eckstein, was west of the “recommended track” (sailing line) shown on the inland electronic navigation chart and displayed on the Myra Eckstein’s electronic chart system. 7 Figure 5. Trackline of the Myra Eckstein tow (highlighted orange) before and during the contact with the Vicksburg Highway 80 Bridge, the recommended track (highlighted yellow), and the tracklines of vessels (black) transiting downbound in daylight hours from 1000 on May 4, 2025, to 0958 on May 5, 2025. (Background source: Corps of Engineers Inland Electronic Navigation Chart U35LM425 as viewed on Made Smart) The captain was unable to correct the heading and align the tow between the piers of the bridge. About 0957, the lead barge of the starboard string, the CC-1109,", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b741e1b429", "answerable": false, "question": "What was the name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine?", "expected_answer": "The report does not give this detail; it says only that a tugboat was dispatched to recover the Three Girls, which was docked in Portland on August 14.", "evidence": [], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 9 The William Chadwick arrived in Portland at 1100 the following morning (August 12). The Three Girls remained afloat as the fire continued to smolder. The following day, a tugboat was dispatched to recover the Three Girls, and on August 14, the Three Girls was docked in Portland. The local fire department boarded the vessel and extinguished the fire using water and foam. 1.3 Additional Information 1.3.1 Damage After the fire was extinguished, National Transportation Safety Board and Coast Guard investigators boarded the Three Girls to inspect the damage. The Coast Guard also requested assistance from a local Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigator, who participated in the examination of the damage. The steel bulkheads, decks, and overhead of the wheelhouse displayed several areas of deck and bulkhead warpage, and all contents inside the wheelhouse", "spans": []}], "answer": "The documents do not contain the name of the tugboat that recovered the burning fishing vessel Three Girls.", "judges": ["groundedness", "abstention"]}, {"key": "t-404724dbc2", "answerable": true, "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "evidence": [{"doc_id": "MIR2619.pdf", "quote": "He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 9 Figure 5. Diagram (looking toward the Erving’s bow) showing the position of the STS crane boom if it were raised versus its position at the time of the accident. (Scale approximate.) One of the STAX 1 deckhands repairing the exhaust duct on the Erving ran toward the starboard-side handrails of the funnel. He yelled and waved his arms in the direction of the crane operator trolley cab, which was about 200 feet away, to indicate that the operator should stop moving the crane. No one was in the cab, but he was unable to see into the trolley cab due to the angle of the trolley cabin front windshield. At 1649, while STS crane 16 was moving toward the stern of the vessel, the crane contacted the STAX 1 emission capture boom (see figure 6). Sections of boom fell onto STAX 1, onto the Erving, and into the water. A portion of the emission", "spans": [[398, 569]]}, {"doc_id": "MIR2619.pdf", "text": "foremen’s trailer to conduct his routine round, checking the highline and decking (cargo/container staging) areas in his work truck before the start of the flex shift. He checked which cranes needed to be moved on the flex shift. While at the decking area, about 1646, he heard operations manager 1 call out on VHF radio that crane operator 1 could not get STS crane 16 boomed up. While operations manager 2 was checking the highline and decking area, crane operator 2 proceeded to STS crane 15’s waterside dock-level control station to move STS crane 15 to the next cargo bay. (STS crane 15’s boom was in the lowered position.) Crane operator 2 told investigators that he was unaware that the STAX 1 was operating next to the Erving (his line of sight was blocked by the containership). He stated, “If I would’ve seen that [emission capture boom], I would have stopped.” Crane operator 2 explained to investigators that the first-shift crane operators", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "not include any information about the location of the barge or its emission capture boom. Had the crane operator waited for the pre-shift planning meeting and been aware of the STAX 1’s location, he may have opted not to move the crane.", "spans": []}, {"doc_id": "MIR2619.pdf", "text": "Collapse of Emissions Control Barge STAX 1 Capture and Control Articulated Arm MIR-26-19 17 Regardless of the crane operator’s awareness of the STAX 1, the only way to ensure the lowered boom could clear the Erving’s exhaust stack before gantrying the crane would have been to have positive confirmation of line of sight from the crane’s trolley cabin. According to the ILWU and the PMA’s Pacific Coast Marine Safety Code, crane operators “shall not operate cranes when visibility cannot be maintained to assure a safe operation.” An FMS ship boss told investigators he believed that, typically, crane operations should be performed in the trolley cab rather than using the waterside dock-level control station. According to crane operator 2 and ship boss 2, moving a crane typically also involved a second person: a dock signal person positioned on the dock where they could observe the crane’s movement along its", "spans": []}], "answer": "The worker was approximately 200 feet away from the crane's operator cabin.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-41de45b070", "answerable": true, "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "evidence": [{"doc_id": "MIR2509.pdf", "quote": "The mate was then able to reach the Brunswick crew over VHF radio to make passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.”", "status": "partly"}], "passages": [{"doc_id": "MIR2509.pdf", "text": "the Local Notice to Mariners, along with a request for vessels to arrange safe passage when transiting nearby. To pass the area where the Brunswick was dredging, a vessel would need to either (1) request that the Brunswick move the floating discharge pipeline so that it was not extending across the river, or (2) pass to the west of the Brunswick, along the west bank of the Cooper River. The dredge crew moved the floating discharge pipe frequently to accommodate passing traffic during normal operations. On the Royal Engineer, the mate was on watch in the wheelhouse. During the transit south, he attempted to hail the dredge via VHF radio about 1 hour before the tow reached the dredge’s location. According to the mate, he intended to request", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.” He said he could swing the dredge around and provide about 300 feet of clearance to the seawall, not including the width of the Celsius Nicosia. The mate informed the dredge captain that he would have enough room to maneuver the Royal Engineer tow so it would pass between the Brunswick and the Celsius Nicosia (see figure 4). Figure 4. The Royal Engine er’s path between the dredge Brunswick and the containership Celsius Nicosia at 1620. (Background source: Esri satellite image as viewed on Made Smart)", "spans": [[0, 268]]}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 10 2 Analysis While the towing vessel Royal Engineer was pushing the crane barge Stevens 1471 in the Cooper River, the tow transited underneath an STS crane at the North Charleston Terminal while maneuvering through a narrow area between a docked containership and a dredging vessel because the dredge’s floating discharge pipeline was blocking the rest of the channel. The barge crane contacted the STS crane, resulting in extensive damage to the STS crane. The Royal Engineer mate was aware of the dredging operations along the tow’s transit route. The day before the contact, on January 3, he had transited the area between the dredge and the North Charleston Terminal, but there was no containership berthed at the terminal. The mate told investigators that, on the day of the contact, he attempted twice to contact the dredge crew early—first an hour and", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 4 According to technical drawings, the mast reached a height of 144.6 feet above the deck of the barge. The air draft of the crane barge was noted on the towboat’s voyage plan as 145 feet. Figure 3. Approximate towing configuration of the Royal Engineer p ushing the Ste vens 1471. The crane components and their measurements are labeled. Along the Royal Engineer tow’s route, the Brunswick, a 315-foot-long dredge and barge, was dredging the Cooper River channel adjacent to the North Charleston Terminal, located about 1 mile north of the Don Holt Bridge. The Brunswick’s floating discharge pipeline extended eastward across the Cooper River channel, where dredge spoils were discharged near the eastern bank, effectively blocking the channel to traffic moving north and south. The dredging operation was published in", "spans": []}], "answer": "The skipper of the dredge Brunswick wanted the Royal Engineer and its crane barge to pass between the dredge and the dock because he had workers downstairs who were working on something, and he would have to stop them to go do something else. He preferred this path to avoid disrupting the work of his crew.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6ec66ca174", "answerable": false, "question": "Why did the Nickelena's captain not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span?", "expected_answer": "The premise is wrong: the captain was not steering. He was still in his stateroom when the tow passed under the bridge at 0213; a crewmember was at the helm, and the captain learned of the problem only when the engineer went below to notify him.", "evidence": [], "passages": [{"doc_id": "MIR2502.pdf", "text": "planned to return to the pilothouse before the towing vessel and barge passed under the bridge. Figure 4. Infrared footage of the Nickelena towing the deck barge BMI 209 with the crane on board at 1226 the night of the contact. (Source: Enbridge Straits Maritime Operations Center) On May 7, about 0200, the captain woke up and prepared to head to the pilothouse. At 0213, while he was still in his stateroom, the crewmember at the helm guided the vessel and barge under the Mackinac Bridge’s suspension span at 8 knots within the marked channel. At some point after passing under the bridge, both the engineer, who was out on deck, and the crewmember at the helm, looked aft and, with the help of the lights of the bridge, noticed that they couldn’t see the crane’s boom. The engineer went below and notified the captain.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-04ce64eb07", "answerable": false, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "evidence": [], "passages": [{"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 2 Analysis While the City of Louisville was upbound on the Upper Mississippi River pushing 11 empty barges, the towing vessel ran aground near mile 42.6 in a charted shallow and rocky area. The grounding caused fractures to the vessel’s bottom plating underneath the engine room, leading to water flooding into the engine room, machinery, and aft accommodation spaces. The pilot of the City of Louisville was alone on watch in the wheelhouse when the grounding occurred. The pilot told investigators that, before the grounding, he had left the helm and was on the port side of the wheelhouse. He estimated he was away from the helm about 5 minutes. Leaving the helm unattended is contrary to prudent navigation practices when operating on rivers. The Mississippi River, in particular, has frequent turns, and the potential for strong currents and heavy traffic.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "for a fleet on the Upper Mississippi River at mile 126 near St. Genevieve, Missouri. The overall length of the tow was about 738 feet, and the overall width was about 140 feet (see figure 3). Figure 3. City of Louisville tow arrangement (scale approximate). On July 29, about 1100, the pilot took over the navigational watch in the wheelhouse from the relief captain for their normally scheduled watch change. The City of Louisville proceeded upriver without event, with the pilot at the helm and making a speed of about 4 to 5 mph. According to the pilot, the tow was traveling at 3 Pilot is a term used aboard towing vessels on inland waterways for a person, other than the captain, who navigates the vessel.", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "engine room, causing the vessel to settle to the bottom. There were eventually about 4 feet of water in the lower engine room. The tow remained intact, facing upriver after the grounding. The pilot said they were unable to move the vessel off the rocks. About 3 hours after the grounding, at 1753, thunderstorms passed through the area, which required the crew and responding personnel to evacuate the City of Louisville. Winds from the storm moved the tow to starboard, causing it to pivot on the rocks; the tow was then oriented toward the left descending bank. As the river stage later rose, the water level inside the engine room increased, and the main deck rudder room and aft galley/mess area also flooded. Figure 5. The City of Louisville aground. (Source: Coast Guard) 1.3 Additional Information There were no reported defects or deficiencies with the City of Louisville’s navigational, steering, communication, and propulsion systems. 5", "spans": []}, {"doc_id": "MIR2519.pdf", "text": "Grounding of Towing Vessel City of Louisville MIR-25-19 a reduced speed at the customer’s request, since they were not in a rush to receive the barges. The pilot told investigators that, about 1442, he left the helm. Before doing so, he looked out the wheelhouse front window and saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system). He also checked the swing meter, fathometer, and electronic chart system (ECS). At that time, the boat’s ECS recorded the vessel on a heading of 349° at 4.8 mph and about 45 yards to the east of the sailing line, which had a course line of 347°. 4 He told investigators that he then went to the port side of the wheelhouse and relieved himself into a bag while looking out of the portside window. At 1444, on a heading of 344° at 4.7 mph, the City of Louisville tow passed a point where the sailing line changed course from 347° to 356°. About a minute later, the", "spans": []}], "answer": "The City of Louisville was **not fitted with an autopilot system**, which means it did not have an automated system to maintain the vessel's heading or course. This absence of an autopilot system is directly related to the incident, as it left the vessel without an automated means of keeping it on the intended sailing line.\n\nThe pilot left the helm unattended for approximately 5 minutes, during which time the tow was not being actively steered. Since there was no autopilot to maintain the course, the vessel was vulnerable to external factors such as currents, wind, and the natural movement of the tow. The pilot had previously noted that there was no swing of the tow, indicating that the vessel was steady at the time he left the helm. However, as the tow passed a point where the sailing line changed course, the vessel likely drifted off the intended path due to the lack of active steering and the absence of an autopilot system to compensate for any deviations.\n\nIn summary, the malfunction was not a technical failure of an autopilot system, but rather the **absence of an autopilot system altogether**, which left the vessel without an automated means to maintain its course while the pilot was away from the helm. This lack of automation contributed to the tow wandering out of the channel.", "judges": ["groundedness", "abstention"]}, {"key": "t-953cfc3e28", "answerable": false, "question": "Why did the towboat Harlan Creek and its barges strike the lock wall at Markland Locks and Dam on the Ohio River in 2025?", "expected_answer": "The reports do not cover a contact by a tow of the Harlan Creek at Markland Locks and Dam; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 71 Report Investigation Year Title Summary Probable Cause MIR-25-14 DCA24FM025 2024 Contact of Amber Brittany Tow with Vane Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart. There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. The National Transportation Safety Board determines that the probable cause of the contact of the Amber Brittany tow with the vane dike was the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his", "spans": []}, {"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Va n e Dike On March 8, 2024, about 1550 local time, the towing vessel Amber Brittany was transiting upbound on the Ohio River, pushing a 15-barge tow, when the tow struck the vane dike at the upstream end of the McAlpine Locks and Dam in Louisville, Kentucky, and broke apart (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Total damages to the barges, cargo, and dam gates were estimated at $1.3 million. 2 Figure 1. The Amber Brittany on July 28, 2022, before the contact. (Source: Matt Burks) 1 In this report, all times are eastern standard times, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM025). Use the CAROL Query to search investigations. April 4, 2025 MIR-25-14", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-34e686d3f4", "answerable": true, "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "evidence": [{"doc_id": "MIR2527.pdf", "quote": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "status": "partly"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "status": "not_retrieved"}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 4 Figure 3. Land-based firefighters on Lucinda Smith. (Source: New Bedford Fire Department) After the fire, US Coast Guard investigators examined the damage on the Lucinda Smith. The Coast Guard also requested assistance from Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigators, who participated in the examination of the damage. ATF investigators concluded that the fire originated in the first mate’s stateroom. Based on the fire damage patterns found within the stateroom, investigators concluded that the fire most likely originated at or near the floor (deck) by the end of the bunk. However, due to the damage to the interior of the stateroom, ATF investigators could not determine the exact ignition source and ultimately classified the cause of the fire as “undetermined.”", "spans": [[443, 487]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6e3fefbfeb", "answerable": true, "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "evidence": [{"doc_id": "MIR2544.pdf", "quote": "Casualty type Flooding/Hull Failure", "status": "retrieved"}], "passages": [{"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole On June 12, 2024, about 1530 local time, the towing vessel Cajole was upbound the Lower Mississippi River near Waggaman, Louisiana, when the vessel began flooding (see figure 1 and figure 2). 1 The two crewmembers aboard attempted to pump out the vessel but were unsuccessful. They tied off to a nearby barge and evacuated to a Good Samaritan vessel. The Cajole later sank. There were no injuries, and a sheen was reported. Damage was estimated at $2 million. Figure 1. Cajole underway on an unknown date before the sinking. (Source: marinetraffic.com, Mark Haury) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM046). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-44", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 2 Casualty Summary Casualty type Flooding/Hull Failure Location Lower Mississippi River, mile 112, Waggaman, Louisiana 29°57.77’ N, 090°14.35’ W Date June 12, 2024 Time 1530 central daylight time (coordinated universal time –5 hrs) Persons on board 2 Injuries None Property damage $2 million Environmental damage Sheen on water, 4,277 gal diesel fuel recovered (est. fuel capacity 5,000 gal) Weather Visibility 7 mi, partly cloudy, winds east-northeast 7 kts, air temperature 91°F Waterway information River width 2,100 ft, depth 33 ft, current est. 2 kts Figure 2. Area where the Cajole flooding occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[74, 109]]}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 10 2 Analysis While transiting the Lower Mississippi River, the towing vessel Cajole flooded and sank after taking on water near mile 113. Partway through the transit, the captain reported that the vessel was losing speed; he later entered the engine room and saw water entering the engine room space from the forward starboard corner near a bulkhead penetration (conduit). There were two spaces forward of the engine room’s forward bulkhead: the auxiliary space and bow void. After the towboat was salvaged, investigators found no hull damage that would have allowed water ingress into these spaces. According to the captain, the cover on an access hatch to the starboard-side auxiliary void was in place when he discovered the flooding in the engine room. The cover was lost during the casualty, so investigators were not able to evaluate its condition. The hatch was flush", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 5 these preparations, about 0630, the vessel departed the shipyard with the captain at the helm, transiting north in the Harvey Canal, bound for Weber Marine in Convent, Louisiana. Between departure and 0745, the captain received an alarm on the bridge. The captain could not recall the nature of the alarm. He silenced the alarm and continued navigating the vessel. About 0745, the Cajole transited Harvey Lock, turned to port, and proceeded upbound on the Mississippi River. Over the next 3-4 hours, the vessel continued at speeds between 3 and 8.5 knots, averaging about 5 knots. Throughout the voyage, to accommodate vessel traffic, the Cajole crossed the river, first crossing to the right descending bank, then the left descending bank. 2 At 1102, the vessel again crossed the river to the right descending bank, turning sharply to port, with the starboard side of the vessel exposed to the current.", "spans": []}], "answer": "The casualty summary indicates that the failure which led to the loss of the towboat Cajole on the Mississippi River near Waggaman was **flooding/hull failure**. This occurred when the vessel took on water near mile 113, resulting in the flooding of the engine room and ultimately the sinking of the vessel.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5a2578f0db", "answerable": false, "question": "Why did the Nickelena's captain not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span?", "expected_answer": "The premise is wrong: the captain was not steering. He was still in his stateroom when the tow passed under the bridge at 0213; a crewmember was at the helm, and the captain learned of the problem only when the engineer went below to notify him.", "evidence": [], "passages": [{"doc_id": "MIR2502.pdf", "text": "planned to return to the pilothouse before the towing vessel and barge passed under the bridge. Figure 4. Infrared footage of the Nickelena towing the deck barge BMI 209 with the crane on board at 1226 the night of the contact. (Source: Enbridge Straits Maritime Operations Center) On May 7, about 0200, the captain woke up and prepared to head to the pilothouse. At 0213, while he was still in his stateroom, the crewmember at the helm guided the vessel and barge under the Mackinac Bridge’s suspension span at 8 knots within the marked channel. At some point after passing under the bridge, both the engineer, who was out on deck, and the crewmember at the helm, looked aft and, with the help of the lights of the bridge, noticed that they couldn’t see the crane’s boom. The engineer went below and notified the captain.", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 12 2 Analysis About 0200 on May 7, shortly after passing eastward under the main suspension span of the Mackinac Bridge, the crew of the commercial towing vessel Nickelena discovered that the crane they were towing 500 feet astern (aboard deck barge BMI 209) had struck the bridge and collapsed onto the barge. Before departure, managers from the towing vessel operating company visually estimated the angle of the boom to be between 50° and 60° and believed that, with its 5-foot “rooster” sheave attached, the boom was 145 feet in length (the boom was 160 feet long). Using their visual estimation of the crane’s boom angle and their boom length estimate, both of which were incorrect, they believed that the boom was at a safe height for the transit. The managers told the Nickelena captain “everything’s secured, ready to go.”", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 8 Figure 7. The boom bent backwards over the cabin after striking the bridge. (Source: Coast Guard) The crane’s mechanical boom angle indicator was extensively damaged by the contact, so investigators could not determine whether it was operational before the bridge strike. Investigators evaluated the LMI and determined that the LMI display was showing a fail mode for the boom angle, the boom pitch and roll, and the wind indicator. The system had the capability to record data, but data downloaded and evaluated later only showed the dates and times of system startups and shutdowns. 1.3.2 Boom Height Evaluation The NTSB conducted a study of the crane boom angle based on an infrared surveillance image of the crane from before the casualty (see figure 4) to estimate the height of boom at the time it contacted the Mackinac Bridge. 3 The study determined,", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge On May 7, 2023, about 0213 local time, the towing vessel Nickelena was transiting the Straits of Mackinac while towing deck barge BMI 209, transporting a crawler crane, when the crane boom struck the main span of the Mackinac Bridge (see figure 1 and figure 2). 1 The contact bent the crane boom backwards, causing the boom to eventually collapse onto the aft end of the barge. There were no injuries, and no pollution was reported. Damage to the Mackinac Bridge was estimated at $145,000; damage to the crane was estimated at $665,000. 2 Figure 1. Left to right: The Nickelena on an unknown date before the contact, and the crane aboard the BMI 209, as seen from the Nickelena during the voyage and before the contact. (Sources: US Coast Guard and Basic Towing Inc.) 1 In this report, all times are central daylight time, and all miles are statute miles. 2", "spans": []}], "answer": "The Nickelena's captain did not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span due to a combination of factors, including the limited visibility, the positioning of the crew, and the reliance on incorrect visual estimates of the crane's boom height.\n\n### Key Reasons:\n1. **Limited Visibility**:  \n   The crew was operating in the early morning hours, and visibility may have been reduced due to low light conditions. Additionally, the bridge's structure and the surrounding environment could have further limited the crew's ability to see the crane boom clearly.\n\n2. **Positioning of the Crew**:  \n   The captain was still in his stateroom at the time of the incident, and the crewmember at the helm was guiding the vessel and barge under the bridge. The engineer, who was on deck, and the helm crewmember noticed the issue after passing under the bridge. This suggests that the captain was not in a position to observe the event in real time.\n\n3. **Incorrect Visual Estimates**:  \n   Before departure, managers from the towing vessel operating company visually estimated the angle of the boom to be between 50° and 60°, believing that the boom was at a safe height for transit. These estimates were later found to be incorrect, and the actual boom height was likely too low, leading to the collision.\n\n4. **Lack of Real-Time Monitoring**:  \n   The crane's mechanical boom angle indicator was extensively damaged by the contact, and the LMI (Lift Monitoring Indicator) system was in a fail mode, meaning it could not provide real-time data on the boom's position or height. This lack of monitoring contributed to the inability to detect the impending collision.\n\n5. **Delayed Detection**:  \n   The crew only noticed the issue after passing under the bridge, indicating that the collision occurred without immediate awareness from the captain or the helm crew. The boom's collapse onto the barge was likely a result of the impact, which was not detected until after the fact.\n\nIn summary, the captain's failure to notice the collision was due to a combination of limited visibility, the crew's positioning, incorrect visual estimates of the boom's height, and the lack of real-time monitoring systems to detect the impending collision.", "judges": ["groundedness", "abstention"]}, {"key": "t-bce0bb2724", "answerable": true, "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "As a result of the casualty, the operating company required mooring lines to be replaced annually.", "status": "partly"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "and subsequent drifting, witnesses described blizzard conditions, including winds ranging from 35–80 mph, with 3–4 feet waves. The RCA Team also found that the vessel operator had no “life cycle management program” for examining or replacing mooring lines before they would break when in use. The team’s report stated that “standard 1.5 in [nylon] lines generally last about one year”; the ages of the Columbia Gorge’s mooring lines ranged from 5 months to 10 years, with the age of some lines either unknown or not definitively known. Additionally, the team concluded that there may not have been sufficient slack in the galvanized chain “to allow the nylon lines to flex and stretch smoothly enough to avoid breakage.” As a result of the casualty, the operating company instituted two new safety measures: mooring lines are to be replaced annually, and the vessel will be crewed and/or moved when forecasted wind gusts exceed 70 knots. 2 Analysis", "spans": [[721, 771]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 7 On January 16, three days after the casualty, the Port of Cascade Locks Port Commission established an internal Root Cause Analysis (RCA) Team to investigate the Columbia Gorge unmooring. The RCA Team identified two root causes related to the mooring arrangement: mooring line age and the lack of a “lifecycle management program,” and likely insufficient slack in the galvanized chain. 4 The RCA Team determined that the mooring arrangement and size of the nylon lines used would have been “sufficient for the loads that occurred during the incident” if the lines had been new or in good condition. Their conclusion was based on the Columbia Gorge’s history of remaining docked during past weather events with similarly high winds. According to the RCA Team report, at the time of the Columbia Gorge’s unmooring", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "arrangement was six nylon mooring lines and no chain). The bow line was tight, and crewmembers estimated there was less than a foot of slack in the breast lines and the chain (see Figure 3). The vessel was uncrewed while docked, and, in the days before the breakaway, the crew checked the vessel’s mooring a few times a day. Figure 3. Columbia Gorge mooring arrangement on January 13, 2024, including the diameters of and materials comprising each mooring line (scale approximate).", "spans": []}], "answer": "Following the Columbia Gorge breakaway at Cascade Locks, the boat's operator started renewing the ropes used to tie it up annually.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e624cfb1a8", "answerable": true, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "evidence": [{"doc_id": "MIR2523.pdf", "quote": "Time 1855 eastern standard time", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "Weather Visibility 10 mi, overcast, winds west 3 kts, air temperature 60° F, water temperature 43° F, sunset 1730", "status": "not_retrieved"}, {"doc_id": "MIR2523.pdf", "quote": "At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties", "status": "retrieved"}], "passages": [{"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 NOTE: This report was reissued August 4, 2026, with corrections to the descending bank labels on the graphic on p. 5. Grounding of Towing Vessel Tom Frazier On February 10, 2024, about 1855 local time, the towing vessel Tom Frazier was pushing 15 empty hopper barges upbound on the Ohio River, near Portsmouth, Ohio, when the vessel grounded on a submerged jetty w hile maneuvering to meet a downbound tow (see figure 1 and figure 2). 1 The nine crewmembers aboard the towboat were safely evacuated to shore. There were no injuries. An estimated 5 gallons of oil w ere released from the Tom Frazier. Damage to the vessel was $258,737. 2 Figure 1. The Tom Frazier underway in 2008. (Source: Billy Smith) 1 In this report, all times are eastern standard time, and all miles are statute miles. 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 5 CORRECTED COPY While the Tom Frazier tow was running close to and parallel with the right descending bank, outside the charted 9-foot-depth contour line, about mile 355, the empty barges passed over the jetties. At 1855, as the captain of the Tom Frazier attempted to maneuver the tow back into the channel while making a speed of about 4 mph, the Tom Frazier grounded on one of the jetties, puncturing the bottom plating and flooding a forward compartment (see figure 5). Figure 5. Trackline of Tom Frazier tow as the vessel transited through the U.S. Grant Bridge and toward the right descending bank. Inset satellite photos show the jetties visible on January 26, 2022 (17.4 to 18.5 feet at the Portsmouth gage) and submerged on February 14, 2024 (28.7 to 31.6 feet at the Portsmouth gage). (Background source: Google Earth; trackline source: Tom Frazier automatic identification system; gage data: United States", "spans": [[263, 441]]}, {"doc_id": "MIR2523.pdf", "text": "Grounding of Towing Vessel Tom Frazier MIR-25-23 8 Figure 8. Ohio River water levels at Portsmouth between August 10, 2023, and February 11, 2024. (Source: US Geological Survey) 1.3.3 Crew The Tom Frazier captain held a Coast Guard-issued credential as master of towing vessels on the Western Rivers. He had worked in the industry for 23 years and with the operating company for 3 years. He stated that he had frequented the area many times in his career but not in the previous 2 or 3 years.", "spans": []}, {"doc_id": "MIR2523.pdf", "text": "Geological Survey) The Tom Frazier began listing to starboard, and the engine room flooded (see figure 6). The captain of the Tom Frazier notified US Coast Guard Sector Ohio Valley, via VHF radio, that they were taking on water and had nine people aboard. The Coast Guard notified Greenup County, Kentucky, officials, who launched the Southshore, Lloyd, and Portsmouth Fire Departments, among others, to the scene. Local first responders, individuals ashore, and crews from nearby vessels evacuated the crew to shore. The Tom Frazier tow was transferred to the towing vessel Marty B, which towed the empty barges to McGinnis’ Debi Jo Dock (mile 334) in Greenup, Kentucky.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-ff9b8fcd62", "answerable": true, "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Persons on board 17 (5 crewmembers and 12 passengers)", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 3 1 Factual Information On August 30, 2024, about 1900, the 51.6-foot-long charter fishing vessel Jig Strike departed from San Diego, California, with a crew of five (captain, second captain, two deckhands, and a cook). 2 The vessel had been chartered for a fishing trip lasting a day and a half, and 12 passengers were aboard. The vessel, which had a wood-framed and plywood hull with fiberglass (fiberglass-reinforced plastic) overlay, transited through the night toward Cortes Bank, located about 100 miles west of San Diego. The weather was calm at departure, but according to the captain, in the morning “ it started getting a little bumpy.” Winds were 12–15 knots with swells of 3–6 feet. The vessel arrived at Cortes Bank shortly before 0700 on August 31. The passengers fished at two different locations, but a fter the crew received word that", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike On August 31, 2024, about 1035 local time, the charter fishing vessel Jig Strike was transiting between fishing locations near Cortes Bank in the Pacific Ocean, about 100 miles west of San Diego, California, when the vessel began rapidly taking on water (see figure 1 and figure 2). 1 The crew was unable to stem the flooding, and the five crewmembers and 12 passengers on board abandoned ship into a liferaft. They were rescued by a nearby good Samaritan vessel, and the Jig Strike later sank. There were no injuries, and no pollution was reported. The vessel was a total loss estimated at $475,000. Figure 1. Jig Strike underway at unknown date. (Source: Jig Strike Sportfishing, facebook.com) 1 (a) In this report, all times are Pacific daylight time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": []}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 2 Casualty Summary NTSB casualty category Flooding/Hull Failure Location Cortes Bank, Pacific Ocean, 100 nm west San Diego, California 32°28.00’ N, 119°12.00’ W Date August 31, 2024 Time 1035 Pacific daylight time (coordinated universal time −7 hrs) Persons on board 17 (5 crewmembers and 12 passengers) Injuries None Property damage $475,000 est. Environmental damage None Weather Partly cloudy, winds west-northwest 15–18 kts, seas 1–2 ft, swells south- southwest 3–6 ft, air temperature 64°F, water temperature 67°F, sunrise 0623 Waterway information Ocean; Cortes Bank depths 6–1,000 ft Figure 2 . Area where the Jig Strike flooded and sank, as indicated by a circled X. (Background source: Google Maps)", "spans": [[318, 371]]}], "answer": "The total head count aboard the Jig Strike when it flooded off Cortes Bank was 17 people, consisting of 5 crewmembers and 12 passengers.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-114b6c7556", "answerable": true, "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "evidence": [{"doc_id": "MIR2503.pdf", "quote": "Engine power; manufacturer 2 x 3,000 hp (2,237 kW); GE 7FDL12 diesel engines", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "The vessel’s propulsion was provided by two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Vessel electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp (see figure 3). The main engines operated at variable revolutions per minute based on the vessel’s input speed command. The auxiliary engines ran at 1,800 rpm. A 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "an electric motor, assisted with maneuvering. Two main engine shaft-driven generators and two 2,442-hp (1,821-kilowatt) Caterpillar 3512C auxiliary diesel engines, each coupled to an electric generator, provided electrical power for the vessel. The auxiliary diesel engines could be started from three locations: locally at a control panel next to the engines, remotely from the machinery control room (MCR), or remotely from the wheelhouse. 3 Each engine was equipped with a pre-lube pump that circulated pressurized lube oil throughout the stopped engine after receiving a start signal and before the engine began the starting sequence. 4 The two auxiliary engines had been installed aboard the Stuyvesant in December 2022, replacing older engines that had reached the end of their service life. The engine’s operation and maintenance manual indicated that the engines (with deep sump) had an approximate lube oil capacity of 162–165 gallons. 1.2 Event Sequence", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "or unloading equipment (such as conveyor and boom) were operational, a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power. The unloading generator was located on the starboard side of the barge’s main deck, aft of the auxiliary motor control center (MCC), with supply fan ducting in the overhead on the starboard side. The engine was positioned on the barge, with the turbochargers facing the forward direction, between the back of the engine and the generator. Figure 3. Unloading generator space on barge Pathfinder. (Background source: Interlake Steamship Co.)", "spans": []}, {"doc_id": "MIR2609.pdf", "text": "at 385 hp (287 kilowatts) and connected via a set of reduction gears to a fixed-pitch propeller. Electrical power was provided by two John Deere diesel engine–driven generators, each rated at 133 hp (99 kilowatts). The vessel was also equipped with a 36-hp (27-kilowatt) generator, located in the engine room, for emergency power. The Oliver Hazard Perry was equipped with high-water bilge alarms as required by the Coast Guard. Eight high-level bilge sensors were located throughout the vessel on the lower deck: one in the forepeak space, three in the berthing spaces, one in the auxiliary machine space (AMS), two in the engine room, and one in the fixed fire extinguishing system room. The AMS contained electrical panels, pumps, and other electrical equipment. It was adjacent to, and forward of, the engine room and separated by a watertight bulkhead that was fitted with a hinged watertight door.", "spans": []}], "answer": "The Bonnie G was equipped with two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. These engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp. The main engines operated at variable revolutions per minute based on the vessel’s input speed command. Additionally, the vessel had a 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-41b14396a0", "answerable": true, "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "As a result of the casualty, the operating company required mooring lines to be replaced annually.", "status": "partly"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "and subsequent drifting, witnesses described blizzard conditions, including winds ranging from 35–80 mph, with 3–4 feet waves. The RCA Team also found that the vessel operator had no “life cycle management program” for examining or replacing mooring lines before they would break when in use. The team’s report stated that “standard 1.5 in [nylon] lines generally last about one year”; the ages of the Columbia Gorge’s mooring lines ranged from 5 months to 10 years, with the age of some lines either unknown or not definitively known. Additionally, the team concluded that there may not have been sufficient slack in the galvanized chain “to allow the nylon lines to flex and stretch smoothly enough to avoid breakage.” As a result of the casualty, the operating company instituted two new safety measures: mooring lines are to be replaced annually, and the vessel will be crewed and/or moved when forecasted wind gusts exceed 70 knots. 2 Analysis", "spans": [[721, 771]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 7 On January 16, three days after the casualty, the Port of Cascade Locks Port Commission established an internal Root Cause Analysis (RCA) Team to investigate the Columbia Gorge unmooring. The RCA Team identified two root causes related to the mooring arrangement: mooring line age and the lack of a “lifecycle management program,” and likely insufficient slack in the galvanized chain. 4 The RCA Team determined that the mooring arrangement and size of the nylon lines used would have been “sufficient for the loads that occurred during the incident” if the lines had been new or in good condition. Their conclusion was based on the Columbia Gorge’s history of remaining docked during past weather events with similarly high winds. According to the RCA Team report, at the time of the Columbia Gorge’s unmooring", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "arrangement was six nylon mooring lines and no chain). The bow line was tight, and crewmembers estimated there was less than a foot of slack in the breast lines and the chain (see Figure 3). The vessel was uncrewed while docked, and, in the days before the breakaway, the crew checked the vessel’s mooring a few times a day. Figure 3. Columbia Gorge mooring arrangement on January 13, 2024, including the diameters of and materials comprising each mooring line (scale approximate).", "spans": []}], "answer": "Following the Columbia Gorge breakaway at Cascade Locks, the boat's operator started renewing the ropes (mooring lines) used to tie up the vessel **annually**. This change was implemented as one of the new safety measures introduced after the incident, in response to the findings of the Root Cause Analysis (RCA) Team. The RCA Team had identified that the mooring lines were not being replaced frequently enough, and that their age and condition contributed to the unmooring incident.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-dedbb20ce1", "answerable": true, "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "evidence": [{"doc_id": "MIR2630.pdf", "quote": "However, the captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "status": "partly"}], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": [[888, 939]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 7 Figure 4. The Mystery (circled) aground as seen from the former location of the Seal Cape Light on January 16, 2025. (Background source: Coast Guard) 1.3.2 Crew Experience The captain had over 20 years of experience, fishing from Mexico to Alaska. Deckhand 2 had at least 25 years of experience and fished with his own vessel. Deckhand 1’s navigational experience was unavailable. 1.3.3 Chart Plotter The captain reported that the Mystery’s chart plotter had frozen on previous occasions. He reported that when the chart plotter froze, the autopilot would slowly turn the vessel to port, as he believed it had on the evening of the grounding. The captain noted that he had never experienced issues with the autopilot. He stated that the freezing issue could be corrected by rebooting the chart plotter. Due to similar freezing issues on previously installed chart plotters from the same manufacturer, the", "spans": [[584, 629]]}, {"doc_id": "MIR2630.pdf", "text": "which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port. Therefore, on the night of the grounding, the chart plotter froze, and, consequently, the autopilot steered the vessel to port. A proper navigation watch requires a watchstander to confirm and correlate information from all available sources, including electronic charts and visual sightings, to verify the vessel’s position. For the Mystery crew, maintaining a proper navigation watch was critical given their operational environment (on a lee shore, with high winds, and in reduced visibility due to darkness). Vessels navigating near shore face increased risk from the proximity to navigation hazards. As such, any error in navigation, steering, or propulsion can quickly result in catastrophe. Coastwise navigation, therefore, requires increased vigilance to maintain a continuous and", "spans": [[0, 144]]}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 11 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the grounding of the fishing vessel Mystery was the deckhand on watch not maintaining a proper navigation watch, likely due to his overreliance on the vessel’s automated navigation systems, which resulted in him not noticing when the chart plotter malfunctioned and the autopilot steered the vessel away from its plotted course. 3.2 Lessons Learned Overreliance on Automated Navigation Systems Although modern technology is an asset, it is not infallible. Operator overreliance on, and overconfidence in, technologies like chart plotters and autopilot systems can negatively affect situation awareness. The safety of a vessel underway depends on the crew’s awareness of the vessel’s position and adherence to a voyage plan. Good seamanship requires correlating information from all means of", "spans": []}], "answer": "According to the NTSB analysis of the Mystery grounding, the captain stated that after the chart plotter froze, the autopilot would slowly turn the vessel to port.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e56a85318d", "answerable": true, "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "evidence": [{"doc_id": "MIR2630.pdf", "quote": "However, the captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "status": "partly"}], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": [[888, 939]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-4d9c419541", "answerable": true, "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "evidence": [{"doc_id": "MIR2501.pdf", "quote": "At 1808, at 1.4 mph, the port bow of barge EMS 317 struck Gate D, the closed gate on the south side of the lock.", "status": "not_retrieved"}, {"doc_id": "MIR2508.pdf", "quote": "at a speed of 0.35 mph, the starboard quarter of the starboard barge (EMS 348) contacted the wooden fendering of the transfer platform at dolphin no. 3", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2501.pdf", "text": "Contact of Kitty Tow with Algiers Lock Gate MIR-25-01 8 About 1804, the Kitty stopped moving astern and the vessel was outside of the open gates, with the stern of EMS 383 (the aft barge) abeam of the open lock gates. The captain put the engines in reverse in anticipation of water surging back into the lock; he estimated the water level in the lock had dropped about 3 to 4 feet. Less than a minute later, the Kitty tow started to advance ahead even though the engines were in reverse. By 1806, the Kitty tow was advancing ahead at 0.7 mph and increasing in speed. The captain moved propulsion astern on all engines to arrest the increase in speed. Seeing that the tow was still advancing ahead, the captain moved all main engine propulsion levers to full astern, but there was no effect on the tow’s advance. He instructed the steersman to look at the wheel (propeller) wash, and the steersman confirmed that the engines were in reverse. At the head of the tow, the deckhand", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-cf09b99bb5", "answerable": true, "question": "According to the NTSB analysi
