 and associated vessel wiring were original to the vessel’s construction and nearly 50 years old. If there was an electrical fault—such as a loose, broken, or frayed wire, or broken receptacle hardware—within the receptacle or nearby circuitry, it could have created excessive resistance heating. Resistive heating from electrical conductors within", "spans": [[206, 364]]}, {"doc_id": "MIR2623.pdf", "text": "Fire aboard Fishing Vessel Sub Zero MIR-26-23 5 2 Analysis While the fishing vessel Sub Zero was transiting Nushagak Bay, a fire started in the engine compartment. The two crewmembers on board attempted to fight the fire but were unsuccessful and were forced to abandon the vessel into a liferaft. They were rescued by a good Samaritan fishing vessel before the Sub Zero sank. The captain initially observed smoke in the aft end of the engine compartment on the display for the two engine compartment cameras. He told investigators that the smoke appeared to be near the vessel’s hydraulic fuel tank but could not definitively confirm its location. The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "spans": [[649, 872]]}], "answer": "Investigators were able to determine the general location of the fire's origin on the **Lucinda Smith** with more precision than on the **Sub Zero**, but in both cases, they faced limitations in pinpointing the exact ignition source.\n\n### **Lucinda Smith:**\n- **Location of Origin:** Investigators concluded that the fire originated **in the first mate’s stateroom**, specifically **near the floor (deck) by the end of the bunk**. This was based on the **fire damage patterns** observed within the stateroom.\n- **Limitations:** Despite identifying the general area of origin, **investigators could not determine the exact ignition source**. This was due to **damage to the interior of the stateroom**, which obscured critical evidence. Additionally, while **electrical components** such as an electric heater, oscillating fan, and wall receptacle were present near the bunk, **crew interviews indicated that the heater and fan were not in use before the fire**, leaving the receptacle and associated wiring as potential suspects. However, without further physical evidence, the cause was classified as **\"undetermined.\"**\n\n### **Sub Zero:**\n- **Location of Origin:** Investigators could not determine the **exact location** of the fire's origin. The captain reported **smoke near the vessel’s hydraulic fuel tank**, but this was **not definitively confirmed**. The fire started in the **engine compartment**, but the **exact point of origin** within that area could not be determined.\n- **Limitations:** The **vessel burned to the waterline and sank**, so investigators **could not access the vessel** to inspect it and gather physical evidence. This **prevented them from determining the ignition source** or the precise location of the fire's origin. The **lack of access** to the vessel after it sank was the **primary limitation** in this case.\n\n### **Summary:**\n- On the **Lucinda Smith**, investigators were able to narrow the fire's origin to a **specific stateroom and general area within it**, but **damage to the stateroom limited their ability to identify the exact ignition source**.\n- On the **Sub Zero**, investigators could not determine the **exact location of the fire's origin** due to the **vessel sinking before it could be inspected**, which **prevented access to critical evidence**.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f716938d89", "answerable": true, "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "the vessel. About 0920, after the captain and the deckhand examined the wheel and rudder gearboxes, checked for damage to the vessel’s propulsion (sternwheel) and steering, and determined there was no hull flooding. The captain then started the vessel’s engines. After waiting for the chief engineer (who was en route to the scene) for about 15 minutes, the captain decided to move the vessel without him. The captain attempted to dock twice at the Columbia Gorge’s usual dock at the Cascade Locks Marina but was unable to due to the high winds and waves. The captain then turned the vessel around and proceeded downriver to its former docking facility, located above the Bonneville Lock and Dam at mile 145.6 on the Columbia River. The lock operator directed the captain to pass through the lock and tie up at the moorage 3 After fishing sites used by local indigenous populations (Nez Perce Tribe, Confederated", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 4 On January 13, at 0816, a Cascade Locks resident alerted the Hood River County Sheriff’s office that the Columbia Gorge was drifting downriver. The vessel’s captain, the chief engineer, and a deckhand were notified. About 0822, the Columbia Gorge’s stern struck three tribal fishing platforms and then the Thunder Island pedestrian bridge—which spanned the historic lock channel at Cascade Locks Marina and connected Thunder Island to the mainland—halting the vessel’s drift (see Figure 4). 3 By 0831, the deckhand arrived at the pedestrian bridge, where he observed the vessel “banging around in the canal” at the entrance of the lock. The deckhand boarded the Columbia Gorge from the pedestrian bridge and started unlocking doors on the vessel, including in the engine room. About 0910, the vessel’s captain arrived and boarded the vessel.", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "2 Analysis During high winds and blizzard conditions, the Columbia Gorge, with no one aboard, broke free from its mooring at Cascade Locks on the Columbia River. The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock. The crew responded quickly once notified of the breakaway and secured the vessel. The operator took precautions prior to the onset of the predicted weather forecast, including turning the ship around from its usual port side docking to starboard so the bow would face into the weather. In addition, they increased the 4 Root Cause Analysis Team Report: January 13, 2024 Sternwheeler Unmooring. (Port of Cascade Locks Port Commission Root Cause Analysis Team, March 5, 2024), 15.", "spans": [[162, 391]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}], "answer": "The Columbia Gorge drifted about 475 yards downriver into the historic lock after it broke free from its mooring at Cascade Locks.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-fee84e8b73", "answerable": true, "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "the vessel. About 0920, after the captain and the deckhand examined the wheel and rudder gearboxes, checked for damage to the vessel’s propulsion (sternwheel) and steering, and determined there was no hull flooding. The captain then started the vessel’s engines. After waiting for the chief engineer (who was en route to the scene) for about 15 minutes, the captain decided to move the vessel without him. The captain attempted to dock twice at the Columbia Gorge’s usual dock at the Cascade Locks Marina but was unable to due to the high winds and waves. The captain then turned the vessel around and proceeded downriver to its former docking facility, located above the Bonneville Lock and Dam at mile 145.6 on the Columbia River. The lock operator directed the captain to pass through the lock and tie up at the moorage 3 After fishing sites used by local indigenous populations (Nez Perce Tribe, Confederated", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 4 On January 13, at 0816, a Cascade Locks resident alerted the Hood River County Sheriff’s office that the Columbia Gorge was drifting downriver. The vessel’s captain, the chief engineer, and a deckhand were notified. About 0822, the Columbia Gorge’s stern struck three tribal fishing platforms and then the Thunder Island pedestrian bridge—which spanned the historic lock channel at Cascade Locks Marina and connected Thunder Island to the mainland—halting the vessel’s drift (see Figure 4). 3 By 0831, the deckhand arrived at the pedestrian bridge, where he observed the vessel “banging around in the canal” at the entrance of the lock. The deckhand boarded the Columbia Gorge from the pedestrian bridge and started unlocking doors on the vessel, including in the engine room. About 0910, the vessel’s captain arrived and boarded the vessel.", "spans": []}, {"doc_id": "MIR2507.pdf", "text": "2 Analysis During high winds and blizzard conditions, the Columbia Gorge, with no one aboard, broke free from its mooring at Cascade Locks on the Columbia River. The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock. The crew responded quickly once notified of the breakaway and secured the vessel. The operator took precautions prior to the onset of the predicted weather forecast, including turning the ship around from its usual port side docking to starboard so the bow would face into the weather. In addition, they increased the 4 Root Cause Analysis Team Report: January 13, 2024 Sternwheeler Unmooring. (Port of Cascade Locks Port Commission Root Cause Analysis Team, March 5, 2024), 15.", "spans": [[162, 391]]}, {"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}], "answer": "The Columbia Gorge drifted about 475 yards downriver into the historic lock after it broke free from its mooring at Cascade Locks.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f03f4ad14c", "answerable": true, "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "evidence": [{"doc_id": "MIR2539.pdf", "quote": "Time 1435 eastern daylight time", "status": "retrieved"}, {"doc_id": "MIR2539.pdf", "quote": "morning twilight 0718, sunrise 0743", "status": "retrieved"}], "passages": [{"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredging Vessel Stuyvesant On November 2, 2024, about 1435 local time, the dredging vessel Stuyvesant, with a crew of 22, was holding station in the St. Johns River, near Jacksonville, Florida, when a fire broke out in the engine room (see figure 1 and figure 2). 1 Two crewmembers were in the machinery control room when the fire started: one escaped, and the other was removed by the shipboard emergency squad and later pronounced dead at a local hospital. After reporting no active fire and removing the crewmember, the crew verified that the engine room was sealed and released the fixed gas fire extinguishing system. No pollution was reported. Damage to the vessel was estimated at $18 million. 2 Figure 1. Stuyvesant underway in 2022. (Source: The Dutra Group) 1 In this report, all times are eastern daylight time, and all miles are statute miles. 2", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 2 Casualty Summary NTSB casualty category Fire/Explosion Location St. Johns River, Jacksonville, Florida 30° 24.009'N, 81° 24.02'W Date November 2, 2024 Time 1435 eastern daylight time (coordinated universal time –4 hrs) Persons on board 24 (22 crew, 2 observers) Injuries 1 fatal Property damage $18 million est. Environmental damage None Weather Visibility 10 mi, overcast, winds 13 kts, air temperature 83° F, morning twilight 0718, sunrise 0743 Waterway information River; depth about 47 feet Figure 2. Area where the fire broke out aboard the Stuyvesant, as indicated by a circled X. (Background source: Google Maps)", "spans": [[212, 243], [472, 507]]}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 15 2 Analysis On November 2, 2024, while the dredging vessel Stuyvesant was holding station in the St. Johns River near Jacksonville, a fire broke out in the engine room. Crewmembers had just completed maintenance on the port auxiliary engine which included replacing the fuel and lube oil filters and the lube oil in the sump. Once the work was complete, the first engineer started the engine remotely from the MCR, and less than a minute later, engineering crewmembers saw flames in the engine room. After the fire, investigators found that the crew had not reinstalled the plug on the engine’s lube oil filter housing after completing maintenance. Without the plug reinstalled on the lube oil filter housing, pressurized lube oil would have sprayed out from the port auxiliary engine through the internally threaded port at the top of the lube oil filter housing when the engine was started.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "Engine Room Fire aboard Dredge Vessel Stuyvesant MIR-25-39 13 The engine manufacturer instructed a thorough walk-around inspection before starting the engine, looking for oil or coolant leaks, loose bolts, and trash buildup. There were specific instructions for inspection of the air inlet system, cooling system, driven equipment, electrical system, fuel system, lubrication system, and the starting system. The last time this maintenance was performed was on July 6, 2024, when the engine had 4,023 running hours. The next scheduled maintenance was due when the engine had 5,023 running hours. At the time of the casualty, the engine had 5,747 running hours. The lock out/tagout log was kept electronically on a tablet in the MCR. Data from the engine room tablet could not be accessed after the fire. 1.3.4 Engineering Crew The chief engineer had worked aboard the Stuyvesant since 1999, in all credentialed positions.", "spans": []}], "answer": "The sun rose over the St. Johns River at 0743, and the flames broke out in the Stuyvesant's engine spaces at 1435. Therefore, the flames broke out approximately 6 hours and 52 minutes after the sun came up.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-83cd8687fd", "answerable": true, "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "The chief engineer closed the quick-closing valves to the engines (stopping fuel supply to them), and the fire team shut down all ventilation fans, fire dampers, and watertight and fire screen doors, and prepared fire hoses.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "At 0741, the vessel’s fire team that entered the engine room reported that there was no fire in the engine room; t he team only observed black smoke.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "Crewmembers boarded the barge, shut all doors and ventilation dampers to the unloading generator space, started the tug’s fire pump, and began boundary cooling on the exterior bulkheads and deck above the unloading generator.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "he released carbon dioxide into the unloading generator space about 1630.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 15 2 Analysis While the passenger vessel Ocean Navigator was docked in Portland, Maine, the vessel experienced a catastrophic engine failure of the no. 2 auxiliary diesel engine, which resulted in an engine room fire. The crew quickly sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to effectively starve the fire of fuel and oxygen, which prevented the spread of the fire. Ultimately, the fire self-extinguished. Additionally, within a few minutes of the fire, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations. The Ocean Navigator crewmembers followed company procedures to muster all passengers and evacuate them from the vessel without injury. Therefore, the crew’s", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 5 sure of the operating status of the supply fan for the unloading generator space. He believed it was either running at slow speed or not running before the time of the fire. The first mate and another crewmember, wearing self-contained breathing apparatus, entered the unloading generator space from the port side with two portable fire extinguishers and reported very heavy smoke. They retreated from the space, securing the door as they exited. The chief engineer announced that he was preparing to release the fixed carbon dioxide fire extinguishing system; he released carbon dioxide into the unloading generator space about 1630. The captain notified the US Coast Guard and company of the fire. Crewmembers set watches and used an infrared thermometer to monitor bulkhead temperatures, which declined through the night. About 0730 the following morning,", "spans": [[644, 717]]}, {"doc_id": "MIR2602.pdf", "text": "Diesel Generator Engine Failure aboard Self-unloading Barge Pathfinder MIR-26-02 11 2 Analysis On December 30, 2024, while the ATB Dorothy Ann/Pathfinder was anchored in Lake Erie, the diesel generator engine on the Pathfinder suffered a catastrophic failure, which resulted in a fire in the barge’s unloading electrical generator space. The crew sealed the space and released the vessel’s fixed gas fire extinguishing system, putting out the fire. The most severe fire damage was about 5–10 feet from the damaged engine block near the no. 9 connecting rod, where internal components had forcefully exited the engine. In the 4 minutes leading up to the discovery of the fire at 1609, the engine control room machinery automation system recorded a decrease of lube oil pressure while the engine was running at rated speed (1,800 rpm). The engine stopped at 1609:30. This loss of pressure (from 58–47 psi) was not severe enough to", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 7 throughout the vessel. The passengers and crew proceeded to their muster stations. The captain notified the operating company’s designated person ashore who, in turn notified the company’s qualified individual, their dedicated salvage and marine firefighting contractor, and the corporate crisis team. 4 About 0718, crewmembers removed the injured motorman from the Ocean Navigator, and at 0721, after receiving permission from the captain, the first fire team entered the engine room—wearing self-contained breathing apparatus—to assess the fire. About 0730, the local shoreside fire department arrived at the vessel. About this time, the captain received the report from the muster station team leaders that all passengers were accounted for at both muster stations. At 0731, the captain directed the passengers and non-essential crew to evacuate the Ocean Navigator to the pier", "spans": []}], "answer": "The crew on the Ocean Navigator sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to starve the fire of fuel and oxygen, which prevented the spread of the fire. The fire self-extinguished. Additionally, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations.\n\nFor the barge Pathfinder, the crew sealed the unloading generator space and released the vessel’s fixed gas fire extinguishing system, which put out the fire. Crewmembers also set watches and used an infrared thermometer to monitor bulkhead temperatures, which declined through the night.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f0891f7e70", "answerable": true, "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "evidence": [{"doc_id": "MIR2608.pdf", "quote": "The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 15 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "spans": [[95, 457]]}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 13 2 Analysis While the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks in Mobile, Alabama, a fire broke out in the upper deck of the engine room near the boiler. Due to the severity of the fire, the crew activated the vessel’s CO 2 fixed fire extinguishing system, and the fire was extinguished. After the fire, the Lem Verbena operating company and Coast Guard investigators found that an O-ring on the oil fittings block upper module of the boiler’s burner unit had become pinched on the fuel port for the lower module. This O-ring was intended to provide a seal between the corresponding fuel ports on the lower and upper modules (when bolted together) to contain pressurized fuel as it moved through the system to the burner unit igniter. O-rings are designed to protect against leaks by lying flat and becoming compressed between two machinery", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena On January 4, 2025, about 2323 local time, the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks on the Mobile River in Mobile, Alabama, with 19 crewmembers on board when a fire started in the engine room (see figure 1 and figure 2). 1 The crew activated the vessel’s carbon dioxide fixed fire extinguishing system. Shoreside firefighters later determined the fire had been extinguished. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $5.5 million. Figure 1. Lem Verbena underway in April 2024 in Santos, Brazil. (Source: Guilherme Ceccato, shipspotting.com) 1 (a) In this report, all times are central standard time. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM014). March 11, 2026 MIR-26-08", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 8 Figure 5. The Lem Verbena boiler’s burner unit after the fire. (Background source: US Coast Guard) 1.3.2 Boiler The Lem Verbena’s boiler created steam using two methods: a furnace heated by a burner unit fired from diesel oil, and waste heat from the main engine or the no. 2 and no. 3 diesel generator exhausts, which ran through vertical tubes within the boiler (the no. 1 diesel generator was not part of the boiler system). A portion of the no. 2 and no. 3 generator exhaust pipes ran directly below the burner unit in the engine room upper platform and through metal grating before it entered the boiler. Precasualty pictures of the no. 2 generator exhaust pipe showed that it was covered with protective lagging (see figure 6). 5 5 Lagging insulates hot surfaces such as engine exhaust piping from combustible surfaces,", "spans": []}], "answer": "Federal investigators concluded that the blaze below decks on the bulk carrier Lem Verbena was set off by the failure of an O-ring seal on the composite boiler burner unit oil fittings block. This failure was caused by the radial misalignment of the two fuel ports on the block modules, which led to pressurized diesel fuel atomizing and igniting on a nearby hot surface.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-1df291a679", "answerable": true, "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "The vessel drifted about 475 yards downriver into a historic lock and damaged tribal fishing platforms mounted on the lock walls before its stern became wedged beneath the Thunder Island pedestrian bridge, which spanned the lock.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "the vessel. About 0920, after the captain and the deckhand examined the wheel and rudder gearboxes, checked for damage to the vessel’s propulsion (sternwheel) and steering, and determined there was no hull flooding. The captain then started the vessel’s engines. After waiting for the chief engineer (who was en route to the scene) for about 15 minutes, the captain decided to move the vessel without him. The captain attempted to dock twice at the Columbia Gorge’s usual dock at the Cascade Locks Marina but was unable to due to the high winds and waves. The captain then turned the vessel around and proceeded downriver to its former docking facility, located above the Bonneville Lock and Dam at mile 145.6 on the Columbia River. The lock operator directed the captain to pass through the lock and tie up at the moorage 3 After fishing sites used by local indigenous populations (Nez Perce Tribe, Confederated", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8edb7100f3", "answerable": false, "question": "How fast was the fishing vessel Mystery traveling when it struck the rocks near Seal Cape, Alaska?", "expected_answer": "The report does not state the Mystery's speed at the time of the grounding.", "evidence": [], "passages": [{"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery On December 10, 2024, about 2121 local time, the fishing vessel Mystery was transiting the Unga Strait along the Aleutian Peninsula with three crewmembers on board when the vessel grounded and flooded near Seal Cape, about 25 miles west of Sand Point, Alaska (see figure 1 and figure 2). 1 The crewmembers were rescued from the vessel by the US Coast Guard. Up to 2,080 gallons of fuel and lube oil were on board the vessel. No injuries were reported. The vessel, plus gear, was a total loss, valued at $950,000. Figure 1. The Mystery underway at an unknown date. (Source: Millennium Marine) 1 (a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles) unless otherwise noted. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM011). Use the CAROL Query to search investigations. September 18, 2026 MIR-26-30", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 9 2 Analysis While the fishing vessel Mystery was transiting northeast along the Aleutian Peninsula, about 25 miles west of Sand Point, Alaska, in autopilot, the vessel struck submerged rocks, grounded ashore, and began taking on water. On the day of the casualty, the Mystery’s captain navigated by entering waypoints into the chart plotter, with the autopilot steering the vessel to the waypoints on each leg of the voyage. Deckhand 1 (and later, deckhand 2) continued to use the waypoints entered by the captain and the autopilot steering system when they took the watch after the captain that evening. After the Mystery grounded, the captain noted that the chart plotter screen had frozen about 15 to 20 minutes earlier and remained in that state. The autopilot, which the captain stated had never had issues, likely functioned properly. However, the captain stated that the chart plotter,", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "Grounding of Fishing Vessel Mystery MIR-26-30 2 Casualty Summary NTSB casualty category Grounding/Stranding Location Near Seal Cape, about 25 miles west of Sand Point, Alaska 55°21.40' N, 161°15.00' W Date December 10, 2024 Time 2121 Alaska standard time (coordinated universal time −9 hrs) Persons on board 3 Injuries None Property damage $800,000 (vessel); $150,000 (gear) Environmental damage None reported; est. 2,000 gallons of diesel fuel, 30 gallons of lube oil, and 50 gallons of other fuel on board Weather Visibility 10 mi, overcast, winds 020° at 20 kts, seas 1 ft, air temperature 39°F, water temperature 39° F, sunset 1713 Waterway information Strait; width 7 nm, depth 42–300 ft, low tide 0400 Figure 2. Area where the Mystery grounded, as indicated by a circled X. (Background source: Google Maps)", "spans": []}, {"doc_id": "MIR2630.pdf", "text": "2 The dockside exam verified the presence and adequate condition of required lifesaving and safety gear (a six-person liferaft and five survival suits). The vessel was rigged for long-line fishing. 1.2 Event Sequence On December 8, 2024, the Mystery began a planned 5-day transit from Dutch Harbor, Alaska—where the crew had unloaded catch after a fishing trip—back to Homer. Three crewmembers were on board (the captain, who owned the vessel, and two deckhands). On December 9 and 10, a gale warning was in effect for the Pavlof Islands, the area the vessel was transiting. Rain was also forecasted, and southeasterly 35-knot winds had been observed. On December 10, the third day of the transit, t he captain navigated the vessel through various straits around the Pavlof Islands. Rather than steering the vessel directly from the helm, the captain relied on the autopilot to steer. 3 He would enter", "spans": []}], "answer": "The specific speed of the fishing vessel *Mystery* when it struck the rocks near Seal Cape, Alaska, is not explicitly mentioned in the provided context. However, the following details about the weather and conditions on the day of the incident may provide some context regarding the vessel's likely speed:\n\n- **Weather Conditions**: On December 10, 2024, the area experienced overcast skies, winds from 020° at 20 knots, and seas of 1 foot. These conditions suggest relatively calm seas, which could have allowed for a moderate speed.\n- **Autopilot Use**: The captain relied on the autopilot to navigate the vessel through the straits around the Pavlof Islands. This implies that the vessel was likely operating under normal navigational conditions, though the autopilot's performance was later questioned due to the chart plotter freezing.\n\nWhile the exact speed is not provided, the vessel was likely traveling at a typical speed for fishing vessels in such conditions, which is generally between **5 to 10 knots**. However, without explicit data on the vessel's speed at the time of the grounding, this remains an estimate.", "judges": ["groundedness"]}, {"key": "t-093ea6a5a3", "answerable": true, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "status": "not_retrieved"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "status": "not_retrieved"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 13 the Scot Stuttgart, the fixed fire extinguishing system’s CO 2 capacity was designed to extinguish a fire in only one engine room, not both. 1.3.5 Postcasualty Actions by the Operating Company After the fire, the operating company identified an inconsistency in the fuel return piping system on a vessel built similarly to the Scot Stuttgart. Like the Scot Stuttgart, the fuel return piping from the port and starboard auxiliary diesel generators on the similarly built vessel did not have a check valve installed in the piping at the top of the day tanks. Other vessels in the fleet with similar diesel oil systems had check valves. The operating company installed check valves at these locations on the Scot Stuttgart and the other similarly built vessel identified without a check valve. The operating company also updated the lock-out/tag-out procedures to", "spans": []}, {"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 14 2 Analysis On May 17, 2025, while offloading cargo at Puerto Nuevo Terminals in San Juan, a fire broke out in the port engine room aboard the tank vessel Scot Stuttgart. 2.1 Use of Fixed Fire Extinguishing System After discovering thick, white smoke coming from the open door of the port engine room into the engine control room, the crew stopped cargo operations. They shut down the port main engine, remotely stopped all fuel pumps, secured ventilation, shut the ventilation dampers, and stopped electrical power for the port engine room. Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space. While awaiting the arrival of local firefighters, the ship’s crew set up boundary cooling of the port engine room using vessel fire hoses", "spans": [[609, 801]]}, {"doc_id": "MIR2629.pdf", "text": "pressurized by the ship’s fire pump. When shoreside firefighters arrived about 40 minutes later, the ship’s crew reported that there were no elevated heat readings outside the port engine room (as measured using handheld infrared thermometers). The incident commander requested permission from the master for firefighters to open the space and investigate the source of the fire, and the master granted it. When firefighters entered the port engine room, thick smoke was still present. Fixed fire extinguishing systems are typically designed to release a calculated amount of CO 2 into a space to ensure that the CO 2 adequately smothers any fire. The Scot Stuttgart’s system was designed to release all 14 bottles of CO 2 for a fire in the port engine room. The presence of smoldering fire when the firefighters unsealed the space indicates that releasing only half of the system’s CO 2 may not have been as", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 10 2 Analysis On July 24, 2025, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the crew was hauling lobster traps near Mount Desert Rock, Maine. The fire resulted in the total loss of the vessel. After smelling burning fiberglass, the captain discovered flames and light gray smoke in the engine compartment, aft on the vessel. The engine compartment contained multiple potential heat and ignition sources, including main engine exhaust components, high pressure hydraulic equipment that was operational at the time of the fire, electrical systems, batteries, and combustible materials. However, because the GITN’R DUN burned to the waterline, subsequently sank, and was not salvaged, investigators were unable to access and inspect the vessel to determine the exact ignition source. Before the captain detected the smell of burning fiberglass, there were no", "spans": []}], "answer": "The tanker **Scot Stuttgart** had a built-in system for flooding its machinery space with an extinguishing agent, specifically a **fixed fire extinguishing system** that used **CO₂**. The crew of the Scot Stuttgart used **half of the CO₂ bottles** from this system to suppress the fire in the port engine room. They also used **vessel fire hoses** with **boundary cooling** to manage the fire until shore firefighters arrived.\n\nThe **lobster boat GITN’R DUN** did not have a built-in system for flooding its machinery space with an extinguishing agent. Instead, the crew relied on **manual firefighting efforts**, including using **vessel fire hoses** and **boundary cooling** to combat the fire, as the vessel burned to the waterline and sank before investigators could determine the exact ignition source.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-ca5e306c87", "answerable": true, "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward.", "status": "retrieved"}, {"doc_id": "MIR2628.pdf", "quote": "The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "rapidly expand as the vessel moved through the water (seas and swells) as it transited, ultimately causing a larger section of the hull to separate, including portions of the plywood, as seen by the second captain and deckhand 1. Water can penetrate through cracks, unsealed through-hull fittings, or areas where improper repairs have been made. Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward. The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs. Although the vessel was not salvaged, and therefore investigators could not examine the hull to determine the method of failure, it is possible that inadequately completed repairs to the hull contributed to the casualty.", "spans": [[346, 470], [471, 727]]}], "answer": "The crewmembers identified the hull delamination on the Jig Strike, which was repaired by the captain and owner. The Coast Guard was unable to oversee the repairs because they were not notified about the issue, preventing them from ensuring the repairs were completed in accordance with recommended practices for fiberglass hull repairs.", "judges": ["correctness", "refusal"]}, {"key": "t-5359c37dea", "answerable": true, "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "evidence": [{"doc_id": "MIR2542.pdf", "quote": "Waterway information Unprotected approach channel, width 148 ft; charted depth 16 ft in channel, 8 ft outside of channel", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2542.pdf", "text": "148 feet wide at the location of the Jack Edwards/Julie C collision, per electronic navigation charts for the area. The charted depth in the channel was 16 feet, with water depths of 8–10 feet immediately outside the channel. On the day of the casualty, high tide within the port was predicted at 6.5 feet above charted datum at 2215; the range of tide was 2.3 feet. The National Geospatial-Intelligence Agency’s (NGA) Sailing Directions (Enroute), East Coast of South America describes the bottom type as follows: The mud on the bottom is known locally as “sling mud.” It is from 0.6 to 1.2m [2.0 to 3.9 feet] thick, and is of a very soft, almost liquid consistency. Ships of 10 knots or more can force a passage through this “sling mud” even though drawing 0.3m [1 foot] more than the actual depth of water. 10 The Jack Edwards crew stated that they were experiencing a flood tide at the time of the transit into Georgetown. According to the Sailing Directions, currents", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "steering issue was not reported to the Jack Edwards’s chief engineer by the bridge watchstanders. Arriving in Georgetown on March 16, the Jack Edwards transited the port’s entrance channel and moored without incident. Later that evening, the vessel shifted berths in the port, again without incident. At 0840 the next morning, the Jack Edwards got underway to conduct a brief sea trial a few miles off the Guyana coast for the vessel’s charterer. A representative of the charterer company had boarded the vessel, bringing the total complement to ten. The OSV’s departure drafts were 13 feet 5 inches forward and 14 feet 2 inches aft. The sea trial was completed by 1530. A half hour later, the vessel anchored, awaiting high tide and an available berth in Georgetown. At 2100, the Jack Edwards crew began preparing the vessel to get underway for the inbound transit to the port. The second mate was the OICNW on the bridge.", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "9 knots, it was hailed on VHF radio by “Georgetown Pilots” and informed that it was “way out of the [Georgetown entrance] channel.” At the time, the Jack Edwards was about 0.48 miles to the northwest of the channel. Georgetown Pilots advised the vessel to come to port toward the channel. The Jack Edwards’s chief mate acknowledged the Georgetown Pilots radio call and instructed the second mate to steer toward the channel. The second mate and chief engineer told investigators that, while outside the channel, the Jack Edwards was “shuddering” and had a “serious vibration.” According to the second mate, the shuddering stopped when the Jack Edwards got closer to the channel. The second mate and chief engineer stated that it was possible that the vibration was caused by the vessel contacting the soft mud bottom. In a statement to investigators, the charterer representative, who was on the bridge during the casualty", "spans": []}, {"doc_id": "MIR2542.pdf", "text": "the channel until it veered to port just prior to the collision). High tide, which occurred at 2215, added 6.5 feet to the charted datum, bringing the water depth to 14.5– 16.5 feet and falling. The Jack Edwards’s aft draft was 14 feet 2 inches, putting the vessel in, or nearly in, the soft “sling mud” on the bottom as it transited inbound. Although the vessel’s echo sounder recorded depths beneath the keel of 8 feet or greater, echo sounder readings can vary in areas with a “fluid-mud” layer. 11 Research has shown that a vessel transiting with its keel near the water-mud interface can experience sluggish maneuvering at low speeds (3 knots). The effect decreases at higher speeds (7 knots). 12 The NGA Sailing Directions notes that ships transiting at 10 knots can navigate through the mud in the approaches to Georgetown with drafts that exceed the depth of water by up to 1 foot. The Jack Edwards was transiting between 9 and 10 knots throughout the time that the 11", "spans": []}], "answer": "The approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C collided, was **148 feet wide** at the location of the collision. The **charted depth** in the channel was **16 feet**. However, water depths immediately outside the channel were reported to be **8–10 feet**. \n\nAdditionally, the channel's bottom was composed of \"sling mud,\" a very soft and almost liquid type of mud, which could affect the vessel's maneuverability, especially at lower speeds.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6f501fe3a5", "answerable": true, "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "evidence": [{"doc_id": "MIR2503.pdf", "quote": "Engine power; manufacturer 2 x 3,000 hp (2,237 kW); GE 7FDL12 diesel engines", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "The vessel’s propulsion was provided by two main engines (nos. 1 and 2 main engines), each driving a 2,682-hp azimuthing stern thruster. Vessel electrical power was supplied by two diesel-driven electrical generators (nos. 1 and 2 auxiliary engines). All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp (see figure 3). The main engines operated at variable revolutions per minute based on the vessel’s input speed command. The auxiliary engines ran at 1,800 rpm. A 1,000-horsepower bow thruster, and the two stern thrusters, each driven by an electric motor, assisted maneuvering.", "spans": []}, {"doc_id": "MIR2539.pdf", "text": "an electric motor, assisted with maneuvering. Two main engine shaft-driven generators and two 2,442-hp (1,821-kilowatt) Caterpillar 3512C auxiliary diesel engines, each coupled to an electric generator, provided electrical power for the vessel. The auxiliary diesel engines could be started from three locations: locally at a control panel next to the engines, remotely from the machinery control room (MCR), or remotely from the wheelhouse. 3 Each engine was equipped with a pre-lube pump that circulated pressurized lube oil throughout the stopped engine after receiving a start signal and before the engine began the starting sequence. 4 The two auxiliary engines had been installed aboard the Stuyvesant in December 2022, replacing older engines that had reached the end of their service life. The engine’s operation and maintenance manual indicated that the engines (with deep sump) had an approximate lube oil capacity of 162–165 gallons. 1.2 Event Sequence", "spans": []}, {"doc_id": "MIR2602.pdf", "text": "or unloading equipment (such as conveyor and boom) were operational, a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power. The unloading generator was located on the starboard side of the barge’s main deck, aft of the auxiliary motor control center (MCC), with supply fan ducting in the overhead on the starboard side. The engine was positioned on the barge, with the turbochargers facing the forward direction, between the back of the engine and the generator. Figure 3. Unloading generator space on barge Pathfinder. (Background source: Interlake Steamship Co.)", "spans": []}, {"doc_id": "MIR2609.pdf", "text": "at 385 hp (287 kilowatts) and connected via a set of reduction gears to a fixed-pitch propeller. Electrical power was provided by two John Deere diesel engine–driven generators, each rated at 133 hp (99 kilowatts). The vessel was also equipped with a 36-hp (27-kilowatt) generator, located in the engine room, for emergency power. The Oliver Hazard Perry was equipped with high-water bilge alarms as required by the Coast Guard. Eight high-level bilge sensors were located throughout the vessel on the lower deck: one in the forepeak space, three in the berthing spaces, one in the auxiliary machine space (AMS), two in the engine room, and one in the fixed fire extinguishing system room. The AMS contained electrical panels, pumps, and other electrical equipment. It was adjacent to, and forward of, the engine room and separated by a watertight bulkhead that was fitted with a hinged watertight door.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness"]}, {"key": "t-1d9ed0698d", "answerable": true, "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "evidence": [{"doc_id": "MIR2527.pdf", "quote": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "status": "retrieved"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "status": "not_retrieved"}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 4 Figure 3. Land-based firefighters on Lucinda Smith. (Source: New Bedford Fire Department) After the fire, US Coast Guard investigators examined the damage on the Lucinda Smith. The Coast Guard also requested assistance from Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigators, who participated in the examination of the damage. ATF investigators concluded that the fire originated in the first mate’s stateroom. Based on the fire damage patterns found within the stateroom, investigators concluded that the fire most likely originated at or near the floor (deck) by the end of the bunk. However, due to the damage to the interior of the stateroom, ATF investigators could not determine the exact ignition source and ultimately classified the cause of the fire as “undetermined.”", "spans": [[443, 487]]}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire aboard the towing vessel Lucinda Smith was an undetermined ignition source in one of the vessel’s staterooms.", "spans": []}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 6 2 Analysis While the towing vessel Lucinda Smith was moored at the dock, a crewmember heard a smoke alarm and discovered a fire in one of the staterooms. ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater). Electrical sources near the bunk included an electric heater, an oscillating fan, and an electrical wall receptacle. Crew interviews revealed that the heater and fan were not in use before the fire and thus likely were not an ignition source. The receptacle and associated vessel wiring were original to the vessel’s construction and nearly 50 years old. If there was an electrical fault—such as a loose, broken, or frayed wire, or broken receptacle hardware—within the receptacle or nearby circuitry, it could have created excessive resistance heating. Resistive heating from electrical conductors within", "spans": [[206, 364]]}, {"doc_id": "MIR2623.pdf", "text": "Fire aboard Fishing Vessel Sub Zero MIR-26-23 5 2 Analysis While the fishing vessel Sub Zero was transiting Nushagak Bay, a fire started in the engine compartment. The two crewmembers on board attempted to fight the fire but were unsuccessful and were forced to abandon the vessel into a liferaft. They were rescued by a good Samaritan fishing vessel before the Sub Zero sank. The captain initially observed smoke in the aft end of the engine compartment on the display for the two engine compartment cameras. He told investigators that the smoke appeared to be near the vessel’s hydraulic fuel tank but could not definitively confirm its location. The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "spans": [[649, 872]]}], "answer": "Investigators could determine that the blaze on the Lucinda Smith began in the first mate’s stateroom, specifically near the floor (deck) by the end of the bunk. However, they could not pinpoint the exact ignition source due to the damage to the interior of the stateroom.\n\nFor the Sub Zero, investigators could not definitively determine the origin of the fire because the vessel burned to the waterline, sank, and was not salvaged, preventing access for inspection. The captain reported smoke near the hydraulic fuel tank, but this could not be confirmed as the exact origin.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-4ddd8de9e8", "answerable": true, "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "All four engines were Caterpillar 3516B diesel engines, each rated at 2,000 hp", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "The chief engineer closed the quick-closing valves to the engines (stopping fuel supply to them), and the fire team shut down all ventilation fans, fire dampers, and watertight and fire screen doors, and prepared fire hoses.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "At 0741, the vessel’s fire team that entered the engine room reported that there was no fire in the engine room; t he team only observed black smoke.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "a 2,447-hp (1,825-kW) Caterpillar 3516B diesel engine-driven generator, referred to as the “unloading generator,” provided electrical power.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "Crewmembers boarded the barge, shut all doors and ventilation dampers to the unloading generator space, started the tug’s fire pump, and began boundary cooling on the exterior bulkheads and deck above the unloading generator.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "he released carbon dioxide into the unloading generator space about 1630.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 15 2 Analysis While the passenger vessel Ocean Navigator was docked in Portland, Maine, the vessel experienced a catastrophic engine failure of the no. 2 auxiliary diesel engine, which resulted in an engine room fire. The crew quickly sealed the engine room by closing watertight doors, shutting off ventilation fans, closing dampers, and activating quick-closing fuel valves to effectively starve the fire of fuel and oxygen, which prevented the spread of the fire. Ultimately, the fire self-extinguished. Additionally, within a few minutes of the fire, the captain notified the crew of the emergency and sounded the general alarm for passengers and crewmembers to proceed to their muster stations. The Ocean Navigator crewmembers followed company procedures to muster all passengers and evacuate them from the vessel without injury. Therefore, the crew’s", "spans": []}], "answer": "The documents provided only mention the Ocean Navigator experiencing a fire after a diesel engine failure, and how the crew sealed the engine room to starve the fire of fuel and oxygen, leading to its self-extinguishment. There is no information provided about the barge Pathfinder or its fire. Therefore, the documents do not contain the answer to how the crew handled the blaze on the barge Pathfinder.", "judges": ["groundedness", "correctness"]}, {"key": "t-43e8ac6644", "answerable": false, "question": "How long did firefighters take to put out the blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point?", "expected_answer": "The premise is wrong: there was no fire after the Hunts Point explosion; instead, sludge burst out of the tank and covered the assistant engineer and the vessel's exterior.", "evidence": [], "passages": [{"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel. The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NYC DEP office. He requested that the NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 4 1.2 Event Sequence On May 24, 2025, about 0818, the Hunts Point departed the Wards Island Wastewater Treatment Plant, where it was normally docked when not in operation, with a crew of six, including a master, chief engineer, assistant engineer, a mate, and two able seamen. The vessel was en route to the North River Wastewater Treatment Plant (also in New York) to load about 100,000 cubic feet of liquid sludge, a transit that would take about 2 hours. When the vessel departed Wards Island, about 40,000 cubic feet of cargo evenly distributed cargo remained in the cargo tanks from the previous day’s operation due to time constraints at the facility and the consistency of the sludge. Because sludge remained within the tanks, it had become too viscous for the vessel’s cargo pumps to move it from the tanks to the facility. To reduce the thickness and", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 13 2 Analysis On May 24, 2025, the sludge vessel Hunts Point was loading cargo at the North River Wastewater Treatment Plant when an explosion occurred in the no. 2 port cargo tank, resulting in the death of the chief engineer and injuries to three other crewmembers. Like other NYC DEP sludge vessels, the Hunts Point was designed to transport treated sludge from wastewater facilities to the dewatering facility. On the day of the casualty, about 40,000 cubic feet of sludge remained aboard the vessel from the previous day’s operation. The remaining cargo was evenly distributed within the six cargo tanks. While the sludge had been treated, it still contained decomposing organic material and produced flammable gases. Any flammable gas the sludge produced would collect within the cargo tanks. As a result, the concentration of these flammable gases would increase the longer the sludge remained within the tanks.", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion aboard Sludge Vessel Hunts Point On May 24, 2025, about 1020 local time, the sludge vessel Hunts Point was moored at the North River Wastewater Treatment Plant on the Hudson River, in New York, New York, when an explosion occurred aboard the vessel (see figure 1 and figure 2). 1 One crewmember was killed, and three crewmembers sustained minor injuries. No pollution was reported. Vessel damage was estimated to exceed $10 million. Figure 1. Hunts Point on July 7, 2018, before the explosion. (Source: Frank Joniak, shipspotting.com) 1 (a) In this report, all times are eastern daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM045). Use the CAROL Query to search investigations. July 15, 2026 MIR-26-22", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-3606811b20", "answerable": true, "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "evidence": [{"doc_id": "MIR2608.pdf", "quote": "The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 15 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "spans": [[95, 457]]}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 13 2 Analysis While the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks in Mobile, Alabama, a fire broke out in the upper deck of the engine room near the boiler. Due to the severity of the fire, the crew activated the vessel’s CO 2 fixed fire extinguishing system, and the fire was extinguished. After the fire, the Lem Verbena operating company and Coast Guard investigators found that an O-ring on the oil fittings block upper module of the boiler’s burner unit had become pinched on the fuel port for the lower module. This O-ring was intended to provide a seal between the corresponding fuel ports on the lower and upper modules (when bolted together) to contain pressurized fuel as it moved through the system to the burner unit igniter. O-rings are designed to protect against leaks by lying flat and becoming compressed between two machinery", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena On January 4, 2025, about 2323 local time, the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks on the Mobile River in Mobile, Alabama, with 19 crewmembers on board when a fire started in the engine room (see figure 1 and figure 2). 1 The crew activated the vessel’s carbon dioxide fixed fire extinguishing system. Shoreside firefighters later determined the fire had been extinguished. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $5.5 million. Figure 1. Lem Verbena underway in April 2024 in Santos, Brazil. (Source: Guilherme Ceccato, shipspotting.com) 1 (a) In this report, all times are central standard time. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM014). March 11, 2026 MIR-26-08", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 8 Figure 5. The Lem Verbena boiler’s burner unit after the fire. (Background source: US Coast Guard) 1.3.2 Boiler The Lem Verbena’s boiler created steam using two methods: a furnace heated by a burner unit fired from diesel oil, and waste heat from the main engine or the no. 2 and no. 3 diesel generator exhausts, which ran through vertical tubes within the boiler (the no. 1 diesel generator was not part of the boiler system). A portion of the no. 2 and no. 3 generator exhaust pipes ran directly below the burner unit in the engine room upper platform and through metal grating before it entered the boiler. Precasualty pictures of the no. 2 generator exhaust pipe showed that it was covered with protective lagging (see figure 6). 5 5 Lagging insulates hot surfaces such as engine exhaust piping from combustible surfaces,", "spans": []}], "answer": "Federal investigators concluded that the blaze below decks on the bulk carrier *Lem Verbena* while it was tied up in Mobile was caused by the failure of an O-ring seal on the composite boiler burner unit oil fittings block. This failure occurred due to the radial misalignment of the two fuel ports on the block modules. As a result, pressurized diesel fuel atomized and ignited on a nearby hot surface, leading to the fire.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-9b67a9d4f3", "answerable": false, "question": "How long did firefighters take to put out the blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point?", "expected_answer": "The premise is wrong: there was no fire after the Hunts Point explosion; instead, sludge burst out of the tank and covered the assistant engineer and the vessel's exterior.", "evidence": [], "passages": [{"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel. The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NYC DEP office. He requested that the NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 4 1.2 Event Sequence On May 24, 2025, about 0818, the Hunts Point departed the Wards Island Wastewater Treatment Plant, where it was normally docked when not in operation, with a crew of six, including a master, chief engineer, assistant engineer, a mate, and two able seamen. The vessel was en route to the North River Wastewater Treatment Plant (also in New York) to load about 100,000 cubic feet of liquid sludge, a transit that would take about 2 hours. When the vessel departed Wards Island, about 40,000 cubic feet of cargo evenly distributed cargo remained in the cargo tanks from the previous day’s operation due to time constraints at the facility and the consistency of the sludge. Because sludge remained within the tanks, it had become too viscous for the vessel’s cargo pumps to move it from the tanks to the facility. To reduce the thickness and", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion on board Sludge Vessel Hunts Point MIR-26-22 13 2 Analysis On May 24, 2025, the sludge vessel Hunts Point was loading cargo at the North River Wastewater Treatment Plant when an explosion occurred in the no. 2 port cargo tank, resulting in the death of the chief engineer and injuries to three other crewmembers. Like other NYC DEP sludge vessels, the Hunts Point was designed to transport treated sludge from wastewater facilities to the dewatering facility. On the day of the casualty, about 40,000 cubic feet of sludge remained aboard the vessel from the previous day’s operation. The remaining cargo was evenly distributed within the six cargo tanks. While the sludge had been treated, it still contained decomposing organic material and produced flammable gases. Any flammable gas the sludge produced would collect within the cargo tanks. As a result, the concentration of these flammable gases would increase the longer the sludge remained within the tanks.", "spans": []}, {"doc_id": "MIR2622.pdf", "text": "Explosion aboard Sludge Vessel Hunts Point On May 24, 2025, about 1020 local time, the sludge vessel Hunts Point was moored at the North River Wastewater Treatment Plant on the Hudson River, in New York, New York, when an explosion occurred aboard the vessel (see figure 1 and figure 2). 1 One crewmember was killed, and three crewmembers sustained minor injuries. No pollution was reported. Vessel damage was estimated to exceed $10 million. Figure 1. Hunts Point on July 7, 2018, before the explosion. (Source: Frank Joniak, shipspotting.com) 1 (a) In this report, all times are eastern daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM045). Use the CAROL Query to search investigations. July 15, 2026 MIR-26-22", "spans": []}], "answer": "The incident report does not mention a blaze that burned on deck after the explosion aboard the sludge vessel Hunts Point. Instead, it states that there was no fire following the explosion, and sludge burst out of the tank, covering the assistant engineer and the exterior of the vessel. Therefore, the question about the duration of time firefighters took to put out a blaze is not applicable in this case.", "judges": ["groundedness"]}, {"key": "t-47dc1467a4", "answerable": false, "question": "What was the name of the tugboat that recovered the burning fishing vessel Three Girls and brought it into Portland, Maine?", "expected_answer": "The report does not give this detail; it says only that a tugboat was dispatched to recover the Three Girls, which was docked in Portland on August 14.", "evidence": [], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 9 The William Chadwick arrived in Portland at 1100 the following morning (August 12). The Three Girls remained afloat as the fire continued to smolder. The following day, a tugboat was dispatched to recover the Three Girls, and on August 14, the Three Girls was docked in Portland. The local fire department boarded the vessel and extinguished the fire using water and foam. 1.3 Additional Information 1.3.1 Damage After the fire was extinguished, National Transportation Safety Board and Coast Guard investigators boarded the Three Girls to inspect the damage. The Coast Guard also requested assistance from a local Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigator, who participated in the examination of the damage. The steel bulkheads, decks, and overhead of the wheelhouse displayed several areas of deck and bulkhead warpage, and all contents inside the wheelhouse", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls On August 11, 2024, about 2056 local time, while the fishing vessel Three Girls was engaged in fishing operations in the Gulf of Maine about 118 miles east-southeast of Portland, Maine, a fire broke out in the vessel’s engine room (see figure 1 and figure 2). 1 The five crewmembers and a National Marine Fisheries Service observer abandoned the burning vessel into a liferaft and were rescued by a US Coast Guard cutter crew that same evening. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $1.3 million. 2 Figure 1. Three Girls docked in Portland, Maine, on August 14, 2024, after the fire. 1 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM056). Use the CAROL Query to search investigations.", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 17 Vessel Particulars Vessel Three Girls Type Fishing (Fishing vessel) Owner/Operator Three Girls Fishing, LLC (Commercial) Flag United States Port of registry Portland, Maine Year built 1979 Official number 609865 (US) IMO number N/A Classification society N/A Length (overall) 81.6 ft (24.9 m) Breadth (max.) 24.0 ft (7.3 m) Draft (casualty) 11.0 ft (3.4 m) Tonnage 783 GRT Engine power; manufacturer 1 x 850 hp (634 kW); Caterpillar 3512 diesel engine NTSB investigators worked closely with our counterparts from Coast Guard Sector Northern New England throughout this investigation. The National Transportation Safety Board (NTSB) is an independent federal agency charged by Congress with investigating every civil aviation accident in the United States and significant events in other modes of transportation—railroad, transit, highway, marine, pipeline, and commercial space. We determine", "spans": []}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 2 Casualty Summary Casualty type Fire/Explosion Location Gulf of Maine, 118 nm east-southeast of Portland, Maine 43°07.37’ N, 67°58.78’ W Date August 11, 2024 Time 2056 eastern daylight time (coordinated universal time –4 hrs) Persons on board 6 Injuries None Property damage $1.3 million est. Environmental damage None Weather Visibility 10 nm, clear, winds southwest 10 kts, gusts 13 kts, seas 2–4 ft, air
