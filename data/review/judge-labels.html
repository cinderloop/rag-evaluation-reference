doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 14 Figure 8. Removed crankshaft from damaged no. 2 auxiliary generator on board Ocean Navigator after the engine failure. After the crankshaft was removed, all main bearings were inspected, and the no. 8 bearing, located directly aft of the affected cylinder, was determined to be in the worst condition. In January 2025, the engine block was replaced and the engine rebuilt by technicians. The operating company requested that the connecting rod bearings on the adjacent no. 1 auxiliary engine be inspected by the technicians. Based on the condition of the sampled bearing, all connecting rod bearings were replaced on the no. 1 auxiliary engine. In February 2025, Caterpillar’s rotating component engineers provided comments from the inspection of the no. 2 auxiliary engine components that had been sent from the Ocean Navigator. The engineers observed the front main bearing", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 9 Figure 6. Left to right: Damaged engine block on no. 2 auxiliary engine aboard Ocean Navigator after the engine failure. Graphic identifying area of engine failure on the no. 2 auxiliary engine. The most significant smoke and heat damage was directly across the decking from the area of the no. 14 cylinder where the engine block was ruptured and extended upward toward the overhead and inboard toward the no. 1 auxiliary engine. The area in the engine room around and above the no. 2 auxiliary engine sustained smoke and heat damage. Soot was observed on all surfaces in the engine room and was heaviest on the components near the deck plates between the two auxiliary engines. The no. 1 auxiliary engine sustained fire damage to the turbocharger, piping, cables, and electrical insulation on the inboard side. The engine control module and", "spans": []}], "answer": "The provided context does not mention an incident involving the vessel *Pathfinder*. It only describes the diesel generator engine failure aboard the *Ocean Navigator* (MIR-25-13). According to the analysis in the context, the failure of the *Ocean Navigator*'s no. 2 auxiliary engine was caused by the ejection of the no. 13 connecting rod, which led to damage to the engine block and other components. However, the specific connecting rod that seized with the crankshaft is not explicitly identified in the text.\n\nIn summary:\n- For the *Ocean Navigator* incident, the no. 13 connecting rod is implicated in the engine failure, but the exact cause of the seizure or the specific connecting rod that seized with the crankshaft is not clearly stated.\n- There is no information provided about an incident involving the *Pathfinder* in the given context.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5ad7d85d3c", "answerable": true, "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "evidence": [{"doc_id": "MIR2617.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds 8 mph west-southwest, air temperature 81°F", "status": "not_retrieved"}, {"doc_id": "MIR2620.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F", "status": "retrieved"}], "passages": [{"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 8 for tows transiting downbound between miles 869 and 303. 9 When the Vicksburg gage reached 36 feet, tows over 110 feet wide were restricted to daytime transit only through the Vicksburg bridges. Also, towing vessels over 6,000 hp, like the Myra Eckstein, had a maximum tow size of 36 barges, with a minimum of 280 hp per loaded standard barge and 560 hp per oversized barge. On the day of the casualty, the Myra Eckstein was pushing 25 standard barges (312 hp per barge). On April 27, the Mississippi River at Vicksburg was recorded having a level of 49.3 feet. According to the National Weather Service, this was the highest peak at the Vicksburg gage since 2020. On May 5, the day of the casualty, the Vicksburg gage read 46.17 feet (about 3.17 feet above major flood stage and about 16 feet above historic normal stage) and falling (see figure 7). Visibility was about 10 miles, with fair skies and", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 4 On May 5, the tow was approaching Vicksburg and two bridges: the Vicksburg Highway 80 Bridge and the Vicksburg Interstate 20 Bridge (see figure 2). The Vicksburg Highway 80 Bridge opened in 1930 and originally served as a highway and railroad crossing (see figure 4). The bridge had been closed to vehicular traffic for several years, serving solely as a railway bridge. Vehicular traffic was carried via the Vicksburg Interstate 20 Bridge, which was about 315 feet downstream from and ran parallel to the Vicksburg Highway 80 Bridge. The Coast Guard recorded 29 reportable contacts with the bridge between March 2010 and February 2024. 4 Figure 4. The Vicksburg Highway 80 Bridge, as viewed looking downriver. (Background source: US Army Corps of Engineers) About 0940, the captain began maneuvering the tow at 9 mph around", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 2 Casualty Summary Casualty type Contact Location Lower Mississippi River, mile 435.8, near Vicksburg, Mississippi 32°18.82' N, 090°54.28' W Date May 5, 2025 Time 0957 central daylight time (coordinated universal time –5 hrs) Persons on board 10 Injuries None Property damage $941,000 est. Environmental damage None Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F, morning twilight 0545, sunrise 0611 Waterway information River; width 0.5 mi, depth 45 ft, current 6 mph est. Figure 2. Area where the Myra Eckstein tow contacted the Vicksburg Highway 80 Bridge, as indicated by a circled X. (Background source: Google Maps)", "spans": [[388, 475]]}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 5 Delta Point and toward the Vicksburg bridges during that period, including the Myra Eckstein, was west of the “recommended track” (sailing line) shown on the inland electronic navigation chart and displayed on the Myra Eckstein’s electronic chart system. 7 Figure 5. Trackline of the Myra Eckstein tow (highlighted orange) before and during the contact with the Vicksburg Highway 80 Bridge, the recommended track (highlighted yellow), and the tracklines of vessels (black) transiting downbound in daylight hours from 1000 on May 4, 2025, to 0958 on May 5, 2025. (Background source: Corps of Engineers Inland Electronic Navigation Chart U35LM425 as viewed on Made Smart) The captain was unable to correct the heading and align the tow between the piers of the bridge. About 0957, the lead barge of the starboard string, the CC-1109,", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-0551961abf", "answerable": true, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "status": "not_retrieved"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "status": "partly"}], "passages": [{"doc_id": "MIR2615.pdf", "text": "and push gear system and an inspection of the engine room and bilges. He notified the mate on watch that he was going to head to the galley to start preparations for the evening meal, which he routinely performed as part of his duties. About 1624, according to recorded Rose Point data, the Mackenzie Rose tow was centered in the Elizabeth River channel and proceeding through t he South Norfolk Jordan Bridge with a course over ground of 020°, a speed over ground of 4.8 knots, and no rate of turn. About a minute later, about 1625, the vessel and tow passed successfully through the South Norfolk Jordan Bridge. The mate told investigators that, after the 3 The marine autopilot system on board the Mackenzie Rose was designed to hold the vessel’s heading, which was set by the operator. It did not have the capability to automatically steer a course, nor did it account for set or drift.", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "Contact of Tank Vessel Hafnia Amessi with Pier MIR-25-11 21 the risks associated with bank effect and current. If the Hafnia Amessi had approached the turn on to Range C in the relatively open water to starboard, the bank effect on the vessel’s port side would have been minimized, and the vessel would have been better positioned to handle the oncoming flood current. To prepare for the Hafnia Amessi’s transit, the pilot ordered the tugboat Diane Moran to escort the tanker down the Cooper River. The pilot stated that this order was a direct consequence of what he had learned from studying the Bow Triumph casualty. When it became apparent that the Hafnia Amessi was not responding to rudder and engine orders as the pilot anticipated and was in danger of striking Pier B, the pilot directed the Diane Moran to push on the tanker’s bow. According to the pilot, the ship’s rate of turn did not increase until the tugboat began", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "the Hafnia Amessi’s drafts were 21.3 feet forward and 26.3 feet aft. Beginning the transit down the Cooper River, the CBPA pilot ordered dead slow ahead, followed by slow ahead. According to the Hafnia Amessi’s pilot card, slow ahead corresponded to 9.0 knots of speed when the tanker was in ballast in open water with no current. At 1000, the vessel entered the Joint Base Charleston Channel (referred to as the JBC Channel in US Army Corps of Engineers documents), 0.5 miles downriver from the INEOS terminal. Shortly after entering the channel, the Hafnia Amessi encountered a bend to port, onto the section of the river containing Range F (see figure 2). The pilot stated that, as the vessel rounded the bend, he noticed “an exceptional amount of tidal current on buoy number 80,” which was a navigation aid on the inside of the bend. He said, “[the current] reduced my speed to less than 5 knots, and in all my years working down here, I’ve never seen a wake on a buoy at", "spans": []}, {"doc_id": "MIR2615.pdf", "text": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge MIR-26-15 17 2 Analysis The towing vessel Mackenzie Rose was pushing the loaded deck barge Weeks 281 ahead, outbound in the southern branch of the Elizabeth River when the tow veered to port and struck the Norfolk and Portsmouth Belt Line Railroad Bridge. At the time of the casualty, there was minimal current, and wind conditions were calm. According to the mate, as the tow transited outbound in the Elizabeth River, he navigated using autopilot by using the rotary knob to increase or decrease the heading setpoint. (There were no company policies that prevented the Mackenzie Rose mate from steering in autopilot while transiting the Elizabeth River.) The mate told investigators that, when the tow got close to the railroad bridge, the autopilot “tripped” without alarming, and he lost steering without realizing it. Based", "spans": [[35, 83], [286, 338]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-7be5edf697", "answerable": true, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "status": "retrieved"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direction. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. Because there were not enough immersion suits available for everyone, t he captain elected not to wear one. The crew attempted to stay on the stern deck of the vessel as long as possible before deploying the liferaft and entering the water. With the wheelhouse unattended, t he vessel’s heading changed, and smoke", "spans": [[599, 706]]}, {"doc_id": "MIR2504.pdf", "text": "distress call on VHF channel 16; he stated that the vessel was on fire and the crew was abandoning ship, and he also provided the vessel’s position. According to the captain, while making the radio calls in the wheelhouse, he was gasping for air and could barely see the GPS position on the navigation console due to the amount of smoke. US Coast Guard Sector Northern New England (in Portland, Maine) received the distress call from the Three Girls. Once alerted about the fire, the first mate ran into the accommodation space to collect as many survival suits from the crew quarters (staterooms) as he could carry. He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "spans": [[617, 895]]}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 6 On August 11, about 2030, the captain made a round of the engine room before returning to the wheelhouse to maneuver the vessel. He did not notice anything out of the ordinary during his round. About 2045, the captain called the crew to report to the stern deck to begin hauling the fishing net back onto the vessel. Crewmembers and the NMFS observer retrieved their gear from the vestibule at the entrance to the engine room in the accommodation space—which included the crew staterooms and the galley—before reporting to the stern deck. As they arrived, the captain was in the port aft corner of the wheelhouse overlooking the stern, operating the hydraulic net reel to haul in the fishing net. None of the crewmembers reported anything unusual from the entrance to the engine room. About 2050, after the fishing net was recovered from the seafloor, and when it", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 11 suits and lifejackets as fire blocked the crewmembers’ path to their storage area. The captain quickly made a mayday call, activated the EPIRB, and abandoned the vessel with the sternman into the liferaft in a timely manner. However, deployment of the liferaft on the windward side of the vessel prevented the crew from positioning it at a safe distance from the burning vessel. As a result, the heat of the fire ignited the liferaft’s canopy, causing it to sink and forcing the crewmembers into the water without any survival gear. The estimated water temperature of 50°F was within a range where hypothermia was a significant survival factor. 6 In water that temperature, cold incapacitation—where the use of hands, arms, and legs becomes more difficult—can occur within 10 minutes and possibly result in swimming failure or drowning. 7 Without lifejackets or immersion suits, the GITN’R DUN crew’s survival was dependent", "spans": []}], "answer": "The captain of the fishing vessel *Three Girls* abandoned ship without wearing an immersion suit because there were not enough immersion suits available for everyone on board. Despite the danger, the captain elected not to wear one, likely prioritizing the safety of the crew over his own.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-54a88ea031", "answerable": true, "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "February 4, 2026 MIR-26-04 Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska", "status": "partly"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 2 Casualty Summary Casualty type Fire/Explosion Location Chatham Strait, about 1 mile west of Point Gardner, Alaska 57°02.09’ N, 134°39.33’ W Date March 6, 2025 Time 1320 Alaska standard time (coordinated universal time –9 hrs) Persons on board 5 Injuries 1 minor Property damage $1.6 million Environmental damage None Weather Visibility 9 mi, overcast, winds east-southeast 12 kts, air temperature 44°F Waterway information Strait; width 4.5 nm, depth 1,571 ft Figure 2. Area where the Spicy Lady fire occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[0, 163]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 4 Figure 3. The Spicy Lady under tow by the Angelette after the crew evacuated to the Angelette. (Source: Wrangell Volunteer Fire Department) At 1432, the captain of the Spicy Lady notified the Wrangell Volunteer Fire Department, located in Wrangell, Alaska (about 100 miles from the Spicy Lady’s location), of the fire. The fire department prepared their gear and boarded a floatplane, which departed Wrangell at 1509 with three firefighters on board. At 1603, the floatplane landed in Warm Springs Bay, where it met the Westerly. The firefighters boarded the Westerly with their gear, and the crew aboard the Westerly transported them to the Spicy Lady just outside of Warm Springs Bay. Once aboard the Spicy Lady, firefighters set up a portable fire pump and entered the main cabin. They encountered heat and heavy smoke and traced the origin of the fire to the forward berthing area. Using water and foam, the firefighters", "spans": [[0, 47]]}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": [[0, 37], [150, 192]]}, {"doc_id": "MIR2624.pdf", "text": "a. The American Bureau of Shipping only served as the designated TPO for the Miss Peggy and did not class the vessel. 1.5 Waterway Conditions The casualty occurred near the boundary of the Lynchburg precautionary area. The Coast Guard designated Lynchburg as a precautionary area “due to frequent congestion of meeting, crossing, and overtaking of dissimilar traffic including ships, tows with/without barges, ferries, and industrial vessels.” 29 Figure 19 shows the radius of the precautionary area. 29 According to 33 CFR 161.2, a precautionary area is a routing measure comprising an area within defined limits where vessels must navigate with particular caution and within which the direction of traffic may be recommended.", "spans": []}], "answer": "The March 2025 Spicy Lady casualty was categorized as a fire/explosion. The incident took place in the Chatham Strait, near the landmark Point Gardner, Alaska.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-661691c93d", "answerable": true, "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "evidence": [{"doc_id": "MIR2543.pdf", "quote": "when the towing vessel Steel Skipper, which was reconfiguring the tow, pushed the tow astern, and the William E Strait collided with two moored barges upstream at the Shell Norco Refinery dock, damaging the barges and dock", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2543.pdf", "text": "about 0210, he felt the vessel begin to move astern in the direction of the Shell Norco Refinery dock as the fleeting tug moved the last two barges into position at the head of the tow. The William E Strait’s engines were not engaged. The Steel Skipper finished its work about 0215, and, with the weather clearing, the mate then noticed “extra equipment tied off to [the] Shell dock. It appeared to be a barge that wasn’t lit well but a bit below [the] dock.” He walked to the stern to check that the towboat was clear. The mate got the William E Strait underway about 0300 and began heading downbound with 16 barges for the Gnots fleeting area at mile 118. A few days later, the Shell Norco Refinery discovered damage to the no. 3 dock and to the two barges moored there. A Shell Norco Refinery boat lift was also damaged. Damages were estimated at $1,000 for the Cajun Courage and CDB02 and $500,000 for the facility.", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 4 CORRECTED COPY three barges in two trips across the river to the Upper St. Rose fleeting area. Operations began at 0100, with the Steel Skipper taking one barge on the first trip, then the remaining two barges on the next trip (see figure 3). Figure 3. William E Strait towing arrangement on arrival and departure from mile 126. (Background source: William E Strait mate) Once the transfer of the 3 barges to the Upper St. Rose fleeting area was completed, the Steel Skipper began to reposition the remaining two barges in the starboard string to the newly created space in the center string (from the barges moved to the Upper St. Rose fleeting area) to create four strings of four barges each for the next leg of William E Strait’s voyage. The mate of the William E Strait said that,", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 5 CORRECTED COPY Using automatic identification system and vessel traffic service data, investigators found that, at the time the last two barges were pushed into place by the Steel Skipper, the William E Strait moved astern about 400 feet toward the moored crane and deck barges at the Shell Norco Refinery dock (see figure 4). Figure 4. William E Strait astern movement toward moored barges on December 10. (Background source: National Oceanic and Atmospheric Administration electronic navigation chart US5LA52M as viewed on Rosepoint)", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "The fleeting tug Steel Skipper was tasked with moving three barges from the William E Strait tow across the river from the Shell Norco Refinery dock to the Upper St. Rose fleeting area near mile 126 on the right descending bank. 3 The Steel Skipper operated with a crew of three—a captain and two deckhands. The Steel Skipper and William E Strait captains had agreed by radio that the Steel Skipper would take the 2 Cajun Industries LLC owned and operated the crane barge, which was built in 2010, and the deck barge, built in 2021. 3 The 68-foot-long fleeting towing vessel Steel Skipper was built in 2021 in Bayou La Batre, Alabama.", "spans": []}], "answer": "The assisting tug Steel Skipper was moving the last two barges into position at the head of the tow near the Shell Norco Refinery dock when the William E Strait ended up backing into the barges tied up at the Shell refinery pier near Norco.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-39365f998b", "answerable": true, "question": "According to the NTSB analysis, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "status": "not_retrieved"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank. Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in this case, the PTC 706 (center barge) had more freeboard than the adjacent barges, but the adjacent barges were not submerged. Therefore, it is more likely that the PTC 706’s freeboard was reduced by weight forward in the barge. This weight forward could have been", "spans": [[94, 361]]}, {"doc_id": "MIR2521.pdf", "text": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 4 Figure 3. Towing arrangement of MARMAC 27 and Baylor J. Tregre (towline not to scale). The Baylor J. Tregre had four crewmembers aboard, including a captain, a mate, and two deckhands (deckhands 1 and 2). The captain and deckhand 1 worked a watch schedule of 0600–1200 and 1800–2400, and the mate and deckhand 2 worked the opposite watch schedule of 0000–0600 and 1200–1800. Once offshore, the Baylor J. Tregre proceeded on a westerly course along the coastline of Louisiana (the tow could not use the Gulf Intracoastal Waterway because the platform on the barge was too tall to transit through some bridge and powerline crossings). About 0630, on May 13, the captain, who was at the helm for his scheduled watch, executed a southwesterly course change. The crew received daily weather reports from Trinity Tugs shoreside staff and", "spans": []}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 4 and coal. The barges with soybeans and corn had covers over their cargo hoppers; the coal barges did not. At the head of the tow, the barges’ raked ends faced forward, while at the aft end of the tow, the Chad Pregracke was faced up to the barges’ raked ends. The PTC 706’s freeboard was about 30 inches, and the two other uncovered coal barges at the head of the tow had a freeboard of 30–31 inches. The covered barges at the head of the tow had varying freeboards: the port outermost barge (CH 0121) had 18 inches, the second tier barge from port (MTC 1379) had 30 inches, and the starboard outermost barge (CH 0132) had 24 inches. Figure 4. Tow diagram of the Chad Pregracke. Over the next day, the pilot and captain alternated navigational watches. The captain stood watch from 0515 to 1115 and 1715 to 2315, and the pilot stood watch", "spans": [[427, 449], [502, 524]]}, {"doc_id": "MIR2546.pdf", "text": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow On March 16, 2024, about 0008 local time, the towing vessel Chad Pregracke was transiting southbound on the Lower Mississippi River pushing 34 loaded barges, near mile 260.6, about 5 miles east of New Roads, Louisiana, when a barge, the PTC 706, at the head of the tow rapidly sank, causing the tow to break apart (see figure 1 and figure 2). 1 Five barges in the tow were damaged. Damages were estimated at $2 million. There were no injuries, and no pollution was reported. Figure 1. Chad Pregracke after the casualty. 1 (a) In this report, all times are central daylight time, and all miles are statute miles. Unless otherwise noted, all speeds in this report speed over ground. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM029). Use the CAROL Query to search investigations. December 11, 2025 MIR-25-46", "spans": [[112, 148], [316, 338]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b9f7fe32e7", "answerable": true, "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "evidence": [{"doc_id": "MIR2529.pdf", "quote": "The vessel was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 5 crew were in the water, less than 4 minutes had elapsed. The yacht had listed over about 45–50° and grounded in the mud, visibly down by the stern (see figure 5). About 1247, automatic identification system data showed the vessel at a speed of 0.1 knots, crossing the 12-foot-depth contour in the West River. Figure 5. The Lovebug at 1238:48 and 1241:45, shortly after the owner and crew abandoned the vessel. (Source: Lovebug owner) Nearby Good Samaritan vessels rescued the crew and owner; Coast Guard personnel later evaluated them for injuries. One crewmember had a minor injury. For 16 days, the partially sunken yacht remained in the West River while salvage plans and logistics were coordinated. Salvage operations began on August 13. The vessel’s aftmost spaces on its lower deck were a garage that housed watercraft and a technical area for vessel electrical and mechanical systems on the", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 7 indication of a potential source of water ingress on the interior or exterior of the vessel. Extensive damage and debris throughout the vessel prevented investigators from examining some smaller spaces. The marine surveyor’s report stated, “due to the post casualty condition of the vessel it is impossible to determine the pre-loss condition.” The report also noted that the vessel had passed a class inspection the month before the casualty. 3 Damage to the vessel was estimated at $8 million. 3 Bureau Veritas was the class society responsible for Lovebug’s survey. The most recent survey took place on July 19, 2024, and included annual surveys of the hull, structure, machinery, and load line. Surveyors commented that there were no damages on the accessible parts of the hull, machinery alarms were audible throughout vessel, and no substantial corrosion areas had been identified during", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug On July 27, 2024, about 1235 local time, the yacht Lovebug was transiting the Chesapeake Bay in the West River north of Shady Side, Maryland, when the vessel started listing heavily to starboard (see figure 1 and figure 2). 1 The four crewmembers and one owner on board abandoned the vessel and were rescued by nearby vessel crews. The yacht partially sank in about 12 feet of water. There was one minor injury. An oil sheen, visible around the vessel, was contained with a boom. Damage to the vessel was estimated at $8 million. 2 Figure 1. The partially sunken Lovebug on July 27, 2024, at 1342. (Source: Maryland Natural Resources Police) 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM053). July 15, 2025 MIR-25-29", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 4 About 1235, when the yacht was near the West River Entrance Light 2, the captain noticed the Lovebug had developed a starboard list (see figure 4). He checked the steering, rudder indicators, and stabilizers o n the bridge and found no problems. The captain told investigators that, when the vessel first began listing, he did not hear any alarms. The list rapidly increased. According to the captain, about a minute after the vessel started listing, the vessel, which had been powered by its starboard generator, lost power. The captain backed off the throttles, and the vessel’s speed dropped to about 4 knots. Figure 4. The Lovebug’s track from the approximate area the vessel first was observed listing to its final position. (Background source: National Oceanic and Atmospheric Administration Electronic Navigation Chart US5MD1LC as viewed on Made Smart automatic identification system)", "spans": []}], "answer": "The information provided does not specify the shipyard to which the yacht Lovebug was moved after being refloated from the West River, nor does it mention the exact date of this move. However, it is noted that salvage operations began on August 13, 2024, and the vessel was partially sunken in the West River for 16 days following the incident on July 27, 2024. Based on the timeline, it is likely that the yacht was moved to a shipyard for inspection and repairs after salvage operations concluded, but the specific shipyard and date are not provided in the context.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6c9dd97335", "answerable": true, "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward.", "status": "retrieved"}, {"doc_id": "MIR2628.pdf", "quote": "The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "rapidly expand as the vessel moved through the water (seas and swells) as it transited, ultimately causing a larger section of the hull to separate, including portions of the plywood, as seen by the second captain and deckhand 1. Water can penetrate through cracks, unsealed through-hull fittings, or areas where improper repairs have been made. Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward. The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs. Although the vessel was not salvaged, and therefore investigators could not examine the hull to determine the method of failure, it is possible that inadequately completed repairs to the hull contributed to the casualty.", "spans": [[346, 470], [471, 727]]}, {"doc_id": "MIR2628.pdf", "text": "about a 10-foot-long section located about 4 feet down from the rub rail. The repairs were completed by the owner and the captain. The US Coast Guard was not notified about the issue with the hull and therefore did not oversee the repairs as required for an inspected vessel like the Jig Strike. According to the Coast Guard, “on multiple occasions from 2005 until vessel sinking, the owner of the Jig Strike routinely disregarded notifying attending CG [Coast Guard] inspectors of ongoing repairs.” A condition and valuation survey was completed in December 2021; the surveyor rated the hull and structure of the vessel as “satisfactory.” The summary of the survey stated, “ The vessel is basically structurally sound but it does exhibit normal deterioration and mechanical deficiencies.”", "spans": [[138, 182]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": [[724, 755]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, the delamination was repaired by the owner and the captain. The Coast Guard was unable to oversee the repairs because they were not notified about the issue with the hull. The Coast Guard stated that the owner of the Jig Strike routinely disregarded notifying attending Coast Guard inspectors of ongoing repairs.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-4166934deb", "answerable": true, "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The barges were recovered by EMS tugs near mile 802 about 0700 and returned to the MPC facility dock.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "3 The current was about 3 mph. A total of six lock lines and four winch wires were used to moor the two barges (three lock lines and two wires on each barge). MPC told investigators that there was not a specified minimum number of lines to secure barges at their facility, but that industry standard was four lines and/or wires per barge in normal conditions. MPC expected enhanced measures beyond the minimum at high-wind and -water level conditions but did not specify how many additional lines should be used. On April 16, about 0600, MPC terminal operations personnel arrived at the terminal and found the MPC 644 and MPC 907 missing. At 0610, terminal operations personnel called EMS to check on the status of the barges. After investigating, at 0645, EMS called MPC terminal operations personnel and stated that the barges had broken away overnight. About 0650, terminal operations personnel performed a", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-cffa5ea260", "answerable": true, "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "evidence": [{"doc_id": "MIR2507.pdf", "quote": "As a result of the casualty, the operating company required mooring lines to be replaced annually.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2507.pdf", "text": "Contact of Small Passenger Vessel Columbia Gorge MIR-25-07 with Pedestrian Bridge and Tribal Fishing Platforms 8 number of mooring lines and ran a chain out. However, while it was moored, the winds picked up (more than twice what was forecasted), increasing the wind load (force) acting on the Columbia Gorge. This force, just off the starboard bow, would have strained the mooring lines and chain holding the ship to its dock. As a result, all eight mooring lines and the chain failed. The vessel operator had no plan in place for regularly examining the vessel’s mooring lines or replacing them before failure, and the ages of the Columbia Gorge’s mooring lines ranged from less than 1 year to 10 years, with the age of some lines either unknown or not definitively known. The Cascade Locks Port Commission RCA Team investigated the breakaway and found that the mooring arrangement and nylon lines used would have been adequate to keep the vessel moored during the", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-9705b70e2c", "answerable": true, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "evidence": [{"doc_id": "MIR2610.pdf", "quote": "The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 3 1 Factual Information On April 15, 2024, about 2300, the crews of towing vessels operated by Evansville Marine Services (EMS) moored two 297.5-foot-long steel tank barges, the MPC 644 and MPC 907, alongside (in a string) the Marathon Petroleum Corporation (MPC) terminal dock at mile 793.8 on the right descending bank of the Ohio River, near Evansville, Indiana. 2 The MPC 644 was carrying about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying about 27,328 barrels of no. 84 conventional-blend-grade gasoline. Discharge of cargo from the two barges was expected to take place the following morning. River conditions at the time were high, with the gauge at Evansville at 38.8 feet and rising (the river peaked 4 days later, on April 19, at 39.8 feet). 3 The current was", "spans": [[460, 642]]}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells On April 16, 2024, about 0445 local time, the barges MPC 907 and MPC 644 broke free from their moorings at the Marathon Petroleum Company terminal dock at mi le 793.8 on the Ohio River, near Evansville, Indiana (see figure 1 and figure 2). 1 The two barges contacted moori ng cells about 1,500 feet downstream at the TransMontaigne terminal at mile 794.1. The barges were later recovered with minor damage. There were no injuries, and no pollution was reported. Damage to the TransMontaigne dock structure was estimated to exceed $2.5 million. Figure 1. Barge MPC 644 at unknown date. (Source: Marathon Petroleum Company) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM034). April 6, 2026 MIR-26-10", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells MIR-26-10 6 2 Analysis On April 16, 2024, two barges loaded with ultra low sulfur diesel fuel and gasoline broke away from their mooring location at the MPC terminal on the Ohio River. The barges, MPC 907 and MPC 644, drifted away and contacted mooring cells at another facility, located downstream. The breakaway occurred during high-water conditions. MPC expected third-party fleet providers—in this case, EMS—to use enhanced measures for mooring in such conditions. Standard mooring consisted of four lines and/or wires per barge. On the evening before the breakaway, EMS personnel had moored the two barges using 10 total lines (three lines and two wires for each barge), thus meeting MPC’s expectations. Because the lines were not retained for examination or testing, investigators could not determine their condition at the time of the accident.", "spans": []}, {"doc_id": "MIR2610.pdf", "text": "visual inspection of the dock and found all six lock lines and four winch wires broken. Terminal operations personnel then notified all downriver facilities of potentially loose barges. MPC personnel reviewed terminal camera footage, which showed that, about 0445 on April 16, the two barges broke free from the dock. EMS reported a drift pile of debris (100 feet by 200 feet) in the water about the time of the breakaway. According to MPC, terminal camera footage appeared to show a debris pile that followed the barges after the breakaway. 2 (a) The inland towing industry refers to the shorelines of Western Rivers as the left and right banks when traveling (facing) downriver. The left bank is called the left descending bank, and the right bank is called the right descending bank. (b) The Ohio River runs 981 miles from Pittsburgh, Pennsylvania, to Cairo, Illinois, where it meets the Mississippi River. 3 Flood stage at Evansville is 42 feet.", "spans": []}], "answer": "The MPC 644 was carrying approximately 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel. The MPC 907 was carrying approximately 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-f8ea159c03", "answerable": false, "question": "What was the official cause of death for the chief engineer and third engineer who died in the Stride engine room fire at Barbours Cut, according to the medical examiner?", "expected_answer": "The report does not state a medical cause of death; it says only that local paramedics pronounced the chief engineer and third engineer dead on scene.", "evidence": [], "passages": [{"doc_id": "MIR2505.pdf", "text": "began boundary cooling on the exterior engine room bulkheads. About 0336, the chief engineer reported to the captain via handheld radio that three crewmembers were in the engine room: the third engineer, wiper, and himself. Emergency teams suited up in firefighting gear to search for the crewmembers and assess the situation in the engine room. The chief engineer shut down all electrical power from the ECR, blacking out the vessel. Upon loss of power, the ECR became dark. A ll three engine crewmembers were coughing due to the smoke. The vessel’s emergency diesel generator automatically started, providing electrical power to vital equipment and lighting circuits. The three engine crewmembers attempted to leave the ECR with their faces covered with shirts soaked in water, but upon opening the ECR door into the engine room, they were met with flames and smoke, so they retreated back into the ECR.", "spans": []}, {"doc_id": "MIR2505.pdf", "text": "Engine Room Fire aboard Cargo Ves sel Stride MIR-25-05 14 Figure 8. Left: Diesel oil puddled alongside base of main engine on tanktop. Upper right: Diesel oil puddled in main engine air intake manifold. Bottom right: Diesel oil puddled in deck containment by boiler on D deck. 1.3.2 Personnel The chief engineer who was aboard the Stride at the time of the fire had 38 years of experience in the maritime industry and had worked with the company as a chief engineer on six other company vessels since 2016. This was his first trip aboard the Stride, and he joined the vessel about 7 weeks before the fire. The third engineer joined the company in 2004 as a wiper, and he had completed 26 contracts aboard various company vessels as a motorman, fourth engineer, and third engineer. This also was his first trip aboard the Stride; he joined the vessel about 3 weeks before the fire. The wiper had about 4 years of experience in the maritime industry and had", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "engineer stated that he “tried to put out the fire on [the motorman’s] coverall” before they ran up to deck 1 to the ship’s hospital to receive first aid from the ship’s doctor. About the same time, the officer on watch on the bridge received a “chain of fire alarms in the engine room.” The officer in the wheelhouse called the engineer on watch in the ECR via phone and also called the captain on his handheld radio. The captain, who was on the balcony of deck 3, felt “a shake of the ship“ and saw thick smoke coming from the vessel’s funnel. A bout this time, the chief engineer and chief mate arrived on scene in the ECR. The captain reported to the wheelhouse, and the officer on watch advised him that a failure of the no. 2 auxiliary engine had resulted in an engine room fire. Additionally, he reported that the motorman, who was near the engine, had gotten burned and was receiving first aid from the ship’s doctor.", "spans": []}, {"doc_id": "MIR2516.pdf", "text": "board. The medical examiner determined that the primary cause of death for the two fatally injured firefighters was smoke inhalation, including carbon monoxide intoxication. 1.3 Vessel 1.3.1 General The Grande Costa D’Avorio was a 692-foot-long Ro/Con vessel with 12 decks. Vehicles were loaded using a stern ramp that led up to deck 3 (see Figure 8). Deck 11 was partially exposed and had a cargo vehicle deck, weather deck, and crew accommodation space.", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-231ed782d1", "answerable": true, "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "evidence": [{"doc_id": "MIR2527.pdf", "quote": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "status": "retrieved"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "status": "not_retrieved"}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 4 Figure 3. Land-based firefighters on Lucinda Smith. (Source: New Bedford Fire Department) After the fire, US Coast Guard investigators examined the damage on the Lucinda Smith. The Coast Guard also requested assistance from Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) certified fire investigators, who participated in the examination of the damage. ATF investigators concluded that the fire originated in the first mate’s stateroom. Based on the fire damage patterns found within the stateroom, investigators concluded that the fire most likely originated at or near the floor (deck) by the end of the bunk. However, due to the damage to the interior of the stateroom, ATF investigators could not determine the exact ignition source and ultimately classified the cause of the fire as “undetermined.”", "spans": [[443, 487]]}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire aboard the towing vessel Lucinda Smith was an undetermined ignition source in one of the vessel’s staterooms.", "spans": []}, {"doc_id": "MIR2527.pdf", "text": "Fire aboard Towing Vessel Lucinda Smith MIR-25-27 6 2 Analysis While the towing vessel Lucinda Smith was moored at the dock, a crewmember heard a smoke alarm and discovered a fire in one of the staterooms. ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater). Electrical sources near the bunk included an electric heater, an oscillating fan, and an electrical wall receptacle. Crew interviews revealed that the heater and fan were not in use before the fire and thus likely were not an ignition source. The receptacle and associated vessel wiring were original to the vessel’s construction and nearly 50 years old. If there was an electrical fault—such as a loose, broken, or frayed wire, or broken receptacle hardware—within the receptacle or nearby circuitry, it could have created excessive resistance heating. Resistive heating from electrical conductors within", "spans": [[206, 364]]}, {"doc_id": "MIR2623.pdf", "text": "Fire aboard Fishing Vessel Sub Zero MIR-26-23 5 2 Analysis While the fishing vessel Sub Zero was transiting Nushagak Bay, a fire started in the engine compartment. The two crewmembers on board attempted to fight the fire but were unsuccessful and were forced to abandon the vessel into a liferaft. They were rescued by a good Samaritan fishing vessel before the Sub Zero sank. The captain initially observed smoke in the aft end of the engine compartment on the display for the two engine compartment cameras. He told investigators that the smoke appeared to be near the vessel’s hydraulic fuel tank but could not definitively confirm its location. The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "spans": [[649, 872]]}], "answer": "On the **Lucinda Smith**, investigators were able to narrow the fire's origin to the **first mate’s stateroom**, specifically **near the floor (deck) by the end of the bunk**. However, they could not determine the **exact ignition source** due to the **damage to the interior of the stateroom**, which obscured critical evidence.\n\nIn contrast, on the **Sub Zero**, investigators could not determine the **exact origin or ignition source** of the fire because the vessel **burned to the waterline and sank**, making it **impossible to access and inspect** the engine compartment or other areas for evidence. The captain reported smoke near the **hydraulic fuel tank**, but this could not be confirmed due to the vessel's destruction.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-65249668c4", "answerable": true, "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "Possible ignition sources in the forward berthing area included electrical wiring, electrical components, and the lithium-ion batteries stored in the portside bunk (some of which the captain said were charging at the time).", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "investigators were unable to determine when this occurred in the ignition sequence, and it is possible that the arcing and corrosion occurred after the initial fire or during firefighting efforts.", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "due to severe fire damage in the berthing area, and because the space was unoccupied when the fire started, investigators were unable to determine when the bag containing the lithium-ion batteries caught fire or what caused it to ignite.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 8 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on board the fishing vessel Spicy Lady was an unknown source on a bunk in the forward berthing area.", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 7 2 Analysis While the crew of the Spicy Lady was fishing in Chatham Strait, about 1 mile west of Point Gardner, Alaska, they saw smoke and discovered a fire in a berthing area inside the main cabin. The fire was later extinguished by responding firefighters. When the crew entered the cabin to investigate the smoke, they discovered a fire near the portside middle bunk in the forward crew berthing area. They found that the bunk mattress was burning, as was a “plastic tote” containing lithium-ion batteries for personal items, which may have been charging at the time. Post-fire photos showed that, compared to other areas of the vessel, the portside bunks in the forward berthing area were the most severely damaged and thus experienced the highest level of heat. Additionally, the responding firefighters and the marine surveyor’s report both concluded that the most severe smoke and fire damage was located in", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady On March 6, 2025, about 1320 local time, the commercial fishing vessel Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska, when the vessel caught fire (see figure 1 and figure 2). 1 The five crewmembers on board were unable to extinguish the fire and abandoned the vessel onto a nearby Good Samaritan vessel. The fire was later extinguished by responding firefighters. One crewmember suffered minor injuries. No pollution was reported. The vessel was declared a total constructive loss, valued at $1.6 million. Figure 1. Spicy Lady being towed after the fire. (Source: Spicy Lady captain) 1 ( a) In this report, all times are Alaska standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM022). February 4, 2026 MIR-26-04", "spans": []}, {"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 3 1 Factual Information On March 2, 2025, the 58-foot-long steel-hulled fishing vessel Spicy Lady got underway from Heritage Harbor near Wrangell, Alaska, with a crew of five. Between March 2 and March 5, the Spicy Lady transited near Frederick Sound and Chatham Strait while fishing for golden king crab. On March 6, at 1320, the crew of the Spicy Lady was fishing in Chatham Strait about 1 mile west of Point Gardner, Alaska. Crewmembers on the aft working deck were preparing to haul in a crab pot when they noticed smoke coming from the main cabin, which was forward on the same deck. The deck boss and another crewmember entered the main cabin to investigate the source of the smoke and observed a fire in a crew berthing area located near the bow of the vessel. 2 (The crew berthing area was a “V-berth” with six bunks—three on the port side and three on the starboard side.)", "spans": []}], "answer": "Investigators were unable to pin down the exact source of the blaze on the fishing vessel *Spicy Lady* because the fire originated from an **unknown source** on a bunk in the forward berthing area. While the fire was later found to have started near the **portside middle bunk** in the forward crew berthing area, the specific cause—such as whether it was due to an electrical fault, overheating lithium-ion batteries, or another factor—could not be definitively determined.\n\nKey factors that contributed to the difficulty in pinpointing the exact cause include:\n\n1. **Lack of clear evidence**: The fire damaged the area significantly, and post-fire photos showed that the portside bunks in the forward berthing area were the most severely damaged. However, this did not provide conclusive evidence about the exact point of origin or the cause.\n\n2. **Potential involvement of lithium-ion batteries**: A \"plastic tote\" containing lithium-ion batteries for personal items was found to be burning, and it may have been charging at the time. While this suggests a possible cause, it was not confirmed whether the batteries were the direct source of the fire or if they were involved in a secondary way.\n\n3. **Limited witness accounts**: The crew members who discovered the fire and attempted to extinguish it did not provide enough detail about the initial spark or heat source.\n\n4. **Fire suppression and damage**: The fire was extinguished by responding firefighters before it could spread further, which may have limited the ability to gather physical evidence or trace the fire's progression.\n\nAs a result, the National Transportation Safety Board (NTSB) concluded that the **probable cause** of the fire was an **unknown source** on a bunk in the forward berthing area, highlighting the challenges in determining the exact origin of the blaze.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e9729a44ab", "answerable": true, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; during the initial charging of one of the 48-volt battery banks using one of the portable chargers, which started on February 1, it took 5 days for the battery voltage to increase from 34 volts to 39 volts.", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "Vessel personnel determined that the BMSs were preventing the batteries from being charged from a portable charger", "status": "not_retrieved"}, {"doc_id": "MIR2531.pdf", "quote": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 4 Figure 3. Diagram of the main deck of the Flagship showing the approximate locations of the 24-volt and 48-volt lithium-ion battery banks. ( Background source: RMK Merrill Stevens) 1.2 Event Sequence 1.2.1 Pre-casualty Events Before their installation on the Flagship during vessel construction, the 24- and 48-volt batteries for the Flagship were able to maintain a charge. There were no issues with the installation of the 48-volt lithium-ion battery systems. However, when the 24-volt system was installed, its BMS could not manage the charging of battery cells. The cause of the problem with the charging of the 24-volt lithium-ion battery system was not identified or resolved during vessel construction. During the vessel’s sea trials, a temporary battery bank of 24-volt batteries with a portable charger was placed on board to meet the vessel’s electrical demands.", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "In response, the vessel manufacturer, shipyard personnel, an electrician, and the vessel owner’s representative developed a new procedure to increase the charging speed of the lithium-ion batteries by bypassing the BMS of each battery bank. To bypass each BMS, an electrical wire was attached to allow power to travel from one side of the terminal to the other side (see figure 4). Figure 4. The installed bypass wire and the wire from the external charger on one of the 48-volt battery management systems on board the Flagship. (Background source: RMK Merrill Stevens) The BMS for the 24-volt battery system, which provided power to the vessel’s fuel pump and internal lights, was bypassed on March 13 and charged by a portable charger that had arrived with the vessel from Turkey.", "spans": [[0, 240]]}, {"doc_id": "MIR2531.pdf", "text": "Fire aboard Yacht Flagship MIR-25-31 8 Figure 6. The 24-volt lithium-ion battery bank (c ircled), after the fire. Shipyard personnel told investigators that the 24-volt and 48-volt batteries were not being charged when the workday ended on Friday, April 26, or during the weekend. They did not document or recall when they were last charged. Shipyard personnel informed investigators that both chargers were disconnected before the fire. The vessel’s shore power cable was connected to an outlet designated to provide electricity while the vessel was docked. In addition, a vessel’s representative told investigators that the electrical systems on the vessel were not being powered by the 24-volt and 48-volt battery systems. 2 Analysis The yacht Flagship was docked with no personnel on board at a shipyard on the Miami River in Miami when an explosion and fire occurred. Shoreside firefighters", "spans": []}, {"doc_id": "MIR2531.pdf", "text": "electrical battery system (see figure 3). A BMS is critical to the safety and overall performance of lithium-ion batteries. The four BMSs aboard the Flagship managed the voltage, current, and temperature of each battery cell, as well as the charging and discharging. The BMSs were designed to start charging each of the battery banks when the charge level fell below 94% and would continue to charge until the charge level reached 100%. The battery banks could be charged from the vessel’s generator, shore power connection, or the solar panels located on the flying bridge. 4 3 CE Certification refers to European Union regulations that required manufacturers to affix a “CE marking” on products. The CE marking indicates that a product has been assessed by the manufacturer and deemed to meet European Union safety, health, and environmental protection requirements. 4 The vessel’s shore power electrical system was designed to operate on the nominal European", "spans": []}], "answer": "The team decided to wire around the battery monitoring computers (BMS) to increase the charging speed of the lithium-ion batteries by bypassing the BMS. The documents do not specify how many volts per day the 48-volt bank had been gaining before this action.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-eb19209763", "answerable": true, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "status": "retrieved"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direction. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. Because there were not enough immersion suits available for everyone, t he captain elected not to wear one. The crew attempted to stay on the stern deck of the vessel as long as possible before deploying the liferaft and entering the water. With the wheelhouse unattended, t he vessel’s heading changed, and smoke", "spans": [[599, 706]]}, {"doc_id": "MIR2504.pdf", "text": "distress call on VHF channel 16; he stated that the vessel was on fire and the crew was abandoning ship, and he also provided the vessel’s position. According to the captain, while making the radio calls in the wheelhouse, he was gasping for air and could barely see the GPS position on the navigation console due to the amount of smoke. US Coast Guard Sector Northern New England (in Portland, Maine) received the distress call from the Three Girls. Once alerted about the fire, the first mate ran into the accommodation space to collect as many survival suits from the crew quarters (staterooms) as he could carry. He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "spans": [[617, 895]]}, {"doc_id": "MIR2504.pdf", "text": "Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 6 On August 11, about 2030, the captain made a round of the engine room before returning to the wheelhouse to maneuver the vessel. He did not notice anything out of the ordinary during his round. About 2045, the captain called the crew to report to the stern deck to begin hauling the fishing net back onto the vessel. Crewmembers and the NMFS observer retrieved their gear from the vestibule at the entrance to the engine room in the accommodation space—which included the crew staterooms and the galley—before reporting to the stern deck. As they arrived, the captain was in the port aft corner of the wheelhouse overlooking the stern, operating the hydraulic net reel to haul in the fishing net. None of the crewmembers reported anything unusual from the entrance to the engine room. About 2050, after the fishing net was recovered from the seafloor, and when it", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 11 suits and lifejackets as fire blocked the crewmembers’ path to their storage area. The captain quickly made a mayday call, activated the EPIRB, and abandoned the vessel with the sternman into the liferaft in a timely manner. However, deployment of the liferaft on the windward side of the vessel prevented the crew from positioning it at a safe distance from the burning vessel. As a result, the heat of the fire ignited the liferaft’s canopy, causing it to sink and forcing the crewmembers into the water without any survival gear. The estimated water temperature of 50°F was within a range where hypothermia was a significant survival factor. 6 In water that temperature, cold incapacitation—where the use of hands, arms, and legs becomes more difficult—can occur within 10 minutes and possibly result in swimming failure or drowning. 7 Without lifejackets or immersion suits, the GITN’R DUN crew’s survival was dependent", "spans": []}], "answer": "The captain of the fishing vessel Three Girls did not wear an immersion suit because there were not enough available for everyone, and he elected not to wear one.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e8fe4221e6", "answerable": true, "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "evidence": [{"doc_id": "MIR2545.pdf", "quote": "On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking", "status": "not_retrieved"}, {"doc_id": "MIR2545.pdf", "quote": "was owned and operated by Algoma Central Corporation", "status": "not_retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel", "status": "retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "was owned and operated by Algoma Shipping Ltd., a subsidiary of the Algoma Central Corporation", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2606.pdf", "text": "Grounding of Dry Bulk Carrier Algoma Verity On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel (see figure 1 and figure 2). 1 The vessel repositioned and continued its upbound transit, outside the channel, until, at 1828, the vessel grounded again, coming to a stop. The Algoma Verity was refloated 3 days later. No pollution or injuries were reported. Damage to the vessel was estimated at $6.6 million. Figure 1. Algoma Verity underway at unknown date. (Source: Algoma Central Corporation) 1 (a) In this report, all times are eastern standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM015). Use the CAROL Query to search investigations. March 4, 2026 MIR-26-06", "spans": [[44, 236]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-2bdcea8ee3", "answerable": true, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; duri
