 temperature 67° F, seawater temperature 63° F, sunset 2024, evening twilight 2102 Waterway information Ocean, depth about 450 ft (at casualty site) Figure 2. Area where the fire broke out aboard the fishing vessel Three Girls, as indicated by a circled X. (Background source: Google Maps)", "spans": []}], "answer": "The documents do not contain the name of the tugboat that recovered the burning fishing vessel Three Girls.", "judges": ["groundedness", "abstention"]}, {"key": "t-dee5eeff4a", "answerable": true, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "status": "not_retrieved"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "status": "not_retrieved"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 13 the Scot Stuttgart, the fixed fire extinguishing system’s CO 2 capacity was designed to extinguish a fire in only one engine room, not both. 1.3.5 Postcasualty Actions by the Operating Company After the fire, the operating company identified an inconsistency in the fuel return piping system on a vessel built similarly to the Scot Stuttgart. Like the Scot Stuttgart, the fuel return piping from the port and starboard auxiliary diesel generators on the similarly built vessel did not have a check valve installed in the piping at the top of the day tanks. Other vessels in the fleet with similar diesel oil systems had check valves. The operating company installed check valves at these locations on the Scot Stuttgart and the other similarly built vessel identified without a check valve. The operating company also updated the lock-out/tag-out procedures to", "spans": []}, {"doc_id": "MIR2629.pdf", "text": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 14 2 Analysis On May 17, 2025, while offloading cargo at Puerto Nuevo Terminals in San Juan, a fire broke out in the port engine room aboard the tank vessel Scot Stuttgart. 2.1 Use of Fixed Fire Extinguishing System After discovering thick, white smoke coming from the open door of the port engine room into the engine control room, the crew stopped cargo operations. They shut down the port main engine, remotely stopped all fuel pumps, secured ventilation, shut the ventilation dampers, and stopped electrical power for the port engine room. Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space. While awaiting the arrival of local firefighters, the ship’s crew set up boundary cooling of the port engine room using vessel fire hoses", "spans": [[609, 801]]}, {"doc_id": "MIR2629.pdf", "text": "pressurized by the ship’s fire pump. When shoreside firefighters arrived about 40 minutes later, the ship’s crew reported that there were no elevated heat readings outside the port engine room (as measured using handheld infrared thermometers). The incident commander requested permission from the master for firefighters to open the space and investigate the source of the fire, and the master granted it. When firefighters entered the port engine room, thick smoke was still present. Fixed fire extinguishing systems are typically designed to release a calculated amount of CO 2 into a space to ensure that the CO 2 adequately smothers any fire. The Scot Stuttgart’s system was designed to release all 14 bottles of CO 2 for a fire in the port engine room. The presence of smoldering fire when the firefighters unsealed the space indicates that releasing only half of the system’s CO 2 may not have been as", "spans": []}, {"doc_id": "MIR2625.pdf", "text": "Fire aboard Fishing Vessel GITN’R DUN MIR-26-25 10 2 Analysis On July 24, 2025, a fire broke out in the engine compartment aboard the fishing vessel GITN’R DUN while the crew was hauling lobster traps near Mount Desert Rock, Maine. The fire resulted in the total loss of the vessel. After smelling burning fiberglass, the captain discovered flames and light gray smoke in the engine compartment, aft on the vessel. The engine compartment contained multiple potential heat and ignition sources, including main engine exhaust components, high pressure hydraulic equipment that was operational at the time of the fire, electrical systems, batteries, and combustible materials. However, because the GITN’R DUN burned to the waterline, subsequently sank, and was not salvaged, investigators were unable to access and inspect the vessel to determine the exact ignition source. Before the captain detected the smell of burning fiberglass, there were no", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-329e2954b7", "answerable": true, "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "evidence": [{"doc_id": "MIR2543.pdf", "quote": "when the towing vessel Steel Skipper, which was reconfiguring the tow, pushed the tow astern, and the William E Strait collided with two moored barges upstream at the Shell Norco Refinery dock, damaging the barges and dock", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2543.pdf", "text": "about 0210, he felt the vessel begin to move astern in the direction of the Shell Norco Refinery dock as the fleeting tug moved the last two barges into position at the head of the tow. The William E Strait’s engines were not engaged. The Steel Skipper finished its work about 0215, and, with the weather clearing, the mate then noticed “extra equipment tied off to [the] Shell dock. It appeared to be a barge that wasn’t lit well but a bit below [the] dock.” He walked to the stern to check that the towboat was clear. The mate got the William E Strait underway about 0300 and began heading downbound with 16 barges for the Gnots fleeting area at mile 118. A few days later, the Shell Norco Refinery discovered damage to the no. 3 dock and to the two barges moored there. A Shell Norco Refinery boat lift was also damaged. Damages were estimated at $1,000 for the Cajun Courage and CDB02 and $500,000 for the facility.", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 4 CORRECTED COPY three barges in two trips across the river to the Upper St. Rose fleeting area. Operations began at 0100, with the Steel Skipper taking one barge on the first trip, then the remaining two barges on the next trip (see figure 3). Figure 3. William E Strait towing arrangement on arrival and departure from mile 126. (Background source: William E Strait mate) Once the transfer of the 3 barges to the Upper St. Rose fleeting area was completed, the Steel Skipper began to reposition the remaining two barges in the starboard string to the newly created space in the center string (from the barges moved to the Upper St. Rose fleeting area) to create four strings of four barges each for the next leg of William E Strait’s voyage. The mate of the William E Strait said that,", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 5 CORRECTED COPY Using automatic identification system and vessel traffic service data, investigators found that, at the time the last two barges were pushed into place by the Steel Skipper, the William E Strait moved astern about 400 feet toward the moored crane and deck barges at the Shell Norco Refinery dock (see figure 4). Figure 4. William E Strait astern movement toward moored barges on December 10. (Background source: National Oceanic and Atmospheric Administration electronic navigation chart US5LA52M as viewed on Rosepoint)", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "The fleeting tug Steel Skipper was tasked with moving three barges from the William E Strait tow across the river from the Shell Norco Refinery dock to the Upper St. Rose fleeting area near mile 126 on the right descending bank. 3 The Steel Skipper operated with a crew of three—a captain and two deckhands. The Steel Skipper and William E Strait captains had agreed by radio that the Steel Skipper would take the 2 Cajun Industries LLC owned and operated the crane barge, which was built in 2010, and the deck barge, built in 2021. 3 The 68-foot-long fleeting towing vessel Steel Skipper was built in 2021 in Bayou La Batre, Alabama.", "spans": []}], "answer": "The assisting tug Steel Skipper was moving the last two barges into position at the head of the tow near the Shell Norco Refinery dock when the William E Strait ended up backing into the barges tied up at the Shell refinery pier near Norco.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b8cbb58f66", "answerable": false, "question": "Why did the towboat Harlan Creek and its barges strike the lock wall at Markland Locks and Dam on the Ohio River in 2025?", "expected_answer": "The reports do not cover a contact by a tow of the Harlan Creek at Markland Locks and Dam; no report in the corpus addresses this casualty.", "evidence": [], "passages": [{"doc_id": "MIR2514.pdf", "text": "Contact of Amber Brittany Tow with Vane Dike MIR-25-14 14 2 Analysis On March 8, 2024, the towing vessel Amber Brittany was transiting upbound on the Ohio River pushing 15 loaded coal barges, when the 1,113-foot-long, 4,600-hp tow was set off course and struck the vane dike mooring cell while exiting the Portland Channel at the McAlpine Locks and Dam. The tow broke apart, sending 10 barges floating down the river, eventually lodging alongside pilings of the L&I Railroad Bridge and in two of the lower McAlpine Dam gates. The upstream section of the McAlpine Locks and Dam is uniquely difficult to navigate, even under ideal circumstances. The geography of this stretch of the river (multiple bridges, bend in river, concrete riverbank, shoaling), combined with changing water currents near fixed hazards to navigation, creates an environment that is challenging. Prevalent outdraft currents near the vane dike and the location of", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-8d19f9585f", "answerable": true, "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "evidence": [{"doc_id": "MIR2525.pdf", "quote": "the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel.", "status": "retrieved"}, {"doc_id": "MIR2614.pdf", "quote": "Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2525.pdf", "text": "On July 13, 2023, about 0100, the Duke, with five crew aboard, departed the Texas International Terminal, a liquid and dry bulk facility, pushing two empty red-flagged barges en route to Galena Park, Houston, eastbound in the Galveston Ship Channel. The two barges were made up abreast and bow to bow with the towboat. The captain, who was at the helm, told investigators he intended to back out with the barges and then shift position to make up to the aft end of the tow before proceeding outbound (see figure 3). Before the tow got underway, Vessel Traffic Service Houston/Galveston reported a 1.5-knot flood current. The captain later noted a 0.77-knot current setting the vessel down on the Figure 3. Duke tow departing the basin at 0120. The poles and section of the bridge contacted by the tow are circled. (Background source: Magnolia data as viewed on Rosepoint)", "spans": [[30, 249]]}, {"doc_id": "MIR2525.pdf", "text": "Contact of Duke Tow with Power Transmission Poles and Pelican Island Bridge MIR-25-25 6 2 Analysis On July 13, 2023, the towing vessel Duke, pushing two barges, was backing into the Galveston Ship Channel away from the Texas International Terminal when the tow contacted multiple power transmission poles, and the tug subsequently contacted the Pelican Island Causeway Bridge. The vessels, electrical infrastructure, and bridge together sustained estimated damages of $300,000. The Duke captain stated that he intended to back out with the barges made up abreast bow to bow with the towboat before flipping the barges around and proceeding outbound. He also stated that a bulk carrier moored to the end of the pier immediately east of the Texas International Terminal required him to back out fa rther than normal into the channel, and that he was focused on staying clear of the moored vessel while he was underway.", "spans": []}, {"doc_id": "MIR2614.pdf", "text": "3 Each barge was loaded with about 24,000 barrels of vacuum gas oil (VGO), a thick heavy petroleum byproduct of the crude oil refinement process. The tow was oriented northerly, toward the Galveston Channel. The towboat was faced up to the rake end of the MMLP 322, with the MMLP 321 as the lead barge (see figure 4). Figure 4. Simplified diagram of the LCPL Phillip C George tow (scale approximate). The barges were identical, each measuring 297.5 feet long and 54 feet wide. The overall length of the tow was about 677 feet, and the deepest draft was 10 feet (the barges). The barges were made up to each other with a port and starboard coupling. Each coupling consisted of four steel wires and a fiber center line at the center kevels between the two barges. On board the Phillip C George were a captain and three other crewmembers. The captain explained she had decided to have the barges strung out (versus a breasted", "spans": [[2, 145]]}, {"doc_id": "MIR2614.pdf", "text": "Contact of LCPL Phillip C George Tow with Terminal Dolphin, MIR-26-14 Power Transmission Pole, and Pelican Island Bridge 4 Overhead electrical power transmission lines with a vertical clearance of 85 feet ran parallel to the causeway. The lines, which were owned by CenterPoint Energy, were supported by poles located in the water about 85 feet to the east side of the bridge. The Texas International Terminal (TXIT) was a liquid- and dry-bulk facility located on the south of the Galveston Channel, on Pelican Island. TXIT was comprised of three deep-draft vessel berths, three barge berths, and an east and west breakwater. A dolphin was located at the end of each breakwater, and the distance between the west and east breakwater dolphins was about 440 feet. 1.2 Event Sequence On the morning of May 15, 2024, the towing vessel LCPL Phillip C George was moored at TXIT, with two tank barges, MMLP 321 and MMLP 322, strung out. 3 Each", "spans": []}], "answer": "The Duke was pushing two empty red-flagged barges, and the LCPL Phillip C George was pushing two tank barges loaded with about 24,000 barrels of vacuum gas oil (VGO) each.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-8b168a96d1", "answerable": true, "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "evidence": [{"doc_id": "MIR2604.pdf", "quote": "Possible ignition sources in the forward berthing area included electrical wiring, electrical components, and the lithium-ion batteries stored in the portside bunk (some of which the captain said were charging at the time).", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "investigators were unable to determine when this occurred in the ignition sequence, and it is possible that the arcing and corrosion occurred after the initial fire or during firefighting efforts.", "status": "not_retrieved"}, {"doc_id": "MIR2604.pdf", "quote": "due to severe fire damage in the berthing area, and because the space was unoccupied when the fire started, investigators were unable to determine when the bag containing the lithium-ion batteries caught fire or what caused it to ignite.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2604.pdf", "text": "Fire aboard Fishing Vessel Spicy Lady MIR-26-04 8 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on board the fishing vessel Spicy Lady was an unknown source on a bunk in the forward berthing area.", "spans": []}], "answer": "The documents indicate that investigators were unable to determine the exact source of the blaze on the fishing vessel Spicy Lady, and the National Transportation Safety Board identified the probable cause as an \"unknown source on a bunk in the forward berthing area.\"", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5b2b8964ff", "answerable": true, "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "evidence": [{"doc_id": "MIR2628.pdf", "quote": "Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward.", "status": "retrieved"}, {"doc_id": "MIR2628.pdf", "quote": "The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2628.pdf", "text": "rapidly expand as the vessel moved through the water (seas and swells) as it transited, ultimately causing a larger section of the hull to separate, including portions of the plywood, as seen by the second captain and deckhand 1. Water can penetrate through cracks, unsealed through-hull fittings, or areas where improper repairs have been made. Several months before the sinking, crewmembers identified a hull delamination above the waterline on the port side, forward. The delamination was repaired by the captain and owner, but the Coast Guard was not notified about the issue and therefore was unable to oversee the repairs to ensure they were completed in accordance with recommended practices for fiberglass hull repairs. Although the vessel was not salvaged, and therefore investigators could not examine the hull to determine the method of failure, it is possible that inadequately completed repairs to the hull contributed to the casualty.", "spans": [[346, 470], [471, 727]]}, {"doc_id": "MIR2628.pdf", "text": "about a 10-foot-long section located about 4 feet down from the rub rail. The repairs were completed by the owner and the captain. The US Coast Guard was not notified about the issue with the hull and therefore did not oversee the repairs as required for an inspected vessel like the Jig Strike. According to the Coast Guard, “on multiple occasions from 2005 until vessel sinking, the owner of the Jig Strike routinely disregarded notifying attending CG [Coast Guard] inspectors of ongoing repairs.” A condition and valuation survey was completed in December 2021; the surveyor rated the hull and structure of the vessel as “satisfactory.” The summary of the survey stated, “ The vessel is basically structurally sound but it does exhibit normal deterioration and mechanical deficiencies.”", "spans": [[138, 182]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 5 Figure 4. Crew and passengers evacuated into liferaft as the Jig Strike sinks. (Source: Joshynews, facebook.com) About 5 minutes later, the charter fishing vessel Legend, which had received the captain of the Jig Strike’s mayday call, arrived and recovered all passengers and crew from the liferaft. The Jig Strike sank shortly afterward. The Legend transported the passengers and crew of the Jig Strike back to San Diego. There were no injuries reported. The vessel was not salvaged and therefore could not be examined. The captain told investigators that in May 2024, several months before the sinking, a deckhand identified a delamination of the hull above the waterline on the port side forward after one of the Jig Strike’s first trips of the season. Deckhand 1, who later witnessed the delamination repairs, described the delamination as being", "spans": [[724, 755]]}, {"doc_id": "MIR2628.pdf", "text": "Flooding and Sinking of Charter Fishing Vessel Jig Strike MIR-26-28 7 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the flooding and sinking of the charter fishing vessel Jig Strike was likely an initial delamination of fiberglass hull sheathing that resulted in a large section of the plywood and fiberglass hull separating while the vessel was underway.", "spans": []}], "answer": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, the delamination was repaired by the owner and the captain. The Coast Guard was unable to oversee the repairs because they were not notified about the issue with the hull. As a result, the Coast Guard could not ensure that the repairs were completed in accordance with recommended practices for fiberglass hull repairs.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-2890edbf91", "answerable": true, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "evidence": [{"doc_id": "MIR2515.pdf", "quote": "However, the flexible ducting was made of combustible material; it was not structurally protected from fire (nor was it required to be).", "status": "not_retrieved"}, {"doc_id": "MIR2515.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "not_retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "status": "retrieved"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 17 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the engine room fire on the towing vessel Johnny M was a catastrophic main engine failure that caused the venting and ignition of hot atomized lube oil. Contributing to the ineffectiveness of the carbon dioxide fixed fire extinguishing system was the lack of structural fire protection for the main engines’ combustion air intake ducting, which allowed oxygen to enter the engine room once the fire consumed the ducting. 3.2 Lessons Learned Structural Fire Protection The flexible ducting providing combustion air to the main engines on board the Johnny M extended from the engine stacks on the main deck down to the engine room and did not have any insulation or other barriers to prevent the passage of smoke, heat, and fire—known as structural fire protection. This type of unprotected", "spans": []}, {"doc_id": "MIR2621.pdf", "text": "Fire aboard Towing Vessel William D MIR-26-21 11 fire protection uses fire-resistant materials and insulation installed on the horizontal and vertical surfaces of a compartment, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke, thus providing additional time to evacuate and for firefighting to contain and extinguish a fire. Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "spans": [[365, 589]]}, {"doc_id": "MIR2621.pdf", "text": "due to the rapid spread of the fire. The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained. 5 Structural fire protection is a component of an overall vessel fire-protection strategy that uses passive design features in a vessel’s structure to slow the expansion of a fire from one compartment to another. Structural 5 See Fire aboard Towing Vessel Mary Dupre near Freeport, Texas, June 26, 2022, MIR-23-12; Fire aboard Towing Vessel Jaxon Aaron on the Lower Mississippi River, mile marker 770, August 13, 2016, MAB-17/19; and Fire On Board Fish Processing Vessel Juno in Grays Harbor, Westport, Washington, December 28, 2013, MAB-15/05.", "spans": [[37, 326]]}, {"doc_id": "MIR2515.pdf", "text": "Engine Room Fire Aboard Towing Vessel Johnny M MIR-25-15 8 Figure 5. Local firefighters fighting the fire aboard Johnny M. (Source: East Marshall Fire Department) 1.3 Additional Information 1.3.1 Damage 1.3.1.1 Vessel After the fire, Coast Guard and the National Transportation Safety Board investigators boarded the Johnny M to examine the vessel damage. The vessel sustained fire damage throughout all the decks. The engine stacks’ interior and exterior and the engine room windows exhibited soot where the space ventilated to the atmosphere. The paint on the exterior of the upper engine room bulkheads was charred where the structural frames intersected with the bulkhead. Fire and heat damage was heavily concentrated in the lower level of the engine room where the main engines were located. The engine room window frames and the deck above the engine room were warped due to heat exposure (see figure 6). The outboard side of the portside stack", "spans": []}], "answer": "The NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to a shortcoming in the federal rules for towboats regarding the lack of requirements for structural fire protection. Specifically, the federal regulations do not currently mandate the use of fire-resistant materials and insulation installed on the horizontal and vertical surfaces of compartments, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke. This absence of structural fire protection allows fires to spread more rapidly, reducing the time available for evacuation and firefighting efforts.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-636e9c7f81", "answerable": false, "question": "Why did the Nickelena's captain not notice the crane boom striking the Mackinac Bridge while he was steering the tug under the span?", "expected_answer": "The premise is wrong: the captain was not steering. He was still in his stateroom when the tow passed under the bridge at 0213; a crewmember was at the helm, and the captain learned of the problem only when the engineer went below to notify him.", "evidence": [], "passages": [{"doc_id": "MIR2502.pdf", "text": "planned to return to the pilothouse before the towing vessel and barge passed under the bridge. Figure 4. Infrared footage of the Nickelena towing the deck barge BMI 209 with the crane on board at 1226 the night of the contact. (Source: Enbridge Straits Maritime Operations Center) On May 7, about 0200, the captain woke up and prepared to head to the pilothouse. At 0213, while he was still in his stateroom, the crewmember at the helm guided the vessel and barge under the Mackinac Bridge’s suspension span at 8 knots within the marked channel. At some point after passing under the bridge, both the engineer, who was out on deck, and the crewmember at the helm, looked aft and, with the help of the lights of the bridge, noticed that they couldn’t see the crane’s boom. The engineer went below and notified the captain.", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 12 2 Analysis About 0200 on May 7, shortly after passing eastward under the main suspension span of the Mackinac Bridge, the crew of the commercial towing vessel Nickelena discovered that the crane they were towing 500 feet astern (aboard deck barge BMI 209) had struck the bridge and collapsed onto the barge. Before departure, managers from the towing vessel operating company visually estimated the angle of the boom to be between 50° and 60° and believed that, with its 5-foot “rooster” sheave attached, the boom was 145 feet in length (the boom was 160 feet long). Using their visual estimation of the crane’s boom angle and their boom length estimate, both of which were incorrect, they believed that the boom was at a safe height for the transit. The managers told the Nickelena captain “everything’s secured, ready to go.”", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge MIR-25-02 8 Figure 7. The boom bent backwards over the cabin after striking the bridge. (Source: Coast Guard) The crane’s mechanical boom angle indicator was extensively damaged by the contact, so investigators could not determine whether it was operational before the bridge strike. Investigators evaluated the LMI and determined that the LMI display was showing a fail mode for the boom angle, the boom pitch and roll, and the wind indicator. The system had the capability to record data, but data downloaded and evaluated later only showed the dates and times of system startups and shutdowns. 1.3.2 Boom Height Evaluation The NTSB conducted a study of the crane boom angle based on an infrared surveillance image of the crane from before the casualty (see figure 4) to estimate the height of boom at the time it contacted the Mackinac Bridge. 3 The study determined,", "spans": []}, {"doc_id": "MIR2502.pdf", "text": "Contact of Crane on Deck Barge BMI 209 Towed by Nickelena with Mackinac Bridge On May 7, 2023, about 0213 local time, the towing vessel Nickelena was transiting the Straits of Mackinac while towing deck barge BMI 209, transporting a crawler crane, when the crane boom struck the main span of the Mackinac Bridge (see figure 1 and figure 2). 1 The contact bent the crane boom backwards, causing the boom to eventually collapse onto the aft end of the barge. There were no injuries, and no pollution was reported. Damage to the Mackinac Bridge was estimated at $145,000; damage to the crane was estimated at $665,000. 2 Figure 1. Left to right: The Nickelena on an unknown date before the contact, and the crane aboard the BMI 209, as seen from the Nickelena during the voyage and before the contact. (Sources: US Coast Guard and Basic Towing Inc.) 1 In this report, all times are central daylight time, and all miles are statute miles. 2", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "abstention"]}, {"key": "t-043bd4c5a2", "answerable": true, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "status": "not_retrieved"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "status": "not_retrieved"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "status": "partly"}], "passages": [{"doc_id": "MIR2615.pdf", "text": "and push gear system and an inspection of the engine room and bilges. He notified the mate on watch that he was going to head to the galley to start preparations for the evening meal, which he routinely performed as part of his duties. About 1624, according to recorded Rose Point data, the Mackenzie Rose tow was centered in the Elizabeth River channel and proceeding through t he South Norfolk Jordan Bridge with a course over ground of 020°, a speed over ground of 4.8 knots, and no rate of turn. About a minute later, about 1625, the vessel and tow passed successfully through the South Norfolk Jordan Bridge. The mate told investigators that, after the 3 The marine autopilot system on board the Mackenzie Rose was designed to hold the vessel’s heading, which was set by the operator. It did not have the capability to automatically steer a course, nor did it account for set or drift.", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "Contact of Tank Vessel Hafnia Amessi with Pier MIR-25-11 21 the risks associated with bank effect and current. If the Hafnia Amessi had approached the turn on to Range C in the relatively open water to starboard, the bank effect on the vessel’s port side would have been minimized, and the vessel would have been better positioned to handle the oncoming flood current. To prepare for the Hafnia Amessi’s transit, the pilot ordered the tugboat Diane Moran to escort the tanker down the Cooper River. The pilot stated that this order was a direct consequence of what he had learned from studying the Bow Triumph casualty. When it became apparent that the Hafnia Amessi was not responding to rudder and engine orders as the pilot anticipated and was in danger of striking Pier B, the pilot directed the Diane Moran to push on the tanker’s bow. According to the pilot, the ship’s rate of turn did not increase until the tugboat began", "spans": []}, {"doc_id": "MIR2511.pdf", "text": "the Hafnia Amessi’s drafts were 21.3 feet forward and 26.3 feet aft. Beginning the transit down the Cooper River, the CBPA pilot ordered dead slow ahead, followed by slow ahead. According to the Hafnia Amessi’s pilot card, slow ahead corresponded to 9.0 knots of speed when the tanker was in ballast in open water with no current. At 1000, the vessel entered the Joint Base Charleston Channel (referred to as the JBC Channel in US Army Corps of Engineers documents), 0.5 miles downriver from the INEOS terminal. Shortly after entering the channel, the Hafnia Amessi encountered a bend to port, onto the section of the river containing Range F (see figure 2). The pilot stated that, as the vessel rounded the bend, he noticed “an exceptional amount of tidal current on buoy number 80,” which was a navigation aid on the inside of the bend. He said, “[the current] reduced my speed to less than 5 knots, and in all my years working down here, I’ve never seen a wake on a buoy at", "spans": []}, {"doc_id": "MIR2615.pdf", "text": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge MIR-26-15 17 2 Analysis The towing vessel Mackenzie Rose was pushing the loaded deck barge Weeks 281 ahead, outbound in the southern branch of the Elizabeth River when the tow veered to port and struck the Norfolk and Portsmouth Belt Line Railroad Bridge. At the time of the casualty, there was minimal current, and wind conditions were calm. According to the mate, as the tow transited outbound in the Elizabeth River, he navigated using autopilot by using the rotary knob to increase or decrease the heading setpoint. (There were no company policies that prevented the Mackenzie Rose mate from steering in autopilot while transiting the Elizabeth River.) The mate told investigators that, when the tow got close to the railroad bridge, the autopilot “tripped” without alarming, and he lost steering without realizing it. Based", "spans": [[35, 83], [286, 338]]}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b1642ea4ef", "answerable": true, "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "evidence": [{"doc_id": "MIR2513.pdf", "quote": "causing components, such as the no. 13 connecting rod and the crankshaft, to seize together and fail by welding themselves to the journal.", "status": "not_retrieved"}, {"doc_id": "MIR2513.pdf", "quote": "until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders.", "status": "retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "causing components, such as the no. 9 connecting rod and the crankshaft, to seize together at the journal and fail.", "status": "not_retrieved"}, {"doc_id": "MIR2602.pdf", "quote": "the fire originated on the starboard side of the unloading generator engine when the engine block ruptured in the area of the no. 9 connecting rod", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 8 Coast Guard also requested assistance from a Bureau of Alcohol, Tobacco, Firearms and Explosives certified fire investigator, who participated in the examination of the damage. Investigators found that the no. 2 auxiliary engine was damaged beyond repair: the engine block, crankshaft, two connecting rods, counterweights, and other parts of the rotating assembly were damaged (see figure 5). Figure 5. Damaged no. 2 auxiliary generator aboard Ocean Navigator after the engine failure. The circled area identifies the location of the engine block damage. Investigators noted a hole about 10 inches high and 16 inches wide on the inboard side of the engine block in the area of the nos. 12 and 14 cylinders where the lower portion of the no. 13 connecting rod had been ejected (see figure 6). This area was located on the lower part of the engine near the deck plates between the two", "spans": [[806, 842]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 16 crankshaft. Parts from the disconnected connecting rod collided chaotically as the crankshaft continued to turn, damaging other engine components until a portion of the no. 13 connecting rod or other internal components ruptured the engine block near the nos. 12 and 14 cylinders. Therefore, it is likely that debris entrained in the lube oil system of the no. 2 auxiliary engine led to the catastrophic damage to the engine. As a result of the block rupturing, hot, atomized lube oil vented through the damaged inspection covers and ignited off hot components internal to the engine. The engineering logbooks for the vessel showed that, in the 2 months before the engine failure, crewmembers added lube oil to the no. 2 auxiliary engine (37 gallons in September and 42 gallons in October). In comparison, the crew added", "spans": [[231, 365]]}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 14 Figure 8. Removed crankshaft from damaged no. 2 auxiliary generator on board Ocean Navigator after the engine failure. After the crankshaft was removed, all main bearings were inspected, and the no. 8 bearing, located directly aft of the affected cylinder, was determined to be in the worst condition. In January 2025, the engine block was replaced and the engine rebuilt by technicians. The operating company requested that the connecting rod bearings on the adjacent no. 1 auxiliary engine be inspected by the technicians. Based on the condition of the sampled bearing, all connecting rod bearings were replaced on the no. 1 auxiliary engine. In February 2025, Caterpillar’s rotating component engineers provided comments from the inspection of the no. 2 auxiliary engine components that had been sent from the Ocean Navigator. The engineers observed the front main bearing", "spans": []}, {"doc_id": "MIR2513.pdf", "text": "Diesel Generator Engine Failure Aboard Passenger Vessel Ocean Navigator MIR-25-13 9 Figure 6. Left to right: Damaged engine block on no. 2 auxiliary engine aboard Ocean Navigator after the engine failure. Graphic identifying area of engine failure on the no. 2 auxiliary engine. The most significant smoke and heat damage was directly across the decking from the area of the no. 14 cylinder where the engine block was ruptured and extended upward toward the overhead and inboard toward the no. 1 auxiliary engine. The area in the engine room around and above the no. 2 auxiliary engine sustained smoke and heat damage. Soot was observed on all surfaces in the engine room and was heaviest on the components near the deck plates between the two auxiliary engines. The no. 1 auxiliary engine sustained fire damage to the turbocharger, piping, cables, and electrical insulation on the inboard side. The engine control module and", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-6f75031c2e", "answerable": true, "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "evidence": [{"doc_id": "MIR2617.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds 8 mph west-southwest, air temperature 81°F", "status": "not_retrieved"}, {"doc_id": "MIR2620.pdf", "quote": "Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F", "status": "retrieved"}], "passages": [{"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 8 for tows transiting downbound between miles 869 and 303. 9 When the Vicksburg gage reached 36 feet, tows over 110 feet wide were restricted to daytime transit only through the Vicksburg bridges. Also, towing vessels over 6,000 hp, like the Myra Eckstein, had a maximum tow size of 36 barges, with a minimum of 280 hp per loaded standard barge and 560 hp per oversized barge. On the day of the casualty, the Myra Eckstein was pushing 25 standard barges (312 hp per barge). On April 27, the Mississippi River at Vicksburg was recorded having a level of 49.3 feet. According to the National Weather Service, this was the highest peak at the Vicksburg gage since 2020. On May 5, the day of the casualty, the Vicksburg gage read 46.17 feet (about 3.17 feet above major flood stage and about 16 feet above historic normal stage) and falling (see figure 7). Visibility was about 10 miles, with fair skies and", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 4 On May 5, the tow was approaching Vicksburg and two bridges: the Vicksburg Highway 80 Bridge and the Vicksburg Interstate 20 Bridge (see figure 2). The Vicksburg Highway 80 Bridge opened in 1930 and originally served as a highway and railroad crossing (see figure 4). The bridge had been closed to vehicular traffic for several years, serving solely as a railway bridge. Vehicular traffic was carried via the Vicksburg Interstate 20 Bridge, which was about 315 feet downstream from and ran parallel to the Vicksburg Highway 80 Bridge. The Coast Guard recorded 29 reportable contacts with the bridge between March 2010 and February 2024. 4 Figure 4. The Vicksburg Highway 80 Bridge, as viewed looking downriver. (Background source: US Army Corps of Engineers) About 0940, the captain began maneuvering the tow at 9 mph around", "spans": []}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 2 Casualty Summary Casualty type Contact Location Lower Mississippi River, mile 435.8, near Vicksburg, Mississippi 32°18.82' N, 090°54.28' W Date May 5, 2025 Time 0957 central daylight time (coordinated universal time –5 hrs) Persons on board 10 Injuries None Property damage $941,000 est. Environmental damage None Weather Visibility 10 mi, fair skies, winds south-southeast 5 mph, air temperature 70°F, morning twilight 0545, sunrise 0611 Waterway information River; width 0.5 mi, depth 45 ft, current 6 mph est. Figure 2. Area where the Myra Eckstein tow contacted the Vicksburg Highway 80 Bridge, as indicated by a circled X. (Background source: Google Maps)", "spans": [[388, 475]]}, {"doc_id": "MIR2620.pdf", "text": "Contact of Myra Eckstein Tow with Vicksburg Highway 80 Bridge MIR-26-20 5 Delta Point and toward the Vicksburg bridges during that period, including the Myra Eckstein, was west of the “recommended track” (sailing line) shown on the inland electronic navigation chart and displayed on the Myra Eckstein’s electronic chart system. 7 Figure 5. Trackline of the Myra Eckstein tow (highlighted orange) before and during the contact with the Vicksburg Highway 80 Bridge, the recommended track (highlighted yellow), and the tracklines of vessels (black) transiting downbound in daylight hours from 1000 on May 4, 2025, to 0958 on May 5, 2025. (Background source: Corps of Engineers Inland Electronic Navigation Chart U35LM425 as viewed on Made Smart) The captain was unable to correct the heading and align the tow between the piers of the bridge. About 0957, the lead barge of the starboard string, the CC-1109,", "spans": []}], "answer": "The Rickey Hughes tow and the Myra Eckstein tow both involved incidents with the Vicksburg Highway 80 Bridge, but the specific details about the weather conditions, including temperature, for the Rickey Hughes tow are not provided in the given context. \n\nFor the Myra Eckstein tow, the weather conditions on the day of the incident (May 5, 2025) included an air temperature of 70°F. There is no mention of the temperature on the day the Rickey Hughes tow occurred. Therefore, based on the available information, we cannot determine which incident occurred in hotter outdoor conditions or the exact temperature readings for the Rickey Hughes tow.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-5707de65e1", "answerable": true, "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "evidence": [{"doc_id": "MIR2543.pdf", "quote": "when the towing vessel Steel Skipper, which was reconfiguring the tow, pushed the tow astern, and the William E Strait collided with two moored barges upstream at the Shell Norco Refinery dock, damaging the barges and dock", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2543.pdf", "text": "about 0210, he felt the vessel begin to move astern in the direction of the Shell Norco Refinery dock as the fleeting tug moved the last two barges into position at the head of the tow. The William E Strait’s engines were not engaged. The Steel Skipper finished its work about 0215, and, with the weather clearing, the mate then noticed “extra equipment tied off to [the] Shell dock. It appeared to be a barge that wasn’t lit well but a bit below [the] dock.” He walked to the stern to check that the towboat was clear. The mate got the William E Strait underway about 0300 and began heading downbound with 16 barges for the Gnots fleeting area at mile 118. A few days later, the Shell Norco Refinery discovered damage to the no. 3 dock and to the two barges moored there. A Shell Norco Refinery boat lift was also damaged. Damages were estimated at $1,000 for the Cajun Courage and CDB02 and $500,000 for the facility.", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 4 CORRECTED COPY three barges in two trips across the river to the Upper St. Rose fleeting area. Operations began at 0100, with the Steel Skipper taking one barge on the first trip, then the remaining two barges on the next trip (see figure 3). Figure 3. William E Strait towing arrangement on arrival and departure from mile 126. (Background source: William E Strait mate) Once the transfer of the 3 barges to the Upper St. Rose fleeting area was completed, the Steel Skipper began to reposition the remaining two barges in the starboard string to the newly created space in the center string (from the barges moved to the Upper St. Rose fleeting area) to create four strings of four barges each for the next leg of William E Strait’s voyage. The mate of the William E Strait said that,", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "Collision Between Towing Vessel William E Strait and Moored Barges at Shell Norco Refinery Dock MIR-25-43 5 CORRECTED COPY Using automatic identification system and vessel traffic service data, investigators found that, at the time the last two barges were pushed into place by the Steel Skipper, the William E Strait moved astern about 400 feet toward the moored crane and deck barges at the Shell Norco Refinery dock (see figure 4). Figure 4. William E Strait astern movement toward moored barges on December 10. (Background source: National Oceanic and Atmospheric Administration electronic navigation chart US5LA52M as viewed on Rosepoint)", "spans": []}, {"doc_id": "MIR2543.pdf", "text": "The fleeting tug Steel Skipper was tasked with moving three barges from the William E Strait tow across the river from the Shell Norco Refinery dock to the Upper St. Rose fleeting area near mile 126 on the right descending bank. 3 The Steel Skipper operated with a crew of three—a captain and two deckhands. The Steel Skipper and William E Strait captains had agreed by radio that the Steel Skipper would take the 2 Cajun Industries LLC owned and operated the crane barge, which was built in 2010, and the deck barge, built in 2021. 3 The 68-foot-long fleeting towing vessel Steel Skipper was built in 2021 in Bayou La Batre, Alabama.", "spans": []}], "answer": "The assisting tug Steel Skipper was moving the last two barges into position at the head of the tow near the Shell Norco Refinery dock when the William E Strait ended up backing into the barges tied up at the Shell refinery pier near Norco.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-e56c8b0ac7", "answerable": true, "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "evidence": [{"doc_id": "MIR2545.pdf", "quote": "On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking", "status": "retrieved"}, {"doc_id": "MIR2545.pdf", "quote": "was owned and operated by Algoma Central Corporation", "status": "not_retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel", "status": "retrieved"}, {"doc_id": "MIR2606.pdf", "quote": "was owned and operated by Algoma Shipping Ltd., a subsidiary of the Algoma Central Corporation", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2606.pdf", "text": "Grounding of Dry Bulk Carrier Algoma Verity On January 8, 2025, at 1813 local time, the dry bulk carrier Algoma Verity was transiting upbound on the Delaware River near Philadelphia, Pennsylvania, when it ran aground outside the channel (see figure 1 and figure 2). 1 The vessel repositioned and continued its upbound transit, outside the channel, until, at 1828, the vessel grounded again, coming to a stop. The Algoma Verity was refloated 3 days later. No pollution or injuries were reported. Damage to the vessel was estimated at $6.6 million. Figure 1. Algoma Verity underway at unknown date. (Source: Algoma Central Corporation) 1 (a) In this report, all times are eastern standard time, and all miles are nautical miles (1.15 statute miles). (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM015). Use the CAROL Query to search investigations. March 4, 2026 MIR-26-06", "spans": [[44, 236]]}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility On July 20, 2024, about 2215 local time, the Canada-flagged cargo vessel Algoma Discovery struck five of the loading shuttles at the BNSF Allouez Taconite Facility, in Superior, Wisconsin, after losing electrical power and main propulsion while docking (see figure 1 and figure 2). 1 There were no injuries, and no pollution was reported. Damage to the facility was estimated at $950,000, and damage to the Algoma Discovery was estimated at $130,000. Figure 1. Algoma Discovery at unknown date before the contact. (Source: Carson Last, marinetraffic.com) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM052). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-45", "spans": [[77, 329]]}, {"doc_id": "MIR2624.pdf", "text": "Collision Between Bulk Carrier Yangze 7 and Towing Vessel Miss Peggy MIR-26-24 72 Report Investigation Year Title Summary Probable Cause MAB-17/30 DCA16FM023 2016 Allision of Tanker Nordbay with Docks and Water Intakes On February 2, 2016, at 2213 local time, the tanker Nordbay was southbound on the Lower Mississippi River in New Orleans, Louisiana, with a pilot on board when it allided with a dock and water intakes on the left descending bank. Less than an hour later, as the vessel maneuvered through another bend in the river while heading toward an anchorage, it allided with a wharf on the left descending bank. No pollution or injuries were reported. The dock, water intakes, the wharf, and the Nordbay sustained an estimated $6.4 million in total damage. The National Transportation Safety Board determines that the probable cause of the Nordbay’s allisions with water intakes and docks was the pilot and the master not", "spans": []}, {"doc_id": "MIR2545.pdf", "text": "Contact of Bulk Carrier Algoma Discovery with BNSF Allouez Taconite Facility MIR-25-45 6 start. He stated that the interlocks for the main engines would not open and the compressed air bottle pressure and the control air pressure had both dropped. The master ordered the starboard anchor and the stern anchor be let go as the vessel was still moving forward, toward the dock. Crewmembers let go the anchors. However, about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots. At 2220, the Algoma Discovery came to a stop, with the bow touching the dock and the stern about 100 feet away from the dock. Five loading shuttles were damaged. Shortly after the vessel made contact with the shuttles, the crew conducted a damage survey of the vessel. The chief engineer determined that the control air system was not being supplied from the compressed air bottle system, and, about", "spans": []}], "answer": "The Algoma Discovery incident occurred on July 20, 2024, and the Algoma Verity incident occurred on January 8, 2025. Therefore, the two events were approximately 6 months apart in time.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-c53b614de8", "answerable": true, "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "evidence": [{"doc_id": "MIR2608.pdf", "quote": "The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "status": "retrieved"}], "passages": [{"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 15 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire on the bulk carrier Lem Verbena was the failure of an O-ring seal on the composite boiler burner unit oil fittings block due to the radial misalignment of the two fuel ports on the block modules, causing pressurized diesel fuel to atomize and ignite on a nearby hot surface.", "spans": [[95, 457]]}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 13 2 Analysis While the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks in Mobile, Alabama, a fire broke out in the upper deck of the engine room near the boiler. Due to the severity of the fire, the crew activated the vessel’s CO 2 fixed fire extinguishing system, and the fire was extinguished. After the fire, the Lem Verbena operating company and Coast Guard investigators found that an O-ring on the oil fittings block upper module of the boiler’s burner unit had become pinched on the fuel port for the lower module. This O-ring was intended to provide a seal between the corresponding fuel ports on the lower and upper modules (when bolted together) to contain pressurized fuel as it moved through the system to the burner unit igniter. O-rings are designed to protect against leaks by lying flat and becoming compressed between two machinery", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena On January 4, 2025, about 2323 local time, the bulk cargo vessel Lem Verbena was docked at the Alabama State Docks on the Mobile River in Mobile, Alabama, with 19 crewmembers on board when a fire started in the engine room (see figure 1 and figure 2). 1 The crew activated the vessel’s carbon dioxide fixed fire extinguishing system. Shoreside firefighters later determined the fire had been extinguished. There were no injuries, and no pollution was reported. Damage to the vessel was estimated at $5.5 million. Figure 1. Lem Verbena underway in April 2024 in Santos, Brazil. (Source: Guilherme Ceccato, shipspotting.com) 1 (a) In this report, all times are central standard time. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA25FM014). March 11, 2026 MIR-26-08", "spans": []}, {"doc_id": "MIR2608.pdf", "text": "Engine Room Fire aboard Cargo Vessel Lem Verbena MIR-26-08 8 Figure 5. The Lem Verbena boiler’s burner unit after the fire. (Background source: US Coast Guard) 1.3.2 Boiler The Lem Verbena’s boiler created steam using two methods: a furnace heated by a burner unit fired from diesel oil, and waste heat from the main engine or the no. 2 and no. 3 diesel generator exhausts, which ran through vertical tubes within the boiler (the no. 1 diesel generator was not part of the boiler system). A portion of the no. 2 and no. 3 generator exhaust pipes ran directly below the burner unit in the engine room upper platform and through metal grating before it entered the boiler. Precasualty pictures of the no. 2 generator exhaust pipe showed that it was covered with protective lagging (see figure 6). 5 5 Lagging insulates hot surfaces such as engine exhaust piping from combustible surfaces,", "spans": []}], "answer": "Federal investigators concluded that the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile was set off by the failure of an O-ring seal on the composite boiler burner unit oil fittings block. This failure was caused by the radial misalignment of the two fuel ports on the block modules, which led to pressurized diesel fuel atomizing and igniting on a nearby hot surface.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-ef5beb2516", "answerable": true, "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "evidence": [{"doc_id": "MIR2544.pdf", "quote": "Casualty type Flooding/Hull Failure", "status": "retrieved"}], "passages": [{"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole On June 12, 2024, about 1530 local time, the towing vessel Cajole was upbound the Lower Mississippi River near Waggaman, Louisiana, when the vessel began flooding (see figure 1 and figure 2). 1 The two crewmembers aboard attempted to pump out the vessel but were unsuccessful. They tied off to a nearby barge and evacuated to a Good Samaritan vessel. The Cajole later sank. There were no injuries, and a sheen was reported. Damage was estimated at $2 million. Figure 1. Cajole underway on an unknown date before the sinking. (Source: marinetraffic.com, Mark Haury) 1 (a) In this report, all times are central daylight time, and all miles are statute miles. (b) Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM046). Use the CAROL Query to search investigations. December 10, 2025 MIR-25-44", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 2 Casualty Summary Casualty type Flooding/Hull Failure Location Lower Mississippi River, mile 112, Waggaman, Louisiana 29°57.77’ N, 090°14.35’ W Date June 12, 2024 Time 1530 central daylight time (coordinated universal time –5 hrs) Persons on board 2 Injuries None Property damage $2 million Environmental damage Sheen on water, 4,277 gal diesel fuel recovered (est. fuel capacity 5,000 gal) Weather Visibility 7 mi, partly cloudy, winds east-northeast 7 kts, air temperature 91°F Waterway information River width 2,100 ft, depth 33 ft, current est. 2 kts Figure 2. Area where the Cajole flooding occurred, as indicated by a circled X. (Background source: Google Maps)", "spans": [[74, 109]]}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 10 2 Analysis While transiting the Lower Mississippi River, the towing vessel Cajole flooded and sank after taking on water near mile 113. Partway through the transit, the captain reported that the vessel was losing speed; he later entered the engine room and saw water entering the engine room space from the forward starboard corner near a bulkhead penetration (conduit). There were two spaces forward of the engine room’s forward bulkhead: the auxiliary space and bow void. After the towboat was salvaged, investigators found no hull damage that would have allowed water ingress into these spaces. According to the captain, the cover on an access hatch to the starboard-side auxiliary void was in place when he discovered the flooding in the engine room. The cover was lost during the casualty, so investigators were not able to evaluate its condition. The hatch was flush", "spans": []}, {"doc_id": "MIR2544.pdf", "text": "Flooding and Sinking of Towing Vessel Cajole MIR-25-44 5 these preparations, about 0630, the vessel departed the shipyard with the captain at the helm, transiting north in the Harvey Canal, bound for Weber Marine in Convent, Louisiana. Between departure and 0745, the captain received an alarm on the bridge. The captain could not recall the nature of the alarm. He silenced the alarm and continued navigating the vessel. About 0745, the Cajole transited Harvey Lock, turned to port, and proceeded upbound on the Mississippi River. Over the next 3-4 hours, the vessel continued at speeds between 3 and 8.5 knots, averaging about 5 knots. Throughout the voyage, to accommodate vessel traffic, the Cajole crossed the river, first crossing to the right descending bank, then the left descending bank. 2 At 1102, the vessel again crossed the river to the right descending bank, turning sharply to port, with the starboard side of the vessel exposed to the current.", "spans": []}], "answer": "The loss of the towboat Cajole on the Mississippi River near Waggaman was caused by flooding and hull failure.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-ca5c401ae5", "answerable": true, "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "evidence": [{"doc_id": "MIR2529.pdf", "quote": "The vessel was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 5 crew were in the water, less than 4 minutes had elapsed. The yacht had listed over about 45–50° and grounded in the mud, visibly down by the stern (see figure 5). About 1247, automatic identification system data showed the vessel at a speed of 0.1 knots, crossing the 12-foot-depth contour in the West River. Figure 5. The Lovebug at 1238:48 and 1241:45, shortly after the owner and crew abandoned the vessel. (Source: Lovebug owner) Nearby Good Samaritan vessels rescued the crew and owner; Coast Guard personnel later evaluated them for injuries. One crewmember had a minor injury. For 16 days, the partially sunken yacht remained in the West River while salvage plans and logistics were coordinated. Salvage operations began on August 13. The vessel’s aftmost spaces on its lower deck were a garage that housed watercraft and a technical area for vessel electrical and mechanical systems on the", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 7 indication of a potential source of water ingress on the interior or exterior of the vessel. Extensive damage and debris throughout the vessel prevented investigators from examining some smaller spaces. The marine surveyor’s report stated, “due to the post casualty condition of the vessel it is impossible to determine the pre-loss condition.” The report also noted that the vessel had passed a class inspection the month before the casualty. 3 Damage to the vessel was estimated at $8 million. 3 Bureau Veritas was the class society responsible for Lovebug’s survey. The most recent survey took place on July 19, 2024, and included annual surveys of the hull, structure, machinery, and load line. Surveyors commented that there were no damages on the accessible parts of the hull, machinery alarms were audible throughout vessel, and no substantial corrosion areas had been identified during", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug On July 27, 2024, about 1235 local time, the yacht Lovebug was transiting the Chesapeake Bay in the West River north of Shady Side, Maryland, when the vessel started listing heavily to starboard (see figure 1 and figure 2). 1 The four crewmembers and one owner on board abandoned the vessel and were rescued by nearby vessel crews. The yacht partially sank in about 12 feet of water. There was one minor injury. An oil sheen, visible around the vessel, was contained with a boom. Damage to the vessel was estimated at $8 million. 2 Figure 1. The partially sunken Lovebug on July 27, 2024, at 1342. (Source: Maryland Natural Resources Police) 1 In this report, all times are eastern daylight time, and all miles are nautical miles (1.15 statute miles). 2 Visit ntsb.gov to find additional information in the public docket for this NTSB investigation (case no. DCA24FM053). July 15, 2025 MIR-25-29", "spans": []}, {"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 4 About 1235, when the yacht was near the West River Entrance Light 2, the captain noticed the Lovebug had developed a starboard list (see figure 4). He checked the steering, rudder indicators, and stabilizers o n the bridge and found no problems. The captain told investigators that, when the vessel first began listing, he did not hear any alarms. The list rapidly increased. According to the captain, about a minute after the vessel started listing, the vessel, which had been powered by its starboard generator, lost power. The captain backed off the throttles, and the vessel’s speed dropped to about 4 knots. Figure 4. The Lovebug’s track from the approximate area the vessel first was observed listing to its final position. (Background source: National Oceanic and Atmospheric Administration Electronic Navigation Chart US5MD1LC as viewed on Made Smart automatic identification system)", "spans": []}], "answer": "The provided context does not specify the shipyard to which the yacht Lovebug was moved after being refloated from the West River, nor does it mention the exact date of this move. However, it is noted that salvage operations began on August 13, 2024, and that the vessel had passed a class inspection the month before the casualty (July 19, 2024). Further details about the shipyard or the date of relocation for inspection and repairs are not included in the given text.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-29b867d4b7", "answerable": true, "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "evidence": [{"doc_id": "MIR2529.pdf", "quote": "The vessel was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "status": "not_retrieved"}], "passages": [{"doc_id": "MIR2529.pdf", "text": "Listing and Partial Sinking of Yacht Lovebug MIR-25-29 5 crew were in the water, less than 4 minutes had elapsed. The yacht had listed over about 45–50° and grounded in the mud, visibly down by the stern (see figure 5). About 1247, automatic identification system data showed the vessel at a speed of 0.1 knots, crossing the 12-foot-depth contour in the West River. Figure 5. The Lovebug at 1238:48 and 1241:45, shortly after the owner and crew abandoned the vessel. (Source: Lovebug owner) Nearby Good Samaritan vessels rescued the crew and owner; Coast Guard personnel later evaluated them for injuries. One crewmember had a minor injury. For 16 days, the partially sunken yacht remained in the West River while salvage plans and logistics were coordinated. Salvage operations began on August 13. The vessel’s aftmost spaces on its lower deck were a garage that housed watercraft and a technical area for vessel electrical and mechanical systems on the", "spans": []}], "answer": "The documents do not contain the answer.", "judges": ["groundedness", "correctness", "refusal"]}, {"key": "t-b745e15155", "answerable": true, "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "evidence": [{"doc_id": "MIR2509.pdf", "quote": "The mate was then able to reach the Brunswick crew over VHF radio to make passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.”", "status": "partly"}], "passages": [{"doc_id": "MIR2509.pdf", "text": "the Local Notice to Mariners, along with a request for vessels to arrange safe passage when transiting nearby. To pass the area where the Brunswick was dredging, a vessel would need to either (1) request that the Brunswick move the floating discharge pipeline so that it was not extending across the river, or (2) pass to the west of the Brunswick, along the west bank of the Cooper River. The dredge crew moved the floating discharge pipe frequently to accommodate passing traffic during normal operations. On the Royal Engineer, the mate was on watch in the wheelhouse. During the transit south, he attempted to hail the dredge via VHF radio about 1 hour before the tow reached the dredge’s location. According to the mate, he intended to request", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "passing arrangements. The dredge captain informed the Royal Engineer mate that his preference was for the tow to pass between the dredge and the dock because “I had guys downstairs that were working on something. ... and I’d have to stop them to go do something else.” He said he could swing the dredge around and provide about 300 feet of clearance to the seawall, not including the width of the Celsius Nicosia. The mate informed the dredge captain that he would have enough room to maneuver the Royal Engineer tow so it would pass between the Brunswick and the Celsius Nicosia (see figure 4). Figure 4. The Royal Engine er’s path between the dredge Brunswick and the containership Celsius Nicosia at 1620. (Background source: Esri satellite image as viewed on Made Smart)", "spans": [[0, 268]]}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 10 2 Analysis While the towing vessel Royal Engineer was pushing the crane barge Stevens 1471 in the Cooper River, the tow transited underneath an STS crane at the North Charleston Terminal while maneuvering through a narrow area between a docked containership and a dredging vessel because the dredge’s floating discharge pipeline was blocking the rest of the channel. The barge crane contacted the STS crane, resulting in extensive damage to the STS crane. The Royal Engineer mate was aware of the dredging operations along the tow’s transit route. The day before the contact, on January 3, he had transited the area between the dredge and the North Charleston Terminal, but there was no containership berthed at the terminal. The mate told investigators that, on the day of the contact, he attempted twice to contact the dredge crew early—first an hour and", "spans": []}, {"doc_id": "MIR2509.pdf", "text": "Contact of Crane on board Royal Engineer Tow with Terminal Cargo Crane MIR-25-09 4 According to technical drawings, the mast reached a height of 144.6 feet above the deck of the barge. The air draft of the crane barge was noted on the towboat’s voyage plan as 145 feet. Figure 3. Approximate towing configuration of the Royal Engineer p ushing the Ste v
