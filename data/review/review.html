e tugs on his reference card. This resulted in the pilot having an incorrect mental model of the tugboat positions and the effect each would have on the Platanos as it maneuvered off the pier.", "before": "cur in the execution of routine or highly practiced tasks, and are often the result of an attentional shift, preoccupation, or distraction while performing the task. The pilot of the Platanos had a normal practice of writing down the names and positions of the tugboats that were assisting a vessel. ", "match": "However, on the morning of the contact, he transposed the names and positions of the tugs on his reference card. This resulted in the pilot having an incorrect mental model of the tugboat positions and the effect each would have on the Platanos as it maneuvered off the pier.", "after": " It is possible that the pilot was interrupted or became distracted by another task while writing down the positions of the tugboats leading to the error. An interruption or distraction, such as concurrent discussions with ship’s crew, while marking each tugboat’s position could have shifted the pil"}], "premise_evidence": []}, {"id": "b038-1", "answerable": true, "dimensions": {"question_type": "procedural", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "summary_table"}, "checks": {"lexical_overlap": 0.2, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "summary_table"}, "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "notes": "Time arithmetic from the casualty summary table (grounding time vs. sunset); the procedural framing is thin because the table holds no crew actions, so a narrative quote anchors the maneuver.", "doc did the fishing vessel Papa Rod continue on its course toward the anchored bulk carrier Appaloosa even after the Appaloosa's crew sounded the ship's horn?", "expected_answer": "Deckhand 2, who had just taken the navigation watch, had fallen asleep at the controls while the Papa Rod continued on autopilot, and the wheelhouse had no watch alarm to wake him, so the vessel kept heading directly toward the Appaloosa despite the horn.", "notes": "Cross-chunk passage on the horn warning combined with the earlier statement that the watchstander fell asleep on autopilot without a watch alarm.", "docs": [{"doc_id": "MIR2512.pdf", "report": "MIR-25-12", "title": "Collision between Fishing Vessel Papa Rod and Anchored Bulk Carrier Appaloosa", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2512.pdf"}], "evidence": [{"doc_id": "MIR2512.pdf", "quote": "According to deckhand 2, a short time after assuming the watch, he fell asleep at the controls as the vessel continued the transit in autopilot (the Papa Rod wheelhouse was not equipped with a watch alarm).", "before": "ng the watch; the deckhand’s work/rest history for the 3 days before boarding the vessel indicated only that he was ashore.) Upon arriving in the fishing vessel’s wheelhouse, the deckhands completed a brief watch turnover, and deckhand 2 assumed the navigation watch. Deckhand 1 went below to sleep. ", "match": "According to deckhand 2, a short time after assuming the watch, he fell asleep at the controls as the vessel continued the transit in autopilot (the Papa Rod wheelhouse was not equipped with a watch alarm).", "after": " 3 An able seafarer was on duty on the 590-foot-long bulk carrier Appaloosa, which was anchored about 4 miles east of the entrance to the Southwest Pass with 21 crewmembers aboard, when, between 0918 and 0923, he saw the Papa Rod off the port bow. The vessel was heading directly toward the Appaloosa"}, {"doc_id": "MIR2512.pdf", "quote": "The vessel was heading directly toward the Appaloosa. The able seafarer informed the second mate, who called the master and the chief officer and sounded the Appaloosa’s horn. However, the Papa Rod continued on its course toward the Appaloosa.", "before": "Rod wheelhouse was not equipped with a watch alarm). 3 An able seafarer was on duty on the 590-foot-long bulk carrier Appaloosa, which was anchored about 4 miles east of the entrance to the Southwest Pass with 21 crewmembers aboard, when, between 0918 and 0923, he saw the Papa Rod off the port bow. ", "match": "The vessel was heading directly toward the Appaloosa. The able seafarer informed the second mate, who called the master and the chief officer and sounded the Appaloosa’s horn. However, the Papa Rod continued on its course toward the Appaloosa.", "after": " 3 A watch alarm system is an automatic system that monitors wheelhouse activity to detect operator disability or absence. Systems vary in complexity, but a simple watch alarm requires the navigation watchstander to reset the alarm at preset time intervals to prevent the watchstander from falling as"}], "premise_evidence": []}, {"id": "b040-2", "answerable": true, "dimensions": {"question_type": "causal", "complexity": "single_span", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.385, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "After the Papa Rod rammed the Appaloosa, how did the shrimper's fishing booms end up fouled in the bulk carrier's anchor cable?", "expected_answer": "Because the Papa Rod's engines were still in gear, the boat kept moving and slid forward along the Appaloosa's hull, tangling its outriggers in the ship's anchor chain.", "notes": "Tests a secondary causal detail of the collision sequence using lay wording (booms, cable) for outriggers and anchor chain.", "docs": [{"doc_id": "MIR2512.pdf", "report": "MIR-25-12", "title": "Collision between Fishing Vessel Papa Rod and Anchored Bulk Carrier Appaloosa", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2512.pdf"}], "evidence": [{"doc_id": "MIR2512.pdf", "quote": "With the Papa Rod’s engines still engaged, the fishing vessel slid forward along the hull of the Appaloosa, entangling its outriggers in the ship’s anchor chain.", "before": "at the time (see figure 3). The force of the collision woke deckhand 2 at the helm and the captain and deckhand 1 below. Figure 3. Left to right: Bow damage to the Papa Rod, and Appaloosa hull breach (circled). Right inset shows ballast water leaking from the breached hull. (Source: US Coast Guard) ", "match": "With the Papa Rod’s engines still engaged, the fishing vessel slid forward along the hull of the Appaloosa, entangling its outriggers in the ship’s anchor chain.", "after": " The Papa Rod’s captain entered the wheelhouse, disengaged the engines, then backed the fishing vessel away from the ship. The Evening Tide assisted in postcollision efforts, including securing the outriggers of the Papa Rod, before continuing southwest to fishing grounds. The Papa Rod returned to i"}], "premise_evidence": []}, {"id": "b041-1", "answerable": true, "dimensions": {"question_type": "causal", "complexity": "multi_span", "phrasing": "close", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.312, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "notes": "Combines the suit-retrieval shortfall with the captain's decision; note the report uses 'survival suits' and 'immersion suits' interchangeably.", "docs": [{"doc_id": "MIR2504.pdf", "report": "MIR-25-04", "title": "Engine Room Fire aboard Fishing Vessel Three Girls", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2504.pdf"}], "evidence": [{"doc_id": "MIR2504.pdf", "quote": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "before": "the amount of smoke. US Coast Guard Sector Northern New England (in Portland, Maine) received the distress call from the Three Girls. Once alerted about the fire, the first mate ran into the accommodation space to collect as many survival suits from the crew quarters (staterooms) as he could carry. ", "match": "He brought five (of the vessel’s seven survival suits) to the muster station (aft of the wheelhouse on the wheelhouse deck) where the crew had mustered. Due to the fire and smoke inside the vessel, the first mate was unable to retrieve the vessel’s remaining two survival suits.", "after": " Engine Room Fire aboard Fishing Vessel Three Girls MIR-25-04 7 While the crew was mustering, the main engine was still in gear, moving the vessel ahead at 1–2 knots. Before leaving the wheelhouse, the captain had tried to put the engine into neutral, but the engine gear was stuck in the ahead direc"}, {"doc_id": "MIR2504.pdf", "quote": "Because there were not enough immersion suits available for everyone, t he captain elected not to wear one.", "before": "tion. About this time, all electrical power throughout the vessel shut off. The crew moved the liferaft from the wheelhouse deck to the stern deck, where they observed fire engulfing the wheelhouse. About this time, the captain directed all crewmembers and the observer to don their immersion suits. ", "match": function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} progress(); }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function progress(){ const n=DATA.items.filter(i=>state[i.id]&&state[i.id].decision).length;

function cur(item){ if(!state[item.id]) state[item.id]={decision:null,question:item.question,

  return state[item.id]; }
function render(){

    card.innerHTML=`<div class="meta">${esc(item.id)} · ${item.answerable?"answerable":"unanswerable"}</div>
      <div>${dims} ${flags}</div><div class="meta" style="margin-top:6px">${docs}</div>

      ${s.evidence.map((e,i)=>`<input type="text" data-q="${i}" value="${esc(e.quote)}" title="${esc(e.doc_id)}">`).join("")}

      <div class="row"><label><input type="radio" name="d-${item.id}" value="approve" ${s.decision==="approve"?"checked":""}> Approve</label>

      <label>Reason / notes</label><input type="text" data-f="reason" value="${esc(s.reason)}">`;
    card.querySelectorAll("[data-f]").forEach(el=>el.addEventListener("input",()=>{s[el.dataset.f]=el.value;save();}));
    card.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("input",()=>{s.evidence[+el.dataset.q].quote=el.value;save();}));
    card.querySelectorAll("input[type=radio]").forEach(el=>el.addEventListener("change",()=>{s.decision=el.value;card.className="card "+el.value;save();}));
    list.appendChild(card);
  }
  progress();
}
document.getElementById("reviewer").value = state.__reviewer || "";
document.getElementById("reviewer").addEventListener("input",e=>{state.__reviewer=e.target.value;save();});
document.getElementById("download").addEventListener("click",()=>{
  const undecided=DATA.items.filter(i=>!(state[i.id]&&state[i.id].decision)).length;
  if(undecided && !confirm(undecided+" candidates are undecided. Download anyway?")) return;
  const decisions={}; for(const i of DATA.items){ const s=state[i.id]; if(s&&s.decision) decisions[i.id]={decision:s.decision,
    question:s.question,expected_answer:s.expected_answer,evidence:s.evidence,reason:s.reason}; }
  const out={reviewer:state.__reviewer||"",candidates_sha256:DATA.candidates_sha256,decisions};
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
  a.download="review-decisions.json"; a.click();
});
render();
</script></body></html>
