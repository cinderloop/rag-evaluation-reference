iscovery with BNSF Allouez Taconite Facility", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2545.pdf"}, {"doc_id": "MIR2606.pdf", "report": "MIR-26-06", "title": "Grounding of Dry Bulk Carrier Algoma Verity", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2606.pdf"}], "evidence": [{"doc_id": "MIR2545.pdf", "quote": "about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots", "before": "terlocks for the main engines would not open and the compressed air bottle pressure and the control air pressure had both dropped. The master ordered the starboard anchor and the stern anchor be let go as the vessel was still moving forward, toward the dock. Crewmembers let go the anchors. However, ", "match": "about 2215, the vessel started to strike the facility’s loading shuttles, as the vessel moved down the dock at a speed of about 0.9 knots", "after": ". At 2220, the Algoma Discovery came to a stop, with the bow touching the dock and the stern about 100 feet away from the dock. Five loading shuttles were damaged. Shortly after the vessel made contact with the shuttles, the crew conducted a damage survey of the vessel. The chief engineer determined"}, {"doc_id": "MIR2606.pdf", "quote": "As the Algoma Verity passed under the Benjamin Franklin Bridge at a speed of about 9 knots, its bow was 140 feet to starboard of the channel (as measured from ship’s centerline) and moving to starboard.", "before": "nding of the Algoma Verity. (Background source: National Oceanic and Atmospheric Administration Electronic Navigation Chart US5PHLCE as viewed on MadeSmart automatic identification system) Grounding of Dry Bulk Carrier Algoma Verity MIR-26-06 7 At 1810:50, pilot 2 eased the rudder to starboard 10°. ", "match": "As the Algoma Verity passed under the Benjamin Franklin Bridge at a speed of about 9 knots, its bow was 140 feet to starboard of the channel (as measured from ship’s centerline) and moving to starboard.", "after": " At 1811:16, the pilot ordered the rudder to midships. Between 1811:22 and 1812:21, pilot 2 issued several rudder commands, first to port 20°, then easing to port 10°, then to midships before ordering successively larger angles of starboard rudder, up to 20°. The helmsman responded as ordered. Meanw"}], "premise_evidence": []}, {"id": "b008-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.105, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "notes": "Tests linking the two towboat fire analyses through their shared observation that Subchapter M does not require structural fire protection; the Johnny M Subchapter M sentence sits in a footnote of the analysis section.", "docs": [{"doc_id": "MIR2515.pdf", "report": "MIR-25-15", "title": "Engine Room Fire aboard Towing Vessel Johnny M", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2515.pdf"}, {"doc_id": "MIR2621.pdf", "report": "MIR-26-21", "title": "Fire aboard Towing Vessel William D", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2621.pdf"}], "evid ohnny M was a catastrophic main engine failure that caused the venting and ignition "}, {"doc_id": "MIR2621.pdf", "quote": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "before": "rapidly through the main deck, up to the second deck, and, finally, to the wheelhouse, ultimately consuming the superstructure. The crew attempted to extinguish the fire using portable extinguishers and the vessel’s fire hose, but their efforts were unsuccessful due to the rapid spread of the fire. ", "match": "The National Transportation Safety Board has previously investigated fires aboard vessels wherein the substantial use of combustible materials in interior spaces and finishes, as well as the lack of structural fire protection, contributed to the extent of the damage each vessel sustained.", "after": " 5 Structural fire protection is a component of an overall vessel fire-protection strategy that uses passive design features in a vessel’s structure to slow the expansion of a fire from one compartment to another. Structural 5 See Fire aboard Towing Vessel Mary Dupre near Freeport, Texas, June 26, 2"}, {"doc_id": "MIR2621.pdf", "quote": "Towing vessels are inspected under the regulations in 46 Code of Federal Regulations Subchapter M; however, these regulations currently do not require vessel owners to incorporate structural fire protection on their vessels.", "before": "uses fire-resistant materials and insulation installed on the horizontal and vertical surfaces of a compartment, on doors/hatches, and in pipe and cable openings to slow the transfer of heat and smoke, thus providing additional time to evacuate and for firefighting to contain and extinguish a fire. ", "match": "Towing vessels are inspected under the regulations in 46 Code of Fe stigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "before": "artial view of the bunk, on unknown date before the fire. (Source: R B Our Equipment Leasing) Fire aboard Towing Vessel Lucinda Smith MIR-25-27 6 2 Analysis While the towing vessel Lucinda Smith was moored at the dock, a crewmember heard a smoke alarm and discovered a fire in one of the staterooms. ", "match": "ATF investigators determined that the fire originated in the first mate’s stateroom, aft of the wheelhouse, near the end of the bunk (by the electric heater).", "after": " Electrical sources near the bunk included an electric heater, an oscillating fan, and an electrical wall receptacle. Crew interviews revealed that the heater and fan were not in use before the fire and thus likely were not an ignition source. The receptacle and associated vessel wiring were origina"}, {"doc_id": "MIR2527.pdf", "quote": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "before": "ical fault—such as a loose, broken, or frayed wire, or broken receptacle hardware—within the receptacle or nearby circuitry, it could have created excessive resistance heating. Resistive heating from electrical conductors within receptacles can produce sufficient heat to ignite nearby combustibles. ", "match": "However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "after": " Once an ignition source was produced, combustible materials—wood paneling and framing, insulating material, clothing, and bed linen—near the fire’s origin (end of the bunk) caught fire. After these combustible materials caught fire, they provided a path for the fire to expand into the overhead and "}, {"doc_id": "MIR2623.pdf", "quote": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "before": "l before the Sub Zero sank. The captain initially observed smoke in the aft end of the engine compartment on the display for the two engine compartment cameras. He told investigators that the smoke appeared to be near the vessel’s hydraulic fuel tank but could not definitively confirm its location. ", "match": "The vessel burned to the waterline, sank, and was not salvaged, so investigators could not access and inspect the vessel to determine the origin and cause of the fire. Therefore, the ignition source could not be determined.", "after": " Fire aboard Fishing Vessel Sub Zero MIR-26-23 6 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire aboard the fishing vessel Sub Zero w as an unknown source within its engine compartment. Fire aboard Fishing Vessel Sub Zero MIR-2"}], "premise_evidence": []}, {"id": "b010-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.192, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "Neither the Tarka II crab boat blaze off Washington nor the Thor tug blaze on the Delaware River had its exact trigger identified. What plausible way the fire got started did investigators put forward for each, and why could they not confirm it?", "expected_answer": "For the Tarka II, heat from the exhaust pipe or an exhaust leak (from the main engine or the running no. 1 auxiliary generator) may have ruptured a pressurized hydraulic line, spraying fluid that ignited on a hot surface; it could not be confirmed because the vessel sank and was not recovered. For the Thor, an electrical fault in the extension cord plug or the nearby boot warmer may have caused resistive heating; the extent of the fire damage prevented determining the exact ignition source.", "notes": "Tests gathering the hypothesised ignition scenario and the reason it stayed unconfirmed from two engine-room fire reports linked by their undetermined cause; this is close to a comparison.", "docs": [{"doc_id": "MIR2524.pdf", "report": "MIR-25-24", "title": "Fire aboard Fishing Vessel Tarka II", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2524.pdf"}, {"doc_id": "MIR2601.pdf", "report": "MIR-26-01", "title": "Engine Room Fire on Towing Vessel Thor", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2601.pdf"}], "evidence": [{"doc_id": "MIR2524.pdf", "quote": "It is possible that exhaust pipe heat, or an exhaust leak, either from the main engine or the running no. 1 auxiliary generator, ruptured one of the pressurized hydraulic lines, causing the hydraulic fluid to spray and ignite on a nearby, unprotected hot surface, and spread to nearby combustibles. However, because the Tarka II sank and was not recovered, the exact source of the fire could not be determined.", "before": "ss lagging. Investigators were unable to verify the condition or arrangement of the exhaust lagging in the engine room because the vessel sank and there were no photos available of the engine room before the fire. The captain reported that the smoke initially looked and smelled like engine exhaust. ", "match": "It is possible that exhaust pipe heat, or an exhaust leak, either from the main engine or the running no. 1 auxiliary generator, ruptured one of the pressurized hydraulic lines, causing the hydraulic fluid to spray and ignite on a nearby, unprotected hot surface, and spread to nearby combustibles. However, because the Tarka II sank and was not recovered, the exact source of the fire could not be determined.", "after": " The captain had no indication of the fire before he saw smoke coming from the sides of the vessel’s exhaust stacks. The Tarka II engine room was equipped with a CCTV camera that displayed on a monitor in the wheelhouse, but it was not in use at the time of the fire. Additionally, there were no smok"}, {"doc_id": "MIR2601.pdf", "quote": "An electrical fault—such as a loose, broken, or frayed wire—within the plug or nearby boot warmer could have created excessive resistive heating. Resistive heating within electrical conductors can produce sufficient heat to ignite nearby combustibles. However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "before": "sion cord’s insulation and plug were found burned down to the copper wiring. Additionally, the 30-amp breaker associated with the receptacle that the extension cord was plugged into was found to be in the tripped position. A breaker can trip due to overloaded circuits, shorts, or electrical faults. ", "match": "An electrical fault—such as a loose, broken, or frayed wire—within the plug or nearby boot warmer could have created excessive resistive heating. Resistive heating within electrical conductors can produce sufficient heat to ignite nearby combustibles. However, due to the extent of the fire damage, the exact ignition source and cause of the fire could not be determined.", "after": " Once an ignition source was produced, combustible materials in and around the paint locker, including paint cans and a plastic trash can, near the fire’s origin caught fire. After these combustible materials caught fire, they provided a path for the fire to expand to the port side of the engine roo"}], "premise_evidence": []}, {"id": "b010-2", "answerable": true, "dimensions": {"question_type": "comparison", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.167, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "Which craft came through its engine-room blaze still afloat, the Tarka II or the Thor, and how did each episode wrap up?", "expected_answer": "The Thor survived: its crew sealed off ventilation, fuel sources and air openings to the engine room and abandoned the towboat, and a responding fire boat put the fire out a few hours later. The Tarka II did not: its two crewmembers abandoned into a liferaft, were rescued by the Coast Guard, and the vessel eventually sank.", "notes": "Tests contrasting the outcomes of two engine-room fires (vessel lost versus fire extinguished) from the analysis sections.", "docs": [{"doc_id": "MIR2524.pdf", "report": "MIR-25-24", "title": "Fire aboard Fishing Vessel Tarka II", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2524.pdf"}, {"doc_id": "MIR2601.pdf", "report": "MIR-26-01", "title": "Engine Room Fire on Towing Vessel Thor", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2601.pdf"}], "evidence": [{"doc_id": "MIR2524.pdf", "quote": "The two crewmembers on board abandoned the vessel into a liferaft and were rescued by the Coast Guard before the vessel eventually sank.", "before": "iceable condition; examinations do not include the hull, electrical systems, or machinery as required for Coast Guard-inspected vessels. Fire aboard Fishing Vessel Tarka II MIR-25-24 8 2 Analysis While the fishing vessel Tarka II was transiting in the Pacific Ocean, a fire began in the engine room. ", "match": "The two crewmembers on board abandoned the vessel into a liferaft and were rescued by the Coast Guard before the vessel eventually sank.", "after": " The captain observed smoke emanating from the sides of the exhaust stacks located just aft of the wheelhouse (likely from engine room vents on or near the main exhaust stacks). When he entered the engine room, he noticed white smoke that smelled like engine exhaust, and he believed there was an exh"}, {"doc_id": "MIR2601.pdf", "quote": "The captain had the crew secure ventilation, fuel sources, and natural air openings to the engine room before abandoning the towboat. The fire was extinguished by a responding fire boat a few hours later.", "before": "mine the exact ignition source and ultimately classified the cause of the fire as “undetermined.” Engine Room Fire on Towing Vessel Thor MIR-26-01 6 2 Analysis While the towing vessel Thor was pushing two material scows downriver on the Delaware River, the crew discovered a fire in the engine room. ", "match": "The captain had the crew secure ventilation, fuel sources, and natural air openings to the engine room before abandoning the towboat. The fire was extinguished by a responding fire boat a few hours later.", "after": " ATF investigators determined that the fire originated in the upper level of the engine room, portside aft. A paint locker was located in the area of origin, and various combustible materials were stored inside and outside of the locker. Interviews with the vessel’s engineer revealed a boot warmer w"}], "premise_evidence": []}, {"id": "b011-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.129, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "Fresh air reaching the burning machinery space made both the GITN'R DUN lobster boat fire and the Scot Stuttgart tanker fire worse. Why could neither space be kept airtight, and roughly how many hours short of the longest closure period the NTSB advises was the tanker's space kept shut after the first gas discharge?", "expected_answer": "The GITN'R DUN had no fixed extinguishing system and no dampers or closures for its engine compartment ventilation openings, so oxygen kept entering and feeding the fire. On the Scot Stuttgart, the master let shoreside firefighters unseal and ventilate the port engine room about an hour after the first CO2 release, whereas the NTSB says such spaces should stay sealed for up to 24 hours, so it was opened roughly 23 hours short of that.", "notes": "Tests linking the oxygen-feeding theme across two reports plus a subtraction (24 hours minus about 1 hour); the arithmetic is somewhat contrived because 24 hours is an upper bound in the lessons learned, not a strict requirement.", "docs": [{"doc_id": "MIR2625.pdf", "report": "MIR-26-25", "title": "Fire aboard Fishing Vessel GITN’R DUN", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2625.pdf"}, {"doc_id": "MIR2629.pdf", "report": "MIR-26-29", "title": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2629.pdf"}], "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Without a fixed fire extinguishing system capable of flooding the engine compartment, and without dampers or closures to fully seal ventilation openings, oxygen continued to enter the engine compartment and feed the fire.", "before": "ptain to retrieve the second fire extinguisher. The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be. The vessel also lacked means to seal ventilation openings in the engine compartment, such as steel dampers or ventilation louvers in the air intake ducting. ", "match": "Without a fixed fire extinguishing system capable of flooding the engine compartment, and without dampers or closures to fully seal ventilation openings, oxygen continued to enter the engine compartment and feed the fire.", "after": " The fire grew and spread, ultimately becoming too intense to be suppressed using the handheld fire extinguishers on board. Once fire and smoke had engulfed the engine compartment and spread into the berthing space, the two crewmembers were unable to access their immersion Fire aboard Fishing Vessel"}, {"doc_id": "MIR2629.pdf", "quote": "Therefore, the master’s decision to authorize shoreside firefighters to unseal and ventilate the port engine room about an hour after the initial activation of the vessel’s CO 2 fixed fire extinguishing system negated the effectiveness of the CO 2 , likely leading to further fire damage in the port engine room.", "before": "t Stuttgart MIR-26-29 15 Shortly after the firefighters started the extractor fans, the space began to fill with heavy, black smoke. The circulation of air from the extractor fans likely fed a smoldering fire that had not been fully extinguished by the vessel’s CO 2 fixed fire extinguishing system. ", "match": "Therefore, the master’s decision to authorize shoreside firefighters to unseal and ventilate the port engine room about an hour after the initial activation of the vessel’s CO 2 fixed fire extinguishing system negated the effectiveness of the CO 2 , likely leading to further fire damage in the port engine room.", "after": " 2.2 Origin and Cause of the Fire After the fire, the most extensive heat damage was found aft of and below the port auxiliary generator engine skid in the port engine room. The economizer piping and the start air control panel located on second deck, below the port auxiliary generator and its skid,"}, {"doc_id": "MIR2629.pdf", "quote": "Additionally, spaces should remain sealed for sufficient time to allow the fire suppression agent to smother fire, as well as for temperatures to drop, for up to 24 hours.", "before": "e fire, displace the oxygen feeding the fire, or effect a combination of both. To ensure the effectiveness of the system and prevent the reintroduction of oxygen into a space, the system should be operated so that the required amount of fire suppression agent is released into the space as designed. ", "match": "Additionally, spaces should remain sealed for sufficient time to allow the fire suppression agent to smother fire, as well as for temperatures to drop, for up to 24 hours.", "after": " Engine Room Fire aboard Chemical Tanker Scot Stuttgart MIR-26-29 19 Vessel Particulars Vessel Scot Stuttgart NTSB vessel group Cargo, Liquid Bulk ( Chemical tanker) Owner/operator Scot Stuttgart SA (Commercial) Flag Republic of Marshall Islands Port of registry Majuro, Republic of Marshall Islands "}], "premise_evidence": []}, {"id": "b011-2", "answerable": true, "dimensions": {"question_type": "comparison", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.158, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "notes": "Tests contrasting fixed versus portable firefighting means in two engine-space fires, using the analysis sections.", "docs": [{"doc_id": "MIR2625.pdf", "report": "MIR-26-25", "title": "Fire aboard Fishing Vessel GITN’R DUN", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2625.pdf"}, {"doc_id": "MIR2629.pdf", "report": "MIR-26-29", "title": "Engine Room Fire aboard Chemical Tanker Scot Stuttgart", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2629.pdf"}], "evidence": [{"doc_id": "MIR2625.pdf", "quote": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "before": "was aft). The smoke detector activated during the fire, but only after the fire had escalated. The absence of engine compartment fire detection likely delayed recognition of the fire in its incipient stage, when it would have been more manageable to extinguish with the available fire extinguishers. ", "match": "Portable fire extinguishers were the only means of onboard firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher.", "after": " The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be. The vessel also lacked means to seal ventilation openings in the engine compartment, such as steel dampers or ventilation louvers in the air intake ducting. Without a fixed fire extinguishing system capab"}, {"doc_id": "MIR2625.pdf", "quote": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "before": "rd firefighting available to the crewmembers. The captain discharged two handheld extinguishers through the aft engine compartment hatch, but the fire continued to grow, rapidly escalating and engulfing the engine compartment in the time it took the captain to retrieve the second fire extinguisher. ", "match": "The vessel was not equipped with a fixed fire extinguishing system, nor was it required to be.", "after": " The vessel also lacked means to seal ventilation openings in the engine compartment, such as steel dampers or ventilation louvers in the air intake ducting. Without a fixed fire extinguishing system capable of flooding the engine compartment, and without dampers or closures to fully seal ventilatio"}, {"doc_id": "MIR2629.pdf", "quote": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "before": "te smoke coming from the open door of the port engine room into the engine control room, the crew stopped cargo operations. They shut down the port main engine, remotely stopped all fuel pumps, secured ventilation, shut the ventilation dampers, and stopped electrical power for the port engine room. ", "match": "Once the port engine room was sealed, the master gave the order to release half (7 of 14) of the CO 2 bottles in the vessel’s fixed fire extinguishing system to suppress the fire in the space.", "after": " While awaiting the arrival of local firefighters, the ship’s crew set up boundary cooling of the port engine room using vessel fire hoses pressurized by the ship’s fire pump. When shoreside firefighters arrived about 40 minutes later, the ship’s crew reported that there were no elevated heat readin"}], "premise_evidence": []}, {"id": "b012-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.1, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "notes": "Tests time-difference arithmetic across two contact reports linked by operator lapses; the 1550 contact time for the Amber Brittany comes from the narrative (cell phone usage section) because the analysis does not restate it.", "docs": [{"doc_id": "MIR2514.pdf", "report": "MIR-25-14", "title": "Contact of Amber Brittany Tow with Vane Dike", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2514.pdf"}, {"doc_id": "MIR2547.pdf", "report": "MIR-25-47", "title": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2547.pdf"}], "evidence": [{"doc_id": "MIR2514.pdf", "quote": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "before": "s waterway combined with the pilot’s inexperience in the area placed increased attention demands on the pilot to monitor the vessel's position and compensate for the expected outdraft. Investigators sought to determine if the pilot's cell phone use may have distracted him while transiting the lock. ", "match": "Cell phone records indicated that the pilot was using his personal cell phone just before the contact and that the first in a series of outgoing and incoming text messages began about 1547, which coincided with the Amber Brittany's departure from the sailing line.", "after": " Cell phone use, especially text messaging, can be visually, manually, and cognitively distracting. Therefore, any distraction from the primary navigation task due to cell phone use would have reduced the pilot’s performance as he navigated the channel. Contact of Amber Brittany Tow with Vane Dike M"}, {"doc_id": "MIR2514.pdf", "quote": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "before": " pilot was messaging on his personal phone just before the contact. He sent a series of 16 messages on March 8 between 1547 and 1607 and made two outgoing calls to the same contact at 1619 and 1622. The messages that began at 1547 coincided with the Amber Brittany’s departure from the sailing line. ", "match": "Between 1547 and 1550, the time of the contact, the pilot sent three outgoing messages and received three incoming messages.", "after": " 1.3.6 Real Time Data Available to Mariners The United States Geological Survey publishes real time river data available to mariners, including river gage, precipitation, and mean water velocity (see figure 8). Mariners use this information to plan for water conditions while transiting the Ohio Rive"}, {"doc_id": "MIR2547.pdf", "quote": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "before": "he US Coast Guard Station Cape Disappointment docks after veering out of the channel. The vessel’s AIS track showed a deliberate course change from the 306 ̊ leg to the 284 ̊ leg on the red (right) side of the Baker Bay West Channel about 1233:47, indicating the captain was still alert at the time. ", "match": "At 1235:12, the Schweiger began moving to port and crossed the channel.", "after": " At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel. There"}, {"doc_id": "MIR2547.pdf", "quote": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "before": "nnel. At 1236, the rate of turn to port increased, resulting in the vessel contacting the Coast Guard docks about 30 seconds later. The captain reported that he fell asleep before the contact, which is supported by the vessel’s AIS track showing the vessel moving across and then out of the channel. ", "match": "Therefore, the captain likely fell asleep about 1 to 3 minutes before the contact, sometime between 12:35:12 and 12:36:25 (see figure 4).", "after": " Later in the day after the contact, the captain learned that he had COVID-19 and a collapsed lung. Acute COVID-19 coronavirus infections can cause tiredness, lack of energy, headaches, and an inability to focus. 3 Suddenly falling asleep without warning has not been described as a typical feature o"}], "premise_evidence": []}, {"id": "b012-2", "answerable": true, "dimensions": {"question_type": "comparison", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.2, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "What underlying reasons did the NTSB give for the person at the controls failing to keep the Amber Brittany tow and the Schweiger out of trouble, and how did those reasons differ?", "expected_answer": "For the Amber Brittany, the pilot failed to counter the outdraft current leaving the lock channel, likely because he was inexperienced on that stretch with that vessel and was distracted by his phone. For the Schweiger, the captain fell asleep at the helm, likely from increased fatigue caused by an acute COVID-19 infection, so the difference is distraction and inexperience versus illness-related fatigue.", "notes": "Tests contrasting the human-factor causes (inexperience and distraction versus illness-related fatigue) in two towing-vessel contacts, from the probable cause and analysis.", "docs": [{"doc_id": "MIR2514.pdf", "report": "MIR-25-14", "title": "Contact of Amber Brittany Tow with Vane Dike", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2514.pdf"}, {"doc_id": "MIR2547.pdf", "report": "MIR-25-47", "title": "Contact of Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2547.pdf"}], "evidence": [{"doc_id": "MIR2514.pdf", "quote": "the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his distraction due to cell phone use.", "before": "d have reduced the pilot’s performance as he navigated the channel. Contact of Amber Brittany Tow with Vane Dike MIR-25-14 16 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the contact of the Amber Brittany tow with the vane d ike was ", "match": "the pilot not effectively compensating for the outdraft current while navigating out of the lock channel entrance, likely due to the pilot’s inexperience in transiting the Portland Channel on the Amber Brittany and his distraction due to cell phone use.", "after": " 3.2 Lessons Learned Preparing for Dam Outdrafts Lock canal entrances near dams present unique hazards for vessels transiting inland rivers. Fast moving river water near low-flow canal waters can produce outdraft currents. Mariners should thoroughly assess the potential impact of outdraft currents w"}, {"doc_id": "MIR2547.pdf", "quote": "the captain falling asleep while navigating the vessel, likely due to increased fatigue caused by an acute COVID-19 coronavirus infection.", "before": "Towing Vessel Schweiger with US Coast Guard Station Cape Disappointment Docks MIR-25-47 10 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the contact of the towing vessel Schweiger with the US Coast Guard Cape Disappointment docks was ", "match": "the captain falling asleep while navigating the vessel, likely due to increased fatigue caused by an acute COVID-19 coronavirus infection.", "after": " 3.2 Lessons Learned Use of Medication While Operating Vessels For the safety of the crew, equipment, and vessel, use of medication in conjunction with the operation of a vessel must be done with caution. Mariners should be aware of any adverse side effects of medications that impact their ability t"}, {"doc_id": "MIR2547.pdf", "quote": "This poor sleep quality would have resulted in increased levels of fatigue on the day of the contact and increased the likelihood of the captain falling asleep while navigating the vessel.", "before": " of the vessel’s transit, it is likely he was experiencing the effects of an acute COVID-19 coronavirus infection while operating the vessel. While the captain reported getting sufficient sleep in the 2 days before the contact, his sleep quality was likely poor, given the effects of acute COVID-19. ", "match": "This poor sleep quality would have resulted in increased levels of fatigue on the day of the contact and increased the likelihood of the captain falling asleep while navigating the vessel.", "after": " The captain reported taking several tablets of ivermectin, which is a prescription medication commonly used to treat parasitic infections in humans and animals. Ivermectin was proposed early in the COVID-19 pandemic as an alternative 3 S. Spudich S and A. Nath, “Nervous system consequences of COVID"}], "premise_evidence": []}, {"id": "b013-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.316, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "How much time went by between the day the tanker Hafnia Amessi hit a Navy pier near Charleston and the day the Mackenzie Rose tug and its barge hit a railroad bridge in Chesapeake, Virginia?", "expected_answer": "About five months (153 days): the Hafnia Amessi casualty happened on January 14, 2024, and the Mackenzie Rose casualty on June 15, 2024, so the Hafnia Amessi casualty came first.", "notes": "Tests date arithmetic across two reports; the only link between the two casualties is time (both 2024 contacts), so the reviewer may find the multi_document link weak.", "docs": [{"doc_id": "MIR2511.pdf", "report": "MIR-25-11", "title": "Contact of Tank Vessel Hafnia Amessi with Pier", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2511.pdf"}, {"doc_id": "MIR2615.pdf", "report": "MIR-26-15", "title": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2615.pdf"}], "evidence": [{"doc_id": "MIR2511.pdf", "quote": "On January 14, 2024, after discharging all of its cargo at the INEOS Aromatics Terminal on the Cooper River in Wando, South Carolina, the Hafnia Amessi prepared to depart the terminal for a voyage to Texas City, Texas.", "before": "rowed to 550 feet downriver. After the tanker Bow Triumph contacted the pier in 2022, a 300-foot section of the pier between the platform at the end of the pier and the shore side of the pier collapsed (see section 1.3.3). Pier B was no longer used after the Bow Triumph casualty. 1.2 Event Sequence ", "match": "On January 14, 2024, after discharging all of its cargo at the INEOS Aromatics Terminal on the Cooper River in Wando, South Carolina, the Hafnia Amessi prepared to depart the terminal for a voyage to Texas City, Texas.", "after": " About 0915, a Charleston Branch Pilots Association (CBPA) pilot boarded the tanker from the tugboat Diane Moran. Before disembarking the Diane Moran, the pilot instructed the tugboat’s captain to have the Diane Moran escort the Hafnia Amessi downriver, with the tugboat off the tanker’s starboard si"}, {"doc_id": "MIR2615.pdf", "quote": "On June 15, 2024, the towing vessel Mackenzie Rose was approaching Chesapeake, Virginia, on the Elizabeth River, with the captain navigating the vessel.", "before": "d Monday through Friday but were not regularly scheduled. Whenever a rail crossing necessitated the bridge being lowered, a local bridge operator would proceed to the Belt Line Berkley yard office and notify mariners via VHF channel 13 about 30 minutes before lowering the bridge. 1.2 Event Sequence ", "match": "On June 15, 2024, the towing vessel Mackenzie Rose was approaching Chesapeake, Virginia, on the Elizabeth River, with the captain navigating the vessel.", "after": " The vessel was en route to the Coastal Precast Systems facility along the river to pick up the 191-foot-long deck barge Weeks 281, which was loaded with precast concrete materials. There were 5 crewmembers aboard the vessel: a captain, mate, lead deckhand, junior deckhand, and engineer. (Crew rotat"}], "premise_evidence": []}, {"id": "b013-2", "answerable": true, "dimensions": {"question_type": "comparison", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.467, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "notes": "Tests computing two durations from narrative timestamps in different reports and comparing them.", "docs": [{"doc_id": "MIR2511.pdf", "report": "MIR-25-11", "title": "Contact of Tank Vessel Hafnia Amessi with Pier", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2511.pdf"}, {"doc_id": "MIR2615.pdf", "report": "MIR-26-15", "title": "Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2615.pdf"}], "evidence": [{"doc_id": "MIR2511.pdf", "quote": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "before": "f Tank Vessel Hafnia Amessi with Pier MIR-25-11 4 When the CBPA pilot entered the bridge of the Hafnia Amessi, he and the master conducted a master/pilot exchange. 3 According to the pilot, the master reported no deficiencies with the vessel’s propulsion, machinery, steering, or navigation systems. ", "match": "At 0948, the Hafnia Amessi got underway from the terminal on the Cooper River.", "after": " The vessel was in ballast condition, with the CBPA pilot, a docking pilot, and a crew of 24 on board. 4 The docking pilot performed the undocking, with the Diane Moran and another tugboat, the James Moran, assisting the operation. Once the tanker was aligned in the channel, the docking pilot turned"}, {"doc_id": "MIR2511.pdf", "quote": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "before": "til 1018:27, when the tugboat captain had to back his vessel away to avoid contact with Pier B by the Diane Moran. The Hafnia Amessi’s heading when the tugboat stopped pushing was 187°. The Hafnia Amessi’s momentum carried it forward, with its bow moving to port and its stern swinging to starboard. ", "match": "At 1019:01, the starboard side of the vessel’s hull pushed over a protective dolphin and contacted the northeast corner of the Pier B platform.", "after": " The Hafnia Amessi’s speed at the time it made contact was 6.0 knots. 5 Underkeel clearance is the vertical distance between the bottom of a vessel and the seafloor or river bottom, as measured at the vessel’s echo sounder transducer. The transducer on the Hafnia Amessi was located 504 feet aft of t"}, {"doc_id": "MIR2615.pdf", "quote": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "before": "ge Weeks 281. The total length of the tow was 287.4 feet, and the widest part of the tow was the barge, which had a beam of 54.6 feet. According to the vessel’s logbook, the loaded deck barge drafts were 4 feet 6 inches at the bow and 6 feet at the stern, and the Mackenzie Rose’s draft was 14 feet. ", "match": "At 1500, the Mackenzie Rose and tow departed the facility, en route to New York, with the mate at the helm in the upper wheelhouse.", "after": " The mate used autopilot while transiting outbound (north) in the Elizabeth River toward the Atlantic Ocean. 3 The mate said he started using the autopilot between Money Point and Paradise Creek. The mate told investigators that he typically would not use autopilot while navigating inland, but he us"}, {"doc_id": "MIR2615.pdf", "quote": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "before": " without “touching up on the bridge.” He told investigators, “Before I hit the bridge, I was already in reverse. I had clutched in earlier and then I backed, as soon as I could back full, I backed full.” Contact of Mackenzie Rose Tow with Norfolk and Portsmouth Belt Line Railroad Bridge MIR-26-15 7 ", "match": "At 1626:41, the bow of the Weeks 281 contacted the western portion of the Warren through-truss approach span of the Norfolk and Portsmouth Belt Line Railroad Bridge", "after": " (see figure 5). The tow’s speed over ground at the time of the contact was 4.8 knots. The bridge was not staffed by a local bridge operator at the time of the casualty. Figure 5. Area of the bridge struck by the tow. (Background source: H&H, Norfolk and Portsmouth Belt Line Railroad Bridge) When th"}], "premise_evidence": []}, {"id": "b014-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "summary_table"}, "checks": {"lexical_overlap": 0.0, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "summary_table"}, "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "notes": "Tests pulling the same field from two casualty summary tables (the MIR2521 table is extracted as labels followed by values, so its quote is a run of values); the link between the reports is the shared $2 million estimate.", "docs": [{"doc_id": "MIR2521.pdf", "report": "MIR-25-21", "title": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2521.pdf"}, {"doc_id": "MIR2546.pdf", "report": "MIR-25-46", "title": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2546.pdf"}], "evidence": [{"doc_id": "MIR2521.pdf", "quote": "1657 central daylight time (coordinated universal time –5) 4 1 minor $2 million est.", "before": "inking of Towing Vessel Baylor J. Tregre MIR-25-21 2 Casualty Summary Casualty type Location Date Time Persons on board Injuries Property damage Environmental damage Weather Waterway information Capsizing/Listing Gulf of America, 23 nm south of Galveston, Texas 28°56.34’ N, 094°54.7’ W May 13, 2024 ", "match": "1657 central daylight time (coordinated unive owing-astern distinction, both from the analysis sections.", "docs": [{"doc_id": "MIR2521.pdf", "report": "MIR-25-21", "title": "Capsizing and Sinking of Towing Vessel Baylor J. Tregre", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2521.pdf"}, {"doc_id": "MIR2546.pdf", "report": "MIR-25-46", "title": "Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2546.pdf"}], "evidence": [{"doc_id": "MIR2521.pdf", "quote": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "before": " predicted to produce winds of 34 knots or greater, hail 0.75 inches or more in diameter, or a waterspout. The warnings are issued for no more than 2 hours’ duration, although they can be extended if conditions persist. Capsizing and Sinking of Towing Vessel Baylor J. Tregre MIR-25-21 14 2 Analysis ", "match": "On May 13, 2024, while towing the barge MARMAC 27 astern on an 800-foot-long wire, about 23 miles south-southwest of Galveston, the Baylor J. Tregre encountered severe weather, listed to port, capsized, and subsequently sank.", "after": " The crew abandoned the vessel into the liferaft and were rescued by Coast Guard responders. While the tow was underway, the crew received daily weather reports from the operating company. According to the mate, the daily weather report for the day of the sinking forecasted a possible chance of thun"}, {"doc_id": "MIR2546.pdf", "quote": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "before": "picked up. The PTC 706 was last inspected by company personnel on February 22 and March 3, 2024. No damage or water in any compartment was noted, and all hatches, dogs and gaskets were in “good” condition. Sinking of Barge PTC 706 and Subsequent Breakup of Chad Pregracke Tow MIR-25-46 10 2 Analysis ", "match": "While the towing vessel Chad Pregracke was pushing 34 loaded barges on the Lower Mississippi River southbound towards New Orleans, near mile 260.6, barge PTC 706 at the head of the tow became partially submerged, causing the tow to break up, and the barge later sank.", "after": " Before the PTC 706 sank, the Chad Pregracke pilot saw its stern sticking up, with the bow of the barge submerged. B arges at the head of a tow can be shoved under water. This can occur on barges with low freeboard due to the effect of river current on the tow or a tow pushing too fast. However, in "}], "premise_evidence": []}, {"id": "b015-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.091, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "How did the NTSB rate the shipboard firefighting in both the Genius Star XI lithium battery cargo fires and the Deep Energy crane cabin blaze, and what had the people aboard each ship done to fight the flames?", "expected_answer": "In both cases the NTSB viewed the crew's response favourably. On the Genius Star XI the crew discharged the fixed CO₂ system into hold no. 1 for the first fire and boundary-cooled hold no. 2 with fire hoses while securing ventilation for the second, actions judged appropriate and likely to have stopped the fire spreading; on the Deep Energy the master mustered the fire teams, who put water on the fire, and called the Coast Guard and local fire department, and their quick response helped limit damage and put the fire out.", "notes": "Tests combining the NTSB's assessment of crew firefighting from the analysis sections of two fire reports linked by the common theme of crew response.", "docs": [{"doc_id": "MIR2541.pdf", "report": "MIR-25-41", "title": "Lithium-ion Battery Fires aboard Cargo Vessel Genius Star XI", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2541.pdf"}, {"doc_id": "MIR2612.pdf", "report": "MIR-26-12", "title": "Fire aboard Pipelayer Deep Energy", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2612.pdf"}], "evidence": [{"doc_id": "MIR2541.pdf", "quote": "The crew discharged the fixed CO₂ fire suppression system for the first fire within cargo hold no. 1 and used boundary cooling with fire hoses for the second fire within cargo hold no. 2, combined with securing the ventilation.", "before": "teries undergoing a thermal runaway are difficult to extinguish with conventional firefighting methods and equipment found aboard a commercial cargo vessel, posing challenges for a crew in transit. Investigators evaluated the response by the vessel’s crew following their discovery of the two fires. ", "match": "The crew discharged the fixed CO₂ fire suppression system for the first fire within cargo hold no. 1 and used boundary cooling with fire hoses for the second fire within cargo hold no. 2, combined with securing the ventilation.", "after": " Therefore, the crew’s actions to respond to the cargo fires were appropriate and likely prevented the fire from expanding. Fires caused by thermal runaway can quickly spread if combustible materials are nearby. However, the lack of ordinary combustibles in the cargo holds in the Genius Star XI and "}, {"doc_id": "MIR2541.pdf", "quote": "Therefore, the crew’s actions to respond to the cargo fires were appropriate and likely prevented the fire from expanding.", "before": "sponse by the vessel’s crew following their discovery of the two fires. The crew discharged the fixed CO₂ fire suppression system for the first fire within cargo hold no. 1 and used boundary cooling with fire hoses for the second fire within cargo hold no. 2, combined with securing the ventilation. ", "match": "Therefore, the crew’s actions to respond to the cargo fires were appropriate and likely prevented the fire from expanding.", "after": " Fires caused by thermal runaway can quickly spread if combustible materials are nearby. However, the lack of ordinary combustibles in the cargo holds in the Genius Star XI and the noncombustible exteriors of the BESS units served to mitigate the risk of this occurring. The IMDG Code requirement for"}, {"doc_id": "MIR2612.pdf", "quote": "The master mustered the vessel’s fire teams, and they applied water onto the fire as the master evaluated the situation. In addition to responding to the fire, the master also requested assistance from the Coast Guard and the local fire department.", "before": "mber was sent to investigate in accordance with the vessel’s fire response plan. After he confirmed the presence of a fire on the starboard side of the interior of the crane cabin, he notified the senior chief mate. The senior chief mate, in turn, notified the master, who sounded the general alarm. ", "match": "The master mustered the vessel’s fire teams, and they applied water onto the fire as the master evaluated the situation. In addition to responding to the fire, the master also requested assistance from the Coast Guard and the local fire department.", "after": " The crew’s quick response and prompt action helped limit the fire damage and extinguish the fire. A postcasualty investigation identified a fire pattern on the bulkhead on the starboard side of the crane cabin behind a compact refrigerator, indicating that this location was the likely origin of the"}, {"doc_id": "MIR2612.pdf", "quote": "The crew’s quick response and prompt action helped limit the fire damage and extinguish the fire.", "before": "otified the master, who sounded the general alarm. The master mustered the vessel’s fire teams, and they applied water onto the fire as the master evaluated the situation. In addition to responding to the fire, the master also requested assistance from the Coast Guard and the local fire department. ", "match": "The crew’s quick response and prompt action helped limit the fire damage and extinguish the fire.", "after": " A postcasualty investigation identified a fire pattern on the bulkhead on the starboard side of the crane cabin behind a compact refrigerator, indicating that this location was the likely origin of the fire. A failure of the refrigerator’s hermetically sealed compressor or an electrical fault could"}], "premise_evidence": []}, {"id": "b015-2", "answerable": true, "dimensions": {"question_type": "comparison", "complexity": "multi_span", "phrasing": "close", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.214, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "What did the NTSB determine was the probable cause of the fires aboard the Genius Star XI, and how does it compare with the probable cause of the fire aboard the pipelayer Deep Energy?", "expected_answer": "The Genius Star XI fires were caused by 41 BESS units breaking away in heavy weather because of improperly secured lashing belts, leading to internal structural deformation and thermal runaway of lithium-ion battery packs in three units; the Deep Energy fire was likely caused by an unknown malfunction of, or electrical fault within, the crane cabin refrigerator or its receptacle, and its exact ignition source could not be determined.", "notes": "Tests contrasting a determined cargo-securing cause with a likely-but-undetermined electrical cause across two fire reports.", "docs": [{"doc_id": "MIR2541.pdf", "report": "MIR-25-41", "title": "Lithium-ion Battery Fires aboard Cargo Vessel Genius Star XI", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2541.pdf"}, {"doc_id": "MIR2612.pdf", "report": "MIR-26-12", "title": "Fire aboard Pipelayer Deep Energy", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2612.pdf"}], "evidence": [{"doc_id": "MIR2541.pdf", "quote": "breakaway of 41 battery energy storage systems (BESS) units in the cargo holds during heavy weather conditions due to improperly secured lashing belts, which resulted in internal structural deformation of these units and thermal runaway of lithium-ion battery packs in three of the BESS units.", "before": "rtation in the maritime environment. Lithium-ion Battery Fires aboard Cargo Vessel Genius Star XI MIR-25-41 28 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines the probable cause of the two (December 25 and Dember 28, 2023) fires aboard the Genius Star XI was the ", "match": "breakaway of 41 battery energy storage systems (BESS) units in the cargo holds during heavy weather conditions due to improperly secured lashing belts, which resulted in internal structural deformation of these units and thermal runaway of lithium-ion battery packs in three of the BESS units.", "after": " 3.2 Lessons Learned Ensuring Proper Cargo Securing In addition to following a vessel’s cargo securing manual and implementing the approved vessel storage and lashing plan, a vessel’s crew must also conduct a thorough inspection of all the cargo-securing arrangements both during and after cargo load"}, {"doc_id": "MIR2612.pdf", "quote": "was likely the result of an unknown malfunction of, or an electrical fault within, the refrigerator or its associated electrical receptacle.", "before": " fire to expand up the bulkhead to the rest of the crane cabin. Fire aboard Pipelayer Deep Energy MIR-26-12 9 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the fire within the knuckle boom crane cabin aboard the pipelayer Deep Energy ", "match": "was likely the result of an unknown malfunction of, or an electrical fault within, the refrigerator or its associated electrical receptacle.", "after": " Fire aboard Pipelayer Deep Energy MIR-26-12 10 Vessel Particulars Vessel Deep Energy NTSB vessel group Pipelayer ( Specialty/Other) Owner/operator Technip UK Limited (Commercial) Flag The Bahamas Port of registry Nassau, The Bahamas Year built 2013 Official number N/A IMO number 9481154 Classificat"}, {"doc_id": "MIR2612.pdf", "quote": "Due to the extent of the fire damage to the refrigerator and elsewhere within the crane cabin, the exact ignition source and cause of the fire could not be determined.", "before": ", or broken receptacle hardware—within the receptacle, it could have created excessive resistance heating, which could have led to the ignition of nearby combustibles. However, because the vessel’s breakers were opened as part of the response to the fire, it is unknown whether this breaker tripped. ", "match": "Due to the extent of the fire damage to the refrigerator and elsewhere within the crane cabin, the exact ignition source and cause of the fire could not be determined.", "after": " Once an ignition source was produced, combustible materials (including shelving and plastic bins) mounted on the bulkhead, above the fire’s likely origin, ignited and provided a path for the fire to expand up the bulkhead to the rest of the crane cabin. Fire aboard Pipelayer Deep Energy MIR-26-12 9"}], "premise_evidence": []}, {"id": "b016-1", "answerable": true, "dimensions": {"question_type": "multi_document", "complexity": "multi_span", "phrasing": "paraphrased", "evidence_location": "analysis"}, "checks": {"lexical_overlap": 0.167, "too_easy": false, "chunk_boundary": "cross_chunk", "duplicate_of": null, "evidence_location": "analysis"}, "question": "For both the Josset tow hitting the Bayou Grosse Tête Bridge and the Dry Tortugas running into platform VK-817A, the NTSB named a safeguard that no rule demanded but that might have averted the casualty. What was that safeguard in each case, and how would it have helped?", "expected_answer": "For the Josset, posting another crewmember on the tow as a lookout (not required) would likely have let the pilot know sooner that the bridge was not open and act to avoid hitting it; for the Dry Tortugas, which was not required to have one, a watch alarm set to appropriate intervals may have woken the sleeping second captain before the contact.", "notes": "Tests linking two contact reports through the shared theme of a non-mandatory safeguard (lookout versus watch alarm) identified in each analysis.", "docs": [{"doc_id": "MIR2618.pdf", "report": "MIR-26-18", "title": "Contact of Josset Tow with the Bayou Grosse Tête Bridge", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2618.pdf"}, {"doc_id": "MIR2627.pdf", "report": "MIR-26-27", "title": "Contact of Offshore Supply Vessel Dry Tortugas with Offshore Gas and Condensate Production Platform VK-817A", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2627.pdf"}], "evidence": [{"doc_id": "MIR2618.pdf", "quote": "Although not required, if the pilot had positioned one of the other crewmembers on the tow as a lookout, he likely would have been aware earlier that the bridge was not open as he expected and could have taken action to avoid striking the bridge.", "before": "ee the bridge and recognize the swing span was not open, the lead barge was nearing the bridge. The pilot began backing the tow as the bridge began to open toward the tow. However, the tow still had headway, resulting in the bow of the lead barge, FMT 502, striking the swing span as it was opening. ", "match": "Although not required, if the pilot had positioned one of the other crewmembers on the tow as a lookout, he likely would have been aware earlier that the bridge was not open as he expected and could have taken action to avoid striking the bridge.", "after": " Contact of the Josset Tow with the Bayou Grosse Tête Bridge MIR-26-18 9 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that the probable cause of the contact between the Josset tow and the Bayou Grosse Tête Bridge was the bridge tender’s miscalculation of Josse"}, {"doc_id": "MIR2627.pdf", "quote": "The Dry Tortugas was not equipped with a watch alarm, nor was it required to be.", "before": "ises at different times of the day and night. During a circadian low period, an individual’s desire for sleep is increased and the performance effects of fatigue are more pronounced. It is likely that the second captain’s fatigue level was further increased by the effects of a circadian low period. ", "match": "The Dry Tortugas was not equipped with a watch alarm, nor was it required to be.", "after": " (After the contact, the operating company installed a watch alarm on board the Dry Tortugas.) While not a substitute for a well-rested operator, a watch alarm can help ensure that crewmembers remain awake and vigilant while on watch, especially when operating alone in the wheelhouse. The second cap"}, {"doc_id": "MIR2627.pdf", "quote": "Had a watch alarm been installed and set to appropriate intervals, it may have awoken the second captain before the contact.", "before": "while on watch, especially when operating alone in the wheelhouse. The second captain was navigating alone in the wheelhouse, and, once he fell asleep, there were no other alarms (radar or electronic charting system) set that could have awoken him as the vessel approached the platform in autopilot. ", "match": "Had a watch alarm been installed and set to appropriate intervals, it may have awoken the second captain before the contact.", "after": " 3 International Maritime Organization, “Guidelines on Fatigue,” MSC. 1/Circ. 1598, January 2019, 15. 4 Enhancing Sleep Efficiency on Vessels in the Tug/Towboat/Barge Industry (National Academies of Sciences, Engineering, and Medicine, 2016), https://www.nationalacademies.org/read/21933. 7 Contact o"}], " ge section.", "docs": [{"doc_id": "MIR2519.pdf", "report": "MIR-25-19", "title": "Grounding of Towing Vessel City of Louisville", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2519.pdf"}], "evidence": [{"doc_id": "MIR2519.pdf", "quote": "The City of Louisville was refloated and towed to a repair yard in Paducah, Kentucky, where it was dry docked on August 10.", "before": "nd towing industry refers to the shorelines of Western Rivers as the left and right banks when traveling (facing) downriver. The left bank is called the left descending bank, and the right bank is called the right descending bank. Grounding of Towing Vessel City of Louisville MIR-25-19 1.3.1 Damage ", "match": "The City of Louisville was refloated and towed to a repair yard in Paducah, Kentucky, where it was dry docked on August 10.", "after": " The cost of repairs was estimated at over $2 million. There were no reports of damage to any of the 11 barges. A marine survey documented hull fracture damage to the bottom plating of the main engine room space about 4 feet forward of the aft watertight bulkhead to the propeller shaft alley (see fi"}], "premise_evidence": []}, {"id": "b029-2", "answerable": false, "dimensions": {"question_type": "unanswerable", "unanswerable_kind": "false_premise"}, "checks": {"lexical_overlap": null, "too_easy": false, "chunk_boundary": null, "duplicate_of": null, "evidence_location": null}, "question": "What malfunction in the City of Louisville's autopilot allowed the tow to wander out of the channel while the pilot was away from the helm on the Upper Mississippi River?", "expected_answer": "The premise is wrong: the City of Louisville had no autopilot system; the pilot left the helm unattended, and the probable cause was the pilot leaving the helm, not an autopilot failure.", "notes": "False premise of an autopilot failure; the vessel had no autopilot and the cause was the unattended helm.", "docs": [{"doc_id": "MIR2519.pdf", "report": "MIR-25-19", "title": "Grounding of Towing Vessel City of Louisville", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2519.pdf"}], "evidence": [], "premise_evidence": [{"doc_id": "MIR2519.pdf", "quote": "saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system).", "before": "vigates the vessel. Grounding of Towing Vessel City of Louisville MIR-25-19 a reduced speed at the customer’s request, since they were not in a rush to receive the barges. The pilot told investigators that, about 1442, he left the helm. Before doing so, he looked out the wheelhouse front window and ", "match": "saw there was no swing of the tow (the City of Louisville was not fitted with an autopilot system).", "after": " He also checked the swing meter, fathometer, and electronic chart system (ECS). At that time, the boat’s ECS recorded the vessel on a heading of 349° at 4.8 mph and about 45 yards to the east of the sailing line, which had a course line of 347°. 4 He told investigators that he then went to the port"}, {"doc_id": "MIR2519.pdf", "quote": "the probable cause of the grounding of the City of Louisville was the pilot leaving the helm unattended while operating his tow on the Mississippi River.", "before": " he was away from the helm for 5 minutes, the system either had a time interval to alarm set to greater than 5 minutes or was disabled or nonoperational. Grounding of Towing Vessel City of Louisville MIR-25-19 3 Conclusions 3.1 Probable Cause The National Transportation Safety Board determines that ", "match": "the probable cause of the grounding of the City of Louisville was the pilot leaving the helm unattended while operating his tow on the Mississippi River.", "after": " 3.2 Lessons Learned Using Pilothouse Alerter Systems A pilothouse alerter, when used as intended, is an effective tool that can help ensure a towing vessel operator remains awake and vigilant while on duty (and notify another crewmember if the pilothouse alarm is not acknowledged). Established proc"}]}, {"id": "b030-1", "answerable": true, "dimensions": {"question_type": "factual", "complexity": "single_span", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.357, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "After the blast aboard the New York City sludge ship Hunts Point, where was the missing senior engineer eventually located?", "expected_answer": "Before the fire department arrived at 1030, the chief engineer was found between the concrete dock and a wooden fender on the vessel's starboard side; he was declared dead at the scene.", "notes": "Tests retrieval of a narrative detail about the post-explosion search, phrased without the report's wording.", "docs": [{"doc_id": "MIR2622.pdf", "report": "MIR-26-22", "title": "Explosion aboard Sludge Vessel Hunts Point", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2622.pdf"}], "evidence": [{"doc_id": "MIR2622.pdf", "quote": "Before the arrival of the fire department at 1030, the chief engineer was found between the concrete dock and a wooden fender located on the starboard side of the vessel.", "before": " NYC DEP notify the New York City Fire Department and the Coast Guard Sector New York Command Center of the explosion and that the chief engineer was missing. The North River facility personnel stopped cargo operations and assisted the Hunts Point crew with searching for the missing chief engineer. ", "match": "Before the arrival of the fire department at 1030, the chief engineer was found between the concrete dock and a wooden fender located on the starboard side of the vessel.", "after": " The chief engineer was declared dead at the scene by the responding New York City Fire Department paramedics. The assistant engineer, master, and an able seaman sustained minor injuries and were transported to the hospital. 1.3 Additional uote": "Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel.", "before": "rd Sludge Vessel Hunts Point MIR-26-22 8 (starboard direction) toward the centerline of the vessel. The master and other crewmembers, who were in the house located aft on the vessel, heard a “hissing” noise and felt the vessel vibrate. About 1020, an explosion occurred in the no. 2 port cargo tank. ", "match": "Following the explosion, there was no fire; however, sludge burst out of the tank and covered the assistant engineer and the exterior of the vessel.", "after": " The crew went out on deck to investigate and found that the deck above the no. 2 port cargo tank had expanded upward during the explosion. The assistant engineer was located by the crew, injured but conscious. The chief engineer could not be found on deck. The master notified the dispatch at the NY"}]}, {"id": "b031-1", "answerable": true, "dimensions": {"question_type": "factual", "complexity": "single_span", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.2, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "notes": "Tests retrieval of the cargo carried by each barge, phrased in lay terms.", "docs": [{"doc_id": "MIR2610.pdf", "report": "MIR-26-10", "title": "Breakaway of Barges MPC 907 and MPC 644 and Subsequent Contact with Mooring Cells", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2610.pdf"}], "evidence": [{"doc_id": "MIR2610.pdf", "quot hat two crewmembers inspect the equipment before starting it.", "notes": "Combines two procedural changes from the analysis, the first spanning the chunk boundary at 'mandate that, ‖ following maintenance'.", "docs": [{"doc_id": "MIR2539.pdf", "report": "MIR-25-39", "title": "Engine Room Fire aboard Dredging Vessel Stuyvesant", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2539.pdf"}], "evidence": [{"doc_id": "MIR2539.pdf", "quote": "The operating company has since updated its maintenance procedures to mandate that, following maintenance on an engine, crewmembers locally start the engine.", "before": " the lube oil pump developed full operating pressure of about 65 psi. Because the engineering crewmembers started the engine remotely from the MCR, rather than locally, they had no indication that lube oil was discharging and subsequently spraying from the port auxiliary engine when it was started. ", "match": "The operating company has since updated its maintenance procedures to mandate that, following maintenance on an engine, crewmembers locally start the engine.", "after": " Maintenance conducted by the engine crew prior to the fire is considered routine, and the crewmembers involved had likely completed similar tasks numerous times. The engine manufacturer’s instructions were available on the vessel and provided detailed information on how to conduct the tasks. Howeve"}, {"doc_id": "MIR2539.pdf", "quote": "The operating company has since updated its maintenance procedures to mandate that, following maintenance on an engine, two crewmembers inspect the equipment before starting the engine.", "before": "filter housing. Had the engine crewmembers followed the engine manufacturer’s instructions when completing their maintenance work, it is likely they would have discovered the missing plug during an inspection and taken steps to reinstall components before starting the engine and prevented the fire. ", "match": "The operating company has since updated its maintenance procedures to mandate that, following maintenance on an engine, two crewmembers inspect the equipment before starting the engine.", "after": " The engineering crew initially planned on conducting the routine maintenance on the port auxiliary engine the day before the fire but chose to delay until the next day due to limited available time. On the day of the fire, a maintenance team consisting of the first engineer, oiler, and wiper was as"}], "premise_evidence": []}, {"id": "b033-1", "answerable": true, "dimensions": {"question_type": "factual", "complexity": "single_span", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.143, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "On the Sunday the unmanned yacht Flagship caught fire at the Miami River shipyard, who raised the alarm and what first drew their attention?", "expected_answer": "The security guard on duty at the shipyard entrance heard popping noises from the enclosed dock area and saw smoke; she investigated, discovered the fire, called 911 and then notified the facility manager.", "notes": "Tests retrieval of who discovered the Flagship fire, phrased without the report's wording.", "docs": [{"doc_id": "MIR2531.pdf", "report": "MIR-25-31", "title": "Fire aboard Yacht Flagship", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2531.pdf"}], "evidence": [{"doc_id": "MIR2531.pdf", "quote": "A security guard who was on duty at the shipyard entrance heard popping noises from the enclosed dock area and saw smoke coming from the facility. She went to investigate, discovered the fire, called 911, and then notified the facility manager.", "before": "before the fire (2) an explosion from the aft area of the vessel at 1031 (3) progression of the fire within the vessel. The times in the upper left of each video still are 1 hour behind the actual time because the shipyard clocks were not set for daylight savings time. (Source: RMK Merrill Stevens) ", "match": "A security guard who was on duty at the shipyard entrance heard popping noises from the enclosed dock area and saw smoke coming from the facility. She went to investigate, discovered the fire, called 911, and then notified the facility manager.", "after": " Firefighters from the City of Miami Fire Rescue arrived at 1050 and started to extinguish the fire. Additional firefighters later arrived to assist. During the response, firefighters moved the vessel from the dock facility to an exterior sea wall, where they extinguished the fire. The vessel sank a"}], "premise_evidence": []}, {"id": "b033-2", "answerable": true, "dimensions": {"question_type": "causal", "complexity": "inference", "phrasing": "paraphrased", "evidence_location": "narrative"}, "checks": {"lexical_overlap": 0.294, "too_easy": false, "chunk_boundary": "within_chunk", "duplicate_of": null, "evidence_location": "narrative"}, "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "notes": "Causal question about the BMS bypass decision with a small rate calculation (5 volts over 5 days); it asks about the precursor decision, not the probable cause of the fire.", "docs": [{"doc_id": "MIR2531.pdf", "report": "MIR-25-31", "title": "Fire aboard Yacht Flagship", "url": "https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2531.pdf"}], "evidence": [{"doc_id": "MIR2531.pdf", "quote": "However, the charging speed was slow; during the init
