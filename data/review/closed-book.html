<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed-book marking</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#57534e;--card:#fff;--line:#e7e5e4;--ok:#15803d;--mid:#b45309;--bad:#b91c1c;--accent:#1d4ed8}
@media (prefers-color-scheme: dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--card:#292524;--line:#44403c;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--accent:#93c5fd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:1}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card.correct{border-left:4px solid var(--ok)}.card.partly_correct{border-left:4px solid var(--mid)}
.card.incorrect,.card.abstained{border-left:4px solid var(--bad)}
.meta{color:var(--muted);font-size:13px}.box{border-left:3px solid var(--line);padding-left:8px;margin:4px 0;white-space:pre-wrap}
h4{margin:10px 0 2px;font-size:13px}input[type=text]{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
</style></head><body>
<header><strong>Closed-book marking</strong><span id="progress" class="meta"></span>
<input id="marker" type="text" placeholder="Your name" style="max-width:200px">
<button id="download">Download marks</button>
<span class="meta">Mark whether the model, with no documents, gave the expected answer. Autosaves in this browser.</span></header>
<main id="list"></main>
<script>
const DATA = {"traces_sha256": "76e0f420ddb241f1ba1f4754737e945b3038e9af2360d734bb84fc692c323540", "items": [{"id": "q-b001-2", "question_type": "comparison", "question": "Which tow was moving at a higher speed at the moment its barge made contact: the Kitty tow when barge EMS 317 struck Algiers Lock Gate D, or the Ovide J tow when barge EMS 348 contacted the Chalmette Refinery dock?", "expected_answer": "The Kitty tow was faster: EMS 317 struck Gate D at 1.4 mph, while EMS 348 contacted the Chalmette Refinery dock at 0.35 mph.", "answer": "The Kitty tow was moving at a higher speed at the moment its barge, EMS 317, struck Algiers Lock Gate D. The Ovide J tow, with barge EMS 348, contacted the Chalmette Refinery dock at a lower speed.", "prefill": null}, {"id": "q-b003-1", "question_type": "multi_document", "question": "The Duke and the LCPL Phillip C George each left the Texas International Terminal in Galveston with two barges before hitting structures near the Pelican Island Bridge. What was each towboat's pair of barges carrying when it set out?", "expected_answer": "The Duke's two barges were empty, while each of the LCPL Phillip C George's two tank barges carried about 24,000 barrels of vacuum gas oil.", "answer": "The question refers to an incident that occurred on April 12, 2011, near Galveston, Texas, involving the towboat *Duke* and the LCPL Phillip C. George. Both vessels were towing barges when they collided with structures near the Pelican Island Bridge. \n\nThe barges being towed by the *Duke* were carrying **crude oil**, and the barges being towed by the LCPL Phillip C. George were also carrying **crude oil**. The collision resulted in a significant oil spill into Galveston Bay.", "prefill": null}, {"id": "q-b004-1", "question_type": "multi_document", "question": "The Ocean Navigator and the barge Pathfinder both had a blaze after a Caterpillar 3516B generator engine broke down. How did the crew get the flames out in each case?", "expected_answer": "On the Ocean Navigator the crew cut fuel to the engines and shut down ventilation fans, dampers and doors, and the fire team later found no fire left in the engine room; on the Pathfinder the crew sealed the space and the chief engineer released carbon dioxide into the unloading generator space about 1630.", "answer": "The Ocean Navigator and the barge Pathfinder both experienced fires caused by a Caterpillar 3516B generator engine failure. In both cases, the crew used fire extinguishing systems to control and eventually extinguish the flames. The exact methods may have varied, but typically, such systems include foam, CO₂, or dry chemical extinguishers designed for electrical fires. The specific details of how each vessel's crew managed the fire are not widely documented.", "prefill": null}, {"id": "q-b004-2", "question_type": "comparison", "question": "According to the NTSB analysis, which connecting rod seized with the crankshaft and led to the engine block rupture in the diesel generator engine failure aboard the Ocean Navigator, and which in the failure aboard the Pathfinder?", "expected_answer": "On the Ocean Navigator it was the no. 13 connecting rod (block ruptured near the nos. 12 and 14 cylinders); on the Pathfinder it was the no. 9 connecting rod.", "answer": "The National Transportation Safety Board (NTSB) analysis identified that in both the Ocean Navigator and Pathfinder incidents, the failure was caused by a connecting rod seizing to the crankshaft, leading to engine block rupture. However, the specific connecting rod involved in each incident was not identified in the NTSB reports. The common cause was the seizure of a connecting rod to the crankshaft, resulting in catastrophic engine failure.", "prefill": null}, {"id": "q-b006-2", "question_type": "comparison", "question": "Was it hotter outdoors when the Rickey Hughes tow hit the Vicksburg Highway 80 Bridge or when the Myra Eckstein tow hit it, and what were the readings?", "expected_answer": "It was warmer during the Rickey Hughes contact, with an air temperature of 81°F, compared with 70°F during the Myra Eckstein contact.", "answer": "There is no recorded data comparing the temperatures outdoors when the Rickey Hughes tow and the Myra Eckstein tow hit the Vicksburg Highway 80 Bridge. The event you are referring to is not documented in available records.", "prefill": null}, {"id": "q-b007-1", "question_type": "multi_document", "question": "Two bulk carriers tied to Algoma Central Corporation had mishaps the NTSB looked into, one hitting dock equipment in Superior, Wisconsin, and the other running onto the bottom of the Delaware River near Philadelphia; roughly how far apart in time were the two events?", "expected_answer": "About five and a half months (roughly 172 days): the Algoma Discovery struck the loading shuttles on July 20, 2024, and the Algoma Verity grounded on January 8, 2025.", "answer": "The two incidents occurred approximately 10 months apart. The first incident, involving the *Allegany* hitting dock equipment in Superior, Wisconsin, happened in September 2016. The second incident, involving the *Columbia* running aground in the Delaware River, occurred in July 2017.", "prefill": null}, {"id": "q-b008-1", "question_type": "multi_document", "question": "What shortcoming in the federal rules for towboats do the NTSB's assessments of both the Johnny M engine-room blaze and the William D bunkroom blaze point to regarding built-in barriers that slow a fire's spread?", "expected_answer": "Both analyses note that towing vessels are inspected under 46 CFR Subchapter M, which does not currently require owners to incorporate structural fire protection; on the Johnny M the combustible air intake ducting was not structurally protected (nor required to be), and on the William D the lack of structural fire protection is cited as a factor in previous fires with heavy use of combustible interior materials.", "answer": "The NTSB's assessments highlight a shortcoming in the federal rules for towboats regarding the lack of built-in barriers to compartmentalize the engine room and bunkroom, which could slow the spread of fire. Specifically, the absence of fire-resistant bulkheads or partitions that would contain fires within localized areas and prevent their rapid spread throughout the vessel.", "prefill": null}, {"id": "q-b009-2", "question_type": "comparison", "question": "How precisely could investigators pin down where the blaze began on the Lucinda Smith versus on the Sub Zero, and what limited them in each case?", "expected_answer": "For the Lucinda Smith, ATF investigators traced the fire to the first mate's stateroom aft of the wheelhouse near the end of the bunk, but the extent of the fire damage meant the exact ignition source and cause could not be determined. For the Sub Zero, the vessel burned to the waterline, sank and was not salvaged, so investigators could not inspect it to find the origin or cause, and the ignition source could not be determined.", "answer": "Investigators were able to pinpoint the origin of the blaze on the *Lucinda Smith* with relatively high precision, as the fire started in the engine room, which had clear physical evidence such as burn marks, melted metal, and charred debris. The location was further confirmed by the position of unburned items and the direction of fire spread.\n\nOn the *Sub Zero*, investigators faced greater challenges in determining the exact origin of the fire. The fire started in the galley, but the area was heavily damaged, and much of the evidence was obscured by water damage and the effects of the fire itself. Additionally, the lack of clear burn patterns and the presence of multiple potential ignition sources limited their ability to precisely determine the origin.", "prefill": null}, {"id": "q-b011-2", "question_type": "comparison", "question": "Which had a built-in system for flooding its machinery space with extinguishing agent, the lobster boat GITN'R DUN or the tanker Scot Stuttgart, and what did each crew actually use to fight the blaze?", "expected_answer": "Only the Scot Stuttgart had one: after sealing the port engine room, the crew released half (7 of 14) of the bottles of its fixed CO2 system. The GITN'R DUN had no fixed system, so the captain relied on portable extinguishers, discharging two handheld units through the aft hatch while the fire kept growing.", "answer": "The tanker *Scot Stuttgart* had a built-in system for flooding its machinery space with extinguishing agent. During a fire, the crew used the built-in system to fight the blaze. The lobster boat *GITN'R DUN* did not have such a system and the crew used water and fire extinguishers to combat the fire.", "prefill": null}, {"id": "q-b012-1", "question_type": "multi_document", "question": "Both the Amber Brittany tow striking the McAlpine vane dike and the Schweiger hitting the Coast Guard docks at Cape Disappointment followed a lapse by the person steering. Roughly how long before each impact did the vessel start wandering off its intended path, and what was the operator doing at that point?", "expected_answer": "The Amber Brittany tow began leaving its route about 1547, when the pilot started a series of text messages, roughly 3 minutes before the 1550 contact. The Schweiger began moving to port across the channel at 1235:12 and struck the docks at 1236:25, about 1 minute 13 seconds later, with the captain likely having fallen asleep in that window.", "answer": "The Amber Brittany struck the McAlpine vane dike approximately **15 minutes** before impact, while the Schweiger hit the Coast Guard docks at Cape Disappointment about **10 minutes** before impact. In both cases, the vessels had been drifting off their intended path due to a lapse in steering control. The operators were reportedly **not paying attention** or **engaged in non-essential tasks**, leading to a failure to maintain proper course.", "prefill": null}, {"id": "q-b013-2", "question_type": "comparison", "question": "After leaving the dock, which was under way longer before hitting the structure, the tanker Hafnia Amessi on the Cooper River or the Mackenzie Rose tow on the Elizabeth River, and by about how much?", "expected_answer": "The Mackenzie Rose tow: it left the facility at 1500 and hit the bridge at 1626:41 (about 1 hour 27 minutes), while the Hafnia Amessi got under way at 0948 and hit Pier B at 1019:01 (about 31 minutes), so the tow was under way roughly 56 minutes longer.", "answer": "The tanker *Hafnia Amessi* on the Cooper River was under way longer before hitting the structure compared to the *Mackenzie Rose* on the Elizabeth River. The *Hafnia Amessi* was under way for approximately **12 seconds** before the collision, while the *Mackenzie Rose* was under way for about **5 seconds** before striking the structure.", "prefill": null}, {"id": "q-b014-1", "question_type": "multi_document", "question": "The tug Baylor J. Tregre, which went down off Galveston, and the Chad Pregracke tow, which came apart on the Lower Mississippi, have the same estimated repair bill in their casualty summaries. What is that amount, and how many people were aboard in each case?", "expected_answer": "Both casualties are estimated at $2 million in damage; there were 4 people aboard the Baylor J. Tregre and 9 aboard in the Chad Pregracke casualty.", "answer": "The tug *Baylor J. Tregre*, which sank off Galveston in 1994, had an estimated repair bill of $1.2 million, with 10 people aboard. The *Chad Pregracke* tow, which broke apart on the Lower Mississippi in 1995, also had an estimated repair bill of $1.2 million, with 14 people aboard.", "prefill": null}, {"id": "q-b014-2", "question_type": "comparison", "question": "According to the NTSB analysis, how many more barges was the towing vessel Chad Pregracke pushing than the Baylor J. Tregre was towing, and how did the two tow arrangements differ?", "expected_answer": "The Chad Pregracke was pushing 34 loaded barges ahead, while the Baylor J. Tregre was towing a single barge, the MARMAC 27, astern on an 800-foot-long wire, so the Chad Pregracke tow had 33 more barges.", "answer": "According to the NTSB analysis, the towing vessel *Chad Pregracke* was pushing **two more barges** than the *Baylor J. Tregre* was towing. The difference in tow arrangements was that the *Chad Pregracke* was pushing a **longer and heavier tow** compared to the *Baylor J. Tregre*, which contributed to the increased difficulty in maneuvering and maintaining control.", "prefill": null}, {"id": "q-b019-2", "question_type": "factual", "question": "How broad was the approach channel off Georgetown, Guyana, where the Jack Edwards and the Julie C came together, and how much water was charted in it?", "expected_answer": "The unprotected approach channel was 148 feet wide, with a charted depth of 16 feet in the channel (8 feet outside it).", "answer": "The approach channel off Georgetown, Guyana, where the *Jack Edwards* and the *Julie C* came together, was relatively narrow, with the channel being approximately 100 meters wide. The depth of the water charted in the channel was around 10 meters.", "prefill": null}, {"id": "q-b023-1", "question_type": "causal", "question": "Why did the skipper of the dredge Brunswick want the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River?", "expected_answer": "Once radio contact was made to arrange the passing, the dredge captain said he preferred the tow to go between the dredge and the dock because he had crew below working on something and would have had to stop them to do something else.", "answer": "The skipper of the dredge *Brunswick* likely wanted the Royal Engineer and its crane barge to squeeze through on the terminal side of the dredge on the Cooper River to avoid disrupting the dredging operations and to ensure safe passage for both vessels. This positioning would allow the crane barge to access the work area without interfering with the dredge's activities, thereby improving efficiency and safety during the operation.", "prefill": null}, {"id": "q-b024-1", "question_type": "factual", "question": "How was the March 2025 Spicy Lady casualty categorized, and in which waterway and near what landmark did it take place?", "expected_answer": "It was categorized as a fire/explosion, occurring in Chatham Strait about 1 mile west of Point Gardner, Alaska.", "answer": "The March 2025 Spicy Lady casualty was categorized as a collision involving a commercial vessel. The incident took place in the Strait of Gibraltar, near the Rock of Gibraltar.", "prefill": null}, {"id": "q-b024-2", "question_type": "causal", "question": "Why were investigators unable to pin down what started the blaze on the fishing vessel Spicy Lady?", "expected_answer": "Several possible ignition sources existed in the forward berthing area (wiring, electrical components and lithium-ion batteries); the arcing and corrosion found on the wires may have occurred after the fire started or during firefighting, and because of severe damage and the space being unoccupied, investigators could not tell when or why the bag of lithium-ion batteries ignited, so the probable cause was an unknown source on a bunk.", "answer": "Investigators were unable to determine the exact origin of the blaze on the fishing vessel *Spicy Lady* due to the rapid spread of the fire and the challenging conditions aboard the vessel. The fire likely started in the galley area, but the intense heat and smoke made it difficult to trace the precise point of origin. Additionally, the vessel's layout and the presence of flammable materials contributed to the fire's quick spread, complicating efforts to identify the exact source.", "prefill": null}, {"id": "q-b025-1", "question_type": "procedural", "question": "After crewmembers identified a hull delamination on the Jig Strike several months before the sinking, who repaired the delamination and why was the Coast Guard unable to oversee the repairs?", "expected_answer": "The captain and owner repaired the port-side forward delamination themselves; the Coast Guard was not notified about the issue, so it could not oversee the repairs to ensure they followed recommended practices for fiberglass hull repairs.", "answer": "The crewmembers of the Jig Strike identified the hull delamination themselves and repaired it using available resources. The Coast Guard was unable to oversee the repairs because the vessel was not under Coast Guard custody at the time and was operated by private entities.", "prefill": null}, {"id": "q-b025-2", "question_type": "factual", "question": "What was the total head count aboard the Jig Strike when it flooded off Cortes Bank, and how many of those people were crew versus paying customers?", "expected_answer": "There were 17 people aboard: 5 crewmembers and 12 passengers.", "answer": "The Jig Strike was a fishing vessel that sank off Cortes Bank in 1996. There were 12 people aboard when it flooded. All 12 were crew members; there were no paying customers on board at the time of the incident.", "prefill": null}, {"id": "q-b028-1", "question_type": "factual", "question": "How far did the Columbia Gorge drift downriver into the historic lock after it broke free from its mooring at Cascade Locks?", "expected_answer": "It drifted about 475 yards downriver into the historic lock.", "answer": "The Columbia Gorge drift traveled approximately 1.5 miles downriver into the historic lock at Cascade Locks after it broke free from its mooring in 2017.", "prefill": null}, {"id": "q-b028-2", "question_type": "factual", "question": "Following the Columbia Gorge breakaway at Cascade Locks, how often did the boat's operator start renewing the ropes used to tie it up?", "expected_answer": "The operating company began requiring the mooring lines to be replaced every year.", "answer": "The boat's operator started renewing the ropes used to tie up the boat every 24 hours following the Columbia Gorge breakaway at Cascade Locks.", "prefill": null}, {"id": "q-b031-1", "question_type": "factual", "question": "What petroleum products, and roughly how much of each, were aboard the MPC 644 and MPC 907 when the two barges drifted loose on the Ohio River near Evansville?", "expected_answer": "The MPC 644 held about 23,000 barrels of no. 2 ultra low sulfur (MV15) diesel fuel, and the MPC 907 held about 27,328 barrels of no. 84 conventional-blend-grade gasoline.", "answer": "The MPC 644 and MPC 907 were two barges that drifted loose on the Ohio River near Evansville, Indiana, in 2013. The barges were carrying a total of approximately 1.1 million gallons of petroleum products. Specifically, the MPC 644 was carrying about 600,000 gallons of No. 2 fuel oil, and the MPC 907 was carrying about 500,000 gallons of No. 1 fuel oil.", "prefill": null}, {"id": "q-b031-2", "question_type": "factual", "question": "Where and at about what time were the barges MPC 907 and MPC 644 recovered by EMS tugs after breaking free from the MPC terminal dock?", "expected_answer": "EMS tugs recovered the barges near mile 802 about 0700 and returned them to the MPC facility dock.", "answer": "The barges MPC 907 and MPC 644 were recovered by EMS tugs off the coast of Oregon, approximately 20 miles west of Coos Bay, around 10:30 p.m. on April 14, 2023.", "prefill": null}, {"id": "q-b032-1", "question_type": "procedural", "question": "Roughly how long after the sun came up over the St. Johns River did flames break out in the Stuyvesant's engine spaces?", "expected_answer": "About 6 hours and 52 minutes: sunrise was at 0743 and the fire occurred at 1435 eastern daylight time.", "answer": "The event you are referring to is the burning of the *Stuyvesant* during the 1913 Florida hurricane. Flames broke out in the engine spaces approximately **15 minutes** after the sun came up over the St. Johns River.", "prefill": null}, {"id": "q-b033-2", "question_type": "causal", "question": "Why did the team working on the yacht Flagship decide to wire around its battery monitoring computers, and roughly how many volts per day had a 48-volt bank been gaining before that?", "expected_answer": "The battery management systems were blocking the portable chargers, so charging was very slow (one 48-volt bank rose from 34 to 39 volts in 5 days, about 1 volt per day); to speed up charging, the manufacturer, shipyard, an electrician and the owner's representative devised a procedure to bypass each BMS.", "answer": "The team working on the yacht *Flagship* decided to wire around its battery monitoring computers due to concerns about the accuracy and reliability of the monitoring system. The system was reportedly providing incorrect data about the state of charge and voltage levels of the 48-volt battery bank. Before the wiring bypass, the battery bank was reportedly gaining approximately 1 volt per day, which was considered abnormal and potentially dangerous.", "prefill": null}, {"id": "q-b036-2", "question_type": "procedural", "question": "After the captain of the Cape Douglas judged the engine room water to be coming in awfully quick, what did he and the deckhand do to abandon the sinking vessel, and how many minutes after the 1315 decision to abandon were they picked up by the Red Sky?", "expected_answer": "About 1315 they decided to abandon, donned survival suits, got into the vessel's towed skiff and waved down a nearby Good Samaritan vessel; the fishing vessel Red Sky picked them up about 1330, roughly 15 minutes later.", "answer": "The captain of the *Cape Douglas* and the deckhand launched a lifeboat and rowed toward the *Red Sky* to be picked up. They were picked up approximately 25 minutes after the 1315 decision to abandon the vessel.", "prefill": null}, {"id": "q-b038-1", "question_type": "procedural", "question": "When the skipper of the Tom Frazier was steering his string of barges back toward the channel near Portsmouth, Ohio, and the boat struck bottom, how long had it been since the sun went down?", "expected_answer": "About 1 hour 25 minutes: the grounding occurred at 1855 eastern standard time and sunset was at 1730.", "answer": "The event you are referring to is the grounding of the Tom Frazier, a barge towboat, near Portsmouth, Ohio, on September 12, 1972. The sun had been down for approximately **2 hours and 15 minutes** when the incident occurred.", "prefill": null}, {"id": "q-b041-1", "question_type": "causal", "question": "Why did the captain of the fishing vessel Three Girls abandon ship without wearing an immersion suit during the August 2024 engine room fire?", "expected_answer": "Fire and smoke inside the vessel kept the first mate from retrieving two of the vessel's seven survival suits (he brought only five to the muster station), so there were not enough immersion suits for everyone and the captain elected not to wear one.", "answer": "The captain of the fishing vessel *Three Girls* abandoned ship without wearing an immersion suit during the August 2024 engine room fire due to the rapid spread of the fire and the immediate danger to life. The captain likely prioritized evacuation over personal protective equipment in the critical moments of the emergency. The incident highlighted the importance of proper safety protocols and the risks associated with not adhering to mandatory safety equipment during maritime emergencies.", "prefill": null}, {"id": "q-b042-2", "question_type": "factual", "question": "What propulsion machinery did the Bonnie G have, and how much output did it deliver?", "expected_answer": "The Bonnie G had two GE 7FDL12 diesel engines rated at 3,000 hp (2,237 kW) each.", "answer": "The Bonnie G was a 19th-century steamship, and it was powered by a single steam engine. The engine delivered an output of approximately 150 horsepower (HP).", "prefill": null}, {"id": "q-b043-1", "question_type": "causal", "question": "According to the casualty summary, what kind of failure brought about the loss of the towboat Cajole on the Mississippi near Waggaman?", "expected_answer": "The casualty summary classifies it as a flooding/hull failure casualty.", "answer": "The loss of the towboat *Cajole* on the Mississippi River near Waggaman was caused by a failure of the towline, which resulted in the vessel being dragged ashore and sustaining significant damage.", "prefill": null}, {"id": "q-b044-2", "question_type": "factual", "question": "According to the NTSB analysis of the Mystery grounding, what did the captain say the autopilot would do after the chart plotter froze?", "expected_answer": "The captain stated that the chart plotter, which the autopilot relied on for a heading to steer, would occasionally freeze, after which the autopilot would slowly turn the vessel to port.", "answer": "The captain stated that after the chart plotter froze, the autopilot would disengage and the ship would return to manual control.", "prefill": null}, {"id": "q-b045-1", "question_type": "factual", "question": "During the Cosflourish Lake's approach to the South Texas Gateway Terminal in Ingleside, which tugboat was made fast at the very back of the tanker, and which one was held in reserve?", "expected_answer": "The no. 4 tug, Mercury, was at the stern, and the no. 5 tug, Zeus, was the standby tug.", "answer": "I do not know the answer to this specific question.", "prefill": "abstained"}, {"id": "q-b047-2", "question_type": "factual", "question": "After salvors refloated the yacht Lovebug from the West River, to which shipyard was it moved for inspection and repairs, and on what date?", "expected_answer": "It was towed to Yank Marine in Dorchester, New Jersey, on September 1 for survey and overhaul.", "answer": "I do not know the specific shipyard or date associated with the yacht Lovebug after it was refloated from the West River.", "prefill": "abstained"}, {"id": "q-b049-1", "question_type": "procedural", "question": "What was the assisting tug Steel Skipper doing when the William E Strait ended up backing into barges tied up at the Shell refinery pier near Norco?", "expected_answer": "The Steel Skipper was reconfiguring the William E Strait's tow and pushed the tow astern, so the William E Strait struck two moored barges upstream at the Shell Norco Refinery dock.", "answer": "The tug *Steel Skipper* was assisting the *William E. Strait* in maneuvering when the *William E. Strait* ended up backing into barges tied up at the Shell refinery pier near Norco, California, on April 2, 2015. The incident occurred during a routine operation, and the *Steel Skipper* was helping with the vessel's movement.", "prefill": null}, {"id": "q-b051-1", "question_type": "factual", "question": "When a STAX 1 worker on top of the Erving's funnel shouted and signalled for the moving crane at the Port of Los Angeles to halt, roughly how far was he from the crane's operator cabin?", "expected_answer": "The crane operator trolley cab was about 200 feet away from the deckhand (and no one was in it).", "answer": "The STAX 1 worker was approximately 150 feet away from the crane's operator cabin.", "prefill": null}, {"id": "q-b053-1", "question_type": "causal", "question": "What did federal investigators conclude set off the blaze below decks on the bulk carrier Lem Verbena while it was tied up in Mobile?", "expected_answer": "A failed O-ring seal on the oil fittings block of the composite boiler's burner unit, caused by radial misalignment of the two fuel ports on the block modules, let pressurized diesel fuel atomize and ignite on a nearby hot surface.", "answer": "Federal investigators concluded that a discarded cigarette butt set off the blaze below decks on the bulk carrier *Lem Verbena* while it was tied up in Mobile.", "prefill": null}, {"id": "q-b001-1", "question_type": "multi_document", "question": "The towing vessels Kitty and Ovide J were both operated by Enterprise Marine Services. What was the combined property damage of the Kitty tow's contact with the Algiers Lock gate and the Chalmette Refinery dock collapse during docking of the Ovide J tow?", "expected_answer": "About $9.08 million: $2,082,677 for the Kitty tow's contact with the Algiers Lock gate plus an estimated $7 million for the Chalmette Refinery dock collapse.", "answer": "The combined property damage from the contact of the *Kitty* tow with the Algiers Lock gate and the *Chalmette Refinery* dock collapse during the docking of the *Ovide J* tow is estimated to be approximately $1.1 billion.", "prefill": null}, {"id": "q-b002-1", "question_type": "multi_document", "question": "In the Joe B. Wyatt casualty at Fort Madison and the John M Donnelly casualty near Baton Rouge, each pilot steered his tow away from the charted recommended route shortly beforehand. How far did the Joe B. Wyatt stray from that route, and by roughly how many feet did the John M Donnelly sit deeper in the water than the probable depth where it came to rest on the river bottom?", "expected_answer": "The Joe B. Wyatt pilot took the tow more than 200 feet off the sailing line, and the John M Donnelly's 9.5-foot draft exceeded the likely 7.8-foot depth at the obstruction by about 1.7 feet.", "answer": "The Joe B. Wyatt strayed approximately 1,000 feet from the charted recommended route. The John M Donnelly sat roughly 15 feet deeper in the water than the probable depth where it came to rest on the river bottom.", "prefill": null}, {"id": "q-b002-2", "question_type": "comparison", "question": "Which tow was pushing more barges: the Joe B. Wyatt tow when it struck the Fort Madison Bridge protection cell, or the John M Donnelly tow when it grounded near Baton Rouge?", "expected_answer": "The John M Donnelly tow, with 25 empty dry cargo barges, versus 15 barges (13 loaded hopper barges and 2 empty tank barges) in the Joe B. Wyatt tow.", "answer": "The Joe B. Wyatt tow was pushing more barges when it struck the Fort Madison Bridge protection cell. The John M. Donnelly tow was involved in a grounding near Baton Rouge, but the exact number of barges involved in each incident is not specified. However, based on typical operations, the Joe B. Wyatt tow was known to be pushing a larger number of barges at the time of the incident.", "prefill": null}, {"id": "q-b003-2", "question_type": "comparison", "question": "Which tow contacted more power transmission poles near the Pelican Island Bridge, the Duke tow or the LCPL Phillip C George tow?", "expected_answer": "The Duke tow: its barge MM-144 contacted three power poles, whereas the LCPL Phillip C George tow's barge MMLP 321 struck one power transmission pole.", "answer": "The LCPL Phillip C George tow contacted more power transmission poles near the Pelican Island Bridge.", "prefill": null}, {"id": "q-b005-1", "question_type": "multi_document", "question": "Roughly how long after the blaze broke out aboard the Cuyahoga in Ashtabula was the same ship found partly filled with water at its Ashtabula berth?", "expected_answer": "About one year and three days: the fire broke out on March 15, 2024, and the flooding was discovered on March 18, 2025.", "answer": "The ship was found partly filled with water at its berth approximately 13 years after the blaze broke out aboard the Cuyahoga in Ashtabula.", "prefill": null}, {"id": "q-b005-2", "question_type": "comparison", "question": "How many people were aboard the Cuyahoga at the time of its 2024 blaze, and how does that headcount differ from the 2025 incident in which it took on water?", "expected_answer": "There were 40 people aboard during the fire (15 crewmembers and 25 maintenance personnel), whereas nobody was aboard when the flooding occurred.", "answer": "The Cuyahoga did not catch fire in 2024. The 2024 blaze referred to is a fictional event. In the 2025 incident, the Cuyahoga took on water, but no specific headcount is provided for either event. Therefore, there is no factual data to compare the number of people aboard during these events.", "prefill": null}, {"id": "q-b006-1", "question_type": "multi_document", "question": "Adding together the two early-May 2025 incidents in which barges pushed by different towboats struck the old Vicksburg Highway 80 Bridge, roughly what was the total estimated cost of the harm done?", "expected_answer": "About $2.84 million in total: an estimated $1.9 million for the Rickey Hughes contact on May 1, 2025, plus an estimated $941,000 for the Myra Eckstein contact on May 5, 2025.", "answer": "The total estimated cost of the harm caused by the two early-May 2025 incidents involving barges pushing by different towboats striking the old Vicksburg Highway 80 Bridge was approximately $150 million.", "prefill": null}, {"id": "q-b007-2", "question_type": "comparison", "question": "At what speeds were the Algoma Discovery moving as it hit the ore-loading equipment at Superior and the Algoma Verity moving as it went beneath the Benjamin Franklin Bridge shortly before first touching bottom, and which was faster?", "expected_answer": "The Algoma Verity was much faster, at about 9 knots passing under the Benjamin Franklin Bridge, whereas the Algoma Discovery was moving at only about 0.9 knots when it struck the loading shuttles.", "answer": "The Algoma Discovery was moving at approximately 0.3 knots when it hit the ore-loading equipment at Superior, and the Algoma Verity was moving at approximately 0.1 knots when it went beneath the Benjamin Franklin Bridge. The Algoma Discovery was faster.", "prefill": null}, {"id": "q-b008-2", "question_type": "comparison", "question": "Which towboat blaze led to the larger estimated financial loss, the one on the Johnny M near Grand Rivers or the one on the William D in the Victoria Barge Canal, and what were the two figures?", "expected_answer": "The Johnny M fire was costlier, with property damage of $3 million, compared with $500,000 for the William D fire.", "answer": "The fire on the **William D** in the Victoria Barge Canal resulted in a larger estimated financial loss compared to the fire on the **Johnny M** near Grand Rivers. \n\n- The **Johnny M** fire resulted in an estimated loss of **$1.2 million**.\n- The **William D** fire resulted in an estimated loss of **$2.5 million**.", "prefill": null}, {"id": "q-b009-1", "question_type": "multi_document", "question": "The towing vessel Lucinda Smith and the fishing vessel Sub Zero were both lost or damaged by fire in 2024. On what date and at what location did each casualty occur?", "expected_answer": "The Lucinda Smith fire occurred on December 7, 2024, on the Acushnet River in New Bedford, Massachusetts; the Sub Zero fire occurred on August 8, 2024, in Nushagak Bay, 28 nm south of Dillingham, Alaska.", "answer": "I do not have specific information regarding the dates or locations of the casualties involving the towing vessel *Lucinda Smith* and the fishing vessel *Sub Zero* in 2024.", "prefill": "abstained"}, {"id": "q-b010-1", "question_type": "multi_document", "question": "Neither the Tarka II crab boat blaze off Washington nor the Thor tug blaze on the Delaware River had its exact trigger identified. What plausible way the fire got started did investigators put forward for each, and why could they not confirm it?", "expected_answer": "For the Tarka II, heat from the exhaust pipe or an exhaust leak (from the main engine or the running no. 1 auxiliary generator) may have ruptured a pressurized hydraulic line, spraying fluid that ignited on a hot surface; it could not be confirmed because the vessel sank and was not recovered. For the Thor, an electrical fault in the extension cord plug or the nearby boot warmer may have caused resistive heating; the extent of the fire damage prevented determining the exact ignition source.", "answer": "For the **Tarka II crab boat blaze off Washington**, investigators suggested that the fire may have started due to **spontaneous combustion of oily rags** or **electrical faults**. These remain plausible but unconfirmed because the exact source was obscured by the rapid spread of the fire and the difficulty in recovering evidence from the water.\n\nFor the **Thor tug blaze on the Delaware River**, investigators proposed that the fire may have originated from **overheated engine components** or **fuel leaks**. The inability to confirm the exact cause was due to the **intensive burning** that likely destroyed critical evidence before it could be examined.", "prefill": null}, {"id": "q-b010-2", "question_type": "comparison", "question": "Which craft came through its engine-room blaze still afloat, the Tarka II or the Thor, and how did each episode wrap up?", "expected_answer": "The Thor survived: its crew sealed off ventilation, fuel sources and air openings to the engine room and abandoned the towboat, and a responding fire boat put the fire out a few hours later. The Tarka II did not: its two crewmembers abandoned into a liferaft, were rescued by the Coast Guard, and the vessel eventually sank.", "answer": "The **Tarka II** came through its engine-room blaze still afloat. The incident was dramatized in the 1970s British television series *Tarka*, where the ship's crew successfully saved the vessel despite the fire.\n\nThe **Thor**, a fictional ship from the 1970s series *The Thor*, did not survive its blaze. The episode ended with the ship sinking, emphasizing the dangers of maritime disasters. \n\nBoth episodes were part of their respective series and concluded with the outcomes described.", "prefill": null}, {"id": "q-b011-1", "question_type": "multi_document", "question": "Fresh air reaching the burning machinery space made both the GITN'R DUN lobster boat fire and the Scot Stuttgart tanker fire worse. Why could neither space be kept airtight, and roughly how many hours short of the longest closure period the NTSB advises was the tanker's space kept shut after the first gas discharge?", "expected_answer": "The GITN'R DUN had no fixed extinguishing system and no dampers or closures for its engine compartment ventilation openings, so oxygen kept entering and feeding the fire. On the Scot Stuttgart, the master let shoreside firefighters unseal and ventilate the port engine room about an hour after the first CO2 release, whereas the NTSB says such spaces should stay sealed for up to 24 hours, so it was opened roughly 23 hours short of that.", "answer": "Fresh air could not be kept out of the burning machinery spaces because the spaces were not properly sealed or the seals failed, allowing air to enter and fuel the fire. The NTSB advised that the tanker's space was kept shut for approximately 10 hours short of the longest closure period recommended.", "prefill": null}, {"id": "q-b012-2", "question_type": "comparison", "question": "What underlying reasons did the NTSB give for the person at the controls failing to keep the Amber Brittany tow and the Schweiger out of trouble, and how did those reasons differ?", "expected_answer": "For the Amber Brittany, the pilot failed to counter the outdraft current leaving the lock channel, likely because he was inexperienced on that stretch with that vessel and was distracted by his phone. For the Schweiger, the captain fell asleep at the helm, likely from increased fatigue caused by an acute COVID-19 infection, so the difference is distraction and inexperience versus illness-related fatigue.", "answer": "The National Transportation Safety Board (NTSB) did not provide a specific analysis of the \"Amber Brittany tow\" or the \"Schweiger\" in a documented investigation. These terms do not correspond to known incidents or cases in the NTSB's public record. Therefore, there is no established information regarding the reasons given by the NTSB for any failure to keep these entities out of trouble.", "prefill": null}, {"id": "q-b013-1", "question_type": "multi_document", "question": "How much time went by between the day the tanker Hafnia Amessi hit a Navy pier near Charleston and the day the Mackenzie Rose tug and its barge hit a railroad bridge in Chesapeake, Virginia?", "expected_answer": "About five months (153 days): the Hafnia Amessi casualty happened on January 14, 2024, and the Mackenzie Rose casualty on June 15, 2024, so the Hafnia Amessi casualty came first.", "answer": "The event involving the tanker *Hafnia Amessi* hitting a Navy pier near Charleston occurred on April 26, 2011. The incident involving the *Mackenzie Rose* tug and its barge hitting a railroad bridge in Chesapeake, Virginia, occurred on April 26, 2012. Therefore, one year and one day passed between the two events.", "prefill": null}, {"id": "q-b015-1", "question_type": "multi_document", "question": "How did the NTSB rate the shipboard firefighting in both the Genius Star XI lithium battery cargo fires and the Deep Energy crane cabin blaze, and what had the people aboard each ship done to fight the flames?", "expected_answer": "In both cases the NTSB viewed the crew's response favourably. On the Genius Star XI the crew discharged the fixed CO₂ system into hold no. 1 for the first fire and boundary-cooled hold no. 2 with fire hoses while securing ventilation for the second, actions judged appropriate and likely to have stopped the fire spreading; on the Deep Energy the master mustered the fire teams, who put water on the fire, and called the Coast Guard and local fire department, and their quick response helped limit damage and put the fire out.", "answer": "The National Transportation Safety Board (NTSB) investigated both incidents and found deficiencies in shipboard firefighting procedures.\n\nIn the **Genius Star XI** lithium battery cargo fire (2019), the NTSB criticized the lack of adequate firefighting equipment and procedures for lithium battery fires. The crew used water to fight the fire, which is not effective for lithium battery fires and may have exacerbated the situation by causing thermal runaway.\n\nIn the **Deep Energy** crane cabin blaze (2018), the NTSB found that the crew did not have proper firefighting equipment or training for the type of fire encountered. The crew attempted to fight the fire with water, but the fire quickly spread, leading to significant damage.\n\nIn both cases, the NTSB emphasized the need for better training, equipment, and procedures for handling hazardous materials and specific fire types on ships.", "prefill": null}, {"id": "q-b015-2", "question_type": "comparison", "question": "What did the NTSB determine was the probable cause of the fires aboard the Genius Star XI, and how does it compare with the probable cause of the fire aboard the pipelayer Deep Energy?", "expected_answer": "The Genius Star XI fires were caused by 41 BESS units breaking away in heavy weather because of improperly secured lashing belts, leading to internal structural deformation and thermal runaway of lithium-ion battery packs in three units; the Deep Energy fire was likely caused by an unknown malfunction of, or electrical fault within, the crane cabin refrigerator or its receptacle, and its exact ignition source could not be determined.", "answer": "The National Transportation Safety Board (NTSB) determined that the probable cause of the fires aboard the *Genius Star XI* was the failure of the vessel's electrical system, which led to an electrical arc and subsequent fire. \n\nIn contrast, the probable cause of the fire aboard the pipelayer *Deep Energy* was attributed to a fuel leak from a hydraulic system, which ignited and caused the fire.\n\nThese two incidents had different causes: one electrical and the other related to a fuel leak.", "prefill": null}, {"id": "q-b016-1", "question_type": "multi_document", "question": "For both the Josset tow hitting the Bayou Grosse Tête Bridge and the Dry Tortugas running into platform VK-817A, the NTSB named a safeguard that no rule demanded but that might have averted the casualty. What was that safeguard in each case, and how would it have helped?", "expected_answer": "For the Josset, posting another crewmember on the tow as a lookout (not required) would likely have let the pilot know sooner that the bridge was not open and act to avoid hitting it; for the Dry Tortugas, which was not required to have one, a watch alarm set to appropriate intervals may have woken the sleeping second captain before the contact.", "answer": "The National Transportation Safety Board (NTSB) identified the **use of radar** as a safeguard that was not mandated by any rule but could have helped prevent both incidents:\n\n1. **Josset Tow hitting the Bayou Grosse Tête Bridge**: Radar could have provided early detection of the bridge and the tow vessel, allowing the crew to take evasive action in time to avoid the collision.\n\n2. **Dry Tortugas running into platform VK-817A**: Radar could have helped the vessel detect the platform at a greater distance, providing sufficient time to adjust course and avoid the collision.\n\nIn both cases, radar would have enhanced situational awareness in low-visibility conditions, potentially preventing the casualties.", "prefill": null}, {"id": "q-b016-2", "question_type": "comparison", "question": "Which contact caused more property damage, the Josset tow with the Bayou Grosse Tête Bridge or the Dry Tortugas with platform VK-817A, and were there any injuries in each?", "expected_answer": "The Dry Tortugas contact caused more property damage, $5 million ($500,000 to the Dry Tortugas and $4.5 million to platform VK-817A), against an estimated $2.5 million for the Josset contact; the Josset casualty had no injuries, while the Dry Tortugas casualty had 1 minor injury aboard the Dry Tortugas.", "answer": "The Josset tow with the Bayou Grosse Tête Bridge caused more property damage. The incident involving the Dry Tortugas and platform VK-817A resulted in no injuries, while the Josset tow incident resulted in injuries.", "prefill": null}, {"id": "q-b017-1", "question_type": "comparison", "question": "Which grounding had the higher property damage, the barge Cordova Provider on Axel Lind Island or the fishing vessel Eileen Rita on Green Island, and how did their environmental damage differ?", "expected_answer": "The Cordova Provider grounding had the higher property damage ($2.9 million versus $720,000 for the Eileen Rita); the Cordova Provider caused no environmental damage, while an oil sheen was observed after the Eileen Rita grounding, with an estimated 4,000 gallons of diesel fuel on board.", "answer": "The barge *Cordova Provider* on Axel Lind Island caused higher property damage compared to the fishing vessel *Eileen Rita* on Green Island. The *Cordova Provider* ran aground on Axel Lind Island in 1989, resulting in significant damage to the island's infrastructure and environment. The *Eileen Rita* incident in 1991 involved a smaller vessel and resulted in less extensive property damage. Environmental damage from both incidents differed in scale and impact, with the *Cordova Provider* incident causing more severe ecological disruption due to the larger vessel and the nature of the grounding.", "prefill": null}, {"id": "q-b018-2", "question_type": "factual", "question": "Roughly how far behind the Nickelena was the barge BMI 209 being pulled during its trip from Escanaba toward Sault Ste. Marie?", "expected_answer": "About 500 feet; once out of the harbor the captain had the tow line lengthened to about 500 feet for the voyage.", "answer": "The barge BMI 209 was approximately 1.5 miles behind the Nickelena during its trip from Escanaba toward Sault Ste. Marie.", "prefill": null}, {"id": "q-b019-1", "question_type": "factual", "question": "How many people were aboard the cargo ship Julie C when it struck the Jack Edwards off Guyana?", "expected_answer": "There were 17 people aboard the Julie C (the Jack Edwards had 10).", "answer": "The cargo ship *Julie C* had 16 people aboard when it struck the *Jack Edwards* off the coast of Guyana in 1981.", "prefill": null}, {"id": "q-b020-1", "question_type": "factual", "question": "What went wrong when the deckhand on the Jordyn Rose tried to let go the anchor near the mouth of the Naknek River?", "expected_answer": "The lever for releasing the windlass clutch broke off, so the anchor stayed stuck in place and could not be dropped.", "answer": "The deckhand on the *Jordyn Rose* attempted to release the anchor near the mouth of the Naknek River in Alaska, but the anchor became entangled in the riverbed's rocky and uneven terrain. This caused the anchor to snag and pull the vessel toward the shore, leading to a dangerous situation. The incident highlighted the risks of anchoring in such environments and the importance of proper anchor handling and situational awareness.", "prefill": null}, {"id": "q-b020-2", "question_type": "factual", "question": "Once the cooking-gas cylinder was ruled out, what possible sources of ignition did the NTSB consider for the Jordyn Rose blaze?", "expected_answer": "The onboard batteries, their associated wiring, the diesel-fueled accommodation heater, or other energized electrical components; the actual source could not be determined.", "answer": "The National Transportation Safety Board (NTSB) considered several possible sources of ignition for the Jordyn Rose blaze, including electrical systems, gas leaks, and potential sparks from metal objects or other materials. They also examined the possibility of an accidental ignition from nearby flammable materials or environmental factors.", "prefill": null}, {"id": "q-b021-1", "question_type": "causal", "question": "Considering how much water the 6 Saturdays needed to float and the soundings shown on the chart for the stretch it crossed just before reaching St. Augustine Inlet, why was the yacht bound to hit bottom there?", "expected_answer": "The boat drew about 4 feet, but about 1515 it entered an area charted at only 0 to 5.9 feet deep, so much of that area was shallower than its draft; it grounded on the shoals just after 1517 while still making 15 knots.", "answer": "The yacht was bound to hit bottom because the water depth required for the 6 Saturdays to float safely was greater than the depth indicated on the chart for the stretch near St. Augustine Inlet. This suggests that the yacht's draft exceeded the depth of the water in that area, leading to the risk of grounding.", "prefill": null}, {"id": "q-b021-2", "question_type": "factual", "question": "What were the wind direction and strength when the 6 Saturdays ran aground at St. Augustine Inlet?", "expected_answer": "The wind was from the east at 18 knots, as measured at Northeast Florida Regional Airport, 4 nm north-northwest of where the boat grounded.", "answer": "The specific wind direction and strength during the incident when the *6 Saturdays* ran aground at St. Augustine Inlet are not widely documented in general historical records. However, it is known that the vessel ran aground during a period of strong winds and high tides, which contributed to the grounding incident. For precise meteorological data from that specific event, detailed historical weather records or maritime reports would need to be consulted.", "prefill": null}, {"id": "q-b023-2", "question_type": "procedural", "question": "How did the Royal Engineer mate try to contact the dredge crew to make passing arrangements, and for roughly how long after his first attempt was he unable to establish communications?", "expected_answer": "He tried twice to contact the dredge crew early, first an hour and then 45 minutes before reaching the dredge, but could not establish communications until about 15 minutes before the tow reached the dredging area, so he went roughly 45 minutes without a response after his first attempt.", "answer": "The Royal Engineer mate attempted to contact the dredge crew via radio. He was unable to establish communications for approximately two hours after his first attempt.", "prefill": null}, {"id": "q-b026-1", "question_type": "causal", "question": "Even though the crew of the BBC Africa did eventually get the rudder working again, why could they not keep the ship from hitting the Common Faith?", "expected_answer": "The chief officer's repeated attempts to retake control with the in-command FU button failed, and the master only switched to emergency override mode after about a minute; by the time he regained rudder control it was too late to turn the vessel enough to avoid the moored bulk carrier.", "answer": "The crew of the BBC Africa could not keep the ship from hitting the Common Faith because the ship's rudder was severely damaged, and despite efforts to restore its function, the damage was too extensive to fully control the ship in time to avoid the collision.", "prefill": null}, {"id": "q-b026-2", "question_type": "factual", "question": "Where was the BBC Africa fixed up after its collision in Houston, and when was that work finished?", "expected_answer": "Its repairs were done at a shipyard in Swinemunde, Poland, and were completed in November 2023.", "answer": "The BBC Africa office in Houston was damaged in a collision in 2017. The repair and renovation work was completed in early 2018.", "prefill": null}, {"id": "q-b027-2", "question_type": "procedural", "question": "Once the American Mariner had come to a stop after hitting the Munuscong Channel Junction Light, how did the engine department get the steering working again?", "expected_answer": "With permission from the shoreside port engineer, the chief engineer disconnected the linkage between the no. 1 control motor and the main pump, isolating that motor, after which the steering responded properly to commands.", "answer": "The engine department likely repaired or bypassed the faulty steering mechanism, possibly by manually overriding the system or making emergency adjustments to restore control of the vessel. Specific details about this incident are not widely documented.", "prefill": null}, {"id": "q-b029-1", "question_type": "factual", "question": "After the towing vessel City of Louisville ran aground near Thebes, Illinois, to which city's repair yard was it brought, and on what date was it hauled out of the water there?", "expected_answer": "It was refloated and towed to a repair yard in Paducah, Kentucky, where it was dry docked on August 10.", "answer": "The towing vessel *City of Louisville* was brought to the repair yard in Cairo, Illinois, and it was hauled out of the water on April 14, 1856.", "prefill": null}, {"id": "q-b030-1", "question_type": "factual", "question": "After the blast aboard the New York City sludge ship Hunts Point, where was the missing senior engineer eventually located?", "expected_answer": "Before the fire department arrived at 1030, the chief engineer was found between the concrete dock and a wooden fender on the vessel's starboard side; he was declared dead at the scene.", "answer": "The missing senior engineer was eventually located in the hold of the ship.", "prefill": null}, {"id": "q-b032-2", "question_type": "procedural", "question": "Following the Stuyvesant engine room fire, how did the vessel's operator change the way its engineers bring an engine back into service after working on it?", "expected_answer": "The operating company now requires that, after maintenance on an engine, crewmembers start the engine locally rather than remotely, and that two crewmembers inspect the equipment before starting it.", "answer": "Following the Stuyvesant engine room fire, the vessel's operator implemented a policy requiring engineers to perform a thorough inspection and testing procedure before bringing an engine back into service. This included checking for any residual fuel or oil leaks, ensuring all systems were properly secured, and verifying that all safety protocols were followed to prevent similar incidents.", "prefill": null}, {"id": "q-b033-1", "question_type": "factual", "question": "On the Sunday the unmanned yacht Flagship caught fire at the Miami River shipyard, who raised the alarm and what first drew their attention?", "expected_answer": "The security guard on duty at the shipyard entrance heard popping noises from the enclosed dock area and saw smoke; she investigated, discovered the fire, called 911 and then notified the facility manager.", "answer": "The alarm was raised by the shipyard's security personnel. Their attention was first drawn by the smell of smoke and the visible flames.", "prefill": null}, {"id": "q-b034-1", "question_type": "procedural", "question": "In the Belle Mer cable strike near Ketchikan, how did the crew lay out the electronic chart ring meant to warn them if the anchor slipped, and how should it have been set up instead?", "expected_answer": "The crew used a 2,127-foot (0.35-mile) radius centred 465 feet northwest of where the anchor was estimated to have been dropped, apparently at the GPS antenna's position at 0554; it should have been centred on the anchor drop location with a radius of about 1,395 feet (495 feet hawsepipe-to-antenna plus 900 feet of chain).", "answer": "During the Belle Mer cable strike near Ketchikan in 1991, the crew did not properly set up the electronic chart plotter (or \"chart ring\") to warn them if the anchor slipped. The system was not configured to monitor anchor position or detect movement, which is a critical function for anchor monitoring. It should have been set up to continuously track the anchor's position relative to the vessel and alert the crew if the anchor began to drag or slip, using GPS or other positioning systems. The failure to properly configure the system contributed to the incident.", "prefill": null}, {"id": "q-b034-2", "question_type": "factual", "question": "When and by what means did the crew of the bulk carrier Belle Mer first hear that a seabed telecommunications line near Ketchikan had been disrupted?", "expected_answer": "On November 16, about 0900 (the day after the cable owner's 1226 loss-of-data alert), the Belle Mer's agent emailed the crew const KEY = "closed-book-" + DATA.traces_sha256;
const LABELS = {correct:"Correct", partly_correct:"Partly correct", incorrect:"Incorrect", abstained:"Abstained"};
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} progress(); }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function cur(item){ if(!state[item.id]) state[item.id]={mark:item.prefill,prefilled:!!item.prefill,guessable:false,note:""}; return state[item.id]; }
function progress(){ const n=DATA.items.filter(i=>cur(i).mark).length;
  document.getElementById("progress").textContent = n + " / " + DATA.items.length + " marked"; }
function render(){
  const list=document.getElementById("list");
  for(const item of DATA.items){
    const s=cur(item); const card=document.createElement("section"); card.className="card "+(s.mark||"");
    card.innerHTML=`<div class="meta">${esc(item.id)} · ${esc(item.question_type)}${s.prefilled?" · pre-marked abstained":""}</div>
      <h4>Question</h4><div class="box">${esc(item.question)}</div>
      <h4>Expected answer</h4><div class="box">${esc(item.expected_answer)}</div>
      <h4>Model answer (no documents)</h4><div class="box">${esc(item.answer)}</div>
      <div class="row">${Object.entries(LABELS).map(([v,l])=>`<label><input type="radio" name="m-${item.id}" value="${v}" ${s.mark===v?"checked":""}> ${l}</label>`).join("")}
      <label title="The question names the options, so a guess can be right"><input type="checkbox" data-g ${s.guessable?"checked":""}> A guess could get this right</label></div>
      <h4>Note</h4><input type="text" data-n value="${esc(s.note)}">`;
    card.querySelectorAll("input[type=radio]").forEach(el=>el.addEventListener("change",()=>{s.mark=el.value;s.prefilled=false;card.className="card "+el.value;save();}));
    card.querySelector("[data-g]").addEventListener("change",e=>{s.guessable=e.target.checked;save();});
    card.querySelector("[data-n]").addEventListener("input",e=>{s.note=e.target.value;save();});
    list.appendChild(card);
  }
  progress();
}
document.getElementById("marker").value = state.__marker || "";
document.getElementById("marker").addEventListener("input",e=>{state.__marker=e.target.value;save();});
document.getElementById("download").addEventListener("click",()=>{
  const unmarked=DATA.items.filter(i=>!cur(i).mark).length;
  if(unmarked && !confirm(unmarked+" items are unmarked. Download anyway?")) return;
  const marks={}; for(const i of DATA.items){ const s=cur(i); if(s.mark) marks[i.id]={mark:s.mark,guessable:s.guessable,prefilled:s.prefilled,note:s.note}; }
  const out={marker:state.__marker||"",traces_sha256:DATA.traces_sha256,marks};
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
  a.download="closed-book-marks.json"; a.click();
});
render();
