# Phase 0 spike only. Superseded by the root docker-compose.yml in Phase 1.
services:
  anythingllm:
    image: mintplexlabs/anythingllm:1.18.0@sha256:5461782e7db41318a516925949a8f8366e258dd576411fca7961fe77dff054cc
    container_name: anythingllm-spike
    ports:
      - "3001:3001"
    cap_add:
      - SYS_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://host.docker.internal:11434
      OLLAMA_MODEL_PREF: qwen3:8b
      OLLAMA_MODEL_TOKEN_LIMIT: "8192"
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://host.docker.internal:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
      VECTOR_DB: lancedb
      DISABLE_TELEMETRY: "true"
    volumes:
      - ./storage:/app/server/storage
